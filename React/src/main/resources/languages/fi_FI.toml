[config.documentation.annotation.art.arcane.react.api.web.webconfiguration]
description = "Reactin sisäisen HTTP/WebSocket-hallintarajapinnan asetukset. Muutokset tulevat voimaan automaattisesti, kun web.toml tallennetaan."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.advertisedurl]
impact = "Aseta tähän käänteisen välityspalvelimen HTTPS-osoite, jos kuuntelija on käytettävissä localhostin ulkopuolelta. Reactin sisäinen kuuntelija tukee edelleen vain HTTP:tä. Muutokset tulevat voimaan automaattisesti, kun web.toml tallennetaan."
summary = "Suorille API-asiakkaille ilmoitettava julkinen perusosoite."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.listenaddress]
impact = "Oletuksena oleva :: -jokeri hyväksyy IPv6- ja IPv4-yhteensopivaa liikennettä lähiverkosta, konteista ja porttiohjauksista. Käytä loopback-osoitetta vain samalla koneella olevan käänteisen välityspalvelimen tai välittäjän takana."
summary = "IP-osoite, johon verkkokuuntelija sidotaan."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.corsorigins]
impact = "Tyhjä luettelo sallii kaikki alkuperät. Lisää tiettyjä alkuperiä rajoittaaksesi alkuperien välistä pääsyä."
summary = "HTTP-rajapinnan sallittujen CORS-alkuperien luettelo."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.listenerenabled]
impact = "React avaa todennetun rajapinnan oletuksena. Arvo false estää HTTP- ja WebSocket-kuuntelijoiden avaamisen."
summary = "Ottaa käyttöön sisäisen verkkokuuntelijan."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.port]
impact = "Jos tämä portti on varattu, React kokeilee seuraavia 99 porttia järjestyksessä ja käyttää sidottua porttia välityspalvelun paikallisyhteyteen sekä luotuihin suoriin URL-osoitteisiin, kun advertisedUrl on tyhjä. Tiedoston web.toml tallentaminen käynnistää kuuntelijan automaattisesti uudelleen."
summary = "Verkkopalvelimen ensisijainen TCP-portti."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.relayenabled]
impact = "Kun arvo on true, React yhdistää välittäjäpalvelimeen osoitteessa relayUrl, jotta kumppanisovellus tavoittaa NAT:n takana olevat palvelimet ilman porttiohjausta."
summary = "Ottaa käyttöön lähtevän pilvivälittäjän asiakkaan NAT-läpäisyä varten."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.relayurl]
impact = "Luetaan vain, kun relayEnabled on true. Jätä tyhjäksi, kun välittäjä ei ole käytössä."
summary = "Välittäjäpalvelimen WSS-perusosoite, esim. wss://relay.arcane.art; polku /agent lisätään automaattisesti."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.requiretokenforreads]
impact = "Kun arvo on true, todentamattomat GET-pyynnöt hylätään virheellä 401. Aseta arvoksi false vain täysin luotetuissa verkkoympäristöissä."
summary = "Vaatii kelvollisen todennustokenin vain luku -tyyppisille HTTP-päätepisteille."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.wspushhz]
impact = "Suuremmat arvot lisäävät työntöpäivitysten tarkkuutta mutta myös verkon ja CPU:n kuormaa."
summary = "Tavoitetaajuus (Hz), jolla mittaajapäivitykset työnnetään WebSocket-yhteyksien kautta."

[config.documentation.annotation.art.arcane.react.content.action.actioncollectgarbage]
