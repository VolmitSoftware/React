"config.documentation.annotation.art.arcane.react.content.feature.featurelazygravity.description" = "Lazy Gravity -toiminnon asetukset. Seuraa vanilla FallingBlock -entiteettejä esteettömillä pystysuorilla reiteillä ja arvioi, kuinka monta liike-tickiä voitaisiin ohittaa, jos laskeutumisticki ratkaistaisiin deterministisesti syntypaikan ja painovoimalaskennan perusteella sen sijaan, että AI ja liike käsiteltäisiin joka tickillä. Ilmoittaa arvioidun ohitettavien tickien määrän ajonaikaisena mittarina, jotta ylläpitäjät voivat arvioida vaikutuksen ennen täyttä tickien ohitustoteutusta. Ohittaa putoavat lohkot, jotka ovat pelaajan bypassRadius-säteen sisällä. Aktiivisen reitin keskeytykset (lohkon asettaminen, rikkominen tai sarakkeen fysiikkamuutos) palauttavat seurattavan entiteetin vanilla-fysiikkaan."
