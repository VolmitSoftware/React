"config.documentation.annotation.art.arcane.react.content.feature.featurehopperchaincoalescing.description" = "Hopper Chain Coalescing -toiminnon asetukset. Tunnistaa samaan suuntaan syöttävien N suppilon suorat ketjut ja arvioi, kuinka monta suppilokohtaista siirtotickiä voitaisiin yhdistää yhdeksi ketjun päästä päähän tehtäväksi eräsiirroksi ketjua ja tickiä kohden. Toimii vain mittaustilassa: ketjujen tunnistus ja arvioitu säästettyjen tickien määrä julkaistaan ketjujen yhdistämisen mittarilukijan kautta. Väliin jäävien InventoryMoveItemEvent-tapahtumien peruminen on ristiriidassa FeatureHopperTokenBucket-luokan token bucket -kulutusjärjestyksen kanssa, joten varsinainen eräsiirto jätetään erillisen NMS-sillan tehtäväksi."
