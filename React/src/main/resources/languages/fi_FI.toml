[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.playerchunkbudgetenabled]
summary = "Ottaa käyttöön maailmakohtaiset pelaajien chunk-budjetit, joissa päällekkäisyys lasketaan kerran."
impact = "Pois käytöstä oletuksena. Käyttöön otettuna budjetit voivat laskea nykyisiä etäisyystavoitteita, ja palautuksen kasvu on asteittaista."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.playertickingchunkbudget]
summary = "Maailmaa kohden arvioitujen pelaajien tickaamien chunkien enimmäismäärä; vähintään 1."
impact = "Päällekkäiset simulointijalanjäljet lasketaan kerran. Asetetut vähimmäisetäisyydet ovat etusijalla, kun budjettia ei voida täyttää."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.playerviewonlychunkbudget]
summary = "Maailmaa kohden arvioitujen vain näkyvien chunkien enimmäismäärä; vähintään 1."
impact = "Laskee näkymäjalanjäljen simulointijalanjäljen ulkopuolella. Tämä ennustaa pelaajien kysyntää, ei todellisia ladattuja chunkeja tai lisäosien lippuja."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.budgetrecoverychecks]
summary = "Peräkkäiset terveet budjettiarvioinnit, jotka vaaditaan ennen etäisyyden kasvattamista; vähintään 1."
impact = "Arvioinnit noudattavat arvoa updateCooldownSeconds. Tuntematon tick-telemetria tai valmistumaton pelaajaindeksi nollaa palautumisen."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.budgetrecoverystep]
summary = "Etäisyyden suurin kasvu onnistuneen budjettipalautumisen jälkeen chunkeina; rajataan välille 1–32."
impact = "Pienemmät askeleet rajoittavat chunk-latauspurskeita etäisyyksien palautuessa. Koskee vain, kun pelaajien chunk-budjetointi on käytössä."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller]
description = "Mittaa Folia-pelaajien sijainteja ja valinnaisia rajattuja JDK Flight Recorder -tapahtumia. JFR tallentaa protokollaliikenteen kokonaismäärät, chunk-generoinnin vaiheet, tallennusaktiivisuuden ja asetetun kynnyksen ylittävät odotukset."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller.field.regionalenabled]
summary = "Ota käyttöön Folia-alueiden TPS-mittaus pelaajien sijainneissa."
impact = "Kysyy kerran sekunnissa rajattua kiertävää joukkoa välimuistissa olevia pelaajien sijainteja lataamatta chunkeja."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller.field.playeranchorsperrefresh]
summary = "Sekunnissa mitattavien pelaajasijaintien enimmäismäärä, rajattu välille 1–512. Havainnot vanhenevat viidessä sekunnissa."
impact = "Suuremmat arvot parantavat pelaajien kattavuutta useampien alueiden TPS-kyselyjen kustannuksella."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller.field.jfrenabled]
summary = "Ota käyttöön valikoiva JFR-telemetria. Pois käytöstä oletuksena. Julkaistut yhteenvedot jättävät pois osoitteet, tiedostopolut ja pinojäljet."
impact = "Lisää JFR-tallennustyötä 30 sekunnin ja 64 MiB:n säilytysrajoilla. Koostesarjat nollataan joka sekunti."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller.field.jfrslowthresholdms]
summary = "Vähimmäiskesto millisekunteina JVM:n tiedosto-I/O-, monitorin sisäänmeno-, monitorin odotus- ja säikeen park-tapahtumille, rajattu välille 1–1000. Chunk-generoinnin vaiheilla ei ole kestokynnystä."
impact = "Pienemmät kynnykset tuottavat enemmän JVM-tapahtumia. Nämä mittarit kuvaavat vain tämän kynnyksen täyttäviä tapahtumia."
