# React — fi_FI
#
# === Tiedoston muokkaus ===
# plugins/React/languages/fi_FI.toml
# Voit muokata tätä tiedostoa suoraan. Paikalliset muutokset säilyvät; puuttuvat tai virheelliset kohdat käyttävät sisäänrakennettua englantia.
# /react language server edit fi_FI
#
# === Etuliite ===
# runtime.prefix: Etuliite, jonka React lisää chatviestien eteen.
#
# === Muotoilu ===
# Chatviestit tukevat &-värikoodeja: &cTeksti&r, &lTeksti&r.
# Värit: &0-&9 ja &a-&f.
# Tyylit: &l lihavointi, &o kursivointi, &n alleviivaus, &m yliviivaus, &k sekoitetut merkit, &r nollaus.
# Värikoodit poistavat aktiiviset tyylit; kirjoita väri ennen tyyliä, kuten &3&lTeksti&r. &r nollaa kaiken muotoilun.
# RGB-värit käyttävät muotoa &#RRGGBBTeksti&r, esimerkiksi &#55AAFFTeksti&r.
# Käytä MiniMessagea liukuväreihin ja vuorovaikutuksiin; älä sekoita MiniMessage-tunnisteita ja &-koodeja samassa viestissä. Sulje tunnisteet päinvastaisessa järjestyksessä kuin avasit ne.
# Säilytä TOML-lainausmerkit ja pakosekvenssit kelvollisina.
# Käytä \n rivinvaihtoon lainatuissa TOML-merkkijonoissa; {{ ja }} tulostavat kirjaimelliset aaltosulkeet.
# renderer.*- ja config.documentation.annotation.*-arvot ovat pelkkää tekstiä.
# test.*-arvot ovat pelkkää tekstiä, paitsi test.result.*-viestit, jotka tukevat muotoilua.
# Käytä muuttujia viestin tekstissä MiniMessage-tunnisteiden ulkopuolella.
#
# === Muuttujat ===
# Säilytä muuttujien nimet ja käytä vain kunkin viestin omia muuttujia.
#   {action}  Toiminnon nimi tai värisäädön suunta
#   {actions}  Jonossa olevien toimintojen määrä tai ohitettujen toimintojen nimilista
#   {active}  Aktiivisten ominaisuuksien tai säätöjen määrä
#   {actor}  Muutoksen tehnyt verkkokäyttäjä
#   {added}  Palasiko ominaisuus aktiiviseen rekisteriin aktivoinnin jälkeen; kielipäivityksen lisäämät viestit
#   {after}  Asetusarvo, kieliviesti tai kekomuistin käyttö muutoksen jälkeen
#   {age}  Integraatiotiedon ikä sekunteina
#   {amount}  Annettavien esineiden määrä
#   {architecture}  CPU-arkkitehtuuri
#   {argument}  Odottamaton komennon argumentti
#   {available}  Käytettävissä olevien NMS-siltakahvojen määrä
#   {average}  Keskimääräinen TPS tai millisekunnit pelipäivitystä kohti
#   {avg_mspt}  Keskimääräinen pelipäivityksen kesto millisekunteina kuormitustestissä
#   {avg_tps}  Keskimääräiset pelipäivitykset sekunnissa kuormitustestissä
#   {bar}  Muotoiltu suorituskykytestin pistepalkki
#   {before}  Asetusarvo, kieliviesti tai kekomuistin käyttö ennen muutosta
#   {checked}  Tarkistettujen mittaajien määrä
#   {chunks}  Toiminnon käsittelemien chunkien määrä
#   {code}  Verkkoliittymän parituskoodi
#   {command}  Komennon polku
#   {count}  Rivien, moduulien, muutosten tai testihavaintojen määrä
#   {current}  Nykyisen sivun numero
#   {delta_heap}  Reactin ja vertailutason loppuhetken kekomuistin käytön ero, MB
#   {delta_mspt}  Reactin ja vertailutason keskimääräisen pelipäivitysajan ero, ms
#   {delta_tps}  Reactin ja vertailutason keskimääräisen TPS:n ero
#   {detail}  Sillan, integraation, toiminnon tai testin diagnostiikkatiedot
#   {dimensions}  Havaitun karttaseinän ruudukon mitat
#   {direction}  Valitun värin sävyn kiertosuunta
#   {distance}  Pyydetty näkyvyys-, simulointi- tai lähetysetäisyys chunkeina
#   {duration}  Kulunut aika; kuormitustestin aloitusviestissä sekunteina
#   {enabled}  Käyttöönottotila tai käytössä olevien moduulien määrä
#   {entities}  Toiminnon käsittelemien entiteettien määrä
#   {entry}  Integraation aikajanan merkintä
#   {exceptions}  Kuormitustestissä tallennetut React-poikkeukset
#   {fail}  Epäonnistuneiden tarkistusten määrä
#   {file}  Asetus-, kieli- tai lisäosan API-tiedoston nimi
#   {fingerprint}  Palvelimen tai verkkoliittymän tunnisteen sormenjälki
#   {finite}  Äärellisiä arvoja palauttavien mittaajien määrä
#   {frames}  Aktiivisen karttaseinän esinekehysten määrä
#   {free}  Vapaa fyysinen tai virtuaalinen muisti
