summary = "Tickit, jotka odotetaan GC-pyynnön jälkeen ennen muistin mittaamista."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize]
description = "Hopper Network Normalize -toiminnon asetukset. Kohdistuu suppiloiden kuumiin kohtiin, yhdistää esine-entiteetit ja voi vapauttaa joutilaita kuumia chunkeja."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.itemmergeradius]
