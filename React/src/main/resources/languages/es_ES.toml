[config.documentation.annotation.art.arcane.react.content.feature.featureactivationrangegovernor]
description = "Configuración de la función Regulador de rango de activación. Reduce temporalmente los rangos de activación de entidades de cada mundo mientras el servidor sufre una presión sostenida, de modo que el propio servidor desactiva las entidades lejanas en lugar de procesar sus ticks. A diferencia de dynamic-activation-range (que muestrea y pausa las entidades una a una), el servidor lee estos rangos en cada tick y se aplican a todas las entidades al instante. Los rangos y el procesamiento de ticks de los aldeanos se restauran cuando el servidor se recupera."

[config.documentation.annotation.art.arcane.react.content.feature.featureactivationrangegovernor.field.animalrangefactor]
