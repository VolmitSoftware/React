[config.documentation.annotation.art.arcane.react.content.tweak.tweakvehicleidlebrake.field.maxvehiclessampledperworld]
impact = "Los valores altos inspeccionan más vehículos por ciclo; los valores bajos limitan con más firmeza el trabajo de evaluación."
summary = "Máximo de vehículos muestreados por evaluación en todos los mundos en el freno de vehículos inactivos, limitado de 1 a 4096."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakvehicleidlebrake.field.minvelocitysquared]
impact = "Los valores altos exigen señales más fuertes antes de actuar; los valores bajos hacen más fácil cumplir esta condición."
summary = "Velocidad mínima al cuadrado que exige el freno de vehículos inactivos."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakvehicleidlebrake.field.onlyemptyvehicles]
impact = "Actívalo para aplicar este comportamiento; desactívalo para mantener esta vía inactiva."
summary = "Controla si el freno de vehículos inactivos se aplica solo a vehículos vacíos."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakvehicleidlebrake.field.tickintervalms]
impact = "Los valores bajos reaccionan más rápido pero consumen más CPU; los valores altos reducen la sobrecarga pero reaccionan más tarde."
summary = "Intervalo principal de evaluación del freno de vehículos inactivos, en milisegundos."

[config.documentation.annotation.art.arcane.react.core.controller.configinputcontroller.field.sessiontimeoutseconds]
impact = "Los valores superiores mantienen los avisos de edición abiertos más tiempo antes de que se cancelen."
summary = "Tiempo de espera de las sesiones de edición de configuración por chat, en segundos."

[config.documentation.annotation.art.arcane.react.core.controller.hotloadcontroller]
description = "Vigila los archivos de configuración e idioma de React y aplica los cambios automáticamente."

[config.documentation.annotation.art.arcane.react.core.controller.hotloadcontroller.field.maxdiffmessagesperfile]
impact = "Los valores bajos reducen el ruido de chat para los operadores en ediciones grandes de la configuración."
summary = "Número máximo de mensajes de diferencias por clave enviados por cada archivo modificado."

[config.documentation.annotation.art.arcane.react.core.controller.hotloadcontroller.field.notifyoperators]
impact = "Desactívalo si solo quieres registros en la consola y no notificaciones dentro del juego."
summary = "Envía a los operadores conectados resúmenes de los cambios de la recarga en caliente."

[config.documentation.annotation.art.arcane.react.core.controller.hotloadcontroller.field.pollintervalms]
impact = "Los valores más bajos detectan antes los eventos recibidos; los cambios automáticos siguen aplicándose en lotes como máximo una vez cada tres segundos."
summary = "Intervalo de sondeo de eventos del sistema de archivos en milisegundos."

[config.documentation.annotation.art.arcane.react.core.controller.eventcontroller]
description = "Mide el tiempo de los manejadores de eventos por plugin envolviendo los oyentes registrados mientras la instrumentación está activa."

[config.documentation.annotation.art.arcane.react.core.controller.eventcontroller.field.dutycycleonms]
impact = "Ventanas más largas producen más muestras registradas por periodo con un coste recurrente mayor."
summary = "Duración en milisegundos de cada ventana de medición periódica en el modo de ciclo de trabajo."

[config.documentation.annotation.art.arcane.react.core.controller.eventcontroller.field.dutycycleperiodms]
impact = "Periodos más cortos registran datos de eventos con más frecuencia y cuestan más; periodos más largos dejan huecos más amplios en el historial."
summary = "Milisegundos entre los inicios de las ventanas de medición periódicas en el modo de ciclo de trabajo."

[config.documentation.annotation.art.arcane.react.core.controller.eventcontroller.field.instrumentation]
impact = "ALWAYS añade una sobrecarga de medición a cada manejador de eventos; ON_DEMAND elimina ese coste en reposo pero deja huecos en el historial; DUTY_CYCLE cambia huecos periódicos por un pequeño coste recurrente."
summary = "Controla cuándo se instalan las envolturas de medición de oyentes: ALWAYS las mantiene instaladas, ON_DEMAND las instala solo mientras un monitor, un mapa, un marcador o un visor web lee datos de eventos, y DUTY_CYCLE abre además una ventana de medición periódica."

[config.documentation.annotation.art.arcane.react.core.controller.eventcontroller.field.sampleractivitywindowms]
impact = "Valores más altos mantienen la instrumentación instalada más tiempo después de que un visor se vaya; valores más bajos la retiran antes."
summary = "Milisegundos tras la última lectura de datos de eventos antes de retirar las envolturas en los modos bajo demanda y de ciclo de trabajo."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller]
description = "Captura una vez los muestreadores de React, almacena telemetría histórica comprimida y atiende consultas acotadas por intervalo de tiempo."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.compressionlevel]
impact = "Los valores más altos pueden reducir el uso de disco a cambio de más CPU en el proceso de escritura."
summary = "Nivel DEFLATE que solo se usa cuando reduce el tamaño de una columna de métricas codificada."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.enabled]
impact = "Al desactivar el almacenamiento se mantienen las instantáneas web en directo, pero no se registran nuevas muestras históricas. El historial existente sigue siendo legible."
summary = "Conserva el historial de los muestreadores en plugins/React/history."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.fifteenminuteretentiondays]
impact = "Los resúmenes de una hora conservan la cobertura histórica después de que caduque este nivel."
summary = "Retención de los resúmenes de quince minutos en días. Cero conserva este nivel indefinidamente."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.livecaptureintervalms]
impact = "Los valores más bajos mejoran la fidelidad de los gráficos en directo, pero consultan con más frecuencia todos los muestreadores registrados."
summary = "Cadencia de la instantánea autorizada de muestreadores en directo, en milisegundos."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.maxquerypoints]
impact = "Los valores más altos mejoran la resolución del gráfico a costa del tamaño de la respuesta y del trabajo de consulta."
summary = "Máximo de intervalos aceptados por cada serie en una consulta histórica."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.maxqueryseries]
impact = "Los valores más altos pueden crear tramas de retransmisión mayores y más lecturas de disco simultáneas."
summary = "Máximo de series aceptadas por una consulta histórica."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.minuteretentiondays]
impact = "La cobertura más antigua sigue disponible mediante resúmenes de menor resolución."
summary = "Retención de los resúmenes de un minuto en días. Cero conserva este nivel indefinidamente."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.querypagepoints]
impact = "Las páginas permanecen acotadas para los tiempos de espera de la retransmisión y del navegador."
summary = "Máximo de intervalos devueltos por serie en una página de respuesta histórica."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.rawretentionhours]
impact = "La cobertura más antigua sigue disponible mediante resúmenes de menor resolución."
summary = "Retención de muestras exactas de un segundo en horas. Cero conserva este nivel indefinidamente."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.tensecondretentiondays]
impact = "La cobertura más antigua sigue disponible mediante resúmenes de menor resolución."
summary = "Retención de los resúmenes de diez segundos en días. Cero conserva este nivel indefinidamente."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.walforceintervalms]
impact = "Un fallo del proceso o del host puede perder como máximo esta ventana reciente; los valores más bajos aumentan las escrituras forzadas en disco."
summary = "Tiempo máximo entre escrituras forzadas del diario histórico, en milisegundos."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller]
description = "Gestiona los metadatos de los mapas de React, la reparación de renderizadores y el envío en vivo de paquetes de mapas para inventarios y marcos de objetos."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemapidlepushintervalms]
impact = "Los valores altos reducen el volumen de paquetes en reposo cuando los jugadores están cerca pero no miran el mapa."
summary = "Intervalo de envío para los espectadores cercanos que no miran activamente el mapa del marco (milisegundos)."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemaplookdotthreshold]
impact = "Los valores altos exigen apuntar con más precisión al mapa antes de enviar actualizaciones de alta frecuencia."
summary = "Producto escalar mínimo de la dirección de la vista necesario para considerar que un jugador mira activamente un mapa de marco."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemappushintervalms]
impact = "Los valores bajos refrescan antes los visuales del mapa pero aumentan la presión de paquetes y de renderizado."
summary = "Intervalo de envío de paquetes de los mapas activos en marcos de objetos, en milisegundos."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemappushoutsiderangewhenholding]
impact = "Desactívalo para detener por completo los paquetes de mapas fuera del radio; actívalo si sostener el mapa debe omitir las comprobaciones de distancia."
summary = "Permite actualizaciones de mapas sostenidos fuera de frameMapPushRadiusBlocks."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemappushradiusblocks]
impact = "Los valores más altos cubren más espectadores pero aumentan el fanout de paquetes."
summary = "Radio máximo en bloques desde un mapa en marco de objeto dentro del cual los jugadores reciben actualizaciones enviadas."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemappushstateretentionms]
impact = "Los valores altos conservan el estado más tiempo con menos rotación; los valores bajos podan antes el registro interno."
summary = "Tiempo de conservación del registro interno de envíos de mapas de marco, en milisegundos."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemapredrawintervalms]
impact = "Los valores bajos refrescan antes los paneles de marco; los valores altos agrupan los redibujados redundantes por espectador en paredes de mapas muy concurridas."
summary = "Intervalo mínimo entre redibujados del lienzo de los mapas de React en marcos de objetos, en milisegundos."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemaprequirelineofsight]
impact = "Al activarlo se eliminan los paquetes a espectadores ocultos pero se añaden comprobaciones de visibilidad ligeras."
summary = "Si está activado, los envíos de mapas de marco requieren línea de visión para los espectadores cercanos (quien sostiene el mapa la omite)."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemapvalidateintervalms]
impact = "Los valores bajos detectan antes los objetos de marco cambiados; los valores altos evitan leer repetidamente los metadatos del objeto en cada tick de mantenimiento."
summary = "Intervalo entre revalidaciones completas de las pilas de objetos de los mapas de marco rastreados, en milisegundos."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.heldmapredrawintervalms]
impact = "Los valores bajos rotan y refrescan los mapas sostenidos con más fluidez; los valores altos reducen el trabajo de renderizado cuando muchos jugadores ven el mismo mapa."
summary = "Intervalo mínimo entre redibujados del lienzo de los mapas de React sostenidos, en milisegundos."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.inventoryrepairbatchsize]
impact = "Los valores altos reducen el tiempo de recuperación tras recargar; los valores bajos reducen el trabajo de cada pasada."
summary = "Número de inventarios de jugador online reparados por pase de mantenimiento."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.inventoryrepaircadencems]
impact = "Los valores bajos reparan antes los metadatos y renderizadores de los mapas; los valores altos reducen el trabajo por tick."
summary = "Cadencia de escaneo de los inventarios de jugadores para reparar mapas de React, en milisegundos."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.itemframechunkbatchsize]
impact = "Los valores altos aceleran la recuperación de los mapas de marco tras recargar; los valores bajos reducen el coste por pasada."
summary = "Número de chunks cargados escaneados para mapas de marco de elementos por pase de mantenimiento."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.itemframerepaircadencems]
impact = "Los valores bajos reparan antes los mapas de marcos de objetos tras recargar; los valores altos reducen la sobrecarga de mantenimiento."
summary = "Cadencia de escaneo de los chunks cargados para reparar mapas de marcos de objetos, en milisegundos."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.maintenancetickintervalms]
impact = "Los valores bajos reparan antes los inventarios y marcos de objetos tras recargar; los valores altos reducen la sobrecarga de mantenimiento."
summary = "Cadencia principal de mantenimiento de la lógica de reparación de mapas, en milisegundos."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.megamapenabled]
impact = "Desactívalo para renderizar cada mapa de marco como un panel independiente de 128x128."
summary = "Combina los mapas de React adyacentes en marcos de objetos que tengan el mismo renderizador en una sola pantalla de megamapa en mosaico."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.megamapmaxtiles]
impact = "Los muros mayores que el presupuesto vuelven al renderizado ampliado de un solo panel."
summary = "Presupuesto total de mosaicos para un muro de megamapa combinado."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.megamapsplitduplicates]
impact = "Desactivar para que los mapas clonados compartan una imagen y nunca se combinen."
summary = "Los mapas React clonados colocados en marcos de objetos reciben identificadores de mapa nuevos automáticamente para que las copias adyacentes se combinen en un muro de megamapa."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.startupboostdurationms]
impact = "Los valores altos priorizan durante más tiempo la recuperación rápida tras recargar; los valores bajos vuelven antes a la cadencia normal."
summary = "Duración del calentamiento tras el arranque o un /reload durante el cual la recuperación de mapas usa lotes de reparación agresivos (milisegundos)."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.startupboostinventorybatchsize]
impact = "Los valores altos hacen que los inventarios de mapas se recuperen más rápido justo tras recargar, a costa de trabajo temporal adicional."
summary = "Tamaño del lote de reparación de inventarios mientras el calentamiento de arranque está activo."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.startupboostitemframechunkbatchsize]
impact = "Los valores altos hacen que los mapas de marco se recuperen más rápido justo tras recargar, a costa de trabajo temporal adicional."
summary = "Tamaño del lote de reparación de chunks con marcos de objetos mientras el calentamiento de arranque está activo."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.startupframemappushintervalms]
impact = "Los valores bajos hacen que los mapas de marco aparezcan antes tras recargar; los valores altos reducen las ráfagas temporales de paquetes durante el calentamiento."
summary = "Intervalo de envío de paquetes usado durante el calentamiento de arranque, en milisegundos."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemappushbatchsize]
summary = "Número máximo de mapas en marcos de objetos rastreados que se consideran para el envío de paquetes por pasada de mantenimiento."
impact = "Los valores altos actualizan antes los muros de mapas muy grandes; los valores bajos limitan la carga del planificador y de la búsqueda de entidades."

[config.documentation.annotation.art.arcane.react.core.controller.incidentcontroller]
description = "Guarda pruebas estructuradas de incidentes para el plugin y el visor web."

[config.documentation.annotation.art.arcane.react.core.controller.incidentcontroller.field.persistenceenabled]
impact = "Al desactivar la persistencia solo se conserva el historial de la ejecución actual."
summary = "Guarda el historial estructurado de incidentes en plugins/React/incidents.json."

[config.documentation.annotation.art.arcane.react.core.controller.incidentcontroller.field.retention]
impact = "Los valores mayores conservan más historial y usan más memoria y espacio en disco."
summary = "Máximo de eventos de incidente estructurados que se conservan."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration]
description = "Configuración global de React. Controla el diseño de monitorización predeterminado, el ajuste del modelo de valor y el comportamiento de diagnóstico."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.adaptabilityopsmetricmode]
impact = "No controla los umbrales de presión de rendimiento. ALL_CHECKS se normaliza a SUCCESSFUL_CHECKS en tiempo de ejecución."
summary = "Selecciona qué tasa de operaciones de habilidades de Adapt muestra React e incluye como contexto de las alertas. Opciones: SUCCESSFUL_CHECKS, ALL_CHECKS."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.customcolors]
impact = "Establécelo en false para que la salida se parezca más al comportamiento de color vanilla o predeterminado."
summary = "Activa el estilo de color personalizado en las vistas del monitor."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.debug]
impact = "Úsalo durante sesiones de depuración; desactívalo en la ejecución normal de producción."
summary = "Activa el registro de depuración y diagnósticos adicionales."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.integrationsecretsenabled]
impact = "Desactivado por defecto. Actívalo para permitir paquetes secretos de Iris y Adapt cuando estén presentes las dependencias."
summary = "Activa las funciones de integración secreta condicionadas por plugin."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.integrationsnapshotmaxmetrics]
impact = "Limitado a un valor entre 1 y 65536. Los cambios borran las publicaciones en caché en el siguiente ciclo de recopilación de un segundo."
summary = "Número máximo de métricas distintas conservadas para las solicitudes de instantáneas de las integraciones."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.language]
impact = "El inglés incluido en el código sigue siendo el idioma de respaldo; los catálogos TOML editables se cargan desde languages."
summary = "Idioma que usan las interfaces de React para jugadores y operadores."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.metrics]
impact = "Establece false para detener los envíos de React a bStats. Los cambios se aplican automáticamente."
summary = "Activa el envío anónimo de estadísticas de uso bStats para React."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.monitoring]
impact = "Los cambios afectan a la composición del panel de monitorización base y a la agrupación de muestreadores."
summary = "Diseño de monitor predeterminado mostrado a los jugadores."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.priority]
impact = "Cambiar estos pesos puede alterar el descarte, las colas y el comportamiento de visibilidad."
summary = "Modelo de prioridad de entidades que usan varios subsistemas de React."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.slowticklogmode]
impact = "OFF suprime las advertencias de ticks lentos. BLAME destaca el plugin o la carga de trabajo probablemente responsable. SHORT registra solo los tiempos mínimos. DETAILED registra la información de diagnóstico completa."
summary = "Controla cómo se registran las advertencias de ticks lentos. Opciones: OFF, BLAME, SHORT, DETAILED."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.unsafebytecode]
impact = "Desactivado por defecto. Las funciones NMS específicas de cada versión pueden seguir conectando su propia instrumentación al activarse. La instrumentación conectada permanece hasta que se reinicia la JVM."
summary = "Adjunta el agente general ByteBuddy de React al arrancar o al activarlo durante la ejecución."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.value]
impact = "Los valores altos pueden aumentar la influencia de los objetos caros en los cálculos."
summary = "Ajuste del valor de los materiales usado para el análisis de recetas y valores."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.verbose]
impact = "Útil para solucionar problemas pero puede crear mucho ruido de registro."
summary = "Activa la salida detallada en la consola para el funcionamiento interno de React."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration_monitoring]
description = "Configuración predeterminada del panel de monitorización de los jugadores."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration_monitoring.field.actionbarheaderslots]
impact = "Los valores altos reducen la paginación horizontal, pero pueden dificultar la lectura de las entradas si las etiquetas son largas."
summary = "Número máximo de grupos de monitor mostrados a la vez en la barra de acción."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration_monitoring.field.actionbarsamplerslots]
impact = "Los valores altos reducen la paginación dentro de un grupo, pero pueden comprimir la legibilidad en pantallas pequeñas."
summary = "Número máximo de muestreadores mostrados a la vez en la fila enfocada de la barra de acción."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration_monitoring.field.monitorconfiguration]
impact = "Cambiarlo altera la estructura base del panel de monitor para los nuevos ajustes."
summary = "Grupos de monitor y muestreadores predeterminados que se muestran a los jugadores."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration_valueconfig]
description = "Configuración del valor de los materiales para los cálculos de valor y ponderación de React."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration_valueconfig.field.basevalue]
impact = "Los valores altos elevan globalmente la valoración base."
summary = "Valor base de los materiales antes de los ajustes de receta y de anulación."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration_valueconfig.field.maxrecipelistprecaution]
impact = "Los valores altos permiten explorar recetas con más profundidad, pero pueden aumentar el coste de procesamiento."
summary = "Límite de seguridad para evitar que el recorrido profundo o cíclico de recetas se descontrole."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration_valueconfig.field.valuemutlipliers]
impact = "Los multiplicadores superiores hacen que los materiales específicos sean más influyentes en los cálculos de valor."
summary = "Multiplicadores por material que anulan la valoración predeterminada."

