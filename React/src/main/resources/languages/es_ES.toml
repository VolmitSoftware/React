# React — es_ES
#
# === Editar el archivo ===
# plugins/React/languages/es_ES.toml
# Puede editar este archivo directamente. Los cambios locales se conservan; las entradas ausentes o no válidas usan el inglés incorporado.
# /react language server edit es_ES
#
# === Prefijo ===
# runtime.prefix: Prefijo que React añade antes de los mensajes de chat.
#
# === Formato ===
# Los mensajes de chat admiten códigos de color con &: &cTexto&r, &lTexto&r.
# Colores: &0-&9 y &a-&f.
# Estilos: &l negrita, &o cursiva, &n subrayado, &m tachado, &k ofuscado, &r restablecer.
# Los códigos de color eliminan los estilos activos; coloca el color antes del estilo, como en &3&lTexto&r. &r restablece todo el formato.
# Los colores RGB usan &#RRGGBBTexto&r, por ejemplo &#55AAFFTexto&r.
# Usa MiniMessage para degradados e interacciones; no mezcles etiquetas MiniMessage y códigos & en un mismo mensaje. Cierra las etiquetas en orden inverso al de apertura.
# Mantén válidas las comillas y las secuencias de escape de TOML.
# Usa \n en cadenas TOML entre comillas para un salto de línea; {{ y }} muestran llaves literales.
# Los valores de renderer.* y config.documentation.annotation.* son texto sin formato.
# Los valores de test.* son texto sin formato, salvo los mensajes de test.result.*, que admiten formato.
# Usa las variables en el texto del mensaje, fuera de las etiquetas MiniMessage.
#
# === Variables ===
# Mantén los nombres de las variables sin cambios y usa solo las variables que corresponden a cada mensaje.
#   {action}  Nombre de la acción o dirección del ajuste de color
#   {actions}  Cantidad de acciones en cola o lista de nombres de acciones excluidas
#   {active}  Número de funciones o ajustes activos
#   {actor}  Usuario web que realizó un cambio
#   {added}  Si una función volvió al registro activo tras activarse; Mensajes añadidos por una actualización de idioma
#   {after}  Valor de configuración, mensaje de idioma o uso de memoria heap después de un cambio
#   {age}  Antigüedad de los datos de integración en segundos
#   {amount}  Cantidad de objetos que se entregarán
#   {architecture}  Arquitectura de la CPU
#   {argument}  Argumento de comando inesperado
#   {available}  Número de identificadores disponibles del puente NMS
#   {average}  TPS medios o milisegundos medios por tick
#   {avg_mspt}  Milisegundos medios por tick durante una pasada de la prueba de carga
#   {avg_tps}  Ticks medios por segundo durante una pasada de la prueba de carga
#   {bar}  Barra de puntuación de rendimiento con formato
#   {before}  Valor de configuración, mensaje de idioma o uso de memoria heap antes de un cambio
#   {checked}  Número de muestreadores comprobados
#   {chunks}  Número de chunks afectados por una acción
#   {code}  Código de emparejamiento web
#   {command}  Ruta del comando
#   {count}  Número de entradas, módulos, cambios o resultados de pruebas
#   {current}  Número de página actual
#   {delta_heap}  Diferencia del uso final de heap entre React y la referencia, en MB
#   {delta_mspt}  Diferencia del tiempo medio por tick entre React y la referencia, en ms
#   {delta_tps}  Diferencia de TPS medios entre React y la referencia
#   {detail}  Detalles de diagnóstico del puente, la integración, la acción o la prueba
#   {dimensions}  Dimensiones detectadas de la cuadrícula de mapas
#   {direction}  Dirección de giro del tono del color seleccionado
#   {distance}  Distancia de visión, simulación o envío solicitada, en chunks
#   {duration}  Tiempo transcurrido; los mensajes de inicio de pruebas de carga usan segundos
#   {enabled}  Estado de activación o número de módulos activados
#   {entities}  Número de entidades afectadas por una acción
#   {entry}  Entrada de la cronología de integración
#   {exceptions}  Excepciones de React registradas durante una pasada de la prueba de carga
#   {fail}  Número de comprobaciones fallidas
#   {file}  Nombre del archivo de configuración, idioma o API de plugins
#   {fingerprint}  Huella del servidor o del token web
#   {finite}  Número de muestreadores que devuelven valores finitos
#   {frames}  Número de marcos en la pared de mapas activa
#   {free}  Memoria física o virtual libre
#   {freed}  Memoria heap liberada por la recolección de basura
#   {from}  Número de la primera entrada de la página actual
#   {grid}  Dimensiones de la cuadrícula de mapas
#   {ground_y}  Altura del suelo para la prueba de gravedad
#   {group}  Grupo de monitores, muestreadores, mapas, configuración o mensajes de idioma
#   {growth}  Crecimiento del heap durante una prueba de carga, en MB
#   {health}  Estado de funcionamiento de la integración
#   {heap_end}  Uso del heap al finalizar una pasada de la prueba de carga, en MB
#   {heap_start}  Uso del heap al iniciar una pasada de la prueba de carga, en MB
#   {heartbeat}  Tiempo desde la última señal de actividad de la integración
#   {height}  Altura del lienzo de prueba en píxeles
#   {hoppers}  Número de tolvas normalizadas
#   {id}  Identificador del puente, muestreador, mapa, acción, paquete o token
#   {impact}  Descripción del efecto de la configuración
#   {incident}  Identificador de la acción recursiva de incidentes excluida de las pruebas de desarrollo
#   {index}  Número del paso actual de las pruebas de desarrollo
#   {invalid}  Número de muestreadores con lecturas inválidas
#   {issued_at}  Fecha y hora de creación del token web
#   {item}  Nombre o identificador del objeto
#   {items}  Número de entidades de objetos fusionadas
#   {kept}  Ediciones locales conservadas por una actualización de idioma
#   {key}  Clave del parámetro de comando, clave de configuración o ID del mensaje de idioma
#   {label}  Etiqueta de la prueba de rendimiento, métrica, ajuste, comando o token web
#   {line}  Número de la línea que se edita en un mensaje de varias líneas
#   {lines}  Número de líneas del registro del servidor examinadas
#   {loaded}  Número de chunks cargados por primera vez durante la precarga
#   {locale}  Código de idioma que se muestra, selecciona o edita
#   {matched}  Mundos cuyo estado de guardado automático coincide con la referencia de la prueba
#   {max_tick}  Mayor intervalo observado entre ticks durante una prueba de carga, en ms
#   {maximum}  Cantidad máxima de objetos, umbral de tiempo por tick o longitud de entrada del editor
#   {message}  Resumen de la acción completada o mensaje de estado de integración
#   {metrics}  Número de métricas proporcionadas por un paquete de API de plugins
#   {minecraft}  Versión de Minecraft
#   {minimum}  TPS mínimos aceptables
#   {missing}  Número de muestreadores necesarios que faltan en el registro
#   {mode}  Modo de juego o de habilidad seleccionado
#   {model}  Modelo de la CPU
#   {name}  Nombre de la prueba de rendimiento, módulo, renderizador o comprobación
#   {note}  Motivo por el que no se examinó el registro del servidor
#   {offenders}  Número de muestreadores que devuelven valores no finitos
#   {options}  Valores de configuración admitidos
#   {p95}  Percentil 95 del tiempo por tick durante una prueba de carga, en ms
#   {parameter}  Nombre del parámetro de comando
#   {parameters}  Parámetros de comando ignorados
#   {pass}  Número de comprobaciones superadas
#   {path}  Ruta de la clave de configuración o del archivo de informe
#   {percent}  Porcentaje de ajuste del color
#   {permission}  Nodo de permiso necesario
#   {personal}  Código de idioma seleccionado por el jugador
#   {phase}  Fase del ciclo de vida de la función que se está probando
#   {pixels}  Número de píxeles no vacíos dibujados por una prueba de mapas
#   {platform}  Sistema operativo o plataforma del servidor de Minecraft
#   {players}  Número de jugadores sintéticos en una prueba de carga
#   {plugin}  Nombre del plugin
#   {process_load}  Carga de CPU del proceso del servidor
#   {processors}  Número de procesadores de CPU disponibles
#   {profile}  Nombre del perfil de configuración de React
#   {protocol}  Versión del protocolo de integración
#   {radius}  Radio en chunks de una acción de las pruebas de desarrollo
#   {range}  Intervalo permitido de distancia de visión, simulación o envío, en chunks
#   {rate}  Velocidad configurada de avance rápido de cultivos
#   {rating}  Valoración de rendimiento con formato
#   {react_errors}  Número de líneas de error de React encontradas en el registro del servidor
#   {reason}  Explicación del fallo, rechazo o estado no disponible
#   {registered}  Número de módulos registrados
#   {remaining}  Tiempo restante hasta la próxima comprobación de idiomas
#   {removed_first}  Si la primera desactivación eliminó una función del registro activo
#   {removed_second}  Si una desactivación repetida eliminó una función del registro activo
#   {renderer}  Nombre o identificador del renderizador de mapas
#   {renderers}  Lista de renderizadores de mapas con identificadores vacíos
#   {role}  Rol de acceso web: viewer, operator o admin
#   {sampler}  Nombre o identificador del muestreador
#   {samplers}  Lista de muestreadores de integración o con fallos
#   {scope}  Ámbito del mapa o del ajuste de distancia
#   {score}  Puntuación de rendimiento
#   {seconds}  Cuenta atrás o duración de la prueba de carga en segundos
#   {section}  Sección de configuración o del editor de idiomas
#   {server}  Implementación y versión del servidor de Minecraft
#   {shown}  Número de filas que se muestran actualmente
#   {since_run}  Errores notificados desde el inicio de la prueba actual
#   {size}  Dimensiones máximas o activas de la pared de mapas
#   {skip}  Número de comprobaciones omitidas
#   {spawn_y}  Altura a la que se generó el bloque de la prueba de gravedad
#   {state}  Estado de la acción o del paquete de API de plugins
#   {status}  Etiqueta del estado de integración o configuración
#   {subject}  Módulo o ajuste descrito por la ayuda de configuración
#   {subsystem}  Nombre del subsistema de pruebas
#   {summary}  Resumen de auditoría de acciones
#   {system_load}  Carga de CPU de todo el sistema
#   {target}  Mundo, jugador, plugin, ajuste o grupo de plugins al que se dirige una operación
#   {threading}  Modo de hilos del servidor
#   {tick}  Duración del tick que superó el umbral de bloqueo, en ms
#   {tick_crashes}  Número de líneas de fallos de ticks encontradas en el registro del servidor
#   {tier}  Nivel de gravedad del procedimiento de incidentes
#   {timing}  Tiempo de callbacks de habilidades en milisegundos por minuto
#   {to}  Número de la última entrada de la página actual
#   {total}  Total de entradas, módulos, mundos, comprobaciones o memoria del mensaje
#   {type}  Tipo del parámetro de comando, valor de configuración, mapa o distancia
#   {unavailable}  Número de identificadores no disponibles del puente NMS
#   {unit}  Etiqueta de unidad del total de un gráfico circular
#   {unknown}  Identificador de la acción desconocida excluida de las pruebas de desarrollo
#   {unreadable}  Número de muestreadores que no se pudieron leer
#   {updated}  Mensajes cambiados por una actualización de idioma
#   {uptime}  Tiempo de actividad del sistema operativo anfitrión
#   {url}  URL del informe de diagnóstico subido
#   {usage}  Sintaxis de uso del comando
#   {used}  Memoria física, memoria virtual o heap en uso
#   {value}  Ajuste, medición o detalle de hardware con formato
#   {values}  Valores muestreados incluidos en un informe de las pruebas de desarrollo
#   {variables}  Nombres de variables admitidos por el mensaje que se edita
#   {vendor}  Proveedor de Java
#   {version}  Versión de React, Java o la plataforma
#   {warmed}  Número de chunks precargados
#   {warn}  Número de comprobaciones con advertencias
#   {width}  Anchura del lienzo de prueba en píxeles
#   {world}  Nombre del mundo de Minecraft

