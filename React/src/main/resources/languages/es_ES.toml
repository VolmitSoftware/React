[config.documentation.annotation.art.arcane.react.content.feature.featureactivationrangegovernor]
description = "Configuración para la función de Activation Range Governor. Escala temporalmente los rangos de activación de entidades por mundo mientras el servidor está bajo presión sostenida, por lo que el propio servidor desactiva las entidades distantes en lugar de ejecutar un ciclo de procesamiento del servidor para ellos. A diferencia de ( de rango de activación dinámica, que muestra y detiene a las entidades una por una en ), estos rangos son leídos por el servidor cada tick y se aplican a todas las entidades al instante. Los rangos y pueblos que ejecutan un ciclo de tratamiento del servidor se restauran una vez que el servidor se recupera."

