[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.updatenotifications]
summary = "Busca actualizaciones de React en las versiones de GitHub."
impact = "Activado de forma predeterminada. VolmLib agrupa las actualizaciones en un aviso al entrar y en /volmit plugins updates. Desactívalo para detener las comprobaciones de React."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.minimumincidentscore]
summary = "Puntuación de incidente necesaria para continuar la mitigación."
impact = "El protocolo continúa si se alcanza esta puntuación o minimumTickMS."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.minimumtickms]
summary = "Duración media del tick, en milisegundos, necesaria para continuar la mitigación."
impact = "El protocolo se detiene cuando ambos indicadores de presión están por debajo de sus umbrales."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.minimumentitiesperchunk]
summary = "Entidades observadas en un chunk necesarias para iniciar su reducción."
impact = "Los valores altos limitan la reducción a concentraciones de entidades más densas."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.recheckdelayms]
summary = "Intervalo de observación tras completar una acción secundaria, en milisegundos; mínimo 1000."
impact = "Permite actualizar las métricas antes de elegir otra medida."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.childtimeoutms]
summary = "Duración máxima de una etapa de mitigación, en milisegundos; mínimo 1000."
impact = "Si una acción secundaria agota el tiempo, el protocolo falla y no escala más."

[config.documentation.annotation.art.arcane.react.content.action.actiontrimentitiesbyagepriority_params.field.minimumentitiesperchunk]
summary = "Mínimo de entidades observadas en un chunk antes de reducirlas; cero incluye todos los chunks observados."
impact = "Un valor positivo limita la reducción a chunks densamente poblados."

[action.capture_profile]
completed = "Se guardó {count} perfil local en {path}"

[config.documentation.annotation.art.arcane.react.content.action.actioncaptureprofile]
description = "Captura bajo demanda un perfil local de JDK Flight Recorder con eventos de ejecución, asignación y GC. Conserva tres capturas; nunca las sube."

[config.documentation.annotation.art.arcane.react.content.action.actioncaptureprofile_params.field.seconds]
summary = "Duración del perfil en segundos, limitada de 1 a 300."
impact = "Las capturas más largas abarcan más actividad; la grabación JFR conserva hasta 64 MiB de datos recientes."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.playerchunkbudgetenabled]
summary = "Activa presupuestos de chunks por mundo para los jugadores; las superposiciones cuentan una vez."
impact = "Desactivado por defecto. Los presupuestos pueden reducir las distancias objetivo existentes y la recuperación es gradual."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.playertickingchunkbudget]
summary = "Máximo estimado de chunks simulados para jugadores por mundo; mínimo 1."
impact = "Las áreas de simulación superpuestas cuentan una vez. Las distancias mínimas configuradas tienen prioridad si el presupuesto no puede cumplirse."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.playerviewonlychunkbudget]
summary = "Máximo estimado de chunks solo visibles por mundo; mínimo 1."
impact = "Cuenta el área visible fuera de la simulada. Estima la demanda de los jugadores, no los chunks cargados ni los tickets de plugins."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.budgetrecoverychecks]
summary = "Evaluaciones saludables consecutivas del presupuesto necesarias antes de aumentar una distancia; mínimo 1."
impact = "Las evaluaciones siguen updateCooldownSeconds. La telemetría de ticks desconocida o un índice de jugadores no preparado reinician la recuperación."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.budgetrecoverystep]
summary = "Aumento máximo de distancia tras recuperar el presupuesto, en chunks; limitado de 1 a 32."
impact = "Los pasos pequeños limitan los picos de carga durante la recuperación. Solo se aplica con los presupuestos de chunks de jugadores activados."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller]
description = "Muestrea ubicaciones de jugadores de Folia y, opcionalmente, eventos limitados de JDK Flight Recorder. JFR captura totales de tráfico del protocolo, etapas de generación de chunks, actividad de almacenamiento y esperas superiores al umbral configurado."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller.field.regionalenabled]
summary = "Activa el muestreo de TPS de las regiones de Folia en las ubicaciones de los jugadores."
impact = "Consulta una selección rotativa y limitada de ubicaciones de jugadores almacenadas en caché una vez por segundo, sin cargar chunks."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller.field.playeranchorsperrefresh]
summary = "Número máximo de ubicaciones de jugadores muestreadas por segundo, limitado entre 1 y 512. Las observaciones caducan tras cinco segundos."
impact = "Los valores más altos cubren más jugadores, pero requieren más consultas de TPS de región."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller.field.jfrenabled]
summary = "Activa la telemetría selectiva de JFR. Desactivada de forma predeterminada. Los resúmenes publicados omiten direcciones, rutas de archivos y trazas de pila."
impact = "Añade trabajo de grabación JFR con límites de retención de 30 segundos y 64 MiB. Las series agregadas se reinician cada segundo."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller.field.jfrslowthresholdms]
summary = "Duración mínima en milisegundos para eventos de E/S de archivos de la JVM, entrada en monitores, espera en monitores y estacionamiento de hilos, limitada entre 1 y 1000. Las etapas de generación de chunks no tienen umbral de duración."
impact = "Los umbrales más bajos generan más eventos de la JVM. Estas métricas describen solo los eventos que alcanzan este umbral."
