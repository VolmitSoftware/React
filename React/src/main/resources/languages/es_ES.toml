[config.documentation.annotation.art.arcane.react.api.web.webconfiguration]
description = "Configuración de la API de gestión HTTP/WebSocket integrada en React. Los cambios se aplican automáticamente al guardar web.toml."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.advertisedurl]
impact = "Establece la URL HTTPS de un proxy inverso si el servidor de escucha es accesible desde fuera de localhost. El servidor integrado de React sigue admitiendo solo HTTP. Los cambios se aplican automáticamente al guardar web.toml."
summary = "URL base pública anunciada a los clientes directos de la API."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.listenaddress]
impact = "La dirección comodín :: predeterminada acepta tráfico IPv6 e IPv4 mapeado para accesos por LAN, contenedores y redirección de puertos. Usa una dirección de bucle local solo detrás de un proxy inverso o repetidor en el mismo equipo."
summary = "Dirección IP en la que escucha el servidor web."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.corsorigins]
impact = "Una lista vacía permite todos los orígenes. Añade orígenes concretos para restringir el acceso entre orígenes distintos."
summary = "Lista de orígenes CORS permitidos para la API HTTP."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.listenerenabled]
impact = "React abre la API autenticada por defecto. Establece false para no abrir ningún servidor HTTP ni WebSocket."
summary = "Activa el servidor web integrado."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.port]
impact = "Si este puerto está ocupado, React prueba los 99 puertos siguientes en orden y utiliza el puerto al que se ha enlazado para el bucle local del relay y las URL directas generadas cuando advertisedUrl está vacío. Guardar web.toml reinicia automáticamente el servidor de escucha."
summary = "Puerto TCP preferido para el servidor web."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.relayenabled]
impact = "Si es true, React se conecta al broker de relé en relayUrl para que la aplicación complementaria pueda llegar a servidores tras NAT sin redirección de puertos."
summary = "Activa el cliente de relé en la nube saliente para atravesar NAT."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.relayurl]
impact = "Solo se lee cuando relayEnabled es true. Déjalo vacío si el relé está desactivado."
summary = "URL WSS base del broker de relé, p. ej. wss://relay.arcane.art; la ruta /agent se añade automáticamente."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.requiretokenforreads]
impact = "Si es true, las solicitudes GET sin autenticar se rechazan con 401. Pon false solo en entornos de red de plena confianza."
summary = "Exige un token de autenticación válido para los endpoints HTTP de solo lectura."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.wspushhz]
impact = "Los valores altos aumentan la fidelidad de las actualizaciones enviadas, pero también la carga de red y de CPU."
summary = "Frecuencia objetivo (Hz) con la que se envían las actualizaciones de los muestreadores por las conexiones WebSocket."

[config.documentation.annotation.art.arcane.react.content.action.actioncollectgarbage]
description = "Configuración de la acción Recolectar basura. Solicita la recolección de basura de la JVM e informa del heap liberado de inmediato."

[config.documentation.annotation.art.arcane.react.content.action.actioncollectgarbage_params.field.postgcwaitticks]
impact = "Los valores altos dan más tiempo a los recolectores de la JVM para estabilizarse; los valores bajos informan antes, pero pueden subestimar la memoria recuperada."
summary = "Ticks de espera tras solicitar el GC antes de muestrear la memoria."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize]
description = "Configuración de la acción Normalizar red de tolvas. Actúa sobre los puntos críticos de tolvas, fusiona entidades de objeto y puede descargar chunks calientes inactivos."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.itemmergeradius]
impact = "Los valores altos amplían el área de búsqueda y cuestan más trabajo; los valores bajos reducen el alcance y son más baratos."
summary = "Radio de fusión de objetos que usa la normalización de la red de tolvas (bloques)."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.maxchunks]
impact = "Los valores altos permiten más rendimiento antes de intervenir; los valores bajos hacen la mitigación más agresiva."
summary = "Máximo de chunks que permite la normalización de la red de tolvas."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.maxmergeditementitiesperchunk]
impact = "Los valores altos permiten ráfagas mayores antes de que actúe el control; los valores bajos limitan los picos antes."
summary = "Máximo de entidades de objeto fusionadas que permite la normalización de la red de tolvas por chunk."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.minimumhopperupdatesperchunk]
impact = "Los valores altos exigen señales más fuertes antes de actuar; los valores bajos hacen más fácil cumplir esta condición."
summary = "Actualizaciones mínimas de tolvas por chunk que exige la normalización de la red de tolvas."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.unloadidlehotchunks]
impact = "Actívalo para aplicar este comportamiento; desactívalo para mantener esta vía inactiva."
summary = "Controla si la normalización de la red de tolvas descarga los chunks calientes inactivos."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.unsafeplayerradius]
impact = "Los valores altos amplían el área de búsqueda y cuestan más trabajo; los valores bajos reducen el alcance y son más baratos."
summary = "Radio de jugador inseguro que usa la normalización de la red de tolvas (bloques)."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.world]
impact = "Indica el nombre de un mundo para limitar las acciones a él, o déjalo en blanco para incluir todos los mundos."
summary = "Filtro por nombre de mundo para las operaciones de normalización de la red de tolvas."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook]
description = "Ejecuta las mitigaciones de incidentes pertinentes una a una, observa la presión entre acciones y finaliza cuando todas alcanzan un resultado final."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.includegarbagecollection]
impact = "Desactivado por defecto porque una recolección explícita puede pausar el servidor."
summary = "Permite una fase de recolección de basura cuando el uso del heap supera el 90%, el heap recuperable estimado supera el 10% y el tiempo de GC se mantiene por debajo del 2%."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.tieroverride]
impact = "Solo sustituye la intensidad; siguen siendo necesarias pruebas pertinentes y una presión sostenida."
summary = "Intensidad de mitigación forzada de 0 a 2; -1 la elige según la presión observada."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.world]
impact = "Déjalo en blanco para elegir el mundo con las pruebas más sólidas para cada mitigación."
summary = "Filtro por clave de mundo para las operaciones del playbook de incidentes."

