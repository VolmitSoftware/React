[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.customcolors]
impact = "Establece para mantener la salida más cerca de comportamiento de color vainilla/default."
summary = "Permite un estilo de color personalizado en vistas del monitor."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.debug]
impact = "Uso durante las sesiones depuradoras; inhabilitación para el tiempo normal de producción."
summary = "Permite depurar la tala y el diagnóstico adicional."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.integrationsecretsenabled]
impact = "Discapacitados por defecto. Permitir Iris/Adapt paquetes secretos cuando las dependencias están presentes."
summary = "Permite funciones de integración secreta con plugin."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.language]
