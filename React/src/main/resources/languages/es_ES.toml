summary = "Retención de los resúmenes de quince minutos en días. Cero conserva este nivel indefinidamente."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.livecaptureintervalms]
impact = "Los valores más bajos mejoran la fidelidad de los gráficos en directo, pero consultan con más frecuencia todos los muestreadores registrados."
summary = "Cadencia de la instantánea autorizada de muestreadores en directo, en milisegundos."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.maxquerypoints]
impact = "Los valores más altos mejoran la resolución del gráfico a costa del tamaño de la respuesta y del trabajo de consulta."
summary = "Máximo de intervalos aceptados por cada serie en una consulta histórica."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.maxqueryseries]
impact = "Los valores más altos pueden crear tramas de retransmisión mayores y más lecturas de disco simultáneas."
summary = "Máximo de series aceptadas por una consulta histórica."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.minuteretentiondays]
impact = "La cobertura más antigua sigue disponible mediante resúmenes de menor resolución."
summary = "Retención de los resúmenes de un minuto en días. Cero conserva este nivel indefinidamente."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.querypagepoints]
impact = "Las páginas permanecen acotadas para los tiempos de espera de la retransmisión y del navegador."
summary = "Máximo de intervalos devueltos por serie en una página de respuesta histórica."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.rawretentionhours]
impact = "La cobertura más antigua sigue disponible mediante resúmenes de menor resolución."
summary = "Retención de muestras exactas de un segundo en horas. Cero conserva este nivel indefinidamente."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.tensecondretentiondays]
impact = "La cobertura más antigua sigue disponible mediante resúmenes de menor resolución."
summary = "Retención de los resúmenes de diez segundos en días. Cero conserva este nivel indefinidamente."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.walforceintervalms]
impact = "Un fallo del proceso o del host puede perder como máximo esta ventana reciente; los valores más bajos aumentan las escrituras forzadas en disco."
summary = "Tiempo máximo entre escrituras forzadas del diario histórico, en milisegundos."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller]
description = "Gestiones React metadatos de los elementos del mapa, reparación de renderistas y entrega en vivo de paquetes para inventarios y marcos de artículos."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemapidlepushintervalms]
impact = "Los valores más altos reducen el volumen de paquetes ocio cuando los jugadores están cerca pero no observan el mapa."
summary = "Intervalo de empuje para los espectadores cercanos que no están mirando activamente el mapa del marco (milliseconds)."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemaplookdotthreshold]
impact = "Los valores más altos requieren un objetivo más estricto en el mapa antes de enviar actualizaciones de alta frecuencia."
summary = "Producto de punto de vista-dirección mínima requerido para tratar a un jugador como mirando activamente a un mapa de marco."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemappushintervalms]
impact = "Valores inferiores refrescan los visuales de mapa más rápido pero aumentan el paquete y la presión del renderizado."
summary = "Intervalo de empuje para mapas activos del marco de elementos en milisegundos."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemappushoutsiderangewhenholding]
impact = "Desactivar los paquetes de mapas duros fuera del radio; activar si la retención debe evitar las comprobaciones de distancia."
summary = "Permite actualizaciones de mapas mantenidos fuera frameMapPushRadiusBlocks."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemappushradiusblocks]
impact = "Los valores más altos cubren más espectadores pero aumentan el fanout de paquetes."
summary = "Radio de bloque máximo desde un mapa de marco de elemento donde los jugadores reciben actualizaciones de presión."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemappushstateretentionms]
impact = "Los valores superiores mantienen el estado más largo con menos churn; los valores inferiores de la contabilidad prune más agresivamente."
summary = "Duración de la retención para el registro de mapas de marco en milisegundos."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemapredrawintervalms]
impact = "Valores inferiores refrescan los paneles de marco más rápido; valores superiores colapsan redundantes por visión roja en las paredes del mapa ocupadas."
summary = "Intervalo mínimo entre rocias de tela para el marco-objetivo React mapas en milisegundos."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemaprequirelineofsight]
impact = "El habilitado elimina los paquetes para los espectadores ocultos pero añade controles de visibilidad ligeros."
summary = "Si está habilitado, los empujes de mapas de marco requieren línea de visión para los espectadores cercanos (los propietarios evitan esto)."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemapvalidateintervalms]
impact = "Los valores más bajos detectan los elementos de marco intercambiados antes; los valores más altos evitan que los metadatos del elemento se repiten."
summary = "Intervalo entre revalidaciones completas de mapas de marcos rastreados en milisegundos."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.heldmapredrawintervalms]
impact = "Los valores inferiores rotan y refrescan los mapas sostenidos más suavemente; los valores superiores cortan el trabajo cuando muchos jugadores ven el mismo mapa."
summary = "Intervalo mínimo entre rocias de tela para el mantenimiento React mapas en milisegundos."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.inventoryrepairbatchsize]
impact = "Los valores más altos reducen el tiempo de recuperación después de la recarga; los valores inferiores reducen el trabajo cada paso."
summary = "Número de inventarios de jugador online reparados por pase de mantenimiento."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.inventoryrepaircadencems]
impact = "Los valores más bajos reparan metadatos de mapas y renderizadores más rápido; los valores más altos reducen el trabajo por tick."
summary = "Cadence para escanear los inventarios de jugadores React reparación de mapas en milisegundos."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.itemframechunkbatchsize]
impact = "Los valores más altos aceleran la recuperación de mapas de marco después de la recarga; los valores inferiores reducen el coste por paso."
summary = "Número de chunks cargados escaneados para mapas de marco de elementos por pase de mantenimiento."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.itemframerepaircadencems]
impact = "Valores inferiores fijar mapas de marco de elementos más rápido después de la recarga; valores superiores reducen el mantenimiento sobrecabezado."
summary = "Cadencia para escanear chunks cargado para la reparación de mapas en milisegundos."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.maintenancetickintervalms]
impact = "Valores inferiores reparan inventarios y marcos de elementos antes después de la recarga; valores superiores reducen el mantenimiento sobrecabezado."
summary = "Cadencia de mantenimiento principal para la lógica de reparación del mapa en milisegundos."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.megamapenabled]
impact = "Desactivar hacer cada mapa de marco como un panel independiente 128x128."
summary = "Combina el marco de elementos adyacente React mapas con el mismo renderizador en una gran pantalla de megamapa de azulejo."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.megamapmaxtiles]
impact = "Los muros mayores que el presupuesto vuelven al renderizado ampliado de un solo panel."
summary = "Presupuesto total de mosaicos para un muro de megamapa combinado."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.megamapsplitduplicates]
impact = "Desactivar para que los mapas clonados compartan una imagen y nunca se combinen."
summary = "Los mapas React clonados colocados en marcos de objetos reciben identificadores de mapa nuevos automáticamente para que las copias adyacentes se combinen en un muro de megamapa."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.startupboostdurationms]
impact = "Los valores superiores priorizan la recuperación rápida después de la descarga más largo; los valores inferiores vuelven a la cadencia normal antes."
summary = "Duración de calentamiento después de la puesta en marcha/reload where map recovery uses aggressive repair batching (milliseconds)."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.startupboostinventorybatchsize]
impact = "Los valores más altos hacen que los inventarios de mapa se recuperen más rápido justo después de recargar a costa del trabajo temporal extra."
summary = "Reparación de inventario tamaño del lote mientras el calentamiento de la startup está activo."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.startupboostitemframechunkbatchsize]
impact = "Los valores más altos hacen que los mapas de marcos se recuperen más rápido justo después de recargar a costa del trabajo temporal extra."
summary = "El tamaño de lote del chunk de marco de elementos se repara mientras el calentamiento de inicio está activo."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.startupframemappushintervalms]
impact = "Los valores inferiores hacen que los mapas de marcos aparezcan más rápido después de la recarga; los valores superiores reducen las ráfagas temporales durante el calentamiento."
summary = "Intervalo de empuje de paquete utilizado durante el calentamiento de la puesta en marcha en milisegundos."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemappushbatchsize]
summary = "Número máximo de mapas registrados en marcos examinados para el envío de paquetes por pasada de mantenimiento."
impact = "Los valores altos actualizan antes los muros de mapas muy grandes; los valores bajos limitan la carga del planificador y de la búsqueda de entidades."

[config.documentation.annotation.art.arcane.react.core.controller.incidentcontroller]
description = "Guarda pruebas estructuradas de incidentes para el complemento y el visor web."

[config.documentation.annotation.art.arcane.react.core.controller.incidentcontroller.field.persistenceenabled]
impact = "Al desactivar la persistencia solo se conserva el historial de la ejecución actual."
summary = "Guarda el historial estructurado de incidentes en plugins/React/incidents.json."

[config.documentation.annotation.art.arcane.react.core.controller.incidentcontroller.field.retention]
impact = "Los valores mayores conservan más historial y usan más memoria y espacio en disco."
summary = "Máximo de eventos de incidente estructurados que se conservan."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration]
description = "Global React configuración. Controla el diseño de monitoreo predeterminado, ajuste del modelo de valor y comportamiento diagnóstico."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.adaptabilityopsmetricmode]
impact = "No controla los umbrales de presión de rendimiento. ALL_CHECKS se normaliza a SUCCESSFUL_CHECKS en tiempo de ejecución."
