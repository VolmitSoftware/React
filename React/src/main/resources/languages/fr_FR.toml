[config.documentation.annotation.art.arcane.react.content.feature.featureredstoneclockgovernor.field.bypasswithinplayerradius]
impact = "Des valeurs plus élevées élargissent la zone de recherche et coûtent plus de travail ; des valeurs plus basses réduisent la portée et coûtent moins cher."
summary = "Rayon de contournement du régulateur d'horloges redstone autour des joueurs, en blocs."

[config.documentation.annotation.art.arcane.react.content.feature.featureredstoneclockgovernor.field.cooloffms]
impact = "Des valeurs plus élevées maintiennent les limitations actives plus longtemps ; des valeurs plus basses laissent l'activité récupérer plus tôt."
summary = "Période de récupération après les décisions de limitation dans le régulateur d'horloges redstone, en millisecondes."

[config.documentation.annotation.art.arcane.react.content.feature.featureredstoneclockgovernor.field.maxtransitionsperwindow]
impact = "Des valeurs plus élevées permettent des rafales plus importantes avant que le contrôle n'intervienne ; des valeurs plus basses plafonnent les pics plus tôt."
summary = "Nombre maximal de transitions autorisées par fenêtre dans le régulateur d'horloges redstone."

[config.documentation.annotation.art.arcane.react.content.feature.featureredstoneclockgovernor.field.onlythrottlewithoutnearbyplayers]
impact = "Activer pour protéger les mécanismes proches des joueurs ; désactiver pour appliquer strictement."
summary = "Si true, le régulateur d'horloges redstone ne limite que les horloges sans joueur à proximité."

[config.documentation.annotation.art.arcane.react.content.feature.featureredstoneclockgovernor.field.tickintervalms]
impact = "Des valeurs plus basses réagissent plus vite mais consomment plus de CPU ; des valeurs plus élevées réduisent la charge mais réagissent plus tard."
summary = "Intervalle d'évaluation principal du régulateur d'horloges redstone, en millisecondes."

[config.documentation.annotation.art.arcane.react.content.feature.featureredstoneclockgovernor.field.windowms]
impact = "Les fenêtres plus longues lissent les rafales mais réagissent plus lentement ; les fenêtres plus courtes réagissent plus vite mais sont plus sensibles."
summary = "Durée de la fenêtre glissante d'application utilisée par le régulateur d'horloges redstone, en millisecondes."

[config.documentation.annotation.art.arcane.react.content.feature.featurespawnburstlimiter]
description = "Configuration de la fonctionnalité Limiteur de rafales d'apparition. Cette fonctionnalité surveille en permanence le comportement du serveur et applique des garde-fous pendant l'exécution."

[config.documentation.annotation.art.arcane.react.content.feature.featurespawnburstlimiter.field.enforcemonsterspawns]
impact = "Activer pour appliquer ce comportement ; désactiver pour garder ce chemin inactif."
summary = "Détermine si le limiteur de rafales d'apparition s'applique aux apparitions de monstres."

[config.documentation.annotation.art.arcane.react.content.feature.featurespawnburstlimiter.field.enforcenaturalspawns]
impact = "Activer pour appliquer ce comportement ; désactiver pour garder ce chemin inactif."
summary = "Détermine si le limiteur de rafales d'apparition s'applique aux apparitions naturelles."

[config.documentation.annotation.art.arcane.react.content.feature.featurespawnburstlimiter.field.enforcespawnerspawns]
impact = "Activer pour appliquer ce comportement ; désactiver pour garder ce chemin inactif."
summary = "Détermine si le limiteur de rafales d'apparition s'applique aux apparitions de générateurs de monstres."

[config.documentation.annotation.art.arcane.react.content.feature.featurespawnburstlimiter.field.ignorenamedentities]
impact = "Activez pour exclure les cas correspondants ; désactivez pour les inclure dans l'application des règles."
summary = "Ignore les entités nommées lorsque le limiteur de rafales d'apparition évalue les cibles."

[config.documentation.annotation.art.arcane.react.content.feature.featurespawnburstlimiter.field.maxmonsterspawnsperchunkwindow]
impact = "Des valeurs plus élevées permettent des rafales plus importantes avant que le contrôle n'intervienne ; des valeurs plus basses plafonnent les pics plus tôt."
summary = "Nombre maximal d'apparitions de monstres autorisées par fenêtre de chunk dans le limiteur de rafales d'apparition."

[config.documentation.annotation.art.arcane.react.content.feature.featurespawnburstlimiter.field.maxspawnerspawnsperchunkwindow]
impact = "Des valeurs plus élevées permettent des rafales plus importantes avant que le contrôle n'intervienne ; des valeurs plus basses plafonnent les pics plus tôt."
summary = "Nombre maximal d'apparitions de générateurs de monstres autorisées par fenêtre de chunk dans le limiteur de rafales d'apparition."

[config.documentation.annotation.art.arcane.react.content.feature.featurespawnburstlimiter.field.maxspawnsperchunkwindow]
impact = "Des valeurs plus élevées permettent des rafales plus importantes avant que le contrôle n'intervienne ; des valeurs plus basses plafonnent les pics plus tôt."
summary = "Nombre maximal d'apparitions autorisées par fenêtre de chunk dans le limiteur de rafales d'apparition."

[config.documentation.annotation.art.arcane.react.content.feature.featurespawnburstlimiter.field.spawnerbackoff]
impact = "Activer pour empêcher les générateurs limités de retenter inutilement à chaque cycle ; désactiver pour annuler seulement l'apparition elle-même."
summary = "Repousse la prochaine tentative d'apparition des générateurs dont les apparitions sont limitées par le limiteur de rafales."

[config.documentation.annotation.art.arcane.react.content.feature.featurespawnburstlimiter.field.spawnerbackoffticks]
impact = "Des valeurs plus élevées mettent les générateurs limités au repos plus longtemps, ce qui réduit le travail de tentatives d'apparition ; des valeurs plus basses laissent les fermes à mobs reprendre plus tôt."
summary = "Délai en ticks appliqué à la prochaine tentative d'apparition d'un générateur limité par le limiteur de rafales."

[config.documentation.annotation.art.arcane.react.content.feature.featurespawnburstlimiter.field.tickintervalms]
impact = "Des valeurs plus basses réagissent plus vite mais consomment plus de CPU ; des valeurs plus élevées réduisent la charge mais réagissent plus tard."
summary = "Intervalle d'évaluation principal du limiteur de rafales d'apparition, en millisecondes."

[config.documentation.annotation.art.arcane.react.content.feature.featurespawnburstlimiter.field.windowms]
impact = "Les fenêtres plus longues lissent les rafales mais réagissent plus lentement ; les fenêtres plus courtes réagissent plus vite mais sont plus sensibles."
summary = "Durée de la fenêtre glissante d'application utilisée par le limiteur de rafales d'apparition (millisecondes)."

[config.documentation.annotation.art.arcane.react.content.feature.featurespawnburstlimiter_spawnwindow.field.lastbackoffms]
impact = "État principalement d'exécution ; le modifier manuellement peut fausser le délai de recharge ou le comportement de limitation."
summary = "Horodatage interne utilisé par le limiteur de rafales d'apparition pour suivre les fenêtres de temps et la décroissance."

[config.documentation.annotation.art.arcane.react.content.feature.featurespawnburstlimiter_spawnwindow.field.lasthit]
impact = "État principalement d'exécution ; le modifier manuellement peut fausser le délai de recharge ou le comportement de limitation."
summary = "Horodatage interne utilisé par le limiteur de rafales d'apparition pour suivre les fenêtres de temps et la décroissance."

[config.documentation.annotation.art.arcane.react.content.feature.featurespawnburstlimiter_spawnwindow.field.monster]
impact = "État principalement d'exécution; React met à jour automatiquement cette information lors de l'évaluation en direct."
summary = "Compteur interne utilisé par le limiteur de rafales d'apparition pour suivre l'activité des rafales."

[config.documentation.annotation.art.arcane.react.content.feature.featurespawnburstlimiter_spawnwindow.field.spawner]
impact = "État principalement d'exécution; React met à jour automatiquement cette information lors de l'évaluation en direct."
summary = "Compteur interne utilisé par le limiteur de rafales d'apparition pour suivre l'activité des rafales."

[config.documentation.annotation.art.arcane.react.content.feature.featurespawnburstlimiter_spawnwindow.field.start]
impact = "État principalement d'exécution ; le modifier manuellement peut fausser le délai de recharge ou le comportement de limitation."
summary = "Horodatage interne utilisé par le limiteur de rafales d'apparition pour suivre les fenêtres de temps et la décroissance."

[config.documentation.annotation.art.arcane.react.content.feature.featurespawnburstlimiter_spawnwindow.field.total]
impact = "État principalement d'exécution; React met à jour automatiquement cette information lors de l'évaluation en direct."
summary = "Compteur interne utilisé par le limiteur de rafales d'apparition pour suivre l'activité des rafales."

[config.documentation.annotation.art.arcane.react.content.feature.featurespawnerlightcache]
description = "Configuration de la fonctionnalité Cache de lumière des générateurs. Met en cache le dernier instantané de lumière du ciel et des blocs autour des cellules candidates d'apparition dans l'obscurité, par chunk, afin que les tentatives d'apparition puissent être court-circuitées lorsque rien n'atteint le seuil d'obscurité. Fonctionne par défaut en mode mesure seule et ne passe à l'annulation que sous pression soutenue."

[config.documentation.annotation.art.arcane.react.content.feature.featurespawnerlightcache.field.bypassradius]
impact = "Des valeurs plus élevées protègent de toute limitation une zone plus large autour des joueurs ; des valeurs plus basses permettent de réduire plus près des joueurs."
summary = "Rayon de contournement autour des joueurs, en blocs ; les générateurs situés à l'intérieur ignorent entièrement le cache."

[config.documentation.annotation.art.arcane.react.content.feature.featurespawnerlightcache.field.darklightmax]
impact = "Des valeurs plus élevées élargissent la plage d'obscurité considérée ; des valeurs plus basses correspondent aux seuils hostiles vanilla stricts (<= 7)."
summary = "Lumière de bloc maximale à laquelle une cellule candidate compte comme candidate d'apparition dans l'obscurité."

[config.documentation.annotation.art.arcane.react.content.feature.featurespawnerlightcache.field.engageincidentscore]
impact = "Des valeurs plus élevées réservent l'annulation aux incidents graves ; des valeurs plus basses l'activent plus tôt."
summary = "Seuil de déclenchement pour activer l'annulation plutôt que la mesure seule (score d'incident)."

[config.documentation.annotation.art.arcane.react.content.feature.featurespawnerlightcache.field.engageticktimems]
impact = "Des valeurs plus élevées retardent l'activation; des valeurs plus faibles facilitent la traversée de ce seuil."
summary = "Seuil de durée de tick pour activer l'annulation (millisecondes)."

[config.documentation.annotation.art.arcane.react.content.feature.featurespawnerlightcache.field.invalidationintervalticks]
impact = "Les valeurs plus élevées réutilisent les instantanés plus longtemps, mais réagissent plus lentement aux changements d'éclairage; les valeurs plus faibles se reconstruisent plus souvent."
summary = "Durée pendant laquelle un instantané en cache reste valide avant d'être recalculé (ticks)."

[config.documentation.annotation.art.arcane.react.content.feature.featurespawnerlightcache.field.maxtrackedchunks]
impact = "Des valeurs plus élevées couvrent plus de chunks riches en générateurs pour un coût mémoire plus élevé ; des valeurs plus basses réduisent la mémoire."
summary = "Nombre maximal d'instantanés de chunks en cache avant que les plus anciens ne soient évincés."

[config.documentation.annotation.art.arcane.react.content.feature.featurespawnerlightcache.field.releaseticktimems]
impact = "Des valeurs plus basses maintiennent l'annulation plus longtemps pour la stabilité ; des valeurs plus élevées rétablissent plus tôt les tentatives d'apparition vanilla."
summary = "Seuil de durée de tick pour revenir au mode mesure seule (millisecondes)."

[config.documentation.annotation.art.arcane.react.content.feature.featurespawnerlightcache.field.tickintervalms]
impact = "Des valeurs plus basses élaguent plus vite les instantanés de chunks périmés mais consomment plus de CPU ; des valeurs plus élevées réduisent la charge."
summary = "Intervalle d'évaluation principal du cache de lumière des générateurs, en millisecondes."

[config.documentation.annotation.art.arcane.react.content.feature.featuretickspikeoriginreplaymap]
description = "Configuration de la fonctionnalité Carte de relecture de l'origine des pics de tick. Cette fonctionnalité surveille en permanence le comportement du serveur et applique des garde-fous pendant l'exécution."

[config.documentation.annotation.art.arcane.react.content.feature.featuretickspikeoriginreplaymap.field.captureradiuschunks]
impact = "Des valeurs plus élevées élargissent la zone de recherche et coûtent plus de travail ; des valeurs plus basses réduisent la portée et coûtent moins cher."
summary = "Rayon de capture en chunks utilisé par la carte de relecture de l'origine des pics de tick (chunks)."

[config.documentation.annotation.art.arcane.react.content.feature.featuretickspikeoriginreplaymap.field.decayeveryms]
impact = "Des valeurs plus basses mettent à jour plus souvent ; des valeurs plus élevées mettent à jour moins souvent avec une charge plus faible."
summary = "Cadence des mises à jour de décroissance dans la carte de relecture de l'origine des pics de tick (millisecondes)."

[config.documentation.annotation.art.arcane.react.content.feature.featuretickspikeoriginreplaymap.field.decayfactor]
impact = "Des valeurs plus élevées amplifient cette influence; des valeurs plus faibles réduisent sa contribution."
summary = "Facteur d'échelle appliqué au facteur de décroissance dans la carte de relecture de l'origine des pics de tick."

[config.documentation.annotation.art.arcane.react.content.feature.featuretickspikeoriginreplaymap.field.maxtrackedchunks]
impact = "Des valeurs plus élevées permettent un débit plus élevé avant l'intervention; des valeurs plus faibles rendent l'atténuation plus agressive."
summary = "Nombre maximal de chunks suivis autorisé par la carte de relecture de l'origine des pics de tick."

[config.documentation.annotation.art.arcane.react.content.feature.featuretickspikeoriginreplaymap.field.minimumheat]
impact = "Les valeurs plus élevées exigent des signaux plus forts avant l'action; les valeurs plus faibles facilitent la satisfaction de cette condition."
summary = "Chaleur minimale requise par la carte de relecture de l'origine des pics de tick."

[config.documentation.annotation.art.arcane.react.content.feature.featuretickspikeoriginreplaymap.field.spikecapturecooldownms]
impact = "Des valeurs plus élevées réduisent la fréquence de répétition; des valeurs plus faibles permettent des réactions plus fréquentes."
summary = "Délai de récupération de la capture de pic dans la carte de relecture de l'origine des pics de tick (millisecondes)."

[config.documentation.annotation.art.arcane.react.content.feature.featuretickspikeoriginreplaymap.field.spikethresholdms]
impact = "Les valeurs plus élevées déclenchent l'atténuation plus tard; les valeurs plus faibles déclenchent plus tôt et de façon plus agressive."
summary = "Seuil de déclenchement du pic dans la carte de relecture de l'origine des pics de tick."

[config.documentation.annotation.art.arcane.react.content.feature.featuretickspikeoriginreplaymap.field.stalechunkms]
impact = "Les valeurs plus élevées maintiennent l'état actif plus longtemps; les valeurs plus basses expirent ou appliquent des changements plus tôt."
summary = "Durée de chunk périmé utilisée par la carte de relecture de l'origine des pics de tick (millisecondes)."

[config.documentation.annotation.art.arcane.react.content.feature.featuretickspikeoriginreplaymap.field.tickintervalms]
impact = "Des valeurs plus basses réagissent plus vite mais consomment plus de CPU ; des valeurs plus élevées réduisent la charge mais réagissent plus tard."
summary = "Intervalle d'évaluation principal de la carte de relecture de l'origine des pics de tick, en millisecondes."

[config.documentation.annotation.art.arcane.react.content.feature.featuretickspikeoriginreplaymap_chunkkey.field.world]
impact = "Ce sont des données d'identité d'exécution qui devraient normalement être laissées aux mises à jour automatiques."
summary = "Identifiant de monde utilisé par le suivi interne de la carte de relecture de l'origine des pics de tick."

[config.documentation.annotation.art.arcane.react.content.feature.featuretickspikeoriginreplaymap_chunkkey.field.x]
impact = "Ce sont des données d'état internes qui ne doivent normalement pas être modifiées manuellement."
summary = "Coordonnée X utilisée par le suivi interne de la carte de relecture de l'origine des pics de tick."

[config.documentation.annotation.art.arcane.react.content.feature.featuretickspikeoriginreplaymap_chunkkey.field.z]
impact = "Ce sont des données d'état internes qui ne doivent normalement pas être modifiées manuellement."
summary = "Coordonnée Z utilisée par le suivi interne de la carte de relecture de l'origine des pics de tick."

[config.documentation.annotation.art.arcane.react.content.feature.featuretickspikeoriginreplaymap_heatcell.field.heat]
impact = "Des valeurs plus élevées marquent une contribution de pic plus forte et décroissent avec le temps selon la configuration."
summary = "Score de chaleur cumulé suivi par la carte de relecture de l'origine des pics de tick pour la relecture des points chauds."

[config.documentation.annotation.art.arcane.react.content.feature.featuretickspikeoriginreplaymap_heatcell.field.lastseenms]
impact = "État principalement d'exécution ; le modifier manuellement peut fausser le délai de recharge ou le comportement de limitation."
summary = "Horodatage interne utilisé par la carte de relecture de l'origine des pics de tick pour suivre les fenêtres de temps et la décroissance."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor]
description = "Configuration de la fonctionnalité Régulateur de portée de suivi. Réduit temporairement les portées de suivi des entités par monde (objets, divers, affichages, animaux, monstres) lorsque le serveur subit une pression soutenue, ce qui diminue le suivi des entités et la diffusion de paquets. Les changements s'appliquent aux entités au moment où elles sont suivies, donc les entités à rotation rapide comme les objets réagissent en quelques secondes ; les portées sont rétablies une fois que le serveur récupère."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.field.animalrangefactor]
impact = "Des valeurs plus basses réduisent la diffusion du suivi des animaux ; les animaux éloignés apparaissent plus tard pendant l'intervention."
summary = "Facteur d'échelle appliqué à la portée de suivi des animaux pendant l'intervention."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.field.displayrangefactor]
impact = "Des valeurs plus basses réduisent la diffusion des entités d'affichage ; les hologrammes ne s'affichent que de plus près pendant l'intervention."
summary = "Facteur d'échelle appliqué à la portée de suivi des entités d'affichage pendant l'intervention."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.field.engageticktimems]
impact = "Les valeurs inférieures réduisent les plages de suivi plus tôt; les valeurs supérieures le réservent pour une charge plus lourde."
summary = "Millisecondes moyennes par tick requises avant que le régulateur n'intervienne."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.field.itemrangefactor]
impact = "Des valeurs plus basses réduisent davantage la diffusion du suivi et des paquets des objets ; les joueurs ne voient les objets lâchés que de plus près."
summary = "Facteur d'échelle appliqué à la portée de suivi des objets pendant l'intervention."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.field.minimumrangeblocks]
impact = "Des valeurs plus élevées limitent l'agressivité de la réduction des plages ; des valeurs plus basses permettent des réductions plus fortes."
summary = "Portée de suivi minimale en blocs après mise à l'échelle."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.field.miscrangefactor]
impact = "Des valeurs plus basses réduisent davantage la diffusion du suivi et des paquets des entités décoratives et ambiantes."
summary = "Facteur d'échelle appliqué à la portée de suivi des entités diverses (cadres, peintures, orbes d'expérience) pendant l'intervention."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.field.monsterrangefactor]
impact = "Des valeurs plus basses réduisent la diffusion du suivi des monstres ; les monstres éloignés apparaissent plus tard pendant l'intervention."
summary = "Facteur d'échelle appliqué à la portée de suivi des monstres pendant l'intervention."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.field.otherrangefactor]
impact = "Des valeurs plus basses réduisent la diffusion pour les entités non catégorisées comme les projectiles et les véhicules."
summary = "Facteur d'échelle appliqué à la portée de suivi des autres entités pendant l'intervention."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.field.releaseticktimems]
impact = "Les valeurs inférieures maintiennent la réduction plus longtemps pour assurer la stabilité; les valeurs supérieures rétablissent plus tôt toutes les plages."
summary = "Millisecondes moyennes par tick sous lesquelles le serveur doit rester avant que le régulateur ne se désengage."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.field.sustainengagems]
impact = "Les valeurs plus élevées ignorent les pics courts; les valeurs plus faibles s'engagent plus rapidement."
summary = "Durée de pression prolongée requise avant l'engagement (millisecondes)."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.field.sustainreleasems]
impact = "Des valeurs plus élevées évitent les oscillations entre états ; des valeurs plus basses rétablissent les plages plus tôt."
summary = "Durée de récupération prolongée requise avant la libération (millisecondes)."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.field.tickintervalms]
impact = "Des valeurs plus basses réagissent plus vite mais consomment plus de CPU ; des valeurs plus élevées réduisent la charge mais réagissent plus tard."
summary = "Intervalle d'évaluation principal du régulateur de portée de suivi, en millisecondes."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrinityincidentmode]
description = "Configuration de la fonctionnalité Mode incident Trinity. Cette fonctionnalité surveille en permanence le comportement du serveur et applique des garde-fous pendant l'exécution."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrinityincidentmode.field.enteradaptabilitytimingbudgetpercent]
impact = "Les valeurs élevées exigent un coût mesuré plus important des contrôles de garde Adapt avant le traitement de l'incident ; les valeurs faibles se déclenchent plus tôt."
