summary = "Distance du joueur (en blocs) à la colonne centrale d'un chunk à partir de laquelle son avance en attente est appliquée. L'activité d'un chunk suit la distance de simulation du monde."

[config.documentation.annotation.art.arcane.react.content.feature.featurecropfastforward.field.engageonincident]
