summary = "Applique un cycle d'activité à la perception des mobs situés entre la distance de cycle d'activité et la distance de sommeil lorsque le serveur est sous charge."

[config.documentation.annotation.art.arcane.react.content.feature.featureadaptiveentitysleep.field.dutycyclemintickms]
