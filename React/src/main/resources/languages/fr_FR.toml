[config.documentation.annotation.art.arcane.react.content.feature.featuretrinityincidentmode.field.enteririspregeninflight]
impact = "Des valeurs plus élevées ne comptent la pression Iris que lorsque le prégénérateur tourne près de sa concurrence maximale ; des valeurs plus faibles comptent aussi une charge de prégénération plus légère."
