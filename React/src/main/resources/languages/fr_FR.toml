"config.documentation.annotation.art.arcane.react.content.feature.featurehopperchaincoalescing.description" = "Configuration pour la fonction de coalition entonnoir Chain. Détecte les chaînes linéaires de N entonnoirs alimentant dans la même direction et projette combien par transfert entonnoir ticks s'effondrerait en un seul tirage partiel tête à queue par chaîne par tick. Opère en mode de mesure seulement: détection de chaîne plus ticks enregistré projeté exposé via le lecteur de métriques de coalisation de chaîne. L'annulation des envois intermédiaires InventoryMoveItemEvent collide avec l'ordre de consommation de seau de FeatureHopperTokenBucket, donc le mouvement partiel réel est reporté à un pont NMS dédié."
"config.documentation.annotation.art.arcane.react.content.feature.featurehopperchaincoalescing.field.bypassradius.impact" = "Des valeurs plus élevées protègent une zone plus large autour des joueurs; des valeurs plus basses comptent les chaînes plus proches des joueurs."
"config.documentation.annotation.art.arcane.react.content.feature.featurehopperchaincoalescing.field.bypassradius.summary" = "Rayon de contournement autour des joueurs en blocs; chaînes touchant ce rayon sauter coalisant la comptabilité."
"config.documentation.annotation.art.arcane.react.content.feature.featurehopperchaincoalescing.field.engageonincident.impact" = "Des valeurs plus élevées réservent le regroupement pour les incidents graves; des valeurs plus faibles s'appliquent plus tôt."
"config.documentation.annotation.art.arcane.react.content.feature.featurehopperchaincoalescing.field.engageonincident.summary" = "Seuil de déclenchement pour la comptabilité du regroupement plutôt que pour la détection passive (score d'incident)."
