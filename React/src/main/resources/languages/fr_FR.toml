[config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands_customshorthand.field.permission]
impact = "Par défaut, react.shorthands.custom limite les raccourcis personnalisés aux opérateurs."
summary = "Autorisation facultative requise pour utiliser ce raccourci en plus de celle de la commande cible. Laissez ce champ vide pour ne demander aucune autorisation supplémentaire au raccourci."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakspawnerplayerradius]
