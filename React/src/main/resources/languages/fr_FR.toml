[config.documentation.annotation.art.arcane.react.content.feature.featureactivationrangegovernor.field.tickintervalms]
impact = "Des valeurs plus basses réagissent plus vite mais consomment plus de CPU ; des valeurs plus élevées réduisent la charge mais réagissent plus tard."
summary = "Intervalle d'évaluation principal pour le régulateur de plage d'activation en millisecondes."

[config.documentation.annotation.art.arcane.react.content.feature.featureactivationrangegovernor.field.villagerrangefactor]
impact = "Des valeurs plus basses réduisent le coût du cerveau et des POI des villageois, la classe d'entités la plus coûteuse ; les villageois éloignés restent inactifs jusqu'à ce qu'on s'en approche."
summary = "Facteur d'échelle appliqué à la plage d'activation des villageois pendant l'engagement."

[config.documentation.annotation.art.arcane.react.content.feature.featureactivationrangegovernor.field.waterrangefactor]
