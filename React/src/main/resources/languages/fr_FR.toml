description = "Configuration de la fonctionnalité Régulateur de plage d'activation. Réduit temporairement les plages d'activation des entités par monde lorsque le serveur subit une pression soutenue, afin que le serveur désactive lui-même les entités éloignées au lieu de les traiter à chaque tick. Contrairement à dynamic-activation-range (qui échantillonne et met en pause les entités une par une), ces plages sont lues par le serveur à chaque tick et s'appliquent instantanément à toutes les entités. Les plages et le traitement des villageois sont rétablis une fois que le serveur récupère."

[config.documentation.annotation.art.arcane.react.content.feature.featureactivationrangegovernor.field.animalrangefactor]
impact = "Des valeurs inférieures désactivent les animaux éloignés plus tôt pendant les fenêtres de pression."
summary = "Facteur d'échelle appliqué à la plage d'activation animale pendant l'engagement."

[config.documentation.annotation.art.arcane.react.content.feature.featureactivationrangegovernor.field.engageticktimems]
impact = "Les valeurs inférieures réduisent les plages d'activation plus tôt; les valeurs supérieures le réservent pour une charge plus lourde."
summary = "Millisecondes moyennes par tick requises avant que le régulateur n'intervienne."

[config.documentation.annotation.art.arcane.react.content.feature.featureactivationrangegovernor.field.flyingmonsterrangefactor]
impact = "Des valeurs plus basses désactivent plus tôt les fantômes et les ghasts éloignés pendant les fenêtres de pression."
summary = "Facteur d'échelle appliqué à la plage d'activation des monstres volants pendant l'intervention."

[config.documentation.annotation.art.arcane.react.content.feature.featureactivationrangegovernor.field.minimumrangeblocks]
impact = "Des valeurs plus élevées limitent l'agressivité de la réduction des plages ; des valeurs plus basses permettent des réductions plus fortes."
summary = "Plage d'activation minimale en blocs après mise à l'échelle."

[config.documentation.annotation.art.arcane.react.content.feature.featureactivationrangegovernor.field.miscrangefactor]
impact = "Des valeurs plus basses désactivent plus tôt les objets, projectiles et entités ambiantes éloignés."
summary = "Facteur d'échelle appliqué à la plage d'activation des entités diverses pendant l'intervention."

[config.documentation.annotation.art.arcane.react.content.feature.featureactivationrangegovernor.field.monsterrangefactor]
impact = "Des valeurs plus basses désactivent plus tôt les monstres éloignés ; les mobs se figent visiblement jusqu'à ce qu'on s'en approche."
summary = "Facteur d'échelle appliqué à la plage d'activation du monstre pendant l'engagement."

[config.documentation.annotation.art.arcane.react.content.feature.featureactivationrangegovernor.field.raiderrangefactor]
impact = "Des valeurs plus basses réduisent le coût de l'IA des pillards mais peuvent ralentir les raids actifs ; prudent par défaut."
summary = "Facteur d'échelle appliqué à la plage d'activation des pillards pendant l'intervention."

[config.documentation.annotation.art.arcane.react.content.feature.featureactivationrangegovernor.field.releaseticktimems]
