"config.documentation.annotation.art.arcane.react.content.feature.featurefurnacebrewbatching.description" = "Configuration pour la fonction Furnace/Brew Battching. Traque les fours et brasseurs actifs par chunk et mesure le nombre d'intermédiaires ticks qui pourraient être ignorés entre les événements de décompression/complete cuisine. Reports projeté volume saut comme une mesure d'exécution; contourne tout bloc dans bypassRadius d'un joueur donc la flamme cosmétique / fumée reste vivante près des joueurs."
"config.documentation.annotation.art.arcane.react.content.feature.featurefurnacebrewbatching.field.bypassradius.impact" = "Les valeurs plus élevées permettent à davantage de fours proches d'exécuter un cycle de traitement du serveur normalement; les valeurs inférieures permettent au batchage d'atteindre les joueurs."
"config.documentation.annotation.art.arcane.react.content.feature.featurefurnacebrewbatching.field.bypassradius.summary" = "Rayon de bloc autour de chaque joueur où le four/brasage est contourné."
"config.documentation.annotation.art.arcane.react.content.feature.featurefurnacebrewbatching.field.engageincidentscore.impact" = "Des valeurs plus faibles s'appliquent lors d'incidents moins graves; des valeurs plus élevées attendent les incidents graves."
"config.documentation.annotation.art.arcane.react.content.feature.featurefurnacebrewbatching.field.engageincidentscore.summary" = "Score de l'incident (0-100) nécessaire avant que le four/brasage ne se déclenche."
"config.documentation.annotation.art.arcane.react.content.feature.featurefurnacebrewbatching.field.engageticktimems.impact" = "Les valeurs inférieures s'engagent plus tôt; les valeurs supérieures se réservent le lotage pour une charge plus lourde."
"config.documentation.annotation.art.arcane.react.content.feature.featurefurnacebrewbatching.field.engageticktimems.summary" = "Millisecondes tick moyennes nécessaires avant l'activation du batchage au four/brasseur."
"config.documentation.annotation.art.arcane.react.content.feature.featurefurnacebrewbatching.field.maxtrackedentries.impact" = "Des valeurs plus élevées permettent de suivre les grandes exploitations; des valeurs plus faibles sont utilisées pour la mémoire du plafond au coût de l'exactitude."
"config.documentation.annotation.art.arcane.react.content.feature.featurefurnacebrewbatching.field.maxtrackedentries.summary" = "Les unités de bloc maximales autorisées par le four/la truie."
"config.documentation.annotation.art.arcane.react.content.feature.featurefurnacebrewbatching.field.releaseticktimems.impact" = "Les valeurs inférieures maintiennent le lotage plus longtemps pour la stabilité; les valeurs supérieures se libèrent plus tôt."
