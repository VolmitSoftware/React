[config.documentation.annotation.art.arcane.react.content.feature.featureactivationrangegovernor]
description = "Configuration pour la fonction Activation Range Governor. Réduit temporairement les plages d'activation de l'entité par monde pendant que le serveur est sous pression soutenue, de sorte que le serveurs lui-même désactive des entités distantes au lieu d'exécuter un cycle de traitement du serveur pour eux. Contrairement à ( dynamique d'activations-distances qui échantillonne et arrête les entités une par une), ces plages sont lues par le serveur chaque tick et s'appliquent instantanément à toutes les entités. Les plages et villagers exécutant un cycle de processing du serveur sont restaurés une fois que le serveau se rétablit."

