summary = "Score d'incident au-dessus duquel l'avance rapide cesse de s'activer. Cette fonctionnalité reste inactive pendant les incidents à forte charge (polarité opposée à la plupart des fonctionnalités de React)."

[config.documentation.annotation.art.arcane.react.content.feature.featurecropfastforward.field.engageontickms]
