[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.updatenotifications]
summary = "Recherche les mises à jour de React dans les versions GitHub."
impact = "Activé par défaut. VolmLib regroupe les mises à jour dans un avis à la connexion et dans /volmit plugins updates. Désactivez pour arrêter les vérifications de React."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.minimumincidentscore]
summary = "Score d’incident requis pour poursuivre les mesures d’atténuation."
impact = "Le scénario continue si ce score ou minimumTickMS est atteint."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.minimumtickms]
summary = "Durée moyenne d’un tick, en millisecondes, requise pour poursuivre les mesures."
impact = "Le scénario s’arrête lorsque les deux indicateurs de pression sont sous leur seuil."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.minimumentitiesperchunk]
summary = "Nombre d’entités observées dans un chunk requis avant leur réduction."
impact = "Une valeur élevée limite la réduction aux concentrations d’entités les plus denses."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.recheckdelayms]
summary = "Délai d’observation après une action enfant, en millisecondes ; minimum 1000."
impact = "Permet d’actualiser les métriques avant de choisir la mesure suivante."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.childtimeoutms]
summary = "Durée maximale d’une étape d’atténuation, en millisecondes ; minimum 1000."
impact = "L’expiration du délai d’une action enfant fait échouer le scénario et arrête l’escalade."

[config.documentation.annotation.art.arcane.react.content.action.actiontrimentitiesbyagepriority_params.field.minimumentitiesperchunk]
summary = "Nombre minimal d’entités observées dans un chunk avant réduction ; zéro inclut tous les chunks observés."
impact = "Une valeur positive limite la réduction aux chunks denses."

[action.capture_profile]
completed = "{count} profil local enregistré dans {path}"

[config.documentation.annotation.art.arcane.react.content.action.actioncaptureprofile]
description = "Capture à la demande un profil JDK Flight Recorder local avec les événements d’exécution, d’allocation et de GC. Conserve trois captures ; aucun téléversement."

[config.documentation.annotation.art.arcane.react.content.action.actioncaptureprofile_params.field.seconds]
summary = "Durée du profil en secondes, limitée entre 1 et 300."
impact = "Une capture plus longue couvre davantage d’activité ; l’enregistrement JFR conserve au plus 64 MiB de données glissantes."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.playerchunkbudgetenabled]
summary = "Active les budgets de chunks des joueurs par monde ; les chevauchements comptent une seule fois."
impact = "Désactivé par défaut. Les budgets peuvent réduire les distances cibles existantes ; leur rétablissement est progressif."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.playertickingchunkbudget]
summary = "Nombre maximal estimé de chunks simulés pour les joueurs par monde ; minimum 1."
impact = "Les zones de simulation qui se chevauchent comptent une fois. Les distances minimales configurées priment si le budget est irréalisable."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.playerviewonlychunkbudget]
summary = "Nombre maximal estimé de chunks uniquement visibles par monde ; minimum 1."
impact = "Compte la zone visible hors de la zone simulée. Estime la demande des joueurs, pas les chunks réellement chargés ni les tickets des plugins."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.budgetrecoverychecks]
summary = "Nombre de vérifications budgétaires saines consécutives avant d’augmenter une distance ; minimum 1."
impact = "Les vérifications suivent updateCooldownSeconds. L’absence de télémétrie des ticks ou un index des joueurs indisponible réinitialise le rétablissement."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.budgetrecoverystep]
summary = "Augmentation maximale de distance après rétablissement du budget, en chunks ; limitée entre 1 et 32."
impact = "De petits pas limitent les pics de chargement pendant le rétablissement. S’applique uniquement si les budgets de chunks des joueurs sont activés."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller]
description = "Échantillonne les positions des joueurs Folia et, en option, un ensemble limité d’événements JDK Flight Recorder. JFR relève les totaux du trafic protocolaire, les étapes de génération des chunks, l’activité de stockage et les attentes dépassant le seuil configuré."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller.field.regionalenabled]
summary = "Active l’échantillonnage des TPS des régions Folia aux positions des joueurs."
impact = "Interroge chaque seconde une sélection limitée et tournante de positions de joueurs mises en cache, sans charger de chunks."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller.field.playeranchorsperrefresh]
summary = "Nombre maximal de positions de joueurs échantillonnées par seconde, limité de 1 à 512. Les observations expirent après cinq secondes."
impact = "Des valeurs plus élevées couvrent davantage de joueurs, mais nécessitent plus de requêtes de TPS des régions."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller.field.jfrenabled]
summary = "Active la télémétrie JFR sélective. Désactivée par défaut. Les résumés publiés excluent les adresses, les chemins de fichiers et les traces de pile."
impact = "Ajoute du travail d’enregistrement JFR avec des limites de conservation de 30 secondes et 64 MiB. Les séries agrégées sont réinitialisées chaque seconde."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller.field.jfrslowthresholdms]
summary = "Durée minimale en millisecondes des événements JVM d’E/S de fichiers, d’entrée dans un moniteur, d’attente sur un moniteur et de mise en attente des threads, limitée de 1 à 1000. Les étapes de génération des chunks n’ont pas de seuil de durée."
impact = "Des seuils plus bas produisent davantage d’événements JVM. Ces métriques décrivent uniquement les événements qui atteignent ce seuil."
