[config.documentation.annotation.art.arcane.react.content.feature.featurecropfastforward]
description = "Configuration de la fonctionnalité Avance rapide des cultures. Le serveur ne fait pousser les cultures que dans les chunks situés dans la distance de simulation d'un joueur ; cette fonctionnalité enregistre donc combien de temps chaque chunk chargé passe hors de cette distance. Lorsqu'un joueur revient dans la portée active, elle parcourt une fois les blocs de cultures et de pousses du chunk et fait avancer leur croissance de cette durée, afin que les joueurs ne trouvent pas de fermes figées à leur retour. La croissance en attente est abandonnée lorsqu'un chunk est déchargé. Reste inactive pendant les incidents de forte charge."

[config.documentation.annotation.art.arcane.react.content.feature.featurecropfastforward.field.activerange]
