[config.documentation.annotation.art.arcane.react.content.feature.featuretrinityincidentmode.field.minimumengagems]
impact = "Les valeurs plus élevées exigent des signaux plus forts avant l'action; les valeurs plus faibles facilitent la satisfaction de cette condition."
summary = "Durée minimale d'activation, en ms, requise par le mode incident Trinity."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrinityincidentmode.field.playbookcooldownms]
impact = "Des valeurs plus élevées réduisent la fréquence de répétition; des valeurs plus faibles permettent des réactions plus fréquentes."
summary = "Délai de récupération du scénario dans le mode incident Trinity (millisecondes)."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrinityincidentmode.field.tickintervalms]
impact = "Des valeurs plus basses réagissent plus vite mais consomment plus de CPU ; des valeurs plus élevées réduisent la charge mais réagissent plus tard."
summary = "Intervalle d'évaluation principal du mode incident Trinity, en millisecondes."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrinityincidentmode.field.verbosetransitions]
impact = "Activer pour les diagnostics ; désactiver pour réduire le bruit dans le chat ou les journaux."
summary = "Active une journalisation supplémentaire des transitions détaillées en mode incident Trinity."

[config.documentation.annotation.art.arcane.react.content.feature.featureunknown]
description = "Configuration de la fonctionnalité Inconnue. Cette fonctionnalité surveille en permanence le comportement du serveur et applique des garde-fous pendant l'exécution."

[config.documentation.annotation.art.arcane.react.content.feature.perworld.worldbudgetoverride.field.budgetms]
summary = "Seuil de budget par monde, en millisecondes, remplaçant budgetMs global pour ce monde."

[config.documentation.annotation.art.arcane.react.content.feature.perworld.worldbudgetoverride.field.panicms]
summary = "Seuil de panique par monde, en millisecondes, remplaçant panicMs global pour ce monde."

[config.documentation.annotation.art.arcane.react.content.feature.perworld.worldbudgetoverride.field.releasems]
summary = "Seuil de relâchement par monde, en millisecondes, remplaçant releaseMs global pour ce monde."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakentitybubbler]
description = "Configuration de l'ajustement Anti-bulles d'entités. Empêche certaines entités projectiles ou utilitaires d'être suspendues indéfiniment dans des colonnes de bulles."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakentitybubbler.field.entitiedtopreventfrombeingbubbled]
impact = "Ajoutez des types pour nettoyer agressivement les ascenseurs à bulles, ou retirez des types pour permettre à ces entités de voyager dans les colonnes d'eau."
summary = "Types d'entités supprimées lorsqu'elles sont détectées dans les trajets de colonne de bulles ou de sable des âmes."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakentitycrowdprevention]
description = "Configuration de l'ajustement Prévention de l'entassement d'entités. Élague les groupes d'entités de type bétail surpeuplés avant qu'ils ne créent une pression de ticks soutenue."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakentitycrowdprevention.field.maxentitiesperclustercrowd]
impact = "Des valeurs plus élevées permettent des rafales plus importantes avant que le contrôle n'intervienne ; des valeurs plus basses plafonnent les pics plus tôt."
summary = "Nombre maximal d'entités autorisé par groupe dans la prévention de l'entassement d'entités."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakentitycrowdprevention.field.mobstopreventfromcrowding]
impact = "Réduisez cette liste pour protéger plus de mobs, ou élargissez-la pour appliquer l'anti-entassement à d'autres types d'entités."
summary = "Types d'entités surveillés pour la pression d'entassement locale et éligibles à l'élagage."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakentitycrowdprevention.field.prevententitybubbling]
impact = "Activer pour appliquer ce comportement ; désactiver pour garder ce chemin inactif."
summary = "Détermine si la prévention de l'entassement d'entités empêche les entités de se faire emporter par les bulles."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakentitycrowdprevention.field.protectnamedentities]
impact = "Laissez activé pour exclure les entités ayant un nom personnalisé ; désactivez pour autoriser leur suppression."
summary = "Protège les entités nommées par les joueurs de la prévention de l'entassement d'entités."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakentityhardstop]
description = "Configuration de l'ajustement Arrêt strict des entités. Plafonne strictement la population d'entités par chunk en annulant les nouveaux ajouts une fois les limites dépassées."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakentityhardstop.field.allowitemdrops]
impact = "Activer pour laisser les objets lâchés apparaître même dans les chunks bondés ; désactiver pour un plafonnement plus strict."
summary = "Permet aux entités d'objets naturels et lâchés par les joueurs de contourner les vérifications de plafond de l'arrêt strict."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakentityhardstop.field.cacheintervalticks]
impact = "Des valeurs plus élevées réduisent la charge de comptage répété mais peuvent refuser les apparitions plus longtemps ; des valeurs plus basses revérifient plus tôt avec plus de charge."
summary = "Durée de cache des chunks récemment rejetés par l'arrêt strict avant de revérifier le nombre d'entités (ticks)."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakentityhardstop.field.maxentitiesperchunk]
impact = "Des valeurs plus élevées permettent des rafales plus importantes avant que le contrôle n'intervienne ; des valeurs plus basses plafonnent les pics plus tôt."
summary = "Nombre maximal d'entités autorisé par chunk dans l'arrêt strict des entités."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakexperienceorbmerge]
description = "Configuration de l'ajustement Fusion des orbes d'expérience. Fusionne les orbes d'expérience proches en piles plus grandes pour réduire le nombre d'entités d'orbes et la charge de ramassage."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakexperienceorbmerge.field.maxexperienceperorb]
impact = "Des valeurs plus élevées permettent des rafales plus importantes avant que le contrôle n'intervienne ; des valeurs plus basses plafonnent les pics plus tôt."
summary = "Expérience maximale autorisée par orbe dans la fusion des orbes d'expérience."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakexperienceorbmerge.field.maxnearbyorbspermerge]
impact = "Des valeurs plus élevées permettent des rafales plus importantes avant que le contrôle n'intervienne ; des valeurs plus basses plafonnent les pics plus tôt."
summary = "Nombre maximal d'orbes proches autorisé par fusion dans la fusion des orbes d'expérience."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakexperienceorbmerge.field.mergeradius]
impact = "Des valeurs plus élevées élargissent la zone de recherche et coûtent plus de travail ; des valeurs plus basses réduisent la portée et coûtent moins cher."
summary = "Rayon de fusion utilisé par la fusion des orbes d'expérience (blocs)."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastcolumns]
description = "Configuration de l'ajustement Colonnes rapides. Réduit les colonnes de plantes dans les mises à jour en chaîne pour limiter les perturbations physiques répétées par bloc."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastdrops]
description = "Configuration de l'ajustement Drops rapides. Envoie les drops et l'XP directement aux joueurs pour réduire l'accumulation d'objets au sol et les perturbations de ramassage."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastdrops.field.allowcontainerdrops]
impact = "Activez pour autoriser ce comportement ; désactivez pour bloquer ou limiter cette voie."
summary = "Autorise les drops de conteneurs dans les drops rapides."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastdrops.field.teleportblockdrops]
impact = "Activer pour appliquer ce comportement ; désactiver pour garder ce chemin inactif."
summary = "Détermine si les drops rapides téléportent les drops de blocs."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastdrops.field.teleportblockxp]
impact = "Activer pour appliquer ce comportement ; désactiver pour garder ce chemin inactif."
summary = "Détermine si les drops rapides téléportent l'XP des blocs."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastdrops.field.teleportentitydrops]
impact = "Activer pour appliquer ce comportement ; désactiver pour garder ce chemin inactif."
summary = "Détermine si les drops rapides téléportent les drops d'entités."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastdrops.field.teleportentityxp]
impact = "Activer pour appliquer ce comportement ; désactiver pour garder ce chemin inactif."
summary = "Détermine si les drops rapides téléportent l'XP des entités."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastentityincineration]
description = "Configuration de l'ajustement Incinération rapide des entités. Supprime les monstres en feu selon des règles de proximité configurées afin de réduire le coût persistant des ticks de feu."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastentityincineration.field.incinerationbeyondnearestplayer]
impact = "Des valeurs plus élevées permettent de nettoyer plus loin des joueurs; des valeurs plus faibles maintiennent le nettoyage plus près des joueurs actifs."
summary = "Distance par rapport aux joueurs avant que l'incinération rapide des entités applique le comportement d'incinération (blocs)."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfallingblocks]
description = "Configuration de l'ajustement Blocs en chute rapides. Accélère les entités de blocs en chute de longue durée lorsque le traitement de la chute commence à causer un coût de tick mesurable."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfallingblocks.field.maxfallms]
impact = "Des valeurs plus élevées permettent un débit plus élevé avant l'intervention; des valeurs plus faibles rendent l'atténuation plus agressive."
summary = "Durée de chute maximale, en ms, autorisée par les blocs en chute rapides."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfire]
description = "Configuration de l'ajustement Feu rapide. Court-circuite les mises à jour de propagation et d'extinction du feu en opérations rapides sur le monde pour réduire la charge de la physique du feu."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids]
description = "Configuration de l'ajustement Fluides rapides. Accélère les chaînes de propagation d'eau et de lave en mises à jour par rafales bornées pour réduire les perturbations répétées des fluides à chaque étape."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids.field.acceleratedrain]
impact = "Activer pour accélérer le retrait des fluides et le comportement de vidage près des mises à jour d'écoulement ; désactiver pour n'accélérer que les ticks d'écoulement direct."
summary = "Détermine si les fluides rapides appliquent une accélération du drainage autour des événements d'écoulement actifs."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids.field.acceleratelava]
impact = "Activer pour accélérer les chaînes d'écoulement de lave ; désactiver pour laisser la lave au rythme vanilla."
summary = "Contrôle si les fluides rapides appliquent l'accélération de la lave."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids.field.acceleratewater]
impact = "Activer pour accélérer les chaînes d'écoulement d'eau ; désactiver pour laisser l'eau au rythme vanilla."
summary = "Contrôle si les fluides rapides appliquent l'accélération de l'eau."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids.field.extravanillaticksperevent]
impact = "Des valeurs plus élevées compressent plus de mises à jour de fluides en moins de ticks serveur mais peuvent augmenter le travail de fluides par tick."
summary = "Ticks de fluides vanilla supplémentaires mis en file par événement d'écoulement dans les fluides rapides."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids.field.maxburstticksperlocationperservertick]
impact = "Des valeurs plus élevées compressent plus vite les chaînes de fluides en un seul tick pour chaque emplacement ; des valeurs plus basses répartissent plus uniformément le travail sur les ticks."
summary = "Nombre maximal de ticks de fluides supplémentaires en file consommés pour un emplacement de bloc lors d'un seul vidage de tick serveur."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids.field.maxextravanillaticksperservertick]
impact = "Des valeurs plus élevées autorisent des rafales d'accélération plus fortes ; des valeurs plus basses plafonnent plus strictement le coût des rafales de fluides."
summary = "Nombre maximal de ticks de fluides vanilla supplémentaires autorisé par tick serveur dans les fluides rapides."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastsnow]
description = "Configuration de l'ajustement Neige rapide. Court-circuite les mises à jour de formation et de fonte de la neige en opérations rapides sur le monde pour réduire les perturbations des blocs météo."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex]
description = "Pré-tick des entonnoirs à l'aide d'un index spatial d'objets pour court-circuiter l'analyse AABB des entités par tick de vanilla. Retombe sur vanilla si un pont NMS requis est indisponible."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.idlestretch]
impact = "Activer pour réduire le coût des ticks d'entonnoirs inactifs sur les serveurs riches en entonnoirs ; le ramassage d'objets via la voie rapide de l'index reste instantané."
summary = "Allonge le délai de transfert des entonnoirs vides et inactifs lorsque le serveur est sous charge, afin que vanilla évite de les interroger à nouveau."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.idlestretchmintickms]
impact = "Des valeurs plus basses étirent plus tôt les entonnoirs inactifs ; des valeurs plus élevées le réservent aux charges plus lourdes."
summary = "Millisecondes moyennes par tick requises avant l'activation de l'allongement des entonnoirs inactifs."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.idlestretchspreadpasses]
impact = "Des valeurs plus élevées sondent chaque entonnoir moins souvent (moins coûteux, allongement plus lent) ; des valeurs plus basses allongent plus tôt les entonnoirs inactifs."
summary = "Nombre de passes de tick sur lesquelles la sonde de chaque entonnoir inactif est répartie."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.idlestretchticks]
impact = "Des valeurs plus élevées ignorent davantage de travail d'entonnoirs inactifs mais retardent plus longtemps la reprise des transferts."
summary = "Délai de récupération en ticks appliqué aux entonnoirs vides et inactifs ; borne le retard maximal avant qu'un entonnoir inactif ne reprenne le prélèvement dans un conteneur."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.itemchunkbudgetpertick]
summary = "Nombre maximal de chunks contenant des objets inspectés dans l’ensemble des mondes par tick."
impact = "Les valeurs élevées revérifient plus vite les chunks indexés, mais peuvent planifier davantage de travail par région ; elles sont limitées entre 1 et 4096."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperlimit]
description = "Configuration du réglage de limitation des entonnoirs. Annule les transferts lorsque la pression liée à l’étendue temporelle des événements d’entonnoirs dépasse le seuil configuré."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperlimit.field.maxhoppereventspan]
impact = "Des valeurs plus élevées permettent un débit plus élevé avant l'intervention; des valeurs plus faibles rendent l'atténuation plus agressive."
summary = "Étendue temporelle maximale des événements d’entonnoirs autorisée par la limitation."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator]
description = "Configuration de l'ajustement Accélérateur de disparition des objets. Pousse les objets lâchés éligibles vers la disparition lorsqu'aucun joueur n'est à proximité."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.field.ignorenameditems]
impact = "Activez pour exclure les cas correspondants ; désactivez pour les inclure dans l'application des règles."
summary = "Ignore les objets nommés lorsque l'accélérateur de disparition des objets évalue les cibles."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.field.ignorevaluables]
impact = "Activez pour exclure les cas correspondants ; désactivez pour les inclure dans l'application des règles."
summary = "Ignore les objets de valeur lorsque l'accélérateur de disparition des objets évalue les cibles."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.field.noplayerradius]
impact = "Des valeurs plus élevées élargissent la zone de recherche et coûtent plus de travail ; des valeurs plus basses réduisent la portée et coûtent moins cher."
summary = "Rayon sans joueur utilisé par l'accélérateur de disparition des objets (blocs)."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.field.targettickslived]
impact = "Des valeurs plus élevées rapprochent immédiatement les objets de la disparition ; des valeurs plus basses conservent une durée de vie plus naturelle."
summary = "Valeur de ticks vécus imposée aux objets éligibles pour accélérer le délai de disparition vanilla."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.field.valuableitems]
impact = "Ajoutez des matériaux pour protéger plus d'objets de la disparition accélérée, ou retirez-en pour permettre un nettoyage plus rapide."
summary = "Liste de matériaux traités comme objets de valeur et exclus lorsque `ignoreValuables` est activé."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakprojectilelimiter]
description = "Configuration de l'ajustement Limiteur de projectiles. Applique des plafonds de rafales de projectiles par joueur et par chunk pour éviter les pics de spam de projectiles."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakprojectilelimiter.field.bypasspermission]
impact = "Changez ceci pour correspondre à votre modèle de permission pour le comportement de contournement."
summary = "Chaîne du nœud de permission vérifiée avant l'application du limiteur de projectiles."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakprojectilelimiter.field.chunkwindowms]
impact = "Les fenêtres plus longues lissent les rafales mais réagissent plus lentement ; les fenêtres plus courtes réagissent plus vite mais sont plus sensibles."
summary = "Durée de la fenêtre glissante pour les contrôles par chunk (millisecondes)."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakprojectilelimiter.field.cleanupintervalms]
impact = "Des valeurs plus basses réagissent plus vite mais consomment plus de CPU ; des valeurs plus élevées réduisent la charge mais réagissent plus tard."
summary = "Intervalle d'évaluation principal du limiteur de projectiles, en millisecondes."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakprojectilelimiter.field.limitchunkprojectiles]
impact = "Activer pour appliquer ce comportement ; désactiver pour garder ce chemin inactif."
summary = "Détermine si le limiteur de projectiles limite les projectiles par chunk."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakprojectilelimiter.field.limitplayerprojectiles]
impact = "Activer pour appliquer ce comportement ; désactiver pour garder ce chemin inactif."
summary = "Détermine si le limiteur de projectiles limite les projectiles par joueur."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakprojectilelimiter.field.maxprojectilesperchunkwindow]
impact = "Des valeurs plus élevées permettent des rafales plus importantes avant que le contrôle n'intervienne ; des valeurs plus basses plafonnent les pics plus tôt."
summary = "Nombre maximal de projectiles autorisés par fenêtre de chunk dans le limiteur de projectiles."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakprojectilelimiter.field.maxprojectilesperplayerwindow]
impact = "Des valeurs plus élevées permettent des rafales plus importantes avant que le contrôle n'intervienne ; des valeurs plus basses plafonnent les pics plus tôt."
summary = "Nombre maximal de projectiles autorisés par fenêtre de joueur dans le limiteur de projectiles."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakprojectilelimiter.field.playerwindowms]
impact = "Les fenêtres plus longues lissent les rafales mais réagissent plus lentement ; les fenêtres plus courtes réagissent plus vite mais sont plus sensibles."
summary = "Durée de la fenêtre glissante pour les contrôles par joueur (millisecondes)."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakprojectilelimiter_burstwindow.field.count]
impact = "État principalement d'exécution; React met à jour automatiquement cette information lors de l'évaluation en direct."
summary = "Compteur interne utilisé par le limiteur de projectiles pour suivre l'activité des rafales."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakprojectilelimiter_burstwindow.field.lasthit]
impact = "État principalement d'exécution ; le modifier manuellement peut fausser le délai de recharge ou le comportement de limitation."
summary = "Horodatage interne utilisé par le limiteur de projectiles pour suivre les fenêtres de temps et la décroissance."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakprojectilelimiter_burstwindow.field.start]
impact = "État principalement d'exécution ; le modifier manuellement peut fausser le délai de recharge ou le comportement de limitation."
summary = "Horodatage interne utilisé par le limiteur de projectiles pour suivre les fenêtres de temps et la décroissance."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakprojectilelimiter_chunkkey.field.world]
impact = "Ce sont des données d'identité d'exécution qui devraient normalement être laissées aux mises à jour automatiques."
summary = "Identifiant de monde utilisé par le suivi interne du limiteur de projectiles."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakprojectilelimiter_chunkkey.field.x]
impact = "Ce sont des données d'état internes qui ne doivent normalement pas être modifiées manuellement."
summary = "Coordonnée X utilisée par le suivi interne du limiteur de projectiles."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakprojectilelimiter_chunkkey.field.z]
impact = "Ce sont des données d'état internes qui ne doivent normalement pas être modifiées manuellement."
summary = "Coordonnée Z utilisée par le suivi interne du limiteur de projectiles."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakserverhibernator]
description = "Configuration de l'ajustement Hibernation du serveur. Mode d'hibernation expérimental pour serveur vide qui dort entre les ticks lorsqu'aucun joueur n'est en ligne."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakserverhibernator.field.imacloudserverenableme]
impact = "Laissez à false, sauf si vous voulez explicitement que React mette les ticks en veille lorsque le serveur est vide."
summary = "Verrou de sécurité pour le chemin expérimental d'hibernation du serveur."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakserverhibernator.field.secondspertick]
impact = "Des valeurs plus élevées ralentissent la boucle plus fortement ; des valeurs plus basses gardent le serveur plus réactif."
summary = "Secondes de délai appliquées par tick par l'hibernation du serveur."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands]
description = "Configuration de Shorthands. Ajoute des raccourcis de commandes opérateur configurables séparément sans modifier /reload."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.customcommands]
impact = "Chaque entrée activée ajoute dynamiquement une commande. La commande cible applique toujours ses propres autorisations et les libellés existants sont protégés sauf si overrideExisting est activé."
summary = "Commandes de raccourci personnalisées organisées par libellé. Ajoutez une table [customCommands.day] avec enabled = true, command = \"time set day\", permission = \"react.shorthands.custom\" et overrideExisting = false. Les arguments saisis après le raccourci sont ajoutés à la commande configurée ; placez le mot args entre accolades dans la commande pour les insérer ailleurs."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.give]
impact = "Lorsqu'il est activé, le raccourci contrôle /give sans espace de noms ; la commande vanilla avec espace de noms reste disponible."
summary = "Enregistre /give <item> <amount> avec l'autocomplétion des objets Minecraft."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.gmc]
impact = "Désactivez cette option pour que /gmc ne soit pas enregistré lorsque Shorthands est actif."
summary = "Enregistre /gmc pour passer le joueur qui exécute la commande en mode Créatif."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.gms]
impact = "Désactivez cette option pour que /gms ne soit pas enregistré lorsque Shorthands est actif."
summary = "Enregistre /gms pour passer le joueur qui exécute la commande en mode Survie."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.gmsp]
impact = "Désactivez cette option pour que /gmsp ne soit pas enregistré lorsque Shorthands est actif."
summary = "Enregistre /gmsp pour passer le joueur qui exécute la commande en mode Spectateur."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.more]
impact = "Désactivez cette option pour que /more ne soit pas enregistré lorsque Shorthands est actif."
summary = "Enregistre /more pour donner une pile de taille maximale correspondant exactement à l'objet tenu."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.rl]
impact = "Désactivez cette option pour que /rl ne soit pas enregistré lorsque Shorthands est actif."
summary = "Enregistre /rl comme alias exécutant la commande /reload non qualifiée du serveur."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands_customshorthand.field.command]
impact = "La commande cible s'exécute avec les autorisations existantes de l'émetteur et ne peut pas élever son accès."
summary = "Commande exécutée en tant qu'utilisateur du raccourci, sans barre oblique initiale. Les arguments fournis sont ajoutés automatiquement sauf si le mot args apparaît entre accolades."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands_customshorthand.field.enabled]
impact = "Désactivez-la pour conserver la définition dans la configuration sans enregistrer sa commande."
summary = "Active cette commande de raccourci personnalisée."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands_customshorthand.field.overrideexisting]
impact = "Conservez false pour ignorer en toute sécurité les libellés en conflit. React restaure toute association remplacée lorsque le raccourci est désactivé ou rechargé."
