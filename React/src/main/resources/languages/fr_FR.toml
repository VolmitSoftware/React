# React — fr_FR
#
# === Modifier le fichier ===
# plugins/React/languages/fr_FR.toml
# Ce fichier peut être modifié directement. Les modifications locales sont conservées ; les entrées manquantes ou invalides utilisent l’anglais intégré.
# /react language server edit fr_FR
#
# === Préfixe ===
# runtime.prefix: Préfixe ajouté par React avant les messages de discussion.
#
# === Mise en forme ===
# Les messages de discussion acceptent les codes couleur avec & : &cTexte&r, &lTexte&r.
# Couleurs : &0-&9 et &a-&f.
# Styles : &l gras, &o italique, &n souligné, &m barré, &k caractères brouillés, &r réinitialisation.
# Les codes couleur effacent les styles actifs ; placez la couleur avant le style, comme dans &3&lTexte&r. &r réinitialise toute la mise en forme.
# Les couleurs RGB utilisent &#RRGGBBTexte&r, par exemple &#55AAFFTexte&r.
# Utilisez MiniMessage pour les dégradés et les interactions ; ne mélangez pas les balises MiniMessage et les codes & dans un même message. Fermez les balises dans l'ordre inverse de leur ouverture.
# Conservez des guillemets et des séquences d'échappement TOML valides.
# Utilisez \n dans les chaînes TOML entre guillemets pour un saut de ligne ; {{ et }} affichent des accolades littérales.
# Les valeurs de renderer.* et config.documentation.annotation.* sont en texte brut.
# Les valeurs de test.* sont en texte brut, sauf les messages de test.result.*, qui acceptent la mise en forme.
# Utilisez les variables dans le texte du message, en dehors des balises MiniMessage.
#
# === Variables ===
# Conservez les noms des variables et utilisez uniquement celles du message concerné.
#   {action}  Nom de l'action ou sens du réglage de couleur
#   {actions}  Nombre d'actions en attente ou liste des noms d'actions exclues
#   {active}  Nombre de fonctionnalités ou d'ajustements actifs
#   {actor}  Utilisateur web ayant effectué une modification
#   {added}  Indique si une fonctionnalité a rejoint le registre actif après son activation ; messages ajoutés par une mise à jour de langue
#   {after}  Valeur de configuration, message de langue ou utilisation du tas après une modification
#   {age}  Âge des données d'intégration en secondes
#   {amount}  Nombre d'objets à donner
#   {architecture}  Architecture du CPU
#   {argument}  Argument de commande inattendu
#   {available}  Nombre de références disponibles du pont NMS
#   {average}  TPS moyens ou millisecondes moyennes par tick
#   {avg_mspt}  Millisecondes moyennes par tick pendant une passe de test de charge
#   {avg_tps}  Nombre moyen de ticks par seconde pendant une passe de test de charge
#   {bar}  Barre de score de performance mise en forme
#   {before}  Valeur de configuration, message de langue ou utilisation du tas avant une modification
#   {checked}  Nombre d'échantillonneurs vérifiés
#   {chunks}  Nombre de chunks affectés par une action
#   {code}  Code d'appariement web
#   {command}  Chemin de la commande
#   {count}  Nombre d'entrées, de modules, de modifications ou de résultats de tests
#   {current}  Numéro de la page actuelle
#   {delta_heap}  Écart d'utilisation finale du tas entre React et la référence, en MB
#   {delta_mspt}  Écart de durée moyenne des ticks entre React et la référence, en ms
#   {delta_tps}  Écart de TPS moyens entre React et la référence
#   {detail}  Détails de diagnostic du pont, de l'intégration, de l'action ou du test
#   {dimensions}  Dimensions détectées de la grille du mur de cartes
#   {direction}  Sens de rotation de la teinte de la couleur sélectionnée
#   {distance}  Distance de vue, de simulation ou d’envoi demandée, en chunks
#   {duration}  Temps écoulé ; les messages de lancement des tests de charge utilisent des secondes
#   {enabled}  État d'activation ou nombre de modules activés
#   {entities}  Nombre d'entités affectées par une action
#   {entry}  Entrée de la chronologie de l'intégration
#   {exceptions}  Exceptions React enregistrées pendant une passe de test de charge
#   {fail}  Nombre de vérifications échouées
#   {file}  Nom du fichier de configuration, de langue ou d'API de plugins
#   {fingerprint}  Empreinte du serveur ou du jeton web
#   {finite}  Nombre d'échantillonneurs renvoyant des valeurs finies
#   {frames}  Nombre de cadres dans le mur de cartes actif
#   {free}  Mémoire physique ou virtuelle libre
#   {freed}  Mémoire du tas libérée par le ramasse-miettes
#   {from}  Numéro de la première entrée de la page actuelle
#   {grid}  Dimensions de la grille du mur de cartes
#   {ground_y}  Hauteur du sol pour le test de gravité
#   {group}  Groupe de moniteurs, d'échantillonneurs, de cartes, de configuration ou de messages de langue
#   {growth}  Augmentation du tas pendant un test de charge, en MB
#   {health}  État de fonctionnement de l'intégration
#   {heap_end}  Utilisation du tas à la fin d'une passe de test de charge, en MB
#   {heap_start}  Utilisation du tas au début d'une passe de test de charge, en MB
#   {heartbeat}  Temps écoulé depuis le dernier signal d'activité de l'intégration
#   {height}  Hauteur de la surface de dessin du test en pixels
#   {hoppers}  Nombre d'entonnoirs normalisés
#   {id}  Identifiant d'une référence du pont, d'un échantillonneur, d'une carte, d'une action, d'un paquet ou d'un jeton
#   {impact}  Description de l'effet de la configuration
#   {incident}  Identifiant de l'action récursive d'incident exclue des tests de développement
#   {index}  Numéro de l'étape actuelle des tests de développement
#   {invalid}  Nombre d'échantillonneurs avec des mesures invalides
#   {issued_at}  Date et heure de création du jeton web
#   {item}  Nom ou identifiant de l'objet
#   {items}  Nombre d'entités d'objets fusionnées
#   {kept}  Modifications locales conservées par une mise à jour de langue
#   {key}  Clé du paramètre de commande, clé de configuration ou ID du message de langue
#   {label}  Libellé du test de performance, de la mesure, du réglage, de la commande ou du jeton web
#   {line}  Numéro de la ligne modifiée dans un message multiligne
#   {lines}  Nombre de lignes du journal du serveur examinées
#   {loaded}  Nombre de chunks nouvellement chargés pendant le préchargement
#   {locale}  Code de langue affiché, sélectionné ou modifié
#   {matched}  Mondes dont l'état de sauvegarde automatique correspond à la référence du test
#   {max_tick}  Plus grand intervalle observé entre les ticks pendant un test de charge, en ms
#   {maximum}  Nombre maximal d'objets, seuil de durée des ticks ou longueur de saisie dans l'éditeur
#   {message}  Résumé de l'action terminée ou message d'état de l'intégration
#   {metrics}  Nombre de mesures fournies par un paquet d'API de plugins
#   {minecraft}  Version de Minecraft
#   {minimum}  TPS minimaux acceptables
#   {missing}  Nombre d'échantillonneurs requis absents du registre
#   {mode}  Mode de jeu ou de capacité sélectionné
#   {model}  Modèle du CPU
#   {name}  Nom du test de performance, du module, du moteur de rendu ou de la vérification
#   {note}  Raison pour laquelle le journal du serveur n'a pas été examiné
#   {offenders}  Nombre d'échantillonneurs renvoyant des valeurs non finies
#   {options}  Valeurs de configuration acceptées
#   {p95}  95e centile de la durée des ticks pendant un test de charge, en ms
#   {parameter}  Nom du paramètre de commande
#   {parameters}  Paramètres de commande ignorés
#   {pass}  Nombre de vérifications réussies
#   {path}  Chemin de la clé de configuration ou du fichier de rapport
#   {percent}  Pourcentage du réglage de couleur
#   {permission}  Nœud de permission requis
#   {personal}  Code de langue sélectionné par le joueur
#   {phase}  Phase du cycle de vie de la fonctionnalité testée
#   {pixels}  Nombre de pixels non vides dessinés par un test de cartes
#   {platform}  Système d'exploitation ou plateforme du serveur Minecraft
#   {players}  Nombre de joueurs synthétiques dans un test de charge
#   {plugin}  Nom du plugin
#   {process_load}  Charge CPU du processus du serveur
#   {processors}  Nombre de processeurs CPU disponibles
#   {profile}  Nom du profil de configuration React
#   {protocol}  Version du protocole d'intégration
#   {radius}  Rayon en chunks pour une action des tests de développement
#   {range}  Plage autorisée pour la distance de vue, de simulation ou d’envoi, en chunks
#   {rate}  Vitesse d'accélération des cultures configurée
#   {rating}  Évaluation de performance mise en forme
#   {react_errors}  Nombre de lignes d'erreur React trouvées dans le journal du serveur
#   {reason}  Explication de l'échec, du rejet ou de l'indisponibilité
#   {registered}  Nombre de modules enregistrés
#   {remaining}  Délai restant avant la prochaine vérification des langues
#   {removed_first}  Indique si la première désactivation a retiré une fonctionnalité du registre actif
#   {removed_second}  Indique si une désactivation répétée a retiré une fonctionnalité du registre actif
#   {renderer}  Nom ou identifiant du moteur de rendu de cartes
#   {renderers}  Liste des moteurs de rendu de cartes aux identifiants vides
#   {role}  Rôle d'accès web : viewer, operator ou admin
#   {sampler}  Nom ou identifiant de l'échantillonneur
#   {samplers}  Liste des échantillonneurs d'intégration ou défaillants
#   {scope}  Portée de la carte ou du réglage de distance
#   {score}  Score de performance
#   {seconds}  Compte à rebours ou durée du test de charge en secondes
#   {section}  Section de configuration ou de l’éditeur de langues
#   {server}  Implémentation et version du serveur Minecraft
#   {shown}  Nombre de lignes actuellement affichées
#   {since_run}  Erreurs signalées depuis le début du test actuel
#   {size}  Dimensions maximales ou actives du mur de cartes
#   {skip}  Nombre de vérifications ignorées
#   {spawn_y}  Hauteur d'apparition du bloc du test de gravité
#   {state}  État de l'action ou du paquet d'API de plugins
#   {status}  Libellé de l'état d'intégration ou de configuration
#   {subject}  Module ou réglage décrit par l'aide de configuration
#   {subsystem}  Nom du sous-système de test
#   {summary}  Résumé de l'audit des actions
#   {system_load}  Charge CPU de l'ensemble du système
#   {target}  Monde, joueur, plugin, réglage ou groupe de plugins visé par une opération
#   {threading}  Mode de gestion des threads du serveur
#   {tick}  Durée du tick ayant dépassé le seuil de blocage, en ms
#   {tick_crashes}  Nombre de lignes de plantage de ticks trouvées dans le journal du serveur
#   {tier}  Niveau de gravité du scénario d'incident
#   {timing}  Durée des rappels de capacité en millisecondes par minute
#   {to}  Numéro de la dernière entrée de la page actuelle
#   {total}  Total des entrées, modules, mondes, vérifications ou quantité de mémoire du message
#   {type}  Type du paramètre de commande, de la valeur de configuration, de la carte ou de la distance
#   {unavailable}  Nombre de références indisponibles du pont NMS
#   {unit}  Libellé d'unité pour le total d'un diagramme circulaire
#   {unknown}  Identifiant de l'action inconnue exclue des tests de développement
#   {unreadable}  Nombre d'échantillonneurs qui n'ont pas pu être lus
#   {updated}  Messages modifiés par une mise à jour de langue
#   {uptime}  Durée de fonctionnement du système d'exploitation hôte
#   {url}  URL du rapport de diagnostic téléversé
#   {usage}  Syntaxe d'utilisation de la commande
#   {used}  Mémoire physique, mémoire virtuelle ou tas utilisé
#   {value}  Réglage, mesure ou détail matériel mis en forme
#   {values}  Valeurs échantillonnées figurant dans un rapport des tests de développement
#   {variables}  Noms de variables acceptés par le message en cours de modification
#   {vendor}  Fournisseur de Java
#   {version}  Version de React, de Java ou de la plateforme
#   {warmed}  Nombre de chunks préchargés
#   {warn}  Nombre de vérifications avec avertissements
#   {width}  Largeur de la surface de dessin du test en pixels
#   {world}  Nom du monde Minecraft

