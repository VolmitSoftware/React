"config.documentation.annotation.art.arcane.react.content.feature.featurelazygravity.description" = "Configuration pour la fonctionnalité Lazy Gravity. Suivre les entités de vanille FallingBlock sur des chemins verticaux clairs et projeter combien de mouvements ticks seraient sautables si leur tick d'atterrissage était résolu déterministiquement à partir de la position de naissance et du calcul de gravité, au lieu de traitement AI/mouvement par tick. Rapporte le volume de saut projeté en tant que mesure de temps d'exécution afin que les opérateurs puissent mesurer l'impact avant qu'une mise en œuvre tick-skip complète ne débarque. contourne les blocs tombant dans un rayon de bypassRadius d'un joueur. Interruptions actives (place / break / physique dans la colonne ) renvoie l'entité suivie à la physique de vanille."
