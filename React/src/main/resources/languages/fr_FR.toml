summary = "Millisecondes moyennes par tick sous lesquelles le serveur doit rester avant que le régulateur ne se désengage."

[config.documentation.annotation.art.arcane.react.content.feature.featureactivationrangegovernor.field.suspendinactivevillagerticking]
