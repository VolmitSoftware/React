summary = "Suspend aussi le traitement des villageois inactifs pendant l'intervention."

[config.documentation.annotation.art.arcane.react.content.feature.featureactivationrangegovernor.field.sustainengagems]
impact = "Les valeurs plus élevées ignorent les pics courts; les valeurs plus faibles s'engagent plus rapidement."
summary = "Durée de pression prolongée requise avant l'engagement (millisecondes)."

[config.documentation.annotation.art.arcane.react.content.feature.featureactivationrangegovernor.field.sustainreleasems]
impact = "Des valeurs plus élevées évitent les oscillations entre états ; des valeurs plus basses rétablissent les plages plus tôt."
