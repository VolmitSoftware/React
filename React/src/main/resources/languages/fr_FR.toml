[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.megamapmaxtiles]
impact = "Les murs dépassant le budget reviennent au rendu zoomé d'un seul tableau de bord."
summary = "Budget total de tuiles pour un mur de mégamap combiné."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.megamapsplitduplicates]
impact = "Désactiver pour que les cartes clonées partagent une seule image et ne se combinent jamais."
summary = "Les cartes React clonées placées dans des cadres d'objets reçoivent automatiquement de nouveaux identifiants de carte afin que les copies adjacentes forment un mur de mégamap."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.startupboostdurationms]
impact = "Les valeurs plus élevées priorisent la récupération rapide après rechargement plus longtemps; les valeurs plus faibles reviennent à une cadence normale plus tôt."
summary = "Durée de la période de préchauffage après le démarrage ou un /reload pendant laquelle la récupération des cartes utilise un traitement par lots de réparation agressif (millisecondes)."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.startupboostinventorybatchsize]
impact = "Des valeurs plus élevées permettent de récupérer les inventaires cartographiques plus rapidement après le rechargement au coût d'un travail temporaire supplémentaire."
summary = "Taille du lot de réparation d'inventaire pendant que le préchauffage du démarrage est actif."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.startupboostitemframechunkbatchsize]
impact = "Des valeurs plus élevées font que les cartes d'images récupèrent plus rapidement après le rechargement au coût de travaux temporaires supplémentaires."
summary = "Taille du lot de réparation de chunks de cadres d'objets pendant que le préchauffage du démarrage est actif."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.startupframemappushintervalms]
impact = "Des valeurs plus basses font apparaître les cartes de cadre plus vite après rechargement ; des valeurs plus élevées réduisent les rafales temporaires de paquets pendant le préchauffage."
summary = "Intervalle d'envoi de paquets utilisé pendant le préchauffage du démarrage, en millisecondes."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemappushbatchsize]
summary = "Nombre maximal de cartes suivies dans des cadres examinées pour l’envoi de paquets par passage de maintenance."
impact = "Les valeurs élevées actualisent plus vite les très grands murs de cartes ; les valeurs faibles limitent la charge de l’ordonnanceur et des recherches d’entités."

[config.documentation.annotation.art.arcane.react.core.controller.incidentcontroller]
description = "Conserve des preuves structurées d’incident pour le plugin et la visionneuse web."

[config.documentation.annotation.art.arcane.react.core.controller.incidentcontroller.field.persistenceenabled]
impact = "La désactivation de la persistance ne conserve que l’historique de l’exécution actuelle."
summary = "Conserve l’historique structuré des incidents dans plugins/React/incidents.json."

[config.documentation.annotation.art.arcane.react.core.controller.incidentcontroller.field.retention]
impact = "Des valeurs plus élevées conservent davantage d’historique et utilisent plus de mémoire et d’espace disque."
summary = "Nombre maximal d’événements d’incident structurés conservés."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration]
description = "Configuration globale de React. Contrôle la disposition de surveillance par défaut, le réglage du modèle de valeur et le comportement des diagnostics."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.adaptabilityopsmetricmode]
impact = "Ce réglage ne contrôle pas les seuils de pression sur les performances. ALL_CHECKS est normalisé en SUCCESSFUL_CHECKS à l'exécution."
summary = "Sélectionne le taux d'opérations de capacité Adapt que React affiche et inclut dans le contexte des alertes. Options : SUCCESSFUL_CHECKS, ALL_CHECKS."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.customcolors]
impact = "Définissez à false pour garder la sortie plus proche du comportement de couleurs vanilla/par défaut."
summary = "Active le style de couleurs personnalisé dans les vues du moniteur."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.debug]
impact = "À utiliser pendant les sessions de débogage ; à désactiver en production normale."
summary = "Active la journalisation de débogage et des diagnostics supplémentaires."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.integrationsecretsenabled]
