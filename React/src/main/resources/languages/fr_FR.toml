summary = "Nombre maximal de métriques distinctes conservées pour les demandes de données instantanées des intégrations."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.language]
impact = "L'anglais intégré au code reste la langue de secours ; les catalogues TOML modifiables sont chargés depuis languages."
