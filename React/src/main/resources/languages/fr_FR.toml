[config.documentation.annotation.art.arcane.react.content.tweak.tweakspawnerplayerradius.field.enforcespawnerspawns]
impact = "Activer pour appliquer ce comportement ; désactiver pour garder ce chemin inactif."
summary = "Détermine si le rayon de joueur des générateurs s'applique aux apparitions de générateurs de monstres."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakspawnerplayerradius.field.enforcetrialspawnerspawns]
impact = "Activer pour appliquer ce comportement ; désactiver pour garder ce chemin inactif."
summary = "Détermine si le rayon de joueur des générateurs s'applique aux apparitions de générateurs d'épreuve."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakspawnerplayerradius.field.onlymonsters]
impact = "Activer pour appliquer ce comportement ; désactiver pour garder ce chemin inactif."
summary = "Détermine si le rayon de joueur des générateurs ne s'applique qu'aux monstres."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakspawnerplayerradius.field.requiredplayerdistance]
impact = "Des valeurs plus élevées élargissent la zone de recherche et coûtent plus de travail ; des valeurs plus basses réduisent la portée et coûtent moins cher."
summary = "Rayon de joueur requis utilisé par le rayon de joueur des générateurs (blocs)."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakunknown]
description = "Configuration de l'ajustement Inconnu. Ajustement de substitution utilisé lorsqu'un identifiant d'ajustement demandé est manquant ou indisponible."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakvehicleidlebrake]
description = "Configuration de l'ajustement Frein de véhicule inactif. Applique un freinage aux véhicules inactifs éloignés pour réduire les mouvements incontrôlés et la charge physique."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakvehicleidlebrake.field.brakeboats]
impact = "Activer pour appliquer ce comportement ; désactiver pour garder ce chemin inactif."
summary = "Détermine si le frein de véhicule inactif s'applique aux bateaux."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakvehicleidlebrake.field.brakeminecarts]
impact = "Activer pour appliquer ce comportement ; désactiver pour garder ce chemin inactif."
summary = "Détermine si le frein de véhicule inactif s'applique aux wagonnets."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakvehicleidlebrake.field.maxdistancewithoutplayer]
impact = "Des valeurs plus élevées permettent un débit plus élevé avant l'intervention; des valeurs plus faibles rendent l'atténuation plus agressive."
summary = "Distance maximale sans joueur autorisée par le frein de véhicule inactif."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakvehicleidlebrake.field.maxvehiclessampledperworld]
impact = "Des valeurs plus élevées inspectent plus de véhicules par cycle ; des valeurs plus basses bornent plus strictement le travail d'évaluation."
summary = "Nombre maximal de véhicules échantillonnés par évaluation dans tous les mondes pour le frein de véhicule inactif, limité entre 1 et 4096."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakvehicleidlebrake.field.minvelocitysquared]
impact = "Les valeurs plus élevées exigent des signaux plus forts avant l'action; les valeurs plus faibles facilitent la satisfaction de cette condition."
summary = "Vitesse minimale au carré requise par le frein de véhicule inactif."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakvehicleidlebrake.field.onlyemptyvehicles]
impact = "Activer pour appliquer ce comportement ; désactiver pour garder ce chemin inactif."
summary = "Détermine si le frein de véhicule inactif ne s'applique qu'aux véhicules vides."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakvehicleidlebrake.field.tickintervalms]
impact = "Des valeurs plus basses réagissent plus vite mais consomment plus de CPU ; des valeurs plus élevées réduisent la charge mais réagissent plus tard."
summary = "Intervalle d'évaluation principal du frein de véhicule inactif, en millisecondes."

[config.documentation.annotation.art.arcane.react.core.controller.configinputcontroller.field.sessiontimeoutseconds]
impact = "Les valeurs supérieures maintiennent les invites d'édition plus longtemps avant qu'elles ne soient annulées."
summary = "Délai d'expiration des sessions d'édition de configuration par chat, en secondes."

[config.documentation.annotation.art.arcane.react.core.controller.hotloadcontroller]
description = "Surveille les fichiers de configuration et de langue de React et applique les modifications automatiquement."

[config.documentation.annotation.art.arcane.react.core.controller.hotloadcontroller.field.maxdiffmessagesperfile]
impact = "Des valeurs plus faibles réduisent le bruit de chat de l'opérateur sur les grandes modifications de configuration."
summary = "Nombre maximal de messages diff au niveau des clés envoyés par fichier modifié."

[config.documentation.annotation.art.arcane.react.core.controller.hotloadcontroller.field.notifyoperators]
impact = "Désactiver si vous voulez seulement des journaux de console et aucune notification dans le jeu."
summary = "Envoie des résumés de changement à des opérateurs en ligne."

[config.documentation.annotation.art.arcane.react.core.controller.hotloadcontroller.field.pollintervalms]
impact = "Des valeurs plus faibles détectent plus tôt les événements reçus ; les modifications automatiques restent appliquées par lots au maximum une fois toutes les trois secondes."
summary = "Intervalle d'interrogation des événements du système de fichiers, en millisecondes."

[config.documentation.annotation.art.arcane.react.core.controller.eventcontroller]
description = "Mesure le temps des gestionnaires d'événements par plugin en enveloppant les écouteurs enregistrés tant que l'instrumentation est active."

[config.documentation.annotation.art.arcane.react.core.controller.eventcontroller.field.dutycycleonms]
impact = "Des fenêtres plus longues produisent plus d'échantillons enregistrés par période pour un coût récurrent plus élevé."
summary = "Durée en millisecondes de chaque fenêtre de mesure périodique dans le mode à cycle."

[config.documentation.annotation.art.arcane.react.core.controller.eventcontroller.field.dutycycleperiodms]
impact = "Des périodes plus courtes enregistrent les données d'événements plus souvent et coûtent plus ; des périodes plus longues laissent des trous plus larges dans l'historique."
summary = "Millisecondes entre les débuts des fenêtres de mesure périodiques dans le mode à cycle."

[config.documentation.annotation.art.arcane.react.core.controller.eventcontroller.field.instrumentation]
impact = "ALWAYS impose un surcoût de mesure à chaque gestionnaire d'événements ; ON_DEMAND supprime ce coût au repos mais laisse des trous dans l'historique ; DUTY_CYCLE échange des trous périodiques contre un faible coût récurrent."
summary = "Détermine quand les enveloppes de mesure des écouteurs sont installées : ALWAYS les garde installées, ON_DEMAND ne les installe que lorsqu'un moniteur, une carte, un espace réservé ou un visiteur web lit des données d'événements, et DUTY_CYCLE ouvre en plus une fenêtre de mesure périodique."

[config.documentation.annotation.art.arcane.react.core.controller.eventcontroller.field.sampleractivitywindowms]
impact = "Des valeurs plus élevées gardent l'instrumentation installée plus longtemps après le départ d'un visiteur ; des valeurs plus basses la retirent plus tôt."
summary = "Millisecondes après la dernière lecture de données d'événements avant le retrait des enveloppes dans les modes à la demande et à cycle."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller]
description = "Capture une fois les échantillonneurs de React, stocke une télémétrie historique compressée et traite des requêtes bornées par intervalle de temps."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.compressionlevel]
impact = "Des valeurs plus élevées peuvent réduire l'espace disque utilisé au prix d'une charge processeur d'écriture accrue."
summary = "Niveau DEFLATE utilisé uniquement lorsqu'il réduit la taille d'une colonne de métriques encodée."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.enabled]
impact = "La désactivation du stockage conserve les instantanés web en direct, mais n'enregistre aucun nouvel échantillon historique. L'historique existant reste lisible."
summary = "Conserve l'historique des échantillonneurs dans plugins/React/history."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.fifteenminuteretentiondays]
impact = "Les agrégats d'une heure conservent la couverture historique après l'expiration de ce niveau."
summary = "Rétention des agrégats de quinze minutes en jours. Zéro conserve ce niveau indéfiniment."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.livecaptureintervalms]
impact = "Des valeurs plus faibles améliorent la fidélité des graphiques en direct, mais interrogent plus souvent tous les échantillonneurs enregistrés."
summary = "Cadence de l'instantané de référence des échantillonneurs en direct, en millisecondes."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.maxquerypoints]
impact = "Des valeurs plus élevées améliorent la résolution du graphique au prix de la taille de réponse et du travail de requête."
summary = "Nombre maximal d'intervalles acceptés pour chaque série dans une requête historique."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.maxqueryseries]
impact = "Des valeurs plus élevées peuvent créer des trames de relais plus grandes et davantage de lectures disque simultanées."
summary = "Nombre maximal de séries acceptées par une requête historique."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.minuteretentiondays]
impact = "La couverture plus ancienne reste disponible grâce aux agrégats de résolution inférieure."
summary = "Rétention des agrégats d'une minute en jours. Zéro conserve ce niveau indéfiniment."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.querypagepoints]
impact = "Les pages restent bornées pour les délais d'expiration du relais et des requêtes du navigateur."
summary = "Nombre maximal d'intervalles renvoyés par série dans une page de réponse historique."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.rawretentionhours]
impact = "La couverture plus ancienne reste disponible grâce aux agrégats de résolution inférieure."
summary = "Rétention des échantillons exacts d'une seconde en heures. Zéro conserve ce niveau indéfiniment."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.tensecondretentiondays]
impact = "La couverture plus ancienne reste disponible grâce aux agrégats de résolution inférieure."
summary = "Rétention des agrégats de dix secondes en jours. Zéro conserve ce niveau indéfiniment."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.walforceintervalms]
impact = "Une panne du processus ou de l'hôte peut perdre au plus cette fenêtre récente ; des valeurs plus faibles augmentent les écritures disque forcées."
summary = "Durée maximale entre les écritures forcées du journal historique, en millisecondes."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller]
description = "Gère les métadonnées des objets carte React, la réparation des moteurs de rendu et la diffusion en direct des paquets de cartes pour les inventaires et les cadres."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemapidlepushintervalms]
impact = "Des valeurs plus élevées réduisent le volume de paquets inactif lorsque les joueurs sont à proximité mais ne regardent pas la carte."
summary = "Intervalle d'envoi de paquets pour les observateurs proches qui ne regardent pas activement la carte du cadre (millisecondes)."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemaplookdotthreshold]
impact = "Des valeurs plus élevées exigent de viser plus précisément la carte avant l'envoi de mises à jour à haute fréquence."
summary = "Produit scalaire minimal de la direction de vue requis pour considérer qu'un joueur regarde activement une carte de cadre."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemappushintervalms]
impact = "Des valeurs plus basses rafraîchissent plus vite les visuels de la carte mais augmentent la pression des paquets et du rendu."
summary = "Intervalle d'envoi de paquets pour les cartes actives de cadres d'objets, en millisecondes."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemappushoutsiderangewhenholding]
impact = "Désactiver pour arrêter strictement les paquets de carte hors du rayon ; activer pour que le fait de tenir la carte contourne les vérifications de distance."
summary = "Autorise les mises à jour des cartes tenues en main en dehors de frameMapPushRadiusBlocks."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemappushradiusblocks]
impact = "Des valeurs plus élevées couvrent plus d'observateurs mais augmentent la diffusion des paquets."
summary = "Rayon maximal en blocs autour d'une carte de cadre d'objet dans lequel les joueurs reçoivent des mises à jour poussées."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemappushstateretentionms]
impact = "Des valeurs plus élevées conservent l'état plus longtemps avec moins de rotation ; des valeurs plus basses élaguent plus agressivement la comptabilité."
summary = "Durée de conservation de la comptabilité d'envoi des cartes de cadre, en millisecondes."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemapredrawintervalms]
impact = "Des valeurs plus basses rafraîchissent plus vite les tableaux de bord des cadres ; des valeurs plus élevées regroupent les redessins redondants par observateur sur les murs de cartes chargés."
summary = "Intervalle minimal entre les redessins du canevas pour les cartes React des cadres d'objets, en millisecondes."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemaprequirelineofsight]
impact = "L'activer supprime les paquets envoyés aux observateurs masqués mais ajoute des vérifications de visibilité légères."
summary = "Si activé, l'envoi des cartes de cadre exige une ligne de vue pour les observateurs proches (les joueurs qui la tiennent ne sont pas concernés)."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemapvalidateintervalms]
impact = "Des valeurs plus basses détectent plus tôt les objets de cadre échangés ; des valeurs plus élevées évitent de relire les métadonnées d'objets à chaque tick de maintenance."
summary = "Intervalle entre les revalidations complètes des piles d'objets des cartes de cadre suivies, en millisecondes."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.heldmapredrawintervalms]
impact = "Des valeurs plus basses font pivoter et rafraîchissent les cartes tenues plus fluidement ; des valeurs plus élevées réduisent le travail de rendu lorsque plusieurs joueurs voient la même carte."
summary = "Intervalle minimal entre les redessins du canevas pour les cartes React tenues en main, en millisecondes."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.inventoryrepairbatchsize]
impact = "Des valeurs plus élevées réduisent le temps de récupération après rechargement; des valeurs plus faibles réduisent le travail à chaque passage."
summary = "Nombre d'inventaires de joueurs en ligne réparés par passe de maintenance."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.inventoryrepaircadencems]
impact = "Des valeurs plus basses réparent plus vite les métadonnées de carte et les moteurs de rendu ; des valeurs plus élevées réduisent le travail par tick."
summary = "Cadence d'analyse des inventaires des joueurs pour la réparation des cartes React, en millisecondes."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.itemframechunkbatchsize]
impact = "Des valeurs plus élevées accélèrent la récupération de la carte-cadre après rechargement; des valeurs plus faibles réduisent le coût par passage."
summary = "Nombre de chunks chargés analysés pour les cartes de cadres d'objets par passe de maintenance."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.itemframerepaircadencems]
impact = "Des valeurs plus basses réparent plus vite les cartes de cadres d'objets après rechargement ; des valeurs plus élevées réduisent la charge de maintenance."
summary = "Cadence d'analyse des chunks chargés pour la réparation des cartes de cadres d'objets, en millisecondes."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.maintenancetickintervalms]
impact = "Des valeurs plus basses réparent plus tôt les inventaires et cadres d'objets après rechargement ; des valeurs plus élevées réduisent la charge de maintenance."
summary = "Cadence de maintenance principale de la logique de réparation des cartes, en millisecondes."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.megamapenabled]
impact = "Désactiver pour rendre chaque carte de cadre comme un tableau de bord 128x128 indépendant."
