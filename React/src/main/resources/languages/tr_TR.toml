#   {plugin}  Eklenti adı
#   {process_load}  Sunucu işleminin CPU yükü
#   {processors}  Kullanılabilir CPU işlemcisi sayısı
#   {profile}  React yapılandırma profilinin adı
#   {protocol}  Entegrasyon protokol sürümü
#   {radius}  Harita veya geliştirici testi eyleminin parça cinsinden yarıçapı
