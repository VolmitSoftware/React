[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.updatenotifications]
summary = "GitHub sürümlerinde React güncellemelerini denetler."
impact = "Varsayılan olarak etkindir. VolmLib güncellemeleri tek bir giriş bildirimi ve /volmit plugins updates raporunda birleştirir. Devre dışı bırakmak React denetimlerini durdurur."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.minimumincidentscore]
summary = "Azaltma işlemlerine devam etmek için gereken olay puanı."
impact = "Bu puana veya minimumTickMS değerine ulaşıldığında plan devam eder."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.minimumtickms]
summary = "Azaltma işlemlerine devam etmek için gereken ortalama tik milisaniyesi."
impact = "Her iki baskı göstergesi de kendi eşiğinin altına düştüğünde plan durur."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.minimumentitiesperchunk]
summary = "Varlık azaltma aşamasından önce bir chunk içinde gözlemlenmesi gereken varlık sayısı."
impact = "Yüksek değerler, azaltmayı daha yoğun varlık kümeleriyle sınırlar."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.recheckdelayms]
summary = "Bir alt işlem tamamlandıktan sonraki gözlem aralığı, milisaniye cinsinden; en az 1000."
impact = "Başka bir azaltma işlemi seçilmeden önce ölçümlerin yenilenmesini sağlar."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.childtimeoutms]
summary = "Bir azaltma aşamasının azami süresi, milisaniye cinsinden; en az 1000."
impact = "Alt işlem zaman aşımına uğrarsa plan başarısız olur ve daha ileri önlemler durdurulur."

[config.documentation.annotation.art.arcane.react.content.action.actiontrimentitiesbyagepriority_params.field.minimumentitiesperchunk]
summary = "Azaltmadan önce bir chunk içinde gözlemlenmesi gereken asgari varlık sayısı; sıfır, gözlemlenen tüm chunk'ları kapsar."
impact = "Pozitif bir değer, azaltmayı yoğun chunk'larla sınırlar."

[action.capture_profile]
completed = "{count} yerel profil {path} konumuna kaydedildi"

[config.documentation.annotation.art.arcane.react.content.action.actioncaptureprofile]
description = "İstek üzerine yürütme, bellek ayırma ve GC olayları içeren yerel JDK Flight Recorder profili kaydeder. Üç kayıt saklar; hiçbirini yüklemez."

[config.documentation.annotation.art.arcane.react.content.action.actioncaptureprofile_params.field.seconds]
summary = "Saniye cinsinden profil süresi; 1 ile 300 arasında sınırlandırılır."
impact = "Uzun kayıtlar daha fazla etkinliği kapsar; JFR en fazla 64 MiB yakın tarihli veri tutar."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.playerchunkbudgetenabled]
summary = "Dünya başına oyuncu chunk bütçelerini etkinleştirir; örtüşmeler bir kez sayılır."
impact = "Varsayılan olarak kapalıdır. Bütçeler mevcut hedef mesafeleri azaltabilir; geri yükseliş kademelidir."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.playertickingchunkbudget]
summary = "Dünya başına oyuncular için simüle edilen tahmini en fazla chunk sayısı; en az 1."
impact = "Örtüşen simülasyon alanları bir kez sayılır. Bütçe sağlanamıyorsa yapılandırılan en düşük mesafeler önceliklidir."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.playerviewonlychunkbudget]
summary = "Dünya başına yalnızca görünen tahmini en fazla chunk sayısı; en az 1."
impact = "Simülasyon alanının dışındaki görüş alanını sayar. Yüklü chunk veya eklenti biletlerini değil, oyuncu talebini tahmin eder."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.budgetrecoverychecks]
summary = "Mesafeyi artırmadan önce gereken ardışık sağlıklı bütçe değerlendirmeleri; en az 1."
impact = "Değerlendirmeler updateCooldownSeconds aralığını izler. Bilinmeyen tik telemetrisi veya hazır olmayan oyuncu dizini toparlanmayı sıfırlar."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.budgetrecoverystep]
summary = "Bütçe toparlandıktan sonra chunk cinsinden en yüksek mesafe artışı; 1 ile 32 arasında sınırlandırılır."
impact = "Küçük adımlar toparlanma sırasında yükleme patlamalarını sınırlar. Yalnızca oyuncu chunk bütçeleri açıkken uygulanır."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller]
description = "Folia oyuncu konumlarını ve isteğe bağlı olarak sınırlı JDK Flight Recorder olaylarını örnekler. JFR, protokol trafiği toplamlarını, chunk üretim aşamalarını, depolama etkinliğini ve yapılandırılan eşiği aşan beklemeleri kaydeder."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller.field.regionalenabled]
summary = "Oyuncu konumlarında Folia bölgesi TPS örneklemesini etkinleştirir."
impact = "Chunk yüklemeden, önbellekteki oyuncu konumlarından sınırlı ve dönüşümlü bir kümeyi saniyede bir sorgular."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller.field.playeranchorsperrefresh]
summary = "Her saniye örneklenen en fazla oyuncu konumu sayısıdır ve 1 ile 512 arasında sınırlandırılır. Gözlemler beş saniye sonra geçerliliğini yitirir."
impact = "Daha yüksek değerler daha fazla oyuncuyu kapsar ancak daha fazla bölge TPS sorgusu gerektirir."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller.field.jfrenabled]
summary = "Seçici JFR telemetrisini etkinleştirir. Varsayılan olarak devre dışıdır. Yayımlanan özetler adresleri, dosya yollarını ve yığın izlerini içermez."
impact = "30 saniye ve 64 MiB saklama sınırlarıyla JFR kayıt işi ekler. Toplu ölçüm serileri her saniye sıfırlanır."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller.field.jfrslowthresholdms]
summary = "JVM dosya G/Ç, monitöre giriş, monitörde bekleme ve iş parçacığı park etme olayları için milisaniye cinsinden en düşük süredir. 1 ile 1000 arasında sınırlandırılır. Chunk üretim aşamalarında süre eşiği yoktur."
impact = "Daha düşük eşikler daha fazla JVM olayı üretir. Bu metrikler yalnızca bu eşiğe ulaşan olayları açıklar."
