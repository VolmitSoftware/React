#   {system_load}  Tüm sistemin CPU yükü
#   {target}  İşlemin hedeflediği dünya, oyuncu, eklenti, ayar veya eklenti grubu
#   {threading}  Sunucunun iş parçacığı çalışma modu
#   {tick}  Donma eşiğini aşan tik süresi, ms cinsinden
