# React — tr_TR
#
# === Dosyayı düzenleme ===
# plugins/React/languages/tr_TR.toml
# Bu dosyayı doğrudan düzenleyebilirsiniz. Yerel değişiklikler korunur; eksik veya geçersiz girdiler yerleşik İngilizce metni kullanır.
# /react language server edit tr_TR
#
# === Önek ===
# runtime.prefix: React tarafından sohbet iletilerinin başına eklenen önek.
#
# === Biçimlendirme ===
# Sohbet iletileri & renk kodlarını destekler: &cMetin&r, &lMetin&r.
# Renkler: &0-&9 ve &a-&f.
# Stiller: &l kalın, &o italik, &n altı çizili, &m üstü çizili, &k karışık karakterler, &r sıfırlama.
# Renk kodları etkin stilleri temizler; rengi stilden önce yazın, örneğin &3&lMetin&r. &r tüm biçimlendirmeyi sıfırlar.
# RGB renkleri &#RRGGBBMetin&r biçimindedir, örneğin &#55AAFFMetin&r.
# Renk geçişleri ve etkileşimler için MiniMessage kullanın; aynı iletide MiniMessage etiketlerini ve & kodlarını karıştırmayın. Etiketleri açılış sırasının tersine kapatın.
# TOML tırnak ve kaçış kurallarına uyun.
# Yeni satır için tırnak içindeki TOML metinlerinde \n kullanın; {{ ve }} süslü ayraçları olduğu gibi gösterir.
# renderer.* ve config.documentation.annotation.* değerleri düz metindir.
# test.* değerleri, biçimlendirmeyi destekleyen test.result.* iletileri dışında düz metindir.
# Değişkenleri ileti metninde, MiniMessage etiketlerinin dışında kullanın.
#
# === Değişkenler ===
# Değişken adlarını değiştirmeyin ve yalnızca ilgili iletinin değişkenlerini kullanın.
#   {action}  Eylem adı veya renk ayarlama yönü
#   {actions}  Kuyruktaki eylem sayısı veya hariç tutulan eylem adları listesi
#   {active}  Etkin özellik veya ince ayar sayısı
#   {actor}  Değişikliği yapan web kullanıcısı
#   {added}  Etkinleştirmeden sonra özelliğin etkin kayıt listesine yeniden katılıp katılmadığı
#   {after}  Değişiklikten sonraki yapılandırma değeri, dil iletisi veya yığın bellek kullanımı
#   {age}  Entegrasyon verisinin saniye cinsinden yaşı
#   {amount}  Verilecek eşya sayısı
#   {architecture}  CPU mimarisi
#   {argument}  Beklenmeyen komut argümanı
#   {available}  Kullanılabilir NMS köprü erişimlerinin sayısı
#   {average}  Ortalama TPS veya tik başına milisaniye
#   {avg_mspt}  Bir yük testi turunda tik başına ortalama milisaniye
#   {avg_tps}  Bir yük testi turunda saniye başına ortalama tik sayısı
#   {bar}  Biçimlendirilmiş performans testi puan çubuğu
#   {before}  Değişiklikten önceki yapılandırma değeri, dil iletisi veya yığın bellek kullanımı
#   {checked}  Kontrol edilen örnekleyici sayısı
#   {chunks}  Bir eylemden etkilenen parça sayısı
#   {code}  Web eşleştirme kodu
#   {command}  Komut yolu
#   {count}  Kayıt, modül, değişiklik veya test bulgusu sayısı
#   {current}  Geçerli sayfa numarası
#   {delta_heap}  React ve başlangıç ölçümü arasındaki son yığın bellek kullanımı farkı, MB cinsinden
#   {delta_mspt}  React ve başlangıç ölçümü arasındaki ortalama tik süresi farkı, ms cinsinden
#   {delta_tps}  React ve başlangıç ölçümü arasındaki ortalama TPS farkı
#   {detail}  Köprü, entegrasyon, eylem veya test tanılama ayrıntıları
#   {dimensions}  Algılanan harita duvarı ızgara boyutları
#   {direction}  Seçili rengin tonunu döndürme yönü
#   {distance}  Chunk cinsinden istenen görüş, simülasyon veya gönderim mesafesi
#   {duration}  Geçen süre; yük testi başlangıç iletilerinde saniye kullanılır
#   {enabled}  Etkinlik durumu veya etkin modül sayısı
#   {entities}  Bir eylemden etkilenen varlık sayısı
#   {entry}  Entegrasyon zaman çizelgesi kaydı
#   {exceptions}  Bir yük testi turunda kaydedilen React istisnaları
#   {fail}  Başarısız kontrol sayısı
#   {file}  Yapılandırma, dil veya eklenti API dosyasının adı
#   {fingerprint}  Sunucu veya web erişim belirtecinin parmak izi
#   {finite}  Sonlu değer döndüren örnekleyici sayısı
#   {frames}  Etkin harita duvarındaki eşya çerçevesi sayısı
#   {free}  Boş fiziksel veya sanal bellek
#   {freed}  Çöp toplama ile geri kazanılan yığın bellek
#   {from}  Geçerli sayfadaki ilk kayıt numarası
#   {grid}  Harita duvarı ızgara boyutları
#   {ground_y}  Yerçekimi testinin zemin yüksekliği
#   {group}  İzleyici, örnekleyici, harita, yapılandırma veya dil iletisi grubu
#   {growth}  Yük testi sırasında yığın bellek artışı, MB cinsinden
#   {health}  Entegrasyonun sağlık durumu
#   {heap_end}  Bir yük testi turunun sonundaki yığın bellek kullanımı, MB cinsinden
#   {heap_start}  Bir yük testi turunun başındaki yığın bellek kullanımı, MB cinsinden
#   {heartbeat}  Entegrasyonun son canlılık sinyalinden bu yana geçen süre
#   {height}  Test tuvalinin piksel cinsinden yüksekliği
#   {hoppers}  Normalleştirilen huni sayısı
#   {id}  Köprü erişimi, örnekleyici, harita, eylem, paket veya erişim belirtecinin kimliği
#   {impact}  Yapılandırma etkisinin açıklaması veya eklenti maliyeti, ms/s cinsinden
#   {incident}  Geliştirici testlerinden çıkarılan özyinelemeli olay eyleminin kimliği
#   {index}  Geçerli geliştirici testi adımının numarası
#   {invalid}  Geçersiz ölçüm döndüren örnekleyici sayısı
#   {issued_at}  Web erişim belirtecinin oluşturulma zamanı
#   {item}  Eşya adı veya kimliği
#   {items}  Birleştirilen eşya varlığı sayısı
#   {key}  Komut parametresi anahtarı, yapılandırma anahtarı veya dil iletisi kimliği
#   {label}  Performans testi, ölçüm, ayar, komut veya web erişim belirteci etiketi
#   {line}  Çok satırlı iletide düzenlenen satırın numarası
#   {lines}  Taranan sunucu günlüğü satırlarının sayısı
#   {loaded}  Ön yükleme sırasında yeni yüklenen parça sayısı
#   {locale}  Görüntülenen, seçilen veya düzenlenen dil kodu
#   {matched}  Otomatik kaydetme durumu testin başlangıç durumuyla eşleşen dünyalar
#   {max_tick}  Yük testi sırasında gözlenen en uzun tik aralığı, ms cinsinden
#   {maximum}  Azami eşya sayısı, tik süresi eşiği veya düzenleyici girdi uzunluğu
#   {message}  Tamamlanan eylemin özeti veya entegrasyon durum iletisi
#   {metrics}  Bir eklenti API paketi tarafından sağlanan ölçüm sayısı
#   {minecraft}  Minecraft sürümü
#   {minimum}  Kabul edilebilir en düşük TPS
#   {missing}  Kayıt listesinde eksik olan zorunlu örnekleyici sayısı
#   {mode}  Seçilen oyun veya yetenek modu
#   {model}  CPU modeli
#   {name}  Performans testi, modül, çizici veya test kontrolünün adı
#   {note}  Sunucu günlüğünün taranmama nedeni
#   {offenders}  Sonlu olmayan değer döndüren örnekleyici sayısı
#   {operations}  Dakikadaki yetenek geri çağrısı işlem sayısı
#   {options}  Kabul edilen yapılandırma değerleri
#   {p95}  Yük testi sırasında tik süresinin 95. yüzdelik değeri, ms cinsinden
#   {parameter}  Komut parametresinin adı
#   {parameters}  Yok sayılan komut parametreleri
#   {pass}  Başarılı kontrol sayısı
#   {path}  Yapılandırma anahtarı yolu veya rapor dosyası yolu
#   {percent}  Renk ayarlama yüzdesi veya eklenti etki payı
#   {permission}  Gerekli izin düğümü
#   {personal}  Oyuncunun seçtiği dil kodu
#   {phase}  Test edilen özellik yaşam döngüsü aşaması
