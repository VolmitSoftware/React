"config.documentation.annotation.art.arcane.react.content.feature.featurelazygravity.description" = "Lazy Gravity özelliğinin yapılandırması. Açık dikey yollardaki vanilla FallingBlock varlıklarını izler ve iniş tick'i, her tick'te AI/hareket işlemesi yerine doğma konumu ve yerçekimi hesabından deterministik olarak çözülse kaç hareket tick'inin atlanabileceğini hesaplar. Öngörülen atlama miktarını çalışma zamanı metriği olarak bildirir; böylece operatörler tam tick-atlama uygulaması devreye girmeden önce etkiyi ölçebilir. Bir oyuncunun bypassRadius mesafesindeki düşen blokları atlar. Etkin yol kesintileri (sütunda yerleştirme, kırma veya fizik değişikliği) izlenen varlığı vanilla fiziğine geri döndürür."
