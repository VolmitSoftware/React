[config.documentation.annotation.art.arcane.react.content.feature.featurehopperchaincoalescing]
description = "huni Chain Coalescing özelliği için yapılandırma. Aynı yönde beslenen N huniler'nin doğrusal zincirlerini tespit eder ve tik başına bir zincire tek baştan kuyruğa batched çekme olarak ne kadar tikler aktarımının çöküşeceğini tahmin eder. Sadece ölçüm modunda çalışır: zincir algılama artı projekt edilen tikler-koalese metrik okuyucu üzerinden ortaya çıkarılır. İptal etmesi ara InventoryMoveItemEvent gönderileri FeatureHopperTokenBucket'ın kova tüketimi siparişine çarpışır, bu nedenle gerçek batched hareket özel bir NMS köprüye ertelenir."

