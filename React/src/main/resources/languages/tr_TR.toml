#   {score}  Performans testi puanı
#   {seconds}  Geri sayım veya yük testi süresi, saniye cinsinden
#   {section}  Yapılandırma veya dil düzenleyicisi bölümü
#   {server}  Minecraft sunucu uygulaması ve sürümü
#   {shown}  Görüntülenen satırların sayısı
#   {since_run}  Geçerli testin başlangıcından bu yana bildirilen hatalar
#   {size}  Harita duvarının azami veya etkin boyutları
#   {skip}  Atlanan kontrol sayısı
#   {spawn_y}  Yerçekimi testi bloğunun oluşturulduğu yükseklik
#   {state}  Eylemin veya eklenti API paketinin durumu
#   {status}  Entegrasyon veya yapılandırma durum etiketi
#   {subject}  Yapılandırma yardımında açıklanan modül veya ayar
#   {subsystem}  Test alt sisteminin adı
#   {summary}  Eylem denetimi özeti
#   {system_load}  Tüm sistemin CPU yükü
#   {target}  İşlemin hedeflediği dünya, oyuncu, eklenti, ayar veya eklenti grubu
#   {threading}  Sunucunun iş parçacığı çalışma modu
#   {tick}  Donma eşiğini aşan tik süresi, ms cinsinden
#   {tick_crashes}  Sunucu günlüğünde bulunan tik çökmesi satırlarının sayısı
#   {tier}  Olay müdahale planının önem derecesi
#   {timing}  Dakika başına yetenek geri çağrısı süresi, milisaniye cinsinden
#   {to}  Geçerli sayfadaki son kayıt numarası
#   {total}  İletideki toplam kayıt, modül, dünya, kontrol veya bellek miktarı
#   {type}  Komut parametresi, yapılandırma değeri, harita veya mesafe türü
#   {unavailable}  Kullanılamayan NMS köprü erişimlerinin sayısı
#   {unit}  Pasta grafik toplamının birim etiketi
#   {unknown}  Geliştirici testlerinden çıkarılan bilinmeyen eylemin kimliği
#   {unreadable}  Okunamayan örnekleyici sayısı
#   {updated}  Dil güncellemesiyle değiştirilen iletiler
#   {uptime}  Sunucu makinesinin işletim sistemi çalışma süresi
#   {url}  Yüklenen tanılama raporunun URL adresi
#   {usage}  Komut kullanım söz dizimi
#   {used}  Kullanılan fiziksel, sanal veya yığın bellek
#   {value}  Biçimlendirilmiş ayar, ölçüm veya donanım ayrıntısı
#   {values}  Geliştirici testi raporunda listelenen örneklenmiş değerler
#   {variables}  Düzenlenen iletinin kabul ettiği yer tutucu adları
