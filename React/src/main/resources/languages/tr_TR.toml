"config.documentation.annotation.art.arcane.react.content.feature.featureexplosionpacketbatching.description" = "Patlama Paketi Gruplama özelliğinin yapılandırması. Aynı tikte ve aynı dünyada oluşan patlamaları toplar, mergeRadius değerine göre kümeler ve küme başına ayrı ayrı gönderilecek kaç ClientboundExplodePackets paketinin tek bir birleştirilmiş pakete indirgeneceğini ölçer. Tahmini patlama-paket azaltımını çalışma zamanı metriği olarak bildirir; bir oyuncunun bypassRadius mesafesi içinde herhangi bir patlama bulunan kümeleri atlar, böylece yakındaki gözlemciler vanilya animasyon ve ses doğruluğunu görür. Folia uyumlu, sentezlenmiş patlama paketi NMS köprüsü tamamlanana kadar yalnızca ölçüm yapar."
