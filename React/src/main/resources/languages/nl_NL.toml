[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.updatenotifications]
summary = "Controleert GitHub-releases op React-updates."
impact = "Standaard ingeschakeld. VolmLib bundelt updates in één melding bij aanmelden en in /volmit plugins updates. Uitschakelen stopt de controles voor React."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.minimumincidentscore]
summary = "Vereiste incidentscore om verdere maatregelen uit te voeren."
impact = "Het draaiboek gaat door wanneer deze score of minimumTickMS wordt bereikt."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.minimumtickms]
summary = "Vereiste gemiddelde tickduur in milliseconden om verdere maatregelen uit te voeren."
impact = "Het draaiboek stopt wanneer beide belastingswaarden onder hun drempel liggen."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.minimumentitiesperchunk]
summary = "Vereist aantal waargenomen entiteiten in één chunk voordat entiteiten worden verwijderd."
impact = "Hogere waarden beperken het verwijderen tot dichtere groepen entiteiten."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.recheckdelayms]
summary = "Observatietijd na een onderliggende actie, in milliseconden; minimaal 1000."
impact = "Laat meetwaarden verversen voordat de volgende maatregel wordt gekozen."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.childtimeoutms]
summary = "Maximale duur van één maatregel in milliseconden; minimaal 1000."
impact = "Bij een time-out van een onderliggende actie mislukt het draaiboek en stopt verdere escalatie."

[config.documentation.annotation.art.arcane.react.content.action.actiontrimentitiesbyagepriority_params.field.minimumentitiesperchunk]
summary = "Minimaal aantal waargenomen entiteiten per chunk vóór verwijdering; nul omvat alle waargenomen chunks."
impact = "Een positieve waarde beperkt het verwijderen tot dichtbezette chunks."

[action.capture_profile]
completed = "{count} lokaal profiel opgeslagen in {path}"

[config.documentation.annotation.art.arcane.react.content.action.actioncaptureprofile]
description = "Maakt op aanvraag een lokaal JDK Flight Recorder-profiel met uitvoerings-, allocatie- en GC-gebeurtenissen. Bewaart drie opnamen en uploadt ze nooit."

[config.documentation.annotation.art.arcane.react.content.action.actioncaptureprofile_params.field.seconds]
summary = "Profielduur in seconden, begrensd op 1 tot 300."
impact = "Langere opnamen omvatten meer activiteit; de JFR-opname bewaart maximaal 64 MiB aan recente gegevens."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.playerchunkbudgetenabled]
summary = "Schakelt chunkbudgetten per wereld voor spelers in; overlap telt één keer."
impact = "Standaard uitgeschakeld. Budgetten kunnen bestaande doelafstanden verlagen; herstel verloopt geleidelijk."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.playertickingchunkbudget]
summary = "Maximaal geschat aantal voor spelers gesimuleerde chunks per wereld; minimaal 1."
impact = "Overlappende simulatiegebieden tellen één keer. Ingestelde minimumafstanden gaan voor als het budget niet haalbaar is."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.playerviewonlychunkbudget]
summary = "Maximaal geschat aantal alleen zichtbare chunks per wereld; minimaal 1."
impact = "Telt het zichtgebied buiten het simulatiegebied. Voorspelt spelersvraag, niet werkelijk geladen chunks of plugintickets."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.budgetrecoverychecks]
summary = "Vereist aantal opeenvolgende gezonde budgetcontroles vóór een afstand toeneemt; minimaal 1."
impact = "Controles volgen updateCooldownSeconds. Onbekende tickmetingen of een onvolledige spelersindex stellen het herstel opnieuw in."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.budgetrecoverystep]
summary = "Maximale afstandstoename na succesvol budgetherstel, in chunks; begrensd op 1 tot 32."
impact = "Kleine stappen beperken laadpieken tijdens herstel. Geldt alleen als chunkbudgetten voor spelers zijn ingeschakeld."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller]
description = "Bemonstert Folia-spelerlocaties en optioneel een begrensde verzameling JDK Flight Recorder-gebeurtenissen. JFR registreert totalen van protocolverkeer, fasen van chunkgeneratie, opslagactiviteit en wachttijden boven de ingestelde drempel."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller.field.regionalenabled]
summary = "Schakelt bemonstering van Folia-regio-TPS op spelerlocaties in."
impact = "Vraagt eenmaal per seconde een begrensde, wisselende selectie spelerlocaties uit de cache op, zonder chunks te laden."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller.field.playeranchorsperrefresh]
summary = "Maximaal aantal spelerlocaties dat per seconde wordt bemonsterd, begrensd van 1 tot 512. Waarnemingen verlopen na vijf seconden."
impact = "Hogere waarden dekken meer spelers, maar vereisen meer opvragingen van regio-TPS."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller.field.jfrenabled]
summary = "Schakelt selectieve JFR-telemetrie in. Standaard uitgeschakeld. Gepubliceerde samenvattingen bevatten geen adressen, bestandspaden of stacktraces."
impact = "Voegt JFR-opnamewerk toe met bewaarlimieten van 30 seconden en 64 MiB. Samengevoegde meetreeksen worden elke seconde gereset."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller.field.jfrslowthresholdms]
summary = "Minimale duur in milliseconden voor JVM-bestands-I/O, monitorbetreding, monitorwachten en threadparkeren, begrensd van 1 tot 1000. Fasen van chunkgeneratie hebben geen duurdrempel."
impact = "Lagere drempels leveren meer JVM-gebeurtenissen op. Deze metrieken beschrijven alleen gebeurtenissen die deze drempel bereiken."
