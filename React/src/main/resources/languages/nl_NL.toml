[config.documentation.annotation.art.arcane.react.api.web.webconfiguration]
description = "Configuratie van de ingebouwde HTTP/WebSocket-beheer-API van React. Wijzigingen worden automatisch toegepast wanneer web.toml wordt opgeslagen."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.advertisedurl]
impact = "Stel de HTTPS-URL van een reverse proxy in als de listener buiten localhost bereikbaar is. De ingebouwde listener van React blijft uitsluitend HTTP ondersteunen. Wijzigingen worden automatisch toegepast wanneer web.toml wordt opgeslagen."
summary = "Openbare basis-URL die aan rechtstreekse API-clients wordt doorgegeven."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.allowedorigins]
impact = "Elke vermelding is een oorsprong: schema, host en poort, zonder pad; gewone http alleen op loopback. Een pagina van een andere oorsprong wordt geweigerd met origin_not_allowed. Verzoeken zonder Origin, zoals die van de relay, veranderen niet."
summary = "Browseroorsprongen die de directe listener mogen gebruiken."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.appurl]
impact = "Wijzig het naar een React Web die je zelf host en voeg de oorsprong ervan toe aan allowedOrigins."
summary = "Adres van React Web dat koppellinks openen."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.listenaddress]
impact = "Het standaardadres :: accepteert IPv6- en IPv4-gemapt verkeer voor toegang via LAN, containers en poortdoorsturing. Gebruik een loopbackadres alleen achter een reverse proxy of relay op dezelfde host."
summary = "IP-adres waaraan de weblistener wordt gebonden."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.listenerenabled]
impact = "React opent standaard de API met authenticatie. Stel false in om geen HTTP- of WebSocket-listener te openen."
summary = "Schakelt de ingebouwde weblistener in."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.port]
impact = "Als deze poort bezet is, probeert React de volgende 99 poorten in volgorde en gebruikt het de daadwerkelijk gebonden poort voor de relay-loopback en gegenereerde directe URL's wanneer advertisedUrl leeg is. Het opslaan van web.toml herstart de listener automatisch."
summary = "Voorkeurs-TCP-poort voor de webserver."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.relayenabled]
impact = "React verbindt met relayUrl bij de eerste /react web pair en bij elke start zolang er een koppeling is. Koppellinks bevatten dan ook het relay-adres."
summary = "Schakelt de uitgaande relay-client in zodat browsers deze server zonder open poort bereiken."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.relayurl]
impact = "Wordt alleen gelezen wanneer relayEnabled waar is. Laat leeg wanneer de relay is uitgeschakeld."
summary = "Basis-WSS-URL van de relaybroker, bijv. wss://relay.arcane.art; het pad /agent wordt automatisch toegevoegd."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.requiretokenforreads]
impact = "Wanneer waar, worden niet-geverifieerde GET-verzoeken met 401 afgewezen. Zet dit alleen op false in volledig vertrouwde netwerkomgevingen."
summary = "Vereist een geldig authenticatietoken voor alleen-lezen HTTP-eindpunten."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.servername]
impact = "Leeg gebruikt de eerste regel van de MOTD, of de naam van de servermap als de MOTD de vanilla-standaard is."
summary = "Naam die React Web voor deze server toont."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.tokendays]
impact = "Elk gebruik start de tijd opnieuw. /react web pair expires= overschrijft dit voor één link. 1 tot 365."
summary = "Dagen dat een koppeling zonder gebruik geldt."

[config.documentation.annotation.art.arcane.react.content.action.actioncollectgarbage]
description = "Configuratie voor de actie Collect Garbage. Vraagt JVM-garbagecollection aan en meldt het direct vrijgemaakte heapgeheugen."

[config.documentation.annotation.art.arcane.react.content.action.actioncollectgarbage_params.field.postgcwaitticks]
impact = "Hogere waarden geven JVM-collectors meer tijd om tot rust te komen; lagere waarden melden sneller, maar kunnen het vrijgemaakte geheugen te laag inschatten."
summary = "Ticks om te wachten na het aanvragen van GC voordat het geheugen wordt gemeten."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize]
description = "Configuratie voor de actie Hopper Network Normalize. Richt zich op trechter-hotspots, voegt voorwerpentiteiten samen en kan inactieve hete chunks ontladen."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.itemmergeradius]
impact = "Hogere waarden vergroten het zoekgebied en kosten meer werk; lagere waarden beperken het bereik en zijn goedkoper."
summary = "Samenvoegstraal voor voorwerpen die door hopper network normalize wordt gebruikt (blokken)."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.maxchunks]
impact = "Hogere waarden laten meer doorvoer toe voordat er wordt ingegrepen; lagere waarden maken de mitigatie agressiever."
summary = "Maximaal toegestane chunks voor hopper network normalize."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.maxmergeditementitiesperchunk]
impact = "Hogere waarden staan grotere pieken toe voordat de regeling ingrijpt; lagere waarden begrenzen pieken eerder."
summary = "Maximaal toegestane samengevoegde voorwerpentiteiten per chunk in hopper network normalize."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.minimumhopperupdatesperchunk]
impact = "Hogere waarden vereisen sterkere signalen voordat er wordt ingegrepen; lagere waarden maken deze voorwaarde makkelijker te halen."
summary = "Minimaal vereiste trechterupdates per chunk voor hopper network normalize."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.unloadidlehotchunks]
impact = "Schakel in om dit gedrag toe te passen; schakel uit om dit pad inactief te houden."
summary = "Bepaalt of hopper network normalize deze optie toepast: inactieve hete chunks ontladen."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.unsafeplayerradius]
impact = "Hogere waarden vergroten het zoekgebied en kosten meer werk; lagere waarden beperken het bereik en zijn goedkoper."
summary = "Onveilige spelerstraal die door hopper network normalize wordt gebruikt (blokken)."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.world]
impact = "Stel een wereldnaam in om acties tot die wereld te beperken, of laat leeg om alle werelden mee te nemen."
summary = "Wereldnaamfilter voor hopper network normalize-bewerkingen."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook]
