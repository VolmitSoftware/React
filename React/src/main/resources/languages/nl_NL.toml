"config.documentation.annotation.art.arcane.react.content.feature.featurehopperchaincoalescing.description" = "Configuratie voor trechter Chain Coalescing functie. Detecteert lineaire ketens van N trechters die dezelfde richting voeden en voorspelt hoeveel per trechter-overdracht ticks zou instorten in een enkele kop tot staart batch pull per ketting per tick. Werkt alleen metingsmodus: keten detectie plus geprojecteerde ticks-gespaard blootgesteld via de kettingcoalering metrieklezer. Annuleren tussenliggende InventoryMoveItemEvent dispatches botsen met FeatureHopperTokenBucket's bucket consumptie bestelling, dus de daadwerkelijke batch beweging wordt verschoven naar een speciale NMS brug."
