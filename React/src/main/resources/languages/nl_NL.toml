# React — nl_NL
#
# === Bestand bewerken ===
# plugins/React/languages/nl_NL.toml
# Je kunt dit bestand rechtstreeks bewerken. Lokale wijzigingen blijven behouden; ontbrekende of ongeldige vermeldingen gebruiken het ingebouwde Engels.
# /react language server edit nl_NL
#
# === Voorvoegsel ===
# runtime.prefix: Voorvoegsel dat React vóór chatberichten plaatst.
#
# === Opmaak ===
# Chatberichten ondersteunen kleurcodes met &: &cTekst&r, &lTekst&r.
# Kleuren: &0-&9 en &a-&f.
# Stijlen: &l vet, &o cursief, &n onderstreept, &m doorgestreept, &k onleesbare tekens, &r herstellen.
# Kleurcodes wissen actieve stijlen; zet de kleur vóór de stijl, zoals in &3&lTekst&r. &r wist alle opmaak.
# RGB-kleuren gebruiken &#RRGGBBTekst&r, bijvoorbeeld &#55AAFFTekst&r.
# Gebruik MiniMessage voor kleurverlopen en interacties; meng MiniMessage-tags en &-codes niet in één bericht. Sluit tags in de omgekeerde volgorde van openen.
# Houd TOML-aanhalingstekens en escape-reeksen geldig.
# Gebruik \n in TOML-tekenreeksen tussen aanhalingstekens voor een nieuwe regel; {{ en }} tonen letterlijke accolades.
# Waarden onder renderer.* en config.documentation.annotation.* zijn platte tekst.
# Waarden onder test.* zijn platte tekst, behalve berichten onder test.result.*, die opmaak ondersteunen.
# Gebruik variabelen in de berichttekst, buiten MiniMessage-tags.
#
# === Variabelen ===
# Behoud de namen van variabelen en gebruik alleen de variabelen die bij het bericht horen.
#   {action}  Actienaam of richting van de kleuraanpassing
#   {actions}  Aantal acties in de wachtrij of lijst met uitgesloten actienamen
#   {active}  Aantal actieve functies of aanpassingen
#   {actor}  Webgebruiker die een wijziging heeft aangebracht
#   {added}  Of een functie na activering weer in het actieve register staat
#   {after}  Configuratiewaarde, taalbericht of heapgebruik na een wijziging
#   {age}  Leeftijd van integratiegegevens in seconden
#   {amount}  Aantal te geven voorwerpen
#   {architecture}  CPU-architectuur
#   {argument}  Onverwacht commandoargument
#   {available}  Aantal beschikbare NMS-brugverwijzingen
#   {average}  Gemiddelde TPS of milliseconden per tick
#   {avg_mspt}  Gemiddelde milliseconden per tick tijdens een belastingtestronde
#   {avg_tps}  Gemiddelde ticks per seconde tijdens een belastingtestronde
#   {bar}  Opgemaakte balk met de benchmarkscore
#   {before}  Configuratiewaarde, taalbericht of heapgebruik vóór een wijziging
#   {checked}  Aantal gecontroleerde samplers
#   {chunks}  Aantal chunks waarop een actie van invloed is
#   {code}  Webkoppelcode
#   {command}  Commandopad
#   {count}  Aantal vermeldingen, modules, wijzigingen of testbevindingen
#   {current}  Huidig paginanummer
#   {delta_heap}  Verschil in eindgebruik van de heap tussen React en de referentiemeting, in MB
#   {delta_mspt}  Verschil in gemiddelde ticktijd tussen React en de referentiemeting, in ms
#   {delta_tps}  Verschil in gemiddelde TPS tussen React en de referentiemeting
#   {detail}  Diagnostische details van de brug, integratie, actie of test
#   {dimensions}  Gedetecteerde rasterafmetingen van de kaartenwand
#   {direction}  Draairichting van de tint van de geselecteerde kleur
#   {distance}  Gevraagde zicht-, simulatie- of verzendafstand in chunks
#   {duration}  Verstreken tijd; startberichten voor belastingtests gebruiken seconden
#   {enabled}  Inschakelstatus of aantal ingeschakelde modules
#   {entities}  Aantal entiteiten waarop een actie van invloed is
#   {entry}  Vermelding in de integratietijdlijn
#   {exceptions}  React-excepties die tijdens een belastingtestronde zijn vastgelegd
#   {fail}  Aantal mislukte controles
#   {file}  Bestandsnaam van een configuratie, taal of plugin-API
#   {fingerprint}  Vingerafdruk van de server of het webtoken
#   {finite}  Aantal samplers dat eindige waarden teruggeeft
#   {frames}  Aantal voorwerplijsten in de actieve kaartenwand
#   {free}  Vrij fysiek of virtueel geheugen
#   {freed}  Heapgeheugen dat door geheugenopruiming is vrijgemaakt
#   {from}  Nummer van de eerste vermelding op de huidige pagina
#   {grid}  Rasterafmetingen van de kaartenwand
#   {ground_y}  Grondhoogte voor de zwaartekrachttest
#   {group}  Monitor-, sampler-, kaart-, configuratie- of taalberichtgroep
#   {growth}  Groei van de heap tijdens een belastingtest, in MB
#   {health}  Gezondheidstoestand van de integratie
#   {heap_end}  Heapgebruik aan het einde van een belastingtestronde, in MB
#   {heap_start}  Heapgebruik aan het begin van een belastingtestronde, in MB
#   {heartbeat}  Tijd sinds het laatste levensteken van de integratie
#   {height}  Hoogte van het testtekenvlak in pixels
#   {hoppers}  Aantal genormaliseerde trechters
#   {id}  Identificatie van een brugverwijzing, sampler, kaart, actie, pakket of token
#   {impact}  Beschrijving van het configuratie-effect of pluginbelasting in ms/s
#   {incident}  Identificatie van de recursieve incidentactie die van de ontwikkeltests is uitgesloten
#   {index}  Nummer van de huidige stap in de ontwikkeltests
#   {invalid}  Aantal samplers met ongeldige metingen
#   {issued_at}  Aanmaaktijd van het webtoken
#   {item}  Naam of identificatie van het voorwerp
#   {items}  Aantal samengevoegde voorwerpentiteiten
#   {key}  Commandoparametersleutel, configuratiesleutel of ID van een taalbericht
#   {label}  Label van een benchmark, meetwaarde, instelling, commando of webtoken
#   {line}  Nummer van de regel die wordt bewerkt in een bericht met meerdere regels
#   {lines}  Aantal doorzochte regels in het serverlogboek
#   {loaded}  Aantal chunks dat tijdens het voorladen nieuw is geladen
#   {locale}  Taalcode die wordt weergegeven, geselecteerd of bewerkt
#   {matched}  Werelden waarvan de automatische opslagstatus overeenkomt met de testreferentie
#   {max_tick}  Langste waargenomen tijd tussen ticks tijdens een belastingtest, in ms
#   {maximum}  Maximaal aantal voorwerpen, drempel voor ticktijd of invoerlengte in de editor
#   {message}  Samenvatting van een voltooide actie of statusbericht van de integratie
#   {metrics}  Aantal meetwaarden dat een plugin-API-pakket levert
#   {minecraft}  Minecraft-versie
#   {minimum}  Minimaal aanvaardbare TPS
#   {missing}  Aantal vereiste samplers dat in het register ontbreekt
#   {mode}  Geselecteerde spelmodus of vaardigheidsmodus
#   {model}  CPU-model
#   {name}  Naam van een benchmark, module, renderer of testcontrole
#   {note}  Reden waarom het serverlogboek niet is doorzocht
#   {offenders}  Aantal samplers dat niet-eindige waarden teruggeeft
#   {operations}  Aantal callbackbewerkingen voor vaardigheden per minuut
#   {options}  Geaccepteerde configuratiewaarden
#   {p95}  95e percentiel van de ticktijd tijdens een belastingtest, in ms
#   {parameter}  Naam van de commandoparameter
#   {parameters}  Genegeerde commandoparameters
#   {pass}  Aantal geslaagde controles
#   {path}  Pad naar de configuratiesleutel of het rapportbestand
#   {percent}  Percentage van de kleuraanpassing of aandeel in de pluginbelasting
#   {permission}  Vereiste machtigingssleutel
#   {personal}  Door de speler geselecteerde taalcode
#   {phase}  Fase van de functielevenscyclus die wordt getest
#   {pixels}  Aantal niet-lege pixels dat een kaarttest heeft getekend
#   {platform}  Besturingssysteem of Minecraft-serverplatform
#   {players}  Aantal synthetische spelers in een belastingtest
#   {plugin}  Naam van de plugin
#   {process_load}  CPU-belasting van het serverproces
#   {processors}  Aantal beschikbare CPU-processoren
#   {profile}  Naam van het React-configuratieprofiel
#   {protocol}  Versie van het integratieprotocol
#   {radius}  Straal in chunks voor een kaartactie of ontwikkeltestactie
#   {range}  Toegestaan bereik voor zicht-, simulatie- of verzendafstand in chunks
#   {rate}  Ingestelde versnellingsfactor voor gewasgroei
#   {rating}  Opgemaakte benchmarkbeoordeling
#   {react_errors}  Aantal React-foutregels dat in het serverlogboek is gevonden
#   {reason}  Uitleg van een fout, afwijzing of onbeschikbare toestand
#   {registered}  Aantal geregistreerde modules
#   {removed_first}  Of de eerste deactivering een functie uit het actieve register heeft verwijderd
#   {removed_second}  Of herhaalde deactivering een functie uit het actieve register heeft verwijderd
#   {renderer}  Naam of identificatie van de kaartrenderer
#   {renderers}  Lijst met kaartrenderers zonder identificatie
#   {role}  Webtoegangsrol: viewer, operator of admin
#   {sampler}  Naam of identificatie van de sampler
#   {samplers}  Lijst met integratiesamplers of falende samplers
#   {scope}  Toepassingsgebied van de kaart of afstandsinstelling
#   {score}  Score van de benchmark
#   {seconds}  Afteltijd of duur van de belastingtest in seconden
#   {section}  Configuratieonderdeel of onderdeel van de taaleditor
#   {server}  Implementatie en versie van de Minecraft-server
#   {shown}  Aantal momenteel weergegeven rijen
#   {since_run}  Fouten die sinds het begin van de huidige test zijn gemeld
#   {size}  Maximale of actieve afmetingen van de kaartenwand
#   {skip}  Aantal overgeslagen controles
#   {spawn_y}  Hoogte waarop het blok voor de zwaartekrachttest is geplaatst
#   {state}  Status van de actie of het plugin-API-pakket
#   {status}  Label voor de integratiestatus of configuratietoestand
#   {subject}  Module of instelling die de configuratiehulp beschrijft
#   {subsystem}  Naam van het geteste subsysteem
#   {summary}  Samenvatting van de actiecontrole
#   {system_load}  CPU-belasting van het hele systeem
#   {target}  Wereld, speler, plugin, instelling of plugingroep waarop een bewerking is gericht
#   {threading}  Threadmodus van de server
#   {tick}  Tickduur die de vastloopdrempel heeft overschreden, in ms
#   {tick_crashes}  Aantal regels over tickcrashes dat in het serverlogboek is gevonden
#   {tier}  Ernstniveau van het incidentdraaiboek
#   {timing}  Callbacktijd voor vaardigheden in milliseconden per minuut
#   {to}  Nummer van de laatste vermelding op de huidige pagina
#   {total}  Totaal aan vermeldingen, modules, werelden, controles of geheugen in het bericht
#   {type}  Type commandoparameter, configuratiewaarde, kaart of afstand
#   {unavailable}  Aantal niet-beschikbare NMS-brugverwijzingen
#   {unit}  Eenheid voor het totaal van een cirkeldiagram
#   {unknown}  Identificatie van de onbekende actie die van de ontwikkeltests is uitgesloten
#   {unreadable}  Aantal samplers dat niet kon worden gelezen
#   {uptime}  Bedrijfstijd van het besturingssysteem van de host
#   {url}  URL van het geüploade diagnostische rapport
#   {usage}  Syntaxis voor het gebruik van het commando
#   {used}  Gebruikt fysiek geheugen, virtueel geheugen of heapgeheugen
#   {value}  Opgemaakte instelling, meting of hardwaregegevens
#   {values}  Bemonsterde waarden in een ontwikkeltestrapport
#   {variables}  Variabelenamen die het bewerkte bericht accepteert
#   {vendor}  Leverancier van Java
#   {verdict}  Eindoordeel van de test
#   {version}  Versie van React, Java of het platform
#   {warmed}  Aantal voorgeladen chunks
#   {warn}  Aantal controles met waarschuwingen
#   {width}  Breedte van het testtekenvlak in pixels
#   {world}  Naam van de Minecraft-wereld

