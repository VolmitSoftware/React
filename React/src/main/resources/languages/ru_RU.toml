"config.documentation.annotation.art.arcane.react.content.feature.featurefurnacebrewbatching.description" = "Конфигурация для печи / функция заваривания пива. Следы активных печей и пивоваренных стендов на чанк и измеряет количество промежуточных тики которые могут быть пропущены между событиями, связанными с выгрузкой топлива / приготовлением пищи. Отчеты прогнозируемый объем пропуска как метрика времени выполнения; обходит любой блок внутри bypassRadius Игрок настолько оживлён, что косметическое пламя/дым остаётся рядом с игроками.."
"config.documentation.annotation.art.arcane.react.content.feature.featurefurnacebrewbatching.field.bypassradius.impact" = "Высокие значения поддерживают более близлежащие печи, которые обычно выполняют цикл обработки серверов; низкие значения позволяют передаче партий приближаться к игрокам."
"config.documentation.annotation.art.arcane.react.content.feature.featurefurnacebrewbatching.field.bypassradius.summary" = "Радиус блока вокруг каждого игрока, где печь / пиво обходят стороной."
"config.documentation.annotation.art.arcane.react.content.feature.featurefurnacebrewbatching.field.engageincidentscore.impact" = "Более низкие значения проявляются во время более легких инцидентов; более высокие значения ожидают серьезных инцидентов."
"config.documentation.annotation.art.arcane.react.content.feature.featurefurnacebrewbatching.field.engageincidentscore.summary" = "Показатель происшествий (0-100) требуется до начала печи/пивоваренной партии."
"config.documentation.annotation.art.arcane.react.content.feature.featurefurnacebrewbatching.field.engageticktimems.impact" = "Более низкие значения включаются раньше; более высокие значения резервируют партию для более тяжелой нагрузки."
"config.documentation.annotation.art.arcane.react.content.feature.featurefurnacebrewbatching.field.engageticktimems.summary" = "Средние миллисекундные тик, необходимые перед началом работы партийной работы печи/пева."
