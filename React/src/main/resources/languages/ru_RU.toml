[config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor]
description = "Конфигурация функции «Регулятор диапазона трекера». Временно уменьшает диапазоны отслеживания сущностей в каждом мире (предметы, прочие, сущности отображения, животные, монстры), пока сервер под устойчивой нагрузкой, сокращая трекер сущностей и рассылку пакетов. Изменения применяются к сущностям по мере того, как они начинают отслеживаться, поэтому быстро сменяющиеся сущности, такие как предметы, реагируют в течение секунд; диапазоны восстанавливаются, когда сервер приходит в норму."

