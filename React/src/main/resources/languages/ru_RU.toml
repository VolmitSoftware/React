[config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.customcommands]
impact = "Каждая включённая запись динамически добавляет одну команду. Целевая команда по-прежнему проверяет собственное разрешение, а существующие названия команд защищены, пока не включён overrideExisting."
summary = "Пользовательские команды-сокращения, сгруппированные по метке команды. Добавьте таблицу [customCommands.day] с enabled = true, command = \"time set day\", permission = \"react.shorthands.custom\" и overrideExisting = false. Аргументы, введённые после сокращения, добавляются к настроенной команде; поместите слово args в фигурные скобки в команде, чтобы вставить их в другое место."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.give]
