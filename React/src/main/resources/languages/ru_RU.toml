[config.documentation.annotation.art.arcane.react.api.feature.reactfeature.field.enabled]
impact = "Значение false останавливает активацию этой функции, сохраняя её файл настроек."
summary = "Включает или отключает эту функцию."

[config.documentation.annotation.art.arcane.react.api.tweak.reacttweak.field.enabled]
impact = "Значение false останавливает активацию этой оптимизации, сохраняя её файл настроек."
summary = "Включает или отключает эту оптимизацию."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration]
description = "Конфигурация встроенного API управления React по HTTP/WebSocket. Изменения применяются автоматически при сохранении web.toml."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.advertisedurl]
impact = "Укажите HTTPS URL обратного прокси, если слушатель доступен за пределами localhost. Встроенный слушатель React по-прежнему поддерживает только HTTP. Изменения применяются автоматически при сохранении web.toml."
summary = "Публичный базовый URL, сообщаемый напрямую подключающимся клиентам API."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.allowedorigins]
impact = "Каждая запись это источник: схема, хост и порт без пути; обычный http только на loopback. Страница из другого источника отклоняется с origin_not_allowed. Запросы без Origin, например от ретранслятора, не затрагиваются."
summary = "Источники браузера, которым разрешён прямой слушатель."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.appurl]
impact = "Укажите свой размещённый React Web и добавьте его источник в allowedOrigins."
summary = "Адрес React Web, который открывают ссылки сопряжения."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.listenaddress]
impact = "Адрес :: по умолчанию принимает IPv6 и IPv4-mapped трафик из локальной сети, контейнеров и через перенаправление портов. Используйте loopback-адрес только за обратным прокси или ретранслятором на том же хосте."
summary = "IP-адрес, к которому привязывается веб-слушатель."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.listenerenabled]
impact = "React по умолчанию открывает API с аутентификацией. Значение false отключает привязку HTTP- и WebSocket-слушателей."
summary = "Включает встроенный веб-слушатель."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.port]
impact = "Если этот порт занят, React по порядку проверяет следующие 99 портов и использует фактически привязанный порт для локального подключения ретранслятора и создаваемых прямых URL, когда advertisedUrl пуст. Сохранение web.toml автоматически перезапускает слушатель."
summary = "Предпочтительный TCP-порт веб-сервера."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.relayenabled]
impact = "React подключается к relayUrl при первом /react web pair и при каждом запуске, пока есть сопряжение. Тогда ссылки сопряжения содержат и адрес ретранслятора."
summary = "Включает исходящий клиент ретранслятора, чтобы браузеры достигали сервера без открытого порта."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.relayurl]
impact = "Читается только при relayEnabled = true. Оставьте пустым, если реле отключено."
summary = "Базовый WSS URL релейного брокера, например wss://relay.arcane.art; путь /agent добавляется автоматически."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.requiretokenforreads]
impact = "Если true, неаутентифицированные запросы GET отклоняются с кодом 401. Устанавливайте false только в полностью доверенных сетях."
summary = "Требует действительный токен аутентификации для HTTP-конечных точек только для чтения."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.servername]
impact = "Пустое значение берёт первую строку MOTD или имя папки сервера, если MOTD стандартный для vanilla."
summary = "Имя, которое React Web показывает для этого сервера."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.tokendays]
impact = "Каждое использование начинает отсчёт заново. /react web pair expires= заменяет значение для одной ссылки. От 1 до 365."
summary = "Дни, которые сопряжение действует без использования."

[config.documentation.annotation.art.arcane.react.content.action.actioncollectgarbage]
description = "Конфигурация действия «Сбор мусора». Запрашивает сборку мусора JVM и сообщает о сразу освобождённой памяти кучи."

[config.documentation.annotation.art.arcane.react.content.action.actioncollectgarbage_params.field.postgcwaitticks]
impact = "Большие значения дают сборщикам JVM больше времени на стабилизацию; меньшие значения дают отчёт быстрее, но могут занизить освобождённую память."
summary = "Тиков ожидания после запроса GC перед измерением памяти."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize]
description = "Конфигурация действия «Нормализация сети воронок». Нацелено на горячие точки воронок, объединяет сущности предметов и может выгружать простаивающие горячие чанки."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.itemmergeradius]
impact = "Более высокие значения расширяют область поиска и требуют больше работы; более низкие значения сужают область и работают дешевле."
summary = "Радиус слияния предметов для «Нормализация сети воронок» (в блоках)."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.maxchunks]
impact = "Более высокие значения допускают больший объём работы до вмешательства; более низкие значения делают меры смягчения более агрессивными."
summary = "Максимальное допустимое значение «чанки» для «Нормализация сети воронок»."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.maxmergeditementitiesperchunk]
impact = "Более высокие значения допускают более крупные всплески до включения контроля; более низкие значения ограничивают пики раньше."
summary = "Максимальное допустимое значение «объединённые сущности предметов» на чанк в «Нормализация сети воронок»."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.minimumhopperupdatesperchunk]
impact = "Более высокие значения требуют более сильных сигналов для действия; более низкие значения облегчают выполнение этого условия."
summary = "Минимальное число обновлений воронок на чанк, требуемое для «Нормализация сети воронок»."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.unloadidlehotchunks]
impact = "Включите, чтобы применять это поведение; отключите, чтобы этот путь оставался неактивным."
summary = "Определяет, выгружает ли «Нормализация сети воронок» простаивающие горячие чанки."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.unsafeplayerradius]
impact = "Более высокие значения расширяют область поиска и требуют больше работы; более низкие значения сужают область и работают дешевле."
summary = "Небезопасный радиус игрока для «Нормализация сети воронок» (в блоках)."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.world]
impact = "Укажите имя мира, чтобы ограничить действия им, или оставьте пустым, чтобы охватить все миры."
summary = "Фильтр по названию мира для операций «Нормализация сети воронок»."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook]
description = "Последовательно запускает подходящие меры смягчения инцидента, наблюдает за нагрузкой между действиями и завершается после их итоговых результатов."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.includegarbagecollection]
