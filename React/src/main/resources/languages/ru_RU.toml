[config.documentation.annotation.art.arcane.react.content.feature.featurelazygravity]
description = "Настройка функции Lazy Gravity. Отслеживает ванильные сущности FallingBlock на свободных вертикальных траекториях и оценивает, сколько тиков движения можно было бы пропустить, если определять тик приземления детерминированно по позиции появления и расчёту гравитации, а не обрабатывать AI и движение каждый тик. Публикует оценочное число пропускаемых тиков как метрику времени выполнения, чтобы операторы могли оценить эффект до внедрения полного пропуска тиков. Не учитывает падающие блоки в радиусе bypassRadius от игрока. Изменения активной траектории (установка, разрушение или физическое обновление блока в столбце) возвращают отслеживаемую сущность к ванильной физике."

