summary = "Минимальное время (в тиках), которое чанк должен провести за пределами дистанции симуляции, прежде чем будет перемотан. Более короткие отсутствия игнорируются."

[config.documentation.annotation.art.arcane.react.content.feature.featurecropfastforward.field.releaseonincident]
