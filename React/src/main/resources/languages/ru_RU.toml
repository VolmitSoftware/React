"config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.description" = "Конфигурация для Tracker Range Governor. Временно масштабируется диапазон отслеживания объектов в мире (элементы, миксы, дисплеи, животные, монстры), а сервер находится под постоянным давлением, сокращая отслеживание объектов и вентиляцию пакетов. Изменения применяются к объектам по мере их отслеживания, поэтому быстродействующие объекты, такие как элементы, реагируют в течение нескольких секунд; диапазоны восстанавливаются после восстановления сервера."
"config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.field.animalrangefactor.impact" = "Более низкие значения сокращают фанатов трекеров животных; отдаленные животные появляются позже во время занятий."
"config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.field.animalrangefactor.summary" = "Масштабный фактор применяется к диапазону отслеживания животных во время работы."
"config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.field.displayrangefactor.impact" = "Более низкие значения сокращают вентиляцию объекта отображения; голограммы отображаются с более близкого расстояния только во время взаимодействия."
"config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.field.displayrangefactor.summary" = "Масштабный коэффициент, применяемый для отображения диапазона отслеживания объектов во время взаимодействия."
"config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.field.engageticktimems.impact" = "Более низкие значения сокращают диапазоны отслеживания раньше; более высокие значения резервируют его для большей нагрузки."
"config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.field.engageticktimems.summary" = "Средние миллисекундные тик, необходимые перед управлением."
"config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.field.itemrangefactor.impact" = "Более низкие значения сокращают больше трекера / пакета; игроки видят только выпадающие предметы из более близких."
