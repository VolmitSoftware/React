summary = "Максимальное число тиков простоя, учитываемых в расчёте роста. Ограничивает чрезмерную перемотку после долгого отсутствия."

[config.documentation.annotation.art.arcane.react.content.feature.featurecropfastforward.field.maxtrackedchunks]
