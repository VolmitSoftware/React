[config.documentation.annotation.art.arcane.react.content.feature.featurepathfinderbudget]
description = "Конфигурация функции «Бюджет поиска пути». Сокращает бюджет узлов A* у мобов вдали от игроков, пока сервер под нагрузкой, делая каждый поиск пути дешевле без изменения того, куда мобы стремятся попасть. Бюджеты восстанавливаются, когда мобы приближаются к игрокам, когда сервер приходит в норму, при выгрузке сущности или при деактивации. Переходит на ванильный поиск пути, если мосты навигации NMS недоступны."

