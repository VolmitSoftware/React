summary = "Миллисекунды после последнего чтения данных событий, после которых обёртки снимаются в режимах по запросу и по циклу."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller]
description = "Однократно собирает данные с измерителей React, сохраняет сжатую историческую телеметрию и обслуживает ограниченные запросы по диапазону времени."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.compressionlevel]
