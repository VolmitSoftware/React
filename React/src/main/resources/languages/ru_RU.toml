[config.documentation.annotation.art.arcane.react.content.feature.featurefurnacebrewbatching]
description = "Конфигурация функции «Пакетная обработка печей и варочных стоек». Отслеживает активные печи и варочные стойки по чанкам и измеряет число промежуточных тиков, которые можно пропустить между событиями окончания топлива и завершения готовки. Сообщает прогнозируемый объём пропусков как метрику времени выполнения; обходит любые блоки в пределах bypassRadius от игрока, чтобы пламя и дым рядом с игроками оставались живыми."

[config.documentation.annotation.art.arcane.react.content.feature.featurefurnacebrewbatching.field.bypassradius]
impact = "Более высокие значения оставляют больше близких печей с обычным тиком; более низкие значения позволяют пакетной обработке подходить ближе к игрокам."
summary = "Радиус в блоках вокруг каждого игрока, в котором пакетная обработка печей и варочных стоек отключена."

[config.documentation.annotation.art.arcane.react.content.feature.featurefurnacebrewbatching.field.engageincidentscore]
impact = "Более низкие значения проявляются во время более легких инцидентов; более высокие значения ожидают серьезных инцидентов."
summary = "Оценка инцидента (0-100), необходимая для включения пакетной обработки печей и варочных стоек."

[config.documentation.annotation.art.arcane.react.content.feature.featurefurnacebrewbatching.field.engageticktimems]
