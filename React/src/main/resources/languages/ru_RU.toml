summary = "Максимальное расстояние без игрока, допустимое для «Тормоз простаивающего транспорта»."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakvehicleidlebrake.field.maxvehiclessampledperworld]
impact = "Более высокие значения проверяют больше транспорта за цикл; более низкие значения строже ограничивают объём оценки."
summary = "Максимальное число единиц транспорта, измеряемых за оценку по всем мирам в «Тормоз простаивающего транспорта», в диапазоне от 1 до 4096."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakvehicleidlebrake.field.minvelocitysquared]
