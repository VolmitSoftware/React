summary = "Среднее время тика в миллисекундах, необходимое для включения пакетной обработки печей и варочных стоек."

[config.documentation.annotation.art.arcane.react.content.feature.featurefurnacebrewbatching.field.maxtrackedentries]
impact = "Более высокие значения отслеживают более крупные фермы; более низкие значения ограничивают использование памяти за счет точности."
