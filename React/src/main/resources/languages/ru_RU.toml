"config.documentation.annotation.art.arcane.react.content.tweak.tweakserverhibernator.field.imacloudserverenableme.summary" = "Защитные ворота для экспериментального сервера гибернации."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakserverhibernator.field.secondspertick.impact" = "Более высокие значения замедляют цикл более агрессивно; более низкие значения поддерживают сервер более отзывчивым."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakserverhibernator.field.secondspertick.summary" = "Секундные задержки, применяемые на тик серверным hibernator."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.description" = "Конфигурация для функции Shorthands. Добавляет команды оператора на скортечку, которые могут быть настроены отдельно без изменения /reload."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.customcommands.impact" = "Каждый включенный вход динамически добавляет одну команду. Целевая команда все еще обеспечивает свое собственное разрешение, и существующие этикетки команд защищены, если не включено overrideExisting."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.customcommands.summary" = "Пользовательские команды ярлыков, организованные командной меткой. Добавить [customCommands.day] столик с enabled = true, command = \"time set day\", permission = \"react.shorthands.custom\", и overrideExisting = false. Аргументы, набранные после команды ярлыка, добавляются к сконфигурированной команде.. Положи слово args внутри брекетов в команде, чтобы вставить их куда-то еще."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.give.impact" = "В то время как включен, на сборе есть неквалифицированная команда /give. Название ваниль давать команду остается доступным."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.give.summary" = "Регистрирует /give <item> <amount> с Minecraft заканчивание элемента вкладки."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.gmc.impact" = "Отключите этот вариант, если /gmc не зарегистрирован во время работы функции Shorthands."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.gmc.summary" = "Регистрирует /gmc, чтобы переключить игрок, который выполняет команду на режим Creative."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.gms.impact" = "Отключите этот вариант, если /gms не зарегистрирован во время работы функции Shorthands."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.gms.summary" = "Регистрирует /gms, чтобы переключить игрок, который выполняет команду в режим выживания."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.gmsp.impact" = "Отключите этот вариант, если /gmsp не зарегистрирован во время работы функции Shorthands."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.gmsp.summary" = "Регистрирует /gmsp для переключения игрока, который выполняет команду в режим Spectator."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.more.impact" = "Отключите этот вариант, если /more не зарегистрирован во время работы функции Shorthands."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.more.summary" = "Регистрирует /more, чтобы дать игроку один столб максимального размера, который точно соответствует держащемуся предмету."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.rl.impact" = "Отключите этот вариант, если /rl не зарегистрирован во время работы функции Shorthands."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.rl.summary" = "Регистрирует /rl как псевдоним, который призывает к неквалифицированной команде /reload сервера."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands_customshorthand.field.command.impact" = "Целевая команда работает с имеющимися разрешениями призывного отправителя и не может повысить доступ."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands_customshorthand.field.command.summary" = "Командование выполняется как пользователь короткого пути, без ведущего слайда. Доставленные аргументы автоматически приложены, если слово args не появляется внутри брекетов."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands_customshorthand.field.enabled.impact" = "Отключить сохранение определения в конфигурации без регистрации его команды."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands_customshorthand.field.enabled.summary" = "Определить качество настройки."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands_customshorthand.field.overrideexisting.impact" = "React восстанавливает любые замененные карты, когда скрас отключен или перезагружен."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands_customshorthand.field.overrideexisting.summary" = "Позволяет этот набор коротких путей временно заменить существующую неквалифицированную командную этикетку во время активации."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands_customshorthand.field.permission.impact" = "По умолчанию react.shorthands.custom ограничивает пользовательские команды набора операторов."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands_customshorthand.field.permission.summary" = "Необходимо дополнительное разрешение на использование этого скортеги, кроме разрешения команды-цель. Оставьте пустое для того, чтобы не потребовать дополнительного разрешения на скортег."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakspawnerplayerradius.description" = "Конфигурация для Spawner Player Radius tweak. Блоки нереста и пробного нереста появляются, когда игроки находятся за пределами требуемого расстояния активации."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakspawnerplayerradius.field.enforcespawnerspawns.impact" = "Способен применять это поведение; неспособен держать этот путь в бездействии."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakspawnerplayerradius.field.enforcespawnerspawns.summary" = "Контроль того, применяется ли радиус игрока-нереста для обеспечения соблюдения нерестовых нерестов."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakspawnerplayerradius.field.enforcetrialspawnerspawns.impact" = "Способен применять это поведение; неспособен держать этот путь в бездействии."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakspawnerplayerradius.field.enforcetrialspawnerspawns.summary" = "Контроль того, применяет ли радиус игрока-нереста принудительное испытание нерестовых пород."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakspawnerplayerradius.field.onlymonsters.impact" = "Способен применять это поведение; неспособен держать этот путь в бездействии."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakspawnerplayerradius.field.onlymonsters.summary" = "Контроль того, применяется ли радиус нереста игрока только к монстрам."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakspawnerplayerradius.field.requiredplayerdistance.impact" = "Более высокие значения расширяют область поиска и стоят больше работы; более низкие значения сужают объем и работают дешевле."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakspawnerplayerradius.field.requiredplayerdistance.summary" = "Требуемый радиус игрока, используемый нерестовым радиусом игрока (блоки)."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakunknown.description" = "Конфигурация для неизвестная настройка. Настройка держателя, используемая при запрашиваемой настройке ID отсутствует или недоступна."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakvehicleidlebrake.description" = "Конфигурация для настройки тормоза транспортного средства Idle. Применяет торможение к дальним неработающим транспортным средствам, чтобы уменьшить безудержное движение и физику над головой."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakvehicleidlebrake.field.brakeboats.impact" = "Способен применять это поведение; неспособен держать этот путь в бездействии."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakvehicleidlebrake.field.brakeboats.summary" = "Контроль того, применяет ли тормозной механизм транспортного средства тормозные лодки."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakvehicleidlebrake.field.brakeminecarts.impact" = "Способен применять это поведение; неспособен держать этот путь в бездействии."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakvehicleidlebrake.field.brakeminecarts.summary" = "Контроль того, применяет ли тормозной механизм транспортного средства на холостых ходах тормозные минные тележки."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakvehicleidlebrake.field.maxdistancewithoutplayer.impact" = "Более высокие значения позволяют увеличить пропускную способность перед вмешательством; более низкие значения делают смягчение более агрессивным."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakvehicleidlebrake.field.maxdistancewithoutplayer.summary" = "Максимальное расстояние без игрока, разрешенное тормозом транспортного средства."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakvehicleidlebrake.field.maxvehiclessampledperworld.impact" = "Более высокие значения позволяют более крупные всплески до того, как контроль вступает; более низкие значения зажимают шипы раньше."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakvehicleidlebrake.field.maxvehiclessampledperworld.summary" = "Максимально допустимые транспортные средства на свет в тормозном состоянии."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakvehicleidlebrake.field.minvelocitysquared.impact" = "Более высокие значения требуют более сильных сигналов перед действием; более низкие значения облегчают удовлетворение этого условия."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakvehicleidlebrake.field.minvelocitysquared.summary" = "Минимальная скорость в квадрате, требуемая тормозом транспортного средства."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakvehicleidlebrake.field.onlyemptyvehicles.impact" = "Способен применять это поведение; неспособен держать этот путь в бездействии."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakvehicleidlebrake.field.onlyemptyvehicles.summary" = "Контроль того, применяется ли тормоз транспортного средства только к пустым транспортным средствам."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakvehicleidlebrake.field.tickintervalms.impact" = "Более низкие значения реагируют быстрее, но потребляют больше. CPUБолее высокие значения уменьшают накладные расходы, но реагируют позже."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakvehicleidlebrake.field.tickintervalms.summary" = "Основной интервал оценки для тормозов транспортного средства в течение миллисекунд."
"config.documentation.annotation.art.arcane.react.core.controller.configinputcontroller.field.sessiontimeoutseconds.impact" = "Более высокие значения сохраняют подсказки редактирования открытыми дольше, прежде чем они будут отменены."
"config.documentation.annotation.art.arcane.react.core.controller.configinputcontroller.field.sessiontimeoutseconds.summary" = "Тайм-аут для сеансов редактирования конфигураций на основе чата в считанные секунды."
"config.documentation.annotation.art.arcane.react.core.controller.hotloadcontroller.description" = "Часы React Конфигурация файлов и изменения горячих приложений без необходимости полного /react reload."
"config.documentation.annotation.art.arcane.react.core.controller.hotloadcontroller.field.enabled.impact" = "Настройте ложный режим для отключения просмотра файлов и требуйте ручной перезагрузки."
"config.documentation.annotation.art.arcane.react.core.controller.hotloadcontroller.field.enabled.summary" = "Позволяет осуществлять горячую загрузку React управляемые конфигурации."
"config.documentation.annotation.art.arcane.react.core.controller.hotloadcontroller.field.maxdiffmessagesperfile.impact" = "Более низкие значения уменьшают шум в чате оператора при больших изменениях конфигурации."
"config.documentation.annotation.art.arcane.react.core.controller.hotloadcontroller.field.maxdiffmessagesperfile.summary" = "Максимальное количество сообщений дифф-кода на уровне ключа, отправляемых в измененный файл."
"config.documentation.annotation.art.arcane.react.core.controller.hotloadcontroller.field.notifyoperators.impact" = "Отключите, если вам нужны только журналы консоли и никаких внутриигровых уведомлений."
"config.documentation.annotation.art.arcane.react.core.controller.hotloadcontroller.field.notifyoperators.summary" = "Отправляет резюме изменений горячей загрузки онлайн-операторам."
"config.documentation.annotation.art.arcane.react.core.controller.hotloadcontroller.field.pollintervalms.impact" = "Более низкие значения процесса доставляют события файловой системы раньше; задержка доставки операционной системы может быть дольше."
"config.documentation.annotation.art.arcane.react.core.controller.hotloadcontroller.field.pollintervalms.summary" = "Интервал вытяжки, используемый наблюдателем конфигураций в миллисекундах."
"config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.description" = "управляющий React метаданные о карте, ремонт рендерера и доставка пакетов с живой картой для кадастров и кадров элементов."
"config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemapidlepushintervalms.impact" = "Более высокие значения уменьшают объем праздных пакетов, когда игроки находятся поблизости, но не смотрят карту."
"config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemapidlepushintervalms.summary" = "Пакетный интервал разгона для близлежащих зрителей, которые не смотрят активно на карту кадра (миллисекунды)."
"config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemaplookdotthreshold.impact" = "Более высокие значения требуют более жесткой цели на карту перед отправкой высокочастотных обновлений."
"config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemaplookdotthreshold.summary" = "Минимальный продукт точки направления обзора, необходимый для того, чтобы игрок активно смотрел на карту кадра."
"config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemappushintervalms.impact" = "Более низкие значения позволяют быстрее обновлять визуальные изображения карты, но увеличивают пакет и давление рендеринга."
"config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemappushintervalms.summary" = "Пакетный интервал разгона для активных карт кадра элемента в миллисекундах."
"config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemappushoutsiderangewhenholding.impact" = "Отключите пакеты карт с жесткой остановкой за пределами радиуса; включите, если удерживание должно обходить проверки расстояния."
"config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemappushoutsiderangewhenholding.summary" = "Позволяет обновлять карты снаружи frameMapPushRadiusBlocks."
"config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemappushradiusblocks.impact" = "Более высокие значения охватывают больше зрителей, но увеличивают количество фанатов пакетов."
"config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemappushradiusblocks.summary" = "Максимальный радиус блока с карты кадра элемента, где игроки получают push-обновления."
"config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemappushstateretentionms.impact" = "Более высокие значения дольше сохраняют состояние с меньшим оттоком; более низкие ценности более агрессивно обрезают бухгалтерию."
"config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemappushstateretentionms.summary" = "Продолжительность хранения для фрейм-карты толкает бухгалтерию в миллисекундах."
"config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemapredrawintervalms.impact" = "Более низкие значения освежают панели инструментов кадра быстрее; более высокие значения разрушают избыточные перерисовки на занятых стенах карты."
"config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemapredrawintervalms.summary" = "Минимальный интервал между перерисовками холста для элемента-кадра React Карты в миллисекундах."
"config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemaprequirelineofsight.impact" = "Включение устраняет пакеты для окклюдированных зрителей, но добавляет легкие проверки видимости."
"config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemaprequirelineofsight.summary" = "Если включена, то для толкания каркасной карты требуется линия видимости для близлежащих зрителей (держатели обходят это)."
"config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemapvalidateintervalms.impact" = "Нижепризнанные значения обнаруживают обмененные элементы рамы раньше; более высокие знания избегают повторения метаданных элементов, которые читаются каждым тик-адресом обслуживания."
"config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemapvalidateintervalms.summary" = "Интервал между полными повторными проверками стека элементов карт отслеживаемых кадров в миллисекундах."
"config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.heldmapredrawintervalms.impact" = "Более низкие значения вращаются и обновляются более плавно; более высокие значения сокращают работу рендеринга, когда многие игроки просматривают одну и ту же карту."
"config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.heldmapredrawintervalms.summary" = "Минимальный интервал между перерисовками холста для проведения React Карты в миллисекундах."
"config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.inventoryrepairbatchsize.impact" = "Более высокие значения сокращают время восстановления после перезагрузки; более низкие значения уменьшают работу каждого прохода."
"config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.inventoryrepairbatchsize.summary" = "Количество онлайн-каталогов игроков, отремонтированных за один пропуск на обслуживание."
"config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.inventoryrepaircadencems.impact" = "Низкие значения ремонтируют метаданные карты и рендеры быстрее; более высокие значения уменьшают работу на тик."
"config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.inventoryrepaircadencems.summary" = "Каденция для сканирования запасов игроков React Ремонт карты за миллисекунды."
"config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.itemframechunkbatchsize.impact" = "Более высокие значения ускоряют восстановление каркасной карты после перезагрузки; более низкие значения снижают стоимость проезда."
"config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.itemframechunkbatchsize.summary" = "Количество загруженных чанки, сканированных на карты элементов-кадр на пропуск по обслуживанию."
