[config.documentation.annotation.art.arcane.react.content.feature.featureactivationrangegovernor]
description = "Конфигурация функции «Регулятор диапазона активации». Временно уменьшает диапазоны активации сущностей в каждом мире, пока сервер находится под устойчивой нагрузкой, так что сам сервер отключает далёкие сущности вместо того, чтобы обрабатывать их тики. В отличие от dynamic-activation-range (которая измеряет и приостанавливает сущности по одной), эти диапазоны считываются сервером каждый тик и применяются ко всем сущностям сразу. Диапазоны и тики жителей восстанавливаются, когда сервер приходит в норму."

[config.documentation.annotation.art.arcane.react.content.feature.featureactivationrangegovernor.field.animalrangefactor]
impact = "Более низкие значения раньше отключают далёких животных во время периодов нагрузки."
summary = "Коэффициент масштабирования диапазона активации животных в активном режиме."

[config.documentation.annotation.art.arcane.react.content.feature.featureactivationrangegovernor.field.engageticktimems]
impact = "Более низкие значения раньше уменьшают диапазоны активации; более высокие значения оставляют это для более высокой нагрузки."
summary = "Среднее время тика в миллисекундах, необходимое для включения регулятора."

[config.documentation.annotation.art.arcane.react.content.feature.featureactivationrangegovernor.field.flyingmonsterrangefactor]
impact = "Более низкие значения раньше отключают далёких фантомов и гастов во время периодов нагрузки."
summary = "Коэффициент масштабирования диапазона активации летающих монстров в активном режиме."

[config.documentation.annotation.art.arcane.react.content.feature.featureactivationrangegovernor.field.minimumrangeblocks]
impact = "Более высокие значения ограничивают степень сжатия диапазонов; более низкие значения допускают более сильное сокращение."
summary = "Минимальный диапазон активации в блоках после масштабирования."

[config.documentation.annotation.art.arcane.react.content.feature.featureactivationrangegovernor.field.miscrangefactor]
