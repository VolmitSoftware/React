summary = "Минимальный квадрат скорости, требуемый для «Тормоз простаивающего транспорта»."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakvehicleidlebrake.field.onlyemptyvehicles]
impact = "Включите, чтобы применять это поведение; отключите, чтобы этот путь оставался неактивным."
summary = "Определяет, применяется ли «Тормоз простаивающего транспорта» только к пустому транспорту."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakvehicleidlebrake.field.tickintervalms]
impact = "Более низкие значения реагируют быстрее, но потребляют больше CPU; более высокие значения снижают накладные расходы, но реагируют позже."
summary = "Основной интервал оценки для «Тормоз простаивающего транспорта» в миллисекундах."

[config.documentation.annotation.art.arcane.react.core.controller.configinputcontroller.field.sessiontimeoutseconds]
impact = "Более высокие значения сохраняют подсказки редактирования открытыми дольше, прежде чем они будут отменены."
summary = "Тайм-аут сеансов редактирования конфигурации через чат, в секундах."

[config.documentation.annotation.art.arcane.react.core.controller.hotloadcontroller]
