#   {loaded}  Число чанков, впервые загруженных при предварительной подготовке
#   {locale}  Код отображаемого, выбираемого или редактируемого языка
#   {matched}  Миры, состояние автосохранения которых совпадает с базовым состоянием теста
#   {max_tick}  Наибольший наблюдаемый интервал между тиками в нагрузочном тесте, в ms
#   {maximum}  Максимальное число предметов, порог времени тика или длина ввода в редакторе
