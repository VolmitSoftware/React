impact = "Более высокие значения вызывают смягчение позже; более низкие значения запускают раньше и более агрессивно."
summary = "Порог оценки инцидента для входа в режим инцидента Trinity."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrinityincidentmode.field.enteririspregeninflight]
impact = "При больших значениях нагрузка Iris учитывается только тогда, когда прегенератор работает почти с полной параллельностью; при меньших учитывается и более лёгкая нагрузка прегенерации."
summary = "Выполняемые запросы чанков прегенератора Iris, которые в режиме инцидентов Trinity считаются нагрузкой Iris; значения ограничиваются диапазоном 1..256."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrinityincidentmode.field.entertickms]
impact = "Более высокие значения задерживают активацию или выход; более низкие значения облегчают пересечение этого порога."
summary = "Порог времени тика для входа в режим инцидента Trinity (миллисекунды)."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrinityincidentmode.field.minimumengagems]
impact = "Более высокие значения требуют более сильных сигналов для действия; более низкие значения облегчают выполнение этого условия."
summary = "Минимальная длительность включения в миллисекундах, требуемая для режима инцидента Trinity."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrinityincidentmode.field.playbookcooldownms]
impact = "Более высокие значения снижают частоту повторов, более низкие позволяют проводить реакции чаще."
summary = "Время восстановления сценария в режиме инцидента Trinity (миллисекунды)."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrinityincidentmode.field.tickintervalms]
impact = "Более низкие значения реагируют быстрее, но потребляют больше CPU; более высокие значения снижают накладные расходы, но реагируют позже."
summary = "Основной интервал оценки для «Режим инцидента Trinity» в миллисекундах."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrinityincidentmode.field.verbosetransitions]
impact = "Включите для диагностики; отключите, чтобы уменьшить шум в чате или журнале."
summary = "Включает дополнительное журналирование подробных переходов в режиме инцидента Trinity."

[config.documentation.annotation.art.arcane.react.content.feature.featureunknown]
description = "Конфигурация неизвестной функции. Эта функция постоянно отслеживает поведение сервера и применяет ограничения во время работы."

[config.documentation.annotation.art.arcane.react.content.feature.perworld.worldbudgetoverride.field.budgetms]
summary = "Порог бюджета для мира в миллисекундах, переопределяющий глобальный budgetMs для этого мира."

[config.documentation.annotation.art.arcane.react.content.feature.perworld.worldbudgetoverride.field.panicms]
summary = "Порог паники для мира в миллисекундах, переопределяющий глобальный panicMs для этого мира."

[config.documentation.annotation.art.arcane.react.content.feature.perworld.worldbudgetoverride.field.releasems]
summary = "Порог отпускания для мира в миллисекундах, переопределяющий глобальный releaseMs для этого мира."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakentitybubbler]
description = "Конфигурация оптимизации «Пузырьковый лифт сущностей». Не даёт выбранным снарядам и служебным сущностям бесконечно зависать в пузырьковых колоннах."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakentitybubbler.field.entitiedtopreventfrombeingbubbled]
impact = "Добавьте больше типов, чтобы агрессивнее очищать пузырьковые лифты, или удалите типы, чтобы эти сущности могли перемещаться в водяных столбах."
summary = "Типы сущностей, удаляемые при обнаружении внутри путей пузырьковых колонн или лифтов из песка душ."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakentitycrowdprevention]
description = "Конфигурация оптимизации «Предотвращение скученности сущностей». Сокращает переполненные скопления сущностей типа скота, пока они не создали устойчивую нагрузку на тики."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakentitycrowdprevention.field.maxentitiesperclustercrowd]
impact = "Более высокие значения допускают более крупные всплески до включения контроля; более низкие значения ограничивают пики раньше."
summary = "Максимальное допустимое значение «сущности» на кластерную толпу в «Предотвращение скученности сущностей»."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakentitycrowdprevention.field.mobstopreventfromcrowding]
impact = "Сузьте этот список, чтобы защитить больше мобов, или расширьте его, чтобы применять защиту от скопления к дополнительным типам сущностей."
summary = "Типы сущностей, проверяемые на локальную скученность и подлежащие сокращению."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakentitycrowdprevention.field.prevententitybubbling]
impact = "Включите, чтобы применять это поведение; отключите, чтобы этот путь оставался неактивным."
summary = "Определяет, применяется ли «предотвращение пузырькового подъёма сущностей» в «Предотвращение скученности сущностей»."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakentitycrowdprevention.field.protectnamedentities]
impact = "Оставьте включённым, чтобы исключать сущности с собственным именем; отключите, чтобы разрешить их удаление."
summary = "Защищает сущности, названные игроками, от удаления функцией предотвращения скученности."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakentityhardstop]
description = "Конфигурация оптимизации «Жёсткий лимит сущностей». Жёстко ограничивает число сущностей в чанке, отменяя новые добавления после превышения лимитов."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakentityhardstop.field.allowitemdrops]
impact = "Включите, чтобы не блокировать выпавшие предметы даже в переполненных чанках; отключите для более строгого жёсткого лимита."
summary = "Разрешает естественным и выброшенным игроками предметам обходить проверки жёсткого лимита."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakentityhardstop.field.cacheintervalticks]
impact = "Более высокие значения снижают накладные расходы на повторный подсчёт, но могут дольше отказывать в спавне; более низкие значения перепроверяют раньше ценой накладных расходов."
summary = "Время кэширования для чанков, недавно отклонённых жёстким лимитом, перед повторной проверкой числа сущностей (тики)."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakentityhardstop.field.maxentitiesperchunk]
impact = "Более высокие значения допускают более крупные всплески до включения контроля; более низкие значения ограничивают пики раньше."
summary = "Максимальное допустимое значение «сущности» на чанк в «Жёсткий лимит сущностей»."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakexperienceorbmerge]
description = "Конфигурация оптимизации «Слияние сфер опыта». Объединяет ближайшие сферы опыта в более крупные стопки, чтобы уменьшить число сущностей-сфер и накладные расходы на подбор."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakexperienceorbmerge.field.maxexperienceperorb]
impact = "Более высокие значения допускают более крупные всплески до включения контроля; более низкие значения ограничивают пики раньше."
summary = "Максимальное допустимое значение «опыт» на сферу в «Слияние сфер опыта»."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakexperienceorbmerge.field.maxnearbyorbspermerge]
impact = "Более высокие значения допускают более крупные всплески до включения контроля; более низкие значения ограничивают пики раньше."
summary = "Максимальное число ближайших сфер опыта за одно слияние в «Слиянии сфер опыта»."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakexperienceorbmerge.field.mergeradius]
impact = "Более высокие значения расширяют область поиска и требуют больше работы; более низкие значения сужают область и работают дешевле."
summary = "Радиус слияния для «Слияние сфер опыта» (в блоках)."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastcolumns]
description = "Конфигурация оптимизации «Быстрые колонны». Сворачивает колонны растений в цепных обновлениях, чтобы уменьшить повторяющуюся физическую нагрузку на каждый блок."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastdrops]
description = "Конфигурация оптимизации «Быстрые выпадения предметов». Направляет выпавшие предметы и опыт сразу игрокам, чтобы уменьшить накопление предметов на земле и нагрузку подбора."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastdrops.field.allowcontainerdrops]
impact = "Включите, чтобы разрешить это поведение; отключите, чтобы блокировать или ограничивать этот путь."
summary = "Разрешает выпадение содержимого контейнеров в «Быстрые выпадения предметов»."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastdrops.field.teleportblockdrops]
impact = "Включите, чтобы применять это поведение; отключите, чтобы этот путь оставался неактивным."
summary = "Определяет, применяется ли «телепортация выпадения блоков» в «Быстрые выпадения предметов»."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastdrops.field.teleportblockxp]
impact = "Включите, чтобы применять это поведение; отключите, чтобы этот путь оставался неактивным."
summary = "Определяет, применяется ли «телепортация опыта блоков» в «Быстрые выпадения предметов»."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastdrops.field.teleportentitydrops]
impact = "Включите, чтобы применять это поведение; отключите, чтобы этот путь оставался неактивным."
summary = "Определяет, применяется ли «телепортация выпадения сущностей» в «Быстрые выпадения предметов»."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastdrops.field.teleportentityxp]
impact = "Включите, чтобы применять это поведение; отключите, чтобы этот путь оставался неактивным."
summary = "Определяет, применяется ли «телепортация опыта сущностей» в «Быстрые выпадения предметов»."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastentityincineration]
description = "Конфигурация оптимизации «Быстрое сжигание сущностей». Удаляет горящих монстров по заданным правилам близости, чтобы сократить затраты на тики затянувшегося огня."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastentityincineration.field.incinerationbeyondnearestplayer]
impact = "Более высокие значения позволяют проводить очистку дальше от игроков; более низкие – держать очистку ближе к активным игрокам."
summary = "Расстояние от игроков, с которого быстрое сжигание сущностей начинает действовать (в блоках)."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfallingblocks]
description = "Конфигурация оптимизации «Быстро падающие блоки». Ускоряет долгоживущие сущности падающих блоков, когда обработка падения начинает создавать заметную нагрузку на тики."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfallingblocks.field.maxfallms]
impact = "Более высокие значения допускают больший объём работы до вмешательства; более низкие значения делают меры смягчения более агрессивными."
summary = "Максимальное время падения в миллисекундах, допустимое для быстро падающих блоков."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfire]
description = "Конфигурация оптимизации «Быстрый огонь». Заменяет обновления распространения и выгорания огня быстрыми операциями мира, чтобы снизить накладные расходы физики огня."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids]
description = "Конфигурация оптимизации «Быстрые жидкости». Ускоренно прокручивает цепочки растекания воды и лавы в ограниченные пакетные обновления, чтобы уменьшить повторяющуюся пошаговую нагрузку жидкостей."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids.field.acceleratedrain]
impact = "Включите, чтобы ускорять отступление и опустошение жидкости рядом с обновлениями потока; отключите, чтобы ускорять только прямые тики потока."
summary = "Определяет, применяется ли «ускорение стока вокруг активных событий потока» в «Быстрые жидкости»."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids.field.acceleratelava]
impact = "Включите, чтобы ускорять цепочки потока лавы; отключите, чтобы лава оставалась с ванильным таймингом."
summary = "Определяет, применяется ли «ускорение лавы» в «Быстрые жидкости»."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids.field.acceleratewater]
impact = "Включите, чтобы ускорять цепочки потока воды; отключите, чтобы вода оставалась с ванильным таймингом."
summary = "Определяет, применяется ли «ускорение воды» в «Быстрые жидкости»."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids.field.extravanillaticksperevent]
impact = "Более высокие значения сжимают больше обновлений жидкости в меньшее число тиков сервера, но могут увеличить работу с жидкостью за тик."
summary = "Дополнительные ванильные тики жидкости, ставящиеся в очередь на каждое событие потока в «Быстрые жидкости»."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids.field.maxburstticksperlocationperservertick]
impact = "Более высокие значения быстрее сворачивают цепочки жидкости в один тик для каждой позиции; более низкие значения равномернее распределяют работу по тикам."
summary = "Максимальное число дополнительных тиков жидкости в очереди, расходуемых для одной позиции блока за один сброс тика сервера."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids.field.maxextravanillaticksperservertick]
impact = "Более высокие значения допускают более сильные всплески ускорения; более низкие значения агрессивнее ограничивают стоимость всплесков жидкости."
summary = "Максимальное число дополнительных ванильных тиков жидкости за тик сервера в «Быстрые жидкости»."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastsnow]
description = "Конфигурация оптимизации «Быстрый снег». Заменяет обновления образования и таяния снега быстрыми операциями мира, чтобы уменьшить нагрузку от погодных блоков."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex]
description = "Заранее обрабатывает воронки с помощью пространственного индекса предметов, чтобы обойти ванильную проверку сущностей AABB на каждый тик. Переходит на ванильное поведение, если любой необходимый мост NMS недоступен."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.idlestretch]
impact = "Включите, чтобы снизить затраты тика простаивающих воронок на серверах с большим числом воронок; подбор предметов через быстрый путь индекса остаётся мгновенным."
summary = "Растягивает перезарядку передачи пустых простаивающих воронок, пока сервер под нагрузкой, чтобы ваниль пропускала их повторный опрос."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.idlestretchmintickms]
impact = "Более низкие значения раньше растягивают простаивающие воронки; более высокие значения оставляют это для более высокой нагрузки."
summary = "Среднее время тика в миллисекундах, необходимое для включения растягивания простаивающих воронок."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.idlestretchspreadpasses]
impact = "Более высокие значения реже опрашивают каждую воронку (дешевле, но растягивание медленнее); более низкие значения раньше растягивают простаивающие воронки."
summary = "Число проходов тиков, по которым распределяется опрос каждой простаивающей воронки."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.idlestretchticks]
impact = "Более высокие значения пропускают больше работы простаивающих воронок, но дольше задерживают возобновление передачи."
summary = "Перезарядка в тиках для пустых простаивающих воронок; ограничивает наихудшую задержку до возобновления забора из контейнера простаивающей воронкой."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.itemchunkbudgetpertick]
summary = "Максимум чанков с предметами, проверяемых во всех мирах за тик."
impact = "Большие значения быстрее перепроверяют индексированные чанки, но могут запланировать больше работы регионов; диапазон ограничен 1–4096."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperlimit]
description = "Конфигурация оптимизации «Лимит воронок». Отменяет передачи воронок, когда нагрузка по временному охвату событий воронок превышает заданный порог."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperlimit.field.maxhoppereventspan]
impact = "Более высокие значения допускают больший объём работы до вмешательства; более низкие значения делают меры смягчения более агрессивными."
summary = "Максимальный временной охват событий воронок, допускаемый ограничителем воронок."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator]
description = "Конфигурация оптимизации «Ускоритель исчезновения предметов». Подталкивает подходящие выброшенные предметы к исчезновению, когда поблизости нет игроков."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.field.ignorenameditems]
impact = "Включите, чтобы исключать подходящие случаи; отключите, чтобы включать их в применение."
summary = "Пропускает именованные предметы при оценке целей в «Ускоритель исчезновения предметов»."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.field.ignorevaluables]
impact = "Включите, чтобы исключать подходящие случаи; отключите, чтобы включать их в применение."
summary = "Пропускает ценные предметы при оценке целей в «Ускоритель исчезновения предметов»."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.field.noplayerradius]
impact = "Более высокие значения расширяют область поиска и требуют больше работы; более низкие значения сужают область и работают дешевле."
summary = "Радиус без игроков для «Ускоритель исчезновения предметов» (в блоках)."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.field.targettickslived]
