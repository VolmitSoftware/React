"config.documentation.annotation.art.arcane.react.content.feature.featurepathfinderbudget.description" = "Конфигурация для функции бюджета Pathfinder. Уменьшает бюджет A*-узла толпы от игроков, пока сервер находится под нагрузкой, что делает поиск по каждому пути дешевле, не меняя места, куда пытаются пойти толпы. Бюджеты восстанавливаются, когда толпа приближается к игрокам, когда сервер восстанавливается или при деактивации. Не удалось закрыть ванильную тропинку, если NMS Навигационные мосты не доступны."
