[config.documentation.annotation.art.arcane.react.content.feature.featurehopperchaincoalescing]
description = "Конфигурация функции «Слияние цепочек воронок». Обнаруживает линейные цепочки воронок и сообщает прогнозируемую экономию тиков. По умолчанию работает только в режиме измерения; в режиме действия с версионным перехватчиком воронок подходящие промежуточные тики пропускаются, а один перенос от головы к хвосту синтезируется. Синтезированные переносы согласуются с ограничением FeatureHopperTokenBucket вместо прямой отмены InventoryMoveItemEvent."

