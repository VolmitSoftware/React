"config.documentation.annotation.art.arcane.react.content.feature.featurehopperchaincoalescing.description" = "Конфигурация для функции воронка Chain Coalescing. Открывает линейные цепи N воронки, питающиеся в одном направлении и прогнозирует, сколько тики-передач на воронка может рухнуть в одну ложку за лоскут на лоскут по тик. Оперирует только в режиме измерения: обнаружение цепочки плюс тики-защищенный проект через сборщик метрик-цепку. Отмена промежуточных отправлений InventoryMoveItemEvent столкнутся с заказом потребления ведра FeatureHopperTokenBucket, поэтому фактический пакетный ход откладывается на специальный NMS-мост."
"config.documentation.annotation.art.arcane.react.content.feature.featurehopperchaincoalescing.field.bypassradius.impact" = "Более высокие значения защищают более широкую зону вокруг игроков; более низкие значения считают цепочки ближе к игрокам."
"config.documentation.annotation.art.arcane.react.content.feature.featurehopperchaincoalescing.field.bypassradius.summary" = "Обходной радиус вокруг игроков в блоках; цепи, касающиеся этого радиуса, пропускают коалесцирующий учет."
