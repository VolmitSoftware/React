summary = "Расстояние от игрока (в блоках) до центрального столбца чанка, на котором применяется его ожидающая перемотка. Активность чанка определяется дистанцией симуляции мира."

[config.documentation.annotation.art.arcane.react.content.feature.featurecropfastforward.field.engageonincident]
impact = "Более высокие значения сохраняют ускоренную перемотку во время лёгких инцидентов; более низкие значения отключают её раньше."
summary = "Оценка инцидента, выше которой ускоренная перемотка перестаёт включаться. Эта функция молчит во время инцидентов с высокой нагрузкой (противоположная полярность по сравнению с большинством функций React)."

[config.documentation.annotation.art.arcane.react.content.feature.featurecropfastforward.field.engageontickms]
impact = "Более высокие значения сохраняют ускоренную перемотку при более высокой нагрузке; более низкие значения отключают её раньше."
summary = "Время тика, выше которого ускоренная перемотка перестаёт включаться (миллисекунды). Не работает под нагрузкой."

[config.documentation.annotation.art.arcane.react.content.feature.featurecropfastforward.field.maxadvancesperpass]
