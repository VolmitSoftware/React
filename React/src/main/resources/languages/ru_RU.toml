[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.updatenotifications]
summary = "Проверяет обновления React в релизах GitHub."
impact = "По умолчанию включено. VolmLib объединяет обновления в одном уведомлении при входе и отчёте /volmit plugins updates. Отключение останавливает проверки React."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.minimumincidentscore]
summary = "Оценка инцидента, необходимая для продолжения мер по снижению нагрузки."
impact = "Сценарий продолжается при достижении этой оценки или minimumTickMS."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.minimumtickms]
summary = "Средняя длительность тика в миллисекундах, необходимая для продолжения мер."
impact = "Сценарий останавливается, когда оба показателя нагрузки опускаются ниже своих порогов."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.minimumentitiesperchunk]
summary = "Количество обнаруженных сущностей в одном чанке, необходимое перед их сокращением."
impact = "Более высокие значения ограничивают сокращение более плотными скоплениями сущностей."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.recheckdelayms]
summary = "Интервал наблюдения после завершения дочернего действия в миллисекундах; минимум 1000."
impact = "Позволяет обновить метрики перед выбором следующей меры."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.childtimeoutms]
summary = "Максимальная длительность одного этапа в миллисекундах; минимум 1000."
impact = "Превышение времени дочернего действия завершает сценарий с ошибкой и останавливает дальнейшую эскалацию."

[config.documentation.annotation.art.arcane.react.content.action.actiontrimentitiesbyagepriority_params.field.minimumentitiesperchunk]
summary = "Минимальное количество обнаруженных сущностей в чанке перед сокращением; ноль включает все наблюдаемые чанки."
impact = "Положительное значение ограничивает сокращение плотно заполненными чанками."

[action.capture_profile]
completed = "Локальный профиль ({count}) сохранён в {path}"

[config.documentation.annotation.art.arcane.react.content.action.actioncaptureprofile]
description = "По запросу записывает локальный профиль JDK Flight Recorder с событиями выполнения, выделения памяти и GC. Хранит три записи; никогда их не отправляет."

[config.documentation.annotation.art.arcane.react.content.action.actioncaptureprofile_params.field.seconds]
summary = "Длительность профиля в секундах, ограниченная диапазоном 1–300."
impact = "Более долгие записи охватывают больше событий; JFR хранит до 64 MiB последних данных."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.playerchunkbudgetenabled]
summary = "Включает бюджеты чанков игроков для каждого мира; пересечения учитываются один раз."
impact = "По умолчанию выключено. Бюджеты могут уменьшать текущие целевые дистанции; восстановление происходит постепенно."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.playertickingchunkbudget]
summary = "Максимальное расчётное число симулируемых для игроков чанков на мир; минимум 1."
impact = "Пересекающиеся области симуляции учитываются один раз. Если бюджет недостижим, заданные минимальные дистанции имеют приоритет."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.playerviewonlychunkbudget]
summary = "Максимальное расчётное число только видимых чанков на мир; минимум 1."
impact = "Учитывает область видимости вне симуляции. Оценивает потребность игроков, а не загруженные чанки или билеты плагинов."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.budgetrecoverychecks]
summary = "Число последовательных благополучных проверок бюджета перед увеличением дистанции; минимум 1."
impact = "Интервал проверок задаёт updateCooldownSeconds. Отсутствие телеметрии тиков или неготовый индекс игроков сбрасывают восстановление."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.budgetrecoverystep]
summary = "Максимальное увеличение дистанции после восстановления бюджета, в чанках; ограничено диапазоном 1–32."
impact = "Малые шаги ограничивают всплески загрузки при восстановлении. Применяется только при включённых бюджетах чанков игроков."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller]
description = "Измеряет показатели в позициях игроков Folia и, при включении, ограниченный набор событий JDK Flight Recorder. JFR записывает суммарный трафик протокола, этапы генерации чанков, операции хранилища и ожидания сверх заданного порога."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller.field.regionalenabled]
summary = "Включает измерение TPS регионов Folia в позициях игроков."
impact = "Раз в секунду опрашивает ограниченную, сменяемую группу сохранённых в кэше позиций игроков без загрузки чанков."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller.field.playeranchorsperrefresh]
summary = "Максимальное число позиций игроков, опрашиваемых за секунду, ограничено диапазоном от 1 до 512. Наблюдения устаревают через пять секунд."
impact = "Большие значения охватывают больше игроков, но требуют больше запросов TPS регионов."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller.field.jfrenabled]
summary = "Включает выборочную телеметрию JFR. По умолчанию отключена. Публикуемые сводки не содержат адресов, путей к файлам и трассировок стека."
impact = "Добавляет работу по записи JFR с пределами хранения 30 секунд и 64 MiB. Сводные ряды обнуляются каждую секунду."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller.field.jfrslowthresholdms]
summary = "Минимальная длительность событий файлового ввода-вывода JVM, входа в монитор, ожидания монитора и парковки потоков в миллисекундах, ограничена диапазоном от 1 до 1000. Для этапов генерации чанков порог длительности не применяется."
impact = "Меньшие пороги создают больше событий JVM. Эти метрики описывают только события, достигшие данного порога."
