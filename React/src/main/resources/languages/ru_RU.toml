summary = "Коэффициент масштабирования диапазона активации рейдеров в активном режиме."

[config.documentation.annotation.art.arcane.react.content.feature.featureactivationrangegovernor.field.releaseticktimems]
impact = "Более низкие значения дольше удерживают снижение для стабильности; более высокие значения быстрее восстанавливают полные диапазоны."
