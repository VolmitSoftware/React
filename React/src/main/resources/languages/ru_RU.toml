"config.documentation.annotation.art.arcane.react.content.feature.featureexplosionpacketbatching.description" = "Конфигурация для пакетной установки Explosion Packet Batching. Собирает одинаковые-тик Взрывы в мире, кластеризуя их mergeRadius, и измеряет, сколько раздельно ClientboundExplodePackets будет сливаться в один объединенный пакет на кластер. Отчеты прогнозируют снижение взрыва до пакета в качестве метрики времени выполнения; обходит кластеры, любой взрыв которых находится внутри. bypassRadius Игрок, поэтому ближайшие наблюдатели видят ванильную анимацию / звуковую верность. В качестве измерения только в ожидании Folia-безопасный синтезированный взрывной пакет NMS мост."
"config.documentation.annotation.art.arcane.react.content.feature.featureexplosionpacketbatching.field.bypassradius.impact" = "Более высокие значения сохраняют более близкую точность анимации; более низкие значения позволяют подбору ставок приближаться к игрокам."
"config.documentation.annotation.art.arcane.react.content.feature.featureexplosionpacketbatching.field.bypassradius.summary" = "Обходной радиус в блоках вокруг любого кластерного взрыва; если какой-либо игрок находится на этом расстоянии, кластер сохраняет ванильное поверх взрывного пакета."
"config.documentation.annotation.art.arcane.react.content.feature.featureexplosionpacketbatching.field.engageincidentscore.impact" = "Более низкие значения участвуют во время более легких инцидентов; более высокие значения резервируют его для серьезных инцидентов."
"config.documentation.annotation.art.arcane.react.content.feature.featureexplosionpacketbatching.field.engageincidentscore.summary" = "Показатель происшествий (0-100) требуется до того, как включится пакетная партия взрывчатки."
"config.documentation.annotation.art.arcane.react.content.feature.featureexplosionpacketbatching.field.engageticktimems.impact" = "Более низкие значения включаются раньше; более высокие значения резервируют партию для более тяжелой нагрузки."
"config.documentation.annotation.art.arcane.react.content.feature.featureexplosionpacketbatching.field.engageticktimems.summary" = "Средние миллисекундные тик, необходимые перед началом взрывного заряда пакетов."
"config.documentation.annotation.art.arcane.react.content.feature.featureexplosionpacketbatching.field.maxbufferedperworld.impact" = "Высшие значения захватывают большие взрывы в одном и том же тик при более высокой стоимости памяти; низкие значения ограничивают память."
"config.documentation.annotation.art.arcane.react.content.feature.featureexplosionpacketbatching.field.maxbufferedperworld.summary" = "Максимально ожидающие взрывы буферизованы в мире до оценки смывов на ранней стадии."
"config.documentation.annotation.art.arcane.react.content.feature.featureexplosionpacketbatching.field.mergedbroadcastrangeblocks.impact" = "Более высокие значения достигают более отдаленных наблюдателей с объединенным пакетом; более низкие значения сокращают количество вентиляции пакетов."
"config.documentation.annotation.art.arcane.react.content.feature.featureexplosionpacketbatching.field.mergedbroadcastrangeblocks.summary" = "Диапазон в блоках для объединенного взрыва передачи отправленной в конце тик."
"config.documentation.annotation.art.arcane.react.content.feature.featureexplosionpacketbatching.field.mergeradius.impact" = "Более высокие значения упаковывают больше взрывов в один пакет (большие сокращения, более нечеткий центр); более низкие значения удерживают кластеры плотно."
