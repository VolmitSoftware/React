[config.documentation.annotation.art.arcane.react.content.feature.featurecropfastforward]
description = "Настройки функции Crop Fast Forward. Сервер выращивает посевы только в чанках в пределах дистанции симуляции игрока, поэтому эта функция записывает, сколько времени каждый загруженный чанк провёл за пределами этой дистанции. Когда игрок возвращается в активный радиус, функция один раз проходит по блокам посевов и саженцев чанка и продвигает их рост на это время, чтобы игроки по возвращении не видели замёрзших ферм. Ожидающий рост отбрасывается при выгрузке чанка. Остаётся неактивной во время инцидентов с высокой нагрузкой."

[config.documentation.annotation.art.arcane.react.content.feature.featurecropfastforward.field.activerange]
