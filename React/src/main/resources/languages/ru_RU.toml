"config.documentation.annotation.art.arcane.react.content.action.actionunknown.description" = "Конфигурация для неизвестного действия. Заполнитель с ограниченными возможностями используется в качестве охранника, когда решение действия не удается."
"config.documentation.annotation.art.arcane.react.content.feature.featureactivationrangegovernor.description" = "Конфигурация для функции Управляющего диапазоном действия. Временно уменьшает диапазон активирования субъектов на мировой основе, пока сервер находится под постоянным давлением, поэтому сам сервер деактивирует удаленные объекты вместо того, чтобы запускать цикл обработки сервера для них. В отличие от ( динамического активационного диапазона, который пробивает и паузует объекты один за другим в ), эти диапазоны читаются сервером каждый тик и применяются ко всем субъектам мгновенно."
"config.documentation.annotation.art.arcane.react.content.feature.featureactivationrangegovernor.field.animalrangefactor.impact" = "Более низкие значения деактивируют удаленных животных раньше во время окон давления."
"config.documentation.annotation.art.arcane.react.content.feature.featureactivationrangegovernor.field.animalrangefactor.summary" = "Масштабный фактор, применяемый к диапазону активации животных во время их участия."
"config.documentation.annotation.art.arcane.react.content.feature.featureactivationrangegovernor.field.engageticktimems.impact" = "Более низкие значения уменьшают диапазон активации раньше; более высокие значения резервируют его для большей нагрузки."
