summary = "Основной интервал оценки для «Бюджет поиска пути» в миллисекундах."

[config.documentation.annotation.art.arcane.react.content.feature.featureperworldtickbudget]
description = "Конфигурация функции «Бюджет тиков по мирам». Измеряет скользящую долю времени тика для каждого мира, применяет гистерезис включения и отпускания и публикует NORMAL/PRESSURE/PANIC для каждого мира. Адаптивный сон сущностей, динамический диапазон активации, обратное давление предметов и бюджет поиска пути используют это состояние при применении поведения нагрузки по мирам."

[config.documentation.annotation.art.arcane.react.content.feature.featureperworldtickbudget.field.budgetms]
