"config.documentation.annotation.art.arcane.react.content.feature.featurecropfastforward.description" = "Конфигурация для функции Crop Fast Forward. Когда чанк переходит от спящего (no близлежащего игрока на длительный период) к активному (player подключен или чанк загружен ), эта функция проходит по посевным и рассадочным блокам один раз и продвигает их рост в соотношении с спящим периодом времени, чтобы игроки не видели замороженные фермы после возвращения. Остается неактивным во время инцидентов высокой нагрузки."
"config.documentation.annotation.art.arcane.react.content.feature.featurecropfastforward.field.activerange.impact" = "Большие значения быстро продвигаются дальше, чем чанки раньше; меньшие значения откладываются до тех пор, пока игроки не приближаются."
"config.documentation.annotation.art.arcane.react.content.feature.featurecropfastforward.field.activerange.summary" = "В пределах этого диапазона, отключенные ресеты отслеживания и любые ожидающие быстрого перехода пожаров."
"config.documentation.annotation.art.arcane.react.content.feature.featurecropfastforward.field.engageonincident.impact" = "Более высокие значения продолжают быстро двигаться вперед во время световых инцидентов; более низкие значения заставляют его замолчать раньше."
"config.documentation.annotation.art.arcane.react.content.feature.featurecropfastforward.field.engageonincident.summary" = "Счет инцидента выше, который быстро переносится перестает вовлекать. Эта функция остается тихой во время инцидентов с высокой нагрузкой (противоположная полярность для большинства случаев. React особенности)."
"config.documentation.annotation.art.arcane.react.content.feature.featurecropfastforward.field.engageontickms.impact" = "Более высокие значения поддерживают быстрый переток вперед во время более тяжелой нагрузки; более низкие значения заставляют его замолчать раньше."
"config.documentation.annotation.art.arcane.react.content.feature.featurecropfastforward.field.engageontickms.summary" = "тик-время, за которым быстрое продвижение прекращает использование (milliseconds)."
