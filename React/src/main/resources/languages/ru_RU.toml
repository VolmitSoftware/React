# React — ru_RU
#
# === Редактирование файла ===
# plugins/React/languages/ru_RU.toml
# Этот файл можно редактировать напрямую. Локальные изменения сохраняются; для отсутствующих или неверных записей используется встроенный английский текст.
# /react language server edit ru_RU
#
# === Префикс ===
# runtime.prefix: Префикс, который React добавляет перед сообщениями чата.
#
# === Форматирование ===
# Сообщения чата поддерживают коды цветов с &: &cТекст&r, &lТекст&r.
# Цвета: &0-&9 и &a-&f.
# Стили: &l жирный, &o курсив, &n подчёркнутый, &m зачёркнутый, &k случайные символы, &r сброс.
# Коды цветов сбрасывают активные стили; указывайте цвет перед стилем, например &3&lТекст&r. &r сбрасывает всё форматирование.
# Цвета RGB задаются как &#RRGGBBТекст&r, например &#55AAFFТекст&r.
# Используйте MiniMessage для градиентов и интерактивных элементов; не смешивайте теги MiniMessage и коды & в одном сообщении. Закрывайте теги в порядке, обратном открытию.
# Соблюдайте правила кавычек и экранирования TOML.
# В строках TOML в кавычках используйте \n для новой строки; {{ и }} выводят обычные фигурные скобки.
# Значения renderer.* и config.documentation.annotation.* содержат обычный текст.
# Значения test.* содержат обычный текст, кроме сообщений test.result.*, которые поддерживают форматирование.
# Используйте переменные в тексте сообщения, вне тегов MiniMessage.
#
# === Переменные ===
# Не меняйте имена переменных и используйте только переменные исходного сообщения.
#   {access}  Роль или права сопряжения React Web
#   {action}  Название действия или направление изменения цвета
#   {actions}  Число действий в очереди или список названий исключённых действий
#   {active}  Число активных функций или настроек оптимизации
#   {actor}  Пользователь веб-интерфейса, внёсший изменение
#   {added}  Вернулась ли функция в реестр активных функций после активации; число сообщений, добавленных обновлением языка
#   {after}  Значение настройки, языковое сообщение или использование кучи после изменения
#   {age}  Возраст данных интеграции в секундах
#   {amount}  Количество выдаваемых предметов
#   {architecture}  Архитектура CPU
#   {argument}  Неожиданный аргумент команды
#   {available}  Число доступных дескрипторов моста NMS
#   {average}  Средний TPS или число миллисекунд на тик
#   {avg_mspt}  Среднее число миллисекунд на тик за проход нагрузочного теста
#   {avg_tps}  Среднее число тиков в секунду за проход нагрузочного теста
#   {bar}  Оформленная шкала баллов теста производительности
#   {before}  Значение настройки, языковое сообщение или использование кучи до изменения
#   {checked}  Число проверенных измерителей
#   {chunks}  Число чанков, затронутых действием
#   {client}  Имя браузера, из которого создано сопряжение React Web
#   {command}  Путь команды
#   {count}  Число записей, модулей, изменений или результатов теста
#   {current}  Номер текущей страницы
#   {delta_heap}  Разница конечного использования кучи между React и базовым замером, в MB
#   {delta_mspt}  Разница среднего времени тика между React и базовым замером, в ms
#   {delta_tps}  Разница среднего TPS между React и базовым замером
#   {detail}  Диагностические сведения о мосте, интеграции, действии или тесте
#   {dimensions}  Обнаруженные размеры сетки стены карт
#   {direction}  Направление поворота оттенка выбранного цвета
#   {distance}  Запрошенная дальность обзора, симуляции или отправки в чанках
#   {duration}  Прошедшее время; в сообщениях о запуске нагрузочного теста — секунды
#   {enabled}  Состояние включения или число включённых модулей
#   {entities}  Число сущностей, затронутых действием
#   {entry}  Запись на временной шкале интеграции
#   {exceptions}  Исключения React, записанные за проход нагрузочного теста
#   {expires}  Когда сопряжение React Web завершится без использования
#   {fail}  Число неудачных проверок
#   {file}  Имя файла настроек, языка или API плагина
#   {fingerprint}  Отпечаток сервера или токена веб-интерфейса
#   {finite}  Число измерителей, возвращающих конечные значения
#   {frames}  Число рамок для предметов в активной стене карт
#   {free}  Свободная физическая или виртуальная память
#   {freed}  Память кучи, освобождённая сборкой мусора
#   {from}  Номер первой записи на текущей странице
#   {grid}  Размеры сетки стены карт
#   {ground_y}  Высота поверхности в тесте гравитации
#   {group}  Группа мониторов, измерителей, карт, настроек или языковых сообщений
#   {growth}  Рост использования кучи во время нагрузочного теста, в MB
#   {health}  Состояние работоспособности интеграции
#   {heap_end}  Использование кучи в конце прохода нагрузочного теста, в MB
#   {heap_start}  Использование кучи в начале прохода нагрузочного теста, в MB
#   {heartbeat}  Время с последнего сигнала активности интеграции
#   {height}  Высота области рисования теста в пикселях
#   {hoppers}  Число нормализованных воронок
#   {id}  Идентификатор дескриптора моста, измерителя, карты, действия, пакета или токена
#   {impact}  Описание влияния настройки
#   {incident}  Идентификатор рекурсивного действия инцидента, исключённого из набора тестов разработчика
#   {index}  Номер текущего шага набора тестов разработчика
#   {invalid}  Число измерителей с некорректными показаниями
#   {item}  Название или идентификатор предмета
#   {items}  Число объединённых сущностей предметов
#   {kept}  Локальные правки, сохранённые при обновлении языка
#   {key}  Ключ параметра команды, ключ настройки или ID языкового сообщения
#   {label}  Метка теста производительности, метрики, настройки, команды или токена веб-интерфейса
#   {lifetime}  Сколько сопряжение React Web действует без использования
#   {line}  Номер редактируемой строки в многострочном сообщении
