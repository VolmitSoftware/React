summary = "엔티티 정리기가 사용하는 플레이어 몹 차단 반경(블록)."

[config.documentation.annotation.art.arcane.react.content.feature.featureentitytrimmer.field.printentitypurgesuccess]
impact = "진단용으로는 활성화하고, 채팅이나 로그 노이즈를 줄이려면 비활성화합니다."
summary = "엔티티 정리기에서 엔티티 정리 성공 출력에 대한 추가 로깅을 활성화합니다."

[config.documentation.annotation.art.arcane.react.content.feature.featureentitytrimmer.field.prioritypercentcutoff]
