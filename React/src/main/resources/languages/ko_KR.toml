# React — ko_KR
#
# === 파일 편집 ===
# plugins/React/languages/ko_KR.toml
# 이 파일을 직접 편집할 수 있습니다. 로컬 변경은 유지되며, 누락되거나 잘못된 항목에는 내장 영어를 사용합니다.
# /react language server edit ko_KR
#
# === 접두사 ===
# runtime.prefix: React가 채팅 메시지 앞에 붙이는 접두사.
#
# === 서식 ===
# 채팅 메시지는 & 색상 코드를 지원합니다: &c텍스트&r, &l텍스트&r.
# 색상: &0-&9 및 &a-&f.
# 스타일: &l 굵게, &o 기울임꼴, &n 밑줄, &m 취소선, &k 난독화, &r 초기화.
# 색상 코드는 적용 중인 스타일을 해제합니다. &3&l텍스트&r처럼 색상을 스타일 앞에 지정하세요. &r은 모든 서식을 초기화합니다.
# RGB 색상에는 &#RRGGBB텍스트&r를 사용합니다. 예: &#55AAFF텍스트&r.
# 고급 효과와 상호작용에는 MiniMessage를 사용하세요. 한 메시지 안에서 MiniMessage 태그와 & 코드를 섞어 쓰지 마세요. 태그는 연 순서의 역순으로 닫으세요.
# TOML의 따옴표와 이스케이프를 올바르게 유지하세요.
# 따옴표로 감싼 TOML 문자열에서 \n으로 줄을 바꿉니다. {{ 및 }}는 중괄호 자체를 표시합니다.
# renderer.* 및 config.documentation.annotation.* 값은 일반 텍스트입니다.
# test.* 값은 일반 텍스트이며, test.result.* 메시지는 서식을 지원합니다.
# 자리 표시자는 MiniMessage 태그 밖의 메시지 본문에 사용하세요.
#
# === 변수 ===
# 변수 이름을 변경하지 말고 각 메시지에 원래 있는 변수만 사용하세요.
#   {action}  작업 이름 또는 색상 조정 방향
#   {actions}  대기 중인 작업 수 또는 제외된 작업 이름 목록
#   {active}  활성 기능 또는 조정 항목 수
#   {actor}  변경한 웹 사용자
#   {added}  활성화 후 기능이 활성 레지스트리에 다시 등록되었는지 여부
#   {after}  변경 후 설정 값, 언어 메시지 또는 힙 사용량
#   {age}  연동 데이터의 경과 시간(초)
#   {amount}  지급할 아이템 수
#   {architecture}  CPU 아키텍처
#   {argument}  예상하지 못한 명령어 인수
#   {available}  사용 가능한 NMS 브리지 핸들 수
#   {average}  평균 TPS 또는 틱당 밀리초
#   {avg_mspt}  부하 테스트 회차의 평균 틱당 밀리초
#   {avg_tps}  부하 테스트 회차의 평균 초당 틱 수
#   {bar}  서식이 적용된 벤치마크 점수 막대
#   {before}  변경 전 설정 값, 언어 메시지 또는 힙 사용량
#   {checked}  검사한 샘플러 수
#   {chunks}  작업의 영향을 받은 청크 수
#   {code}  웹 페어링 코드
#   {command}  명령어 경로
#   {count}  항목, 모듈, 변경 사항 또는 테스트 결과 수
#   {current}  현재 페이지 번호
#   {delta_heap}  종료 시 React와 기준 상태 간 힙 사용량 차이(MB)
#   {delta_mspt}  React와 기준 상태 간 평균 틱 시간 차이(ms)
#   {delta_tps}  React와 기준 상태 간 평균 TPS 차이
#   {detail}  브리지, 연동, 작업 또는 테스트 진단 세부 정보
#   {dimensions}  감지된 지도 벽 격자 크기
#   {direction}  선택한 색상의 색조를 회전할 방향
#   {distance}  요청한 시야·시뮬레이션·전송 거리(청크 단위)
#   {duration}  경과 시간. 부하 테스트 시작 메시지에서는 초 단위
#   {enabled}  활성화 상태 또는 활성화된 모듈 수
#   {entities}  작업의 영향을 받은 개체 수
#   {entry}  연동 타임라인 항목
#   {exceptions}  부하 테스트 회차 중 기록된 React 예외
#   {fail}  실패한 검사 수
#   {file}  설정, 언어 또는 플러그인 API 파일 이름
#   {fingerprint}  서버 또는 웹 토큰 지문
#   {finite}  유한 값을 반환하는 샘플러 수
#   {frames}  활성 지도 벽의 아이템 액자 수
#   {free}  사용 가능한 물리 메모리 또는 가상 메모리
#   {freed}  가비지 컬렉션으로 회수한 힙 메모리
#   {from}  현재 페이지의 첫 항목 번호
#   {grid}  지도 벽 격자 크기
#   {ground_y}  중력 테스트의 지면 높이
#   {group}  모니터, 샘플러, 지도, 설정 또는 언어 메시지 그룹
#   {growth}  부하 테스트 중 힙 증가량(MB)
#   {health}  연동 상태의 정상 여부
#   {heap_end}  부하 테스트 회차 종료 시 힙 사용량(MB)
#   {heap_start}  부하 테스트 회차 시작 시 힙 사용량(MB)
#   {heartbeat}  연동의 마지막 하트비트 이후 경과 시간
#   {height}  테스트 캔버스 높이(픽셀)
#   {hoppers}  정규화한 호퍼 수
#   {id}  브리지 핸들, 샘플러, 지도, 작업, 팩 또는 토큰 식별자
#   {impact}  설정 영향 설명 또는 플러그인 처리 비용(ms/s)
#   {incident}  개발 테스트 모음에서 제외한 재귀적 사고 대응 작업 식별자
#   {index}  개발 테스트 모음의 현재 단계 번호
#   {invalid}  유효하지 않은 측정값을 가진 샘플러 수
#   {issued_at}  웹 토큰 생성 시간
#   {item}  아이템 이름 또는 식별자
#   {items}  병합한 아이템 개체 수
#   {key}  명령어 매개변수 키, 설정 키 또는 언어 메시지 ID
#   {label}  벤치마크, 지표, 설정, 명령어 또는 웹 토큰 레이블
#   {line}  여러 줄 메시지에서 편집 중인 줄 번호
#   {lines}  검색한 서버 로그 줄 수
#   {loaded}  사전 로딩 중 새로 불러온 청크 수
#   {locale}  표시, 선택 또는 편집 중인 언어 코드
#   {matched}  자동 저장 상태가 테스트 기준과 일치하는 월드
#   {max_tick}  부하 테스트에서 관측한 가장 긴 틱 간격(ms)
#   {maximum}  최대 아이템 수, 틱 시간 임계값 또는 편집기 입력 길이
#   {message}  완료된 작업 요약 또는 연동 상태 메시지
#   {metrics}  플러그인 API 팩이 제공하는 지표 수
#   {minecraft}  Minecraft 버전
#   {minimum}  허용되는 최소 TPS
#   {missing}  레지스트리에 없는 필수 샘플러 수
#   {mode}  선택한 게임 모드 또는 능력 모드
#   {model}  CPU 모델
#   {name}  벤치마크, 모듈, 렌더러 또는 테스트 검사 이름
#   {note}  서버 로그를 검색하지 않은 이유
#   {offenders}  유한하지 않은 값을 반환하는 샘플러 수
#   {operations}  분당 능력 콜백 작업 수
#   {options}  허용되는 설정 값
#   {p95}  부하 테스트의 틱 시간 95백분위수(ms)
#   {parameter}  명령어 매개변수 이름
#   {parameters}  무시된 명령어 매개변수
#   {pass}  통과한 검사 수
#   {path}  설정 키 경로 또는 보고서 파일 경로
#   {percent}  색상 조정 비율 또는 플러그인 영향 비중
#   {permission}  필요한 권한 노드
#   {personal}  플레이어가 선택한 언어 코드
#   {phase}  테스트 중인 기능 수명 주기 단계
#   {pixels}  지도 테스트에서 렌더링한 비어 있지 않은 픽셀 수
#   {platform}  운영 체제 또는 Minecraft 서버 플랫폼
#   {players}  부하 테스트의 가상 플레이어 수
#   {plugin}  플러그인 이름
#   {process_load}  서버 프로세스의 CPU 부하
#   {processors}  사용 가능한 CPU 프로세서 수
#   {profile}  React 설정 프로필 이름
#   {protocol}  연동 프로토콜 버전
#   {radius}  지도 또는 개발 테스트 작업의 청크 반경
#   {range}  허용되는 시야·시뮬레이션·전송 거리 범위(청크 단위)
#   {rate}  설정된 작물 성장 가속 비율
#   {rating}  서식이 적용된 벤치마크 등급
#   {react_errors}  서버 로그에서 찾은 React 오류 줄 수
#   {reason}  실패, 거부 또는 사용 불가 상태의 이유
#   {registered}  등록된 모듈 수
#   {removed_first}  첫 비활성화로 기능이 활성 레지스트리에서 제거되었는지 여부
#   {removed_second}  반복 비활성화로 기능이 활성 레지스트리에서 제거되었는지 여부
#   {renderer}  지도 렌더러 이름 또는 식별자
#   {renderers}  식별자가 비어 있는 지도 렌더러 목록
#   {role}  웹 접근 역할: viewer, operator 또는 admin
#   {sampler}  샘플러 이름 또는 식별자
#   {samplers}  연동 샘플러 또는 실패한 샘플러 목록
#   {scope}  지도 범위 또는 거리 설정 범위
#   {score}  벤치마크 점수
#   {seconds}  카운트다운 또는 부하 테스트 시간(초)
#   {section}  설정 또는 언어 편집기 섹션
#   {server}  Minecraft 서버 구현체와 버전
#   {shown}  현재 표시되는 행 수
#   {since_run}  현재 테스트 시작 이후 보고된 오류
#   {size}  지도 벽의 최대 크기 또는 사용 중인 크기
#   {skip}  건너뛴 검사 수
#   {spawn_y}  중력 테스트 블록이 생성된 높이
#   {state}  작업 또는 플러그인 API 팩 상태
#   {status}  연동 상태 또는 설정 상태 레이블
#   {subject}  설정 도움말에서 설명하는 모듈 또는 설정
#   {subsystem}  테스트 하위 시스템 이름
#   {summary}  작업 감사 요약
#   {system_load}  전체 시스템의 CPU 부하
#   {target}  작업 대상 월드, 플레이어, 플러그인, 설정 또는 플러그인 그룹
#   {threading}  서버 스레딩 모드
#   {tick}  멈춤 임계값을 초과한 틱 시간(ms)
#   {tick_crashes}  서버 로그에서 찾은 틱 크래시 줄 수
#   {tier}  사고 대응 절차의 심각도 단계
#   {timing}  분당 능력 콜백 시간(밀리초)
#   {to}  현재 페이지의 마지막 항목 번호
#   {total}  메시지의 전체 항목, 모듈, 월드, 검사 수 또는 메모리 양
#   {type}  명령어 매개변수, 설정 값, 지도 또는 거리 유형
#   {unavailable}  사용할 수 없는 NMS 브리지 핸들 수
#   {unit}  원형 차트 합계의 단위 레이블
#   {unknown}  개발 테스트 모음에서 제외한 알 수 없는 작업 식별자
#   {unreadable}  읽을 수 없었던 샘플러 수
#   {uptime}  호스트 운영 체제 가동 시간
#   {url}  업로드한 진단 보고서 URL
#   {usage}  명령어 사용 구문
#   {used}  사용 중인 물리 메모리, 가상 메모리 또는 힙
#   {value}  서식이 적용된 설정, 측정값 또는 하드웨어 세부 정보
#   {values}  개발 테스트 모음 보고서에 나열된 샘플 값
#   {variables}  편집 중인 메시지에서 허용하는 자리 표시자 이름
#   {vendor}  Java 공급업체
#   {verdict}  전체 테스트 판정
#   {version}  React, Java 또는 플랫폼 버전
#   {warmed}  사전 로딩한 청크 수
#   {warn}  경고가 있는 검사 수
#   {width}  테스트 캔버스 너비(픽셀)
#   {world}  Minecraft 월드 이름

