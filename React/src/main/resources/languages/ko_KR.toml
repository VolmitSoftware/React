[config.documentation.annotation.art.arcane.react.content.feature.featurehopperchaincoalescing]
description = "Hopper Chain Coalescing 기능 설정입니다. 같은 방향으로 아이템을 보내는 N개의 호퍼로 이루어진 직선 체인을 감지하고, 호퍼별 전송 틱 중 몇 개를 체인당 매 틱 한 번의 머리-꼬리 일괄 가져오기로 합칠 수 있는지 추정합니다. 측정 전용 모드로 동작하며, 체인 감지와 예상 절약 틱 수를 체인 병합 메트릭 샘플러로 제공합니다. 중간 InventoryMoveItemEvent 디스패치를 취소하면 FeatureHopperTokenBucket 의 토큰 버킷 소비 순서와 충돌하므로 실제 일괄 이동은 전용 NMS 브리지에서 처리하도록 보류됩니다."

