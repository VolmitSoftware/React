[config.documentation.annotation.art.arcane.react.content.feature.featureexplosionpacketbatching]
description = "폭발 패킷 일괄 처리 기능 설정. 부하 조건이 충족될 때 평가 플러시 사이의 폭발을 수집하고, mergeRadius로 묶은 뒤 제거된 ClientboundExplodePackets 수를 보고합니다. 버전별 폭발 훅을 사용할 수 있으면 바닐라 패킷이 가로채진 후보는 병합된 패킷 하나로 전송하고, 그렇지 않으면 이 기능은 측정 전용으로 유지됩니다. 플레이어의 bypassRadius 안에서 발생한 폭발은 애니메이션과 사운드 품질을 위해 바닐라 패킷을 유지합니다."

[config.documentation.annotation.art.arcane.react.content.feature.featureexplosionpacketbatching.field.bypassradius]
impact = "값이 높을수록 주변 애니메이션 품질을 더 많이 유지하고, 낮을수록 일괄 처리가 플레이어에게 더 가까이 적용됩니다."
summary = "클러스터된 폭발 주변의 우회 반경(블록). 이 거리 안에 플레이어가 있으면 해당 클러스터는 폭발별 바닐라 패킷 전송을 유지합니다."

[config.documentation.annotation.art.arcane.react.content.feature.featureexplosionpacketbatching.field.engageincidentscore]
impact = "값이 낮을수록 가벼운 사건에서도 개입하고, 높을수록 심각한 사건에만 개입합니다."
summary = "폭발 패킷 일괄 처리가 시작되기 전에 필요한 사고 점수(0-100)."

[config.documentation.annotation.art.arcane.react.content.feature.featureexplosionpacketbatching.field.engageticktimems]
impact = "값이 낮을수록 더 일찍 개입하고, 높을수록 일괄 처리를 더 큰 부하에만 사용합니다."
summary = "폭발 패킷 일괄 처리가 시작되기 전에 필요한 평균 틱 밀리초."

[config.documentation.annotation.art.arcane.react.content.feature.featureexplosionpacketbatching.field.maxbufferedperworld]
