# React — it_IT
#
# === Modifica del file ===
# plugins/React/languages/it_IT.toml
# Puoi modificare direttamente questo file. Le modifiche locali vengono conservate; le voci mancanti o non valide usano l’inglese incorporato.
# /react language server edit it_IT
#
# === Prefisso ===
# runtime.prefix: Prefisso aggiunto da React prima dei messaggi di chat.
#
# === Formattazione ===
# I messaggi di chat supportano i codici colore con &: &cTesto&r, &lTesto&r.
# Colori: &0-&9 e &a-&f.
# Stili: &l grassetto, &o corsivo, &n sottolineato, &m barrato, &k caratteri offuscati, &r ripristino.
# I codici colore cancellano gli stili attivi; scrivi il colore prima dello stile, come in &3&lTesto&r. &r ripristina tutta la formattazione.
# I colori RGB usano &#RRGGBBTesto&r, ad esempio &#55AAFFTesto&r.
# Usa MiniMessage per sfumature e interazioni; non mescolare tag MiniMessage e codici & nello stesso messaggio. Chiudi i tag in ordine inverso rispetto all'apertura.
# Mantieni valide le virgolette e le sequenze di escape TOML.
# Usa \n nelle stringhe TOML tra virgolette per andare a capo; {{ e }} mostrano parentesi graffe letterali.
# I valori di renderer.* e config.documentation.annotation.* sono testo semplice.
# I valori di test.* sono testo semplice, tranne i messaggi di test.result.*, che supportano la formattazione.
# Usa le variabili nel testo del messaggio, fuori dai tag MiniMessage.
#
# === Variabili ===
# Mantieni i nomi delle variabili e usa solo quelle previste dal singolo messaggio.
#   {action}  Nome dell'azione o direzione della regolazione del colore
#   {actions}  Numero di azioni in coda o elenco dei nomi delle azioni escluse
#   {active}  Numero di funzionalità o ottimizzazioni attive
#   {actor}  Utente web che ha apportato una modifica
#   {added}  Indica se una funzionalità è rientrata nel registro attivo oppure messaggi aggiunti da un aggiornamento della lingua
#   {after}  Valore di configurazione, messaggio di lingua o utilizzo dell'heap dopo una modifica
#   {age}  Età dei dati di integrazione in secondi
#   {amount}  Numero di oggetti da dare
#   {architecture}  Architettura della CPU
#   {argument}  Argomento di comando imprevisto
#   {available}  Numero di riferimenti disponibili del bridge NMS
#   {average}  TPS medi o millisecondi medi per tick
#   {avg_mspt}  Millisecondi medi per tick durante un ciclo del test di carico
#   {avg_tps}  Tick medi al secondo durante un ciclo del test di carico
#   {bar}  Barra formattata del punteggio del benchmark
#   {before}  Valore di configurazione, messaggio di lingua o utilizzo dell'heap prima di una modifica
#   {checked}  Numero di campionatori controllati
#   {chunks}  Numero di chunk interessati da un'azione
#   {code}  Codice di associazione web
#   {command}  Percorso del comando
#   {count}  Numero di voci, moduli, modifiche o risultati dei test
#   {current}  Numero della pagina corrente
#   {delta_heap}  Differenza nell'utilizzo finale dell'heap tra React e il riferimento, in MB
#   {delta_mspt}  Differenza nel tempo medio dei tick tra React e il riferimento, in ms
#   {delta_tps}  Differenza nei TPS medi tra React e il riferimento
#   {detail}  Dettagli diagnostici del bridge, dell'integrazione, dell'azione o del test
#   {dimensions}  Dimensioni rilevate della griglia della parete di mappe
#   {direction}  Direzione di rotazione della tonalità del colore selezionato
#   {distance}  Distanza di visualizzazione, simulazione o invio richiesta, in chunk
#   {duration}  Tempo trascorso; i messaggi di avvio dei test di carico usano i secondi
#   {enabled}  Stato di attivazione o numero di moduli attivati
#   {entities}  Numero di entità interessate da un'azione
#   {entry}  Voce della cronologia dell'integrazione
#   {exceptions}  Eccezioni di React registrate durante un ciclo del test di carico
#   {fail}  Numero di controlli falliti
#   {file}  Nome del file di configurazione, lingua o API dei plugin
#   {fingerprint}  Impronta del server o del token web
#   {finite}  Numero di campionatori che restituiscono valori finiti
#   {frames}  Numero di cornici nella parete di mappe attiva
#   {free}  Memoria fisica o virtuale libera
#   {freed}  Memoria heap liberata dalla raccolta dei rifiuti
#   {from}  Numero della prima voce nella pagina corrente
#   {grid}  Dimensioni della griglia della parete di mappe
#   {ground_y}  Altezza del terreno per il test di gravità
#   {group}  Gruppo di monitor, campionatori, mappe, configurazione o messaggi di lingua
#   {growth}  Crescita dell'heap durante un test di carico, in MB
#   {health}  Stato di funzionamento dell'integrazione
#   {heap_end}  Utilizzo dell'heap alla fine di un ciclo del test di carico, in MB
#   {heap_start}  Utilizzo dell'heap all'inizio di un ciclo del test di carico, in MB
#   {heartbeat}  Tempo dall'ultimo segnale di attività dell'integrazione
#   {height}  Altezza dell'area di disegno del test in pixel
#   {hoppers}  Numero di tramogge normalizzate
#   {id}  Identificatore del riferimento del bridge, campionatore, mappa, azione, pacchetto o token
#   {impact}  Descrizione dell'effetto della configurazione
#   {incident}  Identificatore dell'azione ricorsiva per incidenti esclusa dai test di sviluppo
#   {index}  Numero del passaggio corrente dei test di sviluppo
#   {invalid}  Numero di campionatori con letture non valide
#   {issued_at}  Data e ora di creazione del token web
#   {item}  Nome o identificatore dell'oggetto
#   {items}  Numero di entità oggetto unite
#   {kept}  Modifiche locali conservate da un aggiornamento della lingua
#   {key}  Chiave del parametro di comando, chiave di configurazione o ID del messaggio di lingua
#   {label}  Etichetta del benchmark, metrica, impostazione, comando o token web
#   {line}  Numero della riga in modifica in un messaggio su più righe
#   {lines}  Numero di righe del registro del server esaminate
#   {loaded}  Numero di chunk caricati per la prima volta durante il precaricamento
#   {locale}  Codice di lingua visualizzato, selezionato o modificato
#   {matched}  Mondi il cui stato di salvataggio automatico corrisponde al riferimento del test
#   {max_tick}  Intervallo massimo osservato tra tick durante un test di carico, in ms
#   {maximum}  Numero massimo di oggetti, soglia del tempo dei tick o lunghezza dell'input dell'editor
#   {message}  Riepilogo dell'azione completata o messaggio di stato dell'integrazione
#   {metrics}  Numero di metriche fornite da un pacchetto API dei plugin
#   {minecraft}  Versione di Minecraft
#   {minimum}  TPS minimi accettabili
#   {missing}  Numero di campionatori necessari mancanti nel registro
#   {mode}  Modalità di gioco o abilità selezionata
#   {model}  Modello della CPU
#   {name}  Nome del benchmark, modulo, renderer o controllo di test
#   {note}  Motivo per cui il registro del server non è stato esaminato
#   {offenders}  Numero di campionatori che restituiscono valori non finiti
#   {options}  Valori di configurazione accettati
#   {p95}  95º percentile del tempo dei tick durante un test di carico, in ms
#   {parameter}  Nome del parametro di comando
#   {parameters}  Parametri di comando ignorati
#   {pass}  Numero di controlli superati
#   {path}  Percorso della chiave di configurazione o del file di rapporto
#   {percent}  Percentuale di regolazione del colore
#   {permission}  Nodo di permesso richiesto
#   {personal}  Codice di lingua selezionato dal giocatore
#   {phase}  Fase del ciclo di vita della funzionalità sottoposta a test
#   {pixels}  Numero di pixel non vuoti disegnati da un test delle mappe
#   {platform}  Sistema operativo o piattaforma del server Minecraft
#   {players}  Numero di giocatori sintetici in un test di carico
#   {plugin}  Nome del plugin
#   {process_load}  Carico della CPU del processo del server
#   {processors}  Numero di processori CPU disponibili
#   {profile}  Nome del profilo di configurazione di React
#   {protocol}  Versione del protocollo di integrazione
#   {radius}  Raggio in chunk per un'azione dei test di sviluppo
#   {range}  Intervallo consentito della distanza di visualizzazione, simulazione o invio, in chunk
#   {rate}  Velocità configurata di avanzamento rapido delle colture
#   {rating}  Valutazione formattata del benchmark
#   {react_errors}  Numero di righe di errore di React trovate nel registro del server
#   {reason}  Spiegazione del fallimento, rifiuto o stato non disponibile
#   {registered}  Numero di moduli registrati
#   {remaining}  Tempo rimanente prima del prossimo controllo delle lingue
#   {removed_first}  Indica se la prima disattivazione ha rimosso una funzionalità dal registro attivo
#   {removed_second}  Indica se una disattivazione ripetuta ha rimosso una funzionalità dal registro attivo
#   {renderer}  Nome o identificatore del renderer delle mappe
#   {renderers}  Elenco dei renderer delle mappe con identificatori vuoti
#   {role}  Ruolo di accesso web: viewer, operator o admin
#   {sampler}  Nome o identificatore del campionatore
#   {samplers}  Elenco dei campionatori di integrazione o con errori
#   {scope}  Ambito della mappa o dell'impostazione della distanza
#   {score}  Punteggio del benchmark
#   {seconds}  Conto alla rovescia o durata del test di carico in secondi
#   {section}  Sezione della configurazione o dell’editor delle lingue
#   {server}  Implementazione e versione del server Minecraft
#   {shown}  Numero di righe attualmente visualizzate
#   {since_run}  Errori segnalati dall'inizio del test corrente
#   {size}  Dimensioni massime o attive della parete di mappe
#   {skip}  Numero di controlli saltati
#   {spawn_y}  Altezza alla quale è stato generato il blocco del test di gravità
#   {state}  Stato dell'azione o del pacchetto API dei plugin
#   {status}  Etichetta dello stato dell'integrazione o della configurazione
#   {subject}  Modulo o impostazione descritti dalla guida alla configurazione
#   {subsystem}  Nome del sottosistema di test
#   {summary}  Riepilogo della verifica delle azioni
#   {system_load}  Carico della CPU dell'intero sistema
#   {target}  Mondo, giocatore, plugin, impostazione o gruppo di plugin destinatari di un'operazione
#   {threading}  Modalità di gestione dei thread del server
#   {tick}  Durata del tick che ha superato la soglia di blocco, in ms
#   {tick_crashes}  Numero di righe di arresto anomalo dei tick trovate nel registro del server
#   {tier}  Livello di gravità della procedura per incidenti
#   {timing}  Tempo di callback delle abilità in millisecondi al minuto
#   {to}  Numero dell'ultima voce nella pagina corrente
#   {total}  Totale di voci, moduli, mondi, controlli o memoria nel messaggio
#   {type}  Tipo del parametro di comando, valore di configurazione, mappa o distanza
#   {unavailable}  Numero di riferimenti non disponibili del bridge NMS
#   {unit}  Etichetta dell'unità per il totale di un grafico a torta
#   {unknown}  Identificatore dell'azione sconosciuta esclusa dai test di sviluppo
#   {unreadable}  Numero di campionatori che non è stato possibile leggere
#   {updated}  Messaggi modificati da un aggiornamento della lingua
#   {uptime}  Tempo di attività del sistema operativo host
#   {url}  URL del rapporto diagnostico caricato
#   {usage}  Sintassi di utilizzo del comando
#   {used}  Memoria fisica, memoria virtuale o heap utilizzati
#   {value}  Impostazione, misura o dettaglio hardware formattati
#   {values}  Valori campionati elencati in un rapporto dei test di sviluppo
#   {variables}  Nomi dei segnaposto accettati dal messaggio in modifica
#   {vendor}  Fornitore di Java
#   {version}  Versione di React, Java o della piattaforma
#   {warmed}  Numero di chunk precaricati
#   {warn}  Numero di controlli con avvisi
#   {width}  Larghezza dell'area di disegno del test in pixel
#   {world}  Nome del mondo Minecraft

