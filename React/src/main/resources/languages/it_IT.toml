[config.documentation.annotation.art.arcane.react.api.web.webconfiguration]
description = "Configurazione dell’API di gestione HTTP/WebSocket integrata in React. Le modifiche vengono applicate automaticamente al salvataggio di web.toml."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.advertisedurl]
impact = "Imposta l’URL HTTPS di un proxy inverso se il listener è accessibile dall’esterno di localhost. Il listener integrato di React continua a supportare solo HTTP. Le modifiche vengono applicate automaticamente al salvataggio di web.toml."
summary = "URL pubblico di base comunicato ai client API diretti."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.listenaddress]
impact = "L'indirizzo predefinito :: accetta traffico IPv6 e IPv4 mappato per accessi da LAN, container e inoltro delle porte. Usa un indirizzo di loopback solo dietro un proxy inverso o relay sullo stesso host."
summary = "Indirizzo IP a cui si associa il listener web."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.corsorigins]
impact = "Una lista vuota permette tutte le origini. Aggiungi origini specifiche per limitare l'accesso all'origine incrociata."
summary = "Elenco dei permessi CORS le origini per HTTP API."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.listenerenabled]
impact = "React apre l'API autenticata per impostazione predefinita. Imposta false per non aprire alcun listener HTTP o WebSocket."
summary = "Abilita il listener web integrato."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.port]
impact = "Se questa porta è occupata, React prova le 99 porte successive in ordine e usa la porta effettivamente associata per la connessione locale del relay e gli URL diretti generati quando advertisedUrl è vuoto. Il salvataggio di web.toml riavvia automaticamente il listener."
summary = "Porta TCP preferita per il server web."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.relayenabled]
impact = "Quando è vero, React si collega al broker relè a relayUrl così l'app compagno può raggiungere i server dietro NAT senza inoltro di porto."
summary = "Consente al client di ripristino cloud in uscita per NAT traversale."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.relayurl]
impact = "Solo leggere quando relayEnabled è vero. Lasciare vuoto quando il relè è disabilitato."
summary = "Base WSS URL del broker relay, e.g. wss://relay.arcane.art; il /agent il percorso viene allegato automaticamente."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.requiretokenforreads]
impact = "Quando è vero, non autenticato GET le richieste sono respinte con 401. Impostare il falso solo in ambienti di rete completamente affidabili."
summary = "Richiede un token auth valido per sola lettura HTTP - E' un punto di vista."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.wspushhz]
impact = "I valori più elevati aumentano la fedeltà alla spinta, ma anche la rete e CPU - E' una cosa da fare."
summary = "Frequenza di target (Hz) in cui gli aggiornamenti lettore di metriche vengono spinti sulle connessioni WebSocket."

[config.documentation.annotation.art.arcane.react.content.action.actioncollectgarbage]
description = "Configurazione per l'azione di Raccogliere Garbage. Richieste JVM raccolta rifiuti e segnala subito il cumulo di recupero."

[config.documentation.annotation.art.arcane.react.content.action.actioncollectgarbage_params.field.postgcwaitticks]
impact = "I valori più elevati permettono JVM collettori più tempo per stabilirsi; i valori inferiori riferiscono più velocemente ma possono sottovalutare la memoria recuperata."
summary = "tick per aspettare dopo aver richiesto GC prima di raccogliere la memoria delle metriche."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize]
description = "Configurazione per la rete tramoggia Normalizza l'azione. Si rivolge ai hotspot tramoggia, fusione di entità degli elementi e può scaricare idle hot chunk."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.itemmergeradius]
impact = "Valori più elevati ampliano l'area di ricerca e costano più lavoro; valori inferiori portata stretta ed eseguire meno costosi."
summary = "Il raggio di fusione degli elementi utilizzato dalla rete tramoggia normalizza (blocks)."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.maxchunks]
impact = "I valori più elevati permettono un maggiore throughput prima dell'intervento; i valori inferiori rendono la mitigazione più aggressiva."
summary = "Il massimo chunk consentito dalla rete tramoggia si normalizza."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.maxmergeditementitiesperchunk]
impact = "I valori più elevati permettono di scoppiare più grandi prima che il controllo si impegne; i valori inferiori picchi di morsetto prima."
summary = "Le entità di elementi fusi massime consentite per chunk nella rete tramoggia si normalizzano."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.minimumhopperupdatesperchunk]
impact = "I valori più elevati richiedono segnali più forti prima dell'azione; i valori inferiori rendono questa condizione più facile da soddisfare."
summary = "L'aggiornamento minimo di tramoggia per chunk richiesto dalla rete tramoggia si normalizza."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.unloadidlehotchunks]
