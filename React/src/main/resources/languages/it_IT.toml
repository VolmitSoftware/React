[config.documentation.annotation.art.arcane.react.content.feature.featurespawnburstlimiter.field.spawnerbackoffticks]
impact = "Valori più alti tengono inattivi più a lungo gli spawner limitati, riducendo il lavoro dei tentativi di generazione; valori più bassi permettono ai grinder di riprendere prima."
