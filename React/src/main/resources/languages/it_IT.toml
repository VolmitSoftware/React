[config.documentation.annotation.art.arcane.react.content.action.actionprewarmcriticalchunks_params.field.playerchunkradius]
impact = "Valori più alti ampliano l'area di ricerca e richiedono più lavoro; valori più bassi restringono l'ambito e costano meno."
summary = "Raggio dei chunk del giocatore usato da «prewarm critical chunks» (chunk)."

[config.documentation.annotation.art.arcane.react.content.action.actionprewarmcriticalchunks_params.field.touchchunksnapshot]
impact = "Attiva per applicare questo comportamento; disattiva per lasciare inattivo questo percorso."
summary = "Controlla se in «prewarm critical chunks» si applica «toccare l'istantanea del chunk»."

[config.documentation.annotation.art.arcane.react.content.action.actionprewarmcriticalchunks_params.field.world]
