[config.documentation.annotation.art.arcane.react.content.feature.featurefurnacebrewbatching]
description = "Configurazione della funzione Furnace/Brew Batching. Traccia le fornaci e i banchi di pozioni attivi per chunk e misura il numero di tick intermedi che potrebbero essere saltati tra gli eventi di fine combustibile e fine cottura. Riporta il volume di salti previsto come metrica di runtime; esclude ogni blocco entro bypassRadius da un giocatore, così fiamme e fumo restano vivaci vicino ai giocatori."

[config.documentation.annotation.art.arcane.react.content.feature.featurefurnacebrewbatching.field.bypassradius]
impact = "Valori più alti mantengono i forni vicini più numerosi con tick normali; valori più bassi permettono al batching di arrivare più vicino ai giocatori."
summary = "Raggio in blocchi attorno a ogni giocatore entro cui il batching di fornaci e pozioni viene escluso."

[config.documentation.annotation.art.arcane.react.content.feature.featurefurnacebrewbatching.field.engageincidentscore]
impact = "Valori più bassi intervengono anche in incidenti più lievi; valori più alti attendono incidenti gravi."
summary = "Punteggio di incidente (0-100) richiesto prima che il batching di fornaci e pozioni intervenga."

[config.documentation.annotation.art.arcane.react.content.feature.featurefurnacebrewbatching.field.engageticktimems]
impact = "Valori più bassi intervengono prima; valori più alti riservano il batching a un carico maggiore."
summary = "Millisecondi medi per tick necessari prima che il batching di fornaci e pozioni intervenga."

[config.documentation.annotation.art.arcane.react.content.feature.featurefurnacebrewbatching.field.maxtrackedentries]
