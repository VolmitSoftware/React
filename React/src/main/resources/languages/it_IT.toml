[config.documentation.annotation.art.arcane.react.content.feature.featureexplosionpacketbatching]
description = "Configurazione della funzione Explosion Packet Batching. Raccoglie le esplosioni soggette a pressione tra uno svuotamento e l'altro della valutazione, le raggruppa in base a mergeRadius e riporta quanti ClientboundExplodePackets vengono rimossi. Con gli hook di esplosione specifici della versione disponibili, i candidati i cui pacchetti vanilla sono stati intercettati trasmettono un unico pacchetto unito; altrimenti la funzione resta in sola misurazione. Le esplosioni entro bypassRadius da un giocatore mantengono i pacchetti vanilla per la fedeltà di animazione e suono."

[config.documentation.annotation.art.arcane.react.content.feature.featureexplosionpacketbatching.field.bypassradius]
impact = "Valori più alti preservano più fedeltà delle animazioni vicine; valori più bassi permettono al batching di arrivare più vicino ai giocatori."
summary = "Raggio di esclusione in blocchi attorno a ogni esplosione raggruppata; se un giocatore si trova entro questa distanza, il gruppo mantiene il fanout vanilla dei pacchetti per singola esplosione."

[config.documentation.annotation.art.arcane.react.content.feature.featureexplosionpacketbatching.field.engageincidentscore]
impact = "Valori più bassi intervengono anche in incidenti più lievi; valori più alti lo riservano agli incidenti gravi."
summary = "Punteggio di incidente (0-100) richiesto prima che il batching dei pacchetti di esplosione intervenga."

[config.documentation.annotation.art.arcane.react.content.feature.featureexplosionpacketbatching.field.engageticktimems]
