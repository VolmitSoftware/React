summary = "Numero massimo di esplosioni in sospeso messe in buffer per mondo tra una valutazione e l'altra."

[config.documentation.annotation.art.arcane.react.content.feature.featureexplosionpacketbatching.field.mergedbroadcastrangeblocks]
impact = "Valori più alti raggiungono osservatori più lontani con il pacchetto unito; valori più bassi riducono ulteriormente il fanout dei pacchetti."
summary = "Distanza in blocchi per ogni trasmissione conservata di esplosioni unite."

[config.documentation.annotation.art.arcane.react.content.feature.featureexplosionpacketbatching.field.mergeradius]
