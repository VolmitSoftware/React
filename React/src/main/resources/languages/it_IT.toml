[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastdrops.field.teleportentityxp]
impact = "Attivare questo comportamento; disabilitare il mantenimento di tale percorso inattivo."
summary = "Controlli se le gocce veloci applicano l'entità del teletrasporto xp."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastentityincineration]
description = "Configurazione per la modifica Fast Entity Incineration. Rimuove i mostri in fiamme secondo le regole di vicinanza configurate per ridurre il costo del fuoco tick persistente."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastentityincineration.field.incinerationbeyondnearestplayer]
impact = "I valori più elevati permettono la pulizia più lontano dai giocatori; i valori inferiori mantengono la pulizia più vicina ai giocatori attivi."
summary = "La distanza dai giocatori prima dell'incenerimento di entità rapida applica il comportamento di incenerimento (blocchi)."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfallingblocks]
description = "Configurazione per Fast Falling Blocks tweak. Accelera le entità di blocchi di caduta a lunga durata quando il processo di caduta inizia a causare costi tick misurabili."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfallingblocks.field.maxfallms]
impact = "I valori più elevati permettono un maggiore throughput prima dell'intervento; i valori inferiori rendono la mitigazione più aggressiva."
summary = "Massimo calo ms permesso da blocchi di caduta veloci."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfire]
description = "Configurazione per il tweak Fast Fire. Corti di cortocircuito fuoco si diffuse e gli aggiornamenti bruciati in operazioni veloci del mondo per abbassare il fuoco-fisica sopra la testa."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids]
description = "Configurazione per il tweak Fast Fluids. Rapido verso l'acqua e la lava distribuiscono catene in aggiornamenti di scoppio rilegati per ridurre il mandrino del fluido ripetuto per passo."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids.field.acceleratedrain]
impact = "Abilitare l'accelerazione del ritiro dei fluidi e il comportamento vuoto vicino agli aggiornamenti di flusso; disabilitare per accelerare solo tick di flusso diretto."
summary = "Controlla se i fluidi veloci si applicano all'accelerazione drenante intorno agli eventi di flusso attivi."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids.field.acceleratelava]
impact = "Attivare le catene di flusso lavico; disabilitare il lavaggio a tempo di vaniglia."
summary = "Controlla se i fluidi veloci applicano l'accelerazione della lava."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids.field.acceleratewater]
impact = "Attivare le catene di flusso d'acqua; disabilitare l'acqua al momento della vaniglia."
summary = "Controlla se i fluidi veloci applicano l'accelerazione dell'acqua."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids.field.extravanillaticksperevent]
impact = "Valori più alti comprimono gli aggiornamenti di fluido in meno server tick ma possono aumentare il lavoro del fluido per tick."
summary = "Ulteriori file di fluido di vaniglia tick in coda per evento di flusso di fluido nei fluidi veloci."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids.field.maxburstticksperlocationperservertick]
impact = "I valori più alti collassano le catene di fluidi in un tick per ogni posizione; i valori inferiori distribuiscono il lavoro più uniformemente attraverso tick."
summary = "L'tick in coda extra fluido consumato per un blocco durante una singola flush tick del server."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids.field.maxextravanillaticksperservertick]
impact = "I valori più elevati permettono di ottenere forti esplosioni di accelerazione; i valori inferiori della scoppio del liquido del tappo costano più aggressivo."
summary = "Il massimo di tick per fluido extra di vaniglia consentito per server tick nei fluidi veloci."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastsnow]
description = "Configurazione per il tweak Fast Snow. Brevi circuiti forma di neve e sciogliere gli aggiornamenti in operazioni veloci del mondo per ridurre il mandrino antiurto."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex]
description = "Pre-tick tramogge utilizzando un indice di elementi spaziali per la scansione dell'entità AABB per tick del vanilla a circuito corto. Non si chiude alla vaniglia se non è disponibile alcun ponte NMS richiesto."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.idlestretch]
impact = "Consente di ridurre i costi tramoggia tick inattivi sui server pesanti tramoggia; il ritiro degli elementi attraverso l'indice fast-path rimane istantaneo."
summary = "Estende l'tempo di recupero di trasferimento di tramogge vuoti e inatti mentre il server è sotto carico così vanilla salta ri-polling."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.idlestretchmintickms]
impact = "I valori inferiori allungano l'tramogge inattivo prima; i valori superiori lo riservano per carichi più pesanti."
summary = "Millisecondi tick medi necessari prima che si attiva lo stretching tramoggia inattivo."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.idlestretchspreadpasses]
impact = "Valori più alti sondano ogni tramoggia meno spesso ( più economico, più lento per estendere); valori inferiori allungare idle tramogge prima."
summary = "Numero di passaggi tick ogni sonda tramoggia inattivo è diffuso."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.idlestretchticks]
impact = "Valori più alti saltano più lavoro tramoggia inattivo ma ritardano la ripresa del trasferimento per un periodo maggiore."
summary = "tempo di recupero in tick applicato a tramogge vuoto ozio; limita il peggiore ritardo prima che un tramoggia ozio riprenda la tiratura da un container."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.itemchunkbudgetpertick]
summary = "Numero massimo di chunk contenenti oggetti ispezionati in tutti i mondi per tick."
impact = "Valori più alti ricontrollano prima i chunk indicizzati ma possono pianificare più lavoro nelle regioni; i valori sono limitati a 1–4096."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperlimit]
description = "Configurazione del limite delle tramogge. Annulla i trasferimenti quando la pressione della finestra temporale degli eventi delle tramogge supera la soglia configurata."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperlimit.field.maxhoppereventspan]
impact = "I valori più elevati permettono un maggiore throughput prima dell'intervento; i valori inferiori rendono la mitigazione più aggressiva."
summary = "Finestra temporale massima degli eventi delle tramogge consentita dal limite."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator]
description = "Configurazione per l'articolo Disperso Acceleratore tweak. Spinge i giocatori ammessi ha lasciato gli oggetti in arrivo quando non ci sono giocatori nelle vicinanze."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.field.ignorenameditems]
impact = "Abilitare questo per escludere i casi corrispondenti; disabilitarlo per includerli nell'applicazione."
summary = "Salta gli elementi di nome quando l'acceleratore disperato dell'oggetto valuta i bersagli."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.field.ignorevaluables]
impact = "Abilitare questo per escludere i casi corrispondenti; disabilitarlo per includerli nell'applicazione."
summary = "Salta i valori quando l'acceleratore disperato dell'oggetto valuta gli obiettivi."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.field.noplayerradius]
impact = "Valori più elevati ampliano l'area di ricerca e costano più lavoro; valori inferiori portata stretta ed eseguire meno costosi."
summary = "Nessun raggio di giocatore utilizzato da acceleratore disperato (blocchi)."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.field.targettickslived]
impact = "I valori più elevati spingono gli elementi più vicini alla disperazione immediatamente; i valori inferiori mantengono una vita più naturale."
summary = "Valore con tick imposto sugli elementi idonei per accelerare il tempo di scarico della vaniglia."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.field.valuableitems]
impact = "Aggiungi materiali per proteggere più oggetti da sbavature accelerate, o rimuovere i materiali per consentire una pulizia più rapida."
summary = "Elenco dei materiali trattati come oggetti di valore ed esclusi quando `ignoreValuables` è abilitato."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakprojectilelimiter]
description = "Configurazione per proiettile Limiter tweak. Applica caps di scoppio proiettile per giocatore e per chunk per prevenire spikes spam proiettile."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakprojectilelimiter.field.bypasspermission]
impact = "Modificare questo per abbinare il modello di autorizzazione per comportamento bypass."
summary = "String di nodo di autorizzazione verificato prima dell'applicazione del limitatore proiettile."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakprojectilelimiter.field.chunkwindowms]
impact = "Le finestre più lunghe si levigano i colpi ma reagiscono più lentamente; le finestre più corte reagiscono velocemente, ma sono più sensibili."
summary = "L'intervallo di finestra per chunk controlla (millisecondi)."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakprojectilelimiter.field.cleanupintervalms]
impact = "I valori più bassi reagiscono più velocemente ma consumano di più CPU; valori più elevati riducono la testa sopraelevata ma reagiscono in seguito."
summary = "Intervallo di valutazione principale per il limitatore proiettile in millisecondi."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakprojectilelimiter.field.limitchunkprojectiles]
impact = "Attivare questo comportamento; disabilitare il mantenimento di tale percorso inattivo."
summary = "Controlla se limiter proiettile applica limitare chunk proiettili."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakprojectilelimiter.field.limitplayerprojectiles]
impact = "Attivare questo comportamento; disabilitare il mantenimento di tale percorso inattivo."
summary = "Controlla se limiter proiettile applica il lettore limite proiettili."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakprojectilelimiter.field.maxprojectilesperchunkwindow]
impact = "I valori più elevati permettono di scoppiare più grandi prima che il controllo si impegne; i valori inferiori picchi di morsetto prima."
summary = "Il massimo proiettili consentito per ogni finestra chunk nel limitatore proiettile."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakprojectilelimiter.field.maxprojectilesperplayerwindow]
impact = "I valori più elevati permettono di scoppiare più grandi prima che il controllo si impegne; i valori inferiori picchi di morsetto prima."
summary = "Il massimo proiettili consentito per ogni finestra di lettore nel limitatore proiettile."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakprojectilelimiter.field.playerwindowms]
impact = "Le finestre più lunghe si levigano i colpi ma reagiscono più lentamente; le finestre più corte reagiscono velocemente, ma sono più sensibili."
summary = "Lunghezza della finestra di rotolamento per i controlli del giocatore (millisecondi)."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakprojectilelimiter_burstwindow.field.count]
impact = "Stato di runtime primari; React aggiorna automaticamente la valutazione in tempo reale."
summary = "Contatore interno utilizzato dal limitatore proiettile durante il monitoraggio dell'attività di scoppio."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakprojectilelimiter_burstwindow.field.lasthit]
impact = "Primaramente stato runtime; modificare manualmente questo può distorcere tempo di recupero o comportamento di throttling."
summary = "Stampolo temporale interno utilizzato dal limitatore proiettile per tracciare le finestre di tempo e la decomposizione."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakprojectilelimiter_burstwindow.field.start]
impact = "Primaramente stato runtime; modificare manualmente questo può distorcere tempo di recupero o comportamento di throttling."
summary = "Stampolo temporale interno utilizzato dal limitatore proiettile per tracciare le finestre di tempo e la decomposizione."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakprojectilelimiter_chunkkey.field.world]
impact = "Questi dati di identità runtime e devono essere normalmente lasciati agli aggiornamenti automatici."
summary = "Identificatore mondiale utilizzato dal limitatore proiettile tracking interno."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakprojectilelimiter_chunkkey.field.x]
impact = "Questi dati sono interni e non devono essere modificati manualmente."
summary = "Coordinate dell'asse X utilizzate dal limitatore proiettile per il tracciamento interno."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakprojectilelimiter_chunkkey.field.z]
impact = "Questi dati sono interni e non devono essere modificati manualmente."
summary = "Coordinate dell'asse Z utilizzate dal limitatore proiettile per il tracciamento interno."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakserverhibernator]
description = "Configurazione per server hibernator tweak. modalità di invernazione esperimentale del server vuoto che dorme tra tick quando nessun giocatore è online."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakserverhibernator.field.imacloudserverenableme]
impact = "Tenete questo falso a meno che non volete esplicitamente che React dormi tick mentre il server è vuoto."
summary = "Porta di sicurezza per il percorso di ibernazione del server sperimentale."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakserverhibernator.field.secondspertick]
impact = "I valori più elevati rallentano il loop in modo più aggressivo; i valori inferiori mantengono il server più reattivo."
summary = "Secondi di ritardo applicati per tick da server hibernator."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands]
description = "Configurazione per la funzione Shorthands. Aggiunge comandi di scorciatoia operatore che possono essere configurati separatamente senza modificare /reload."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.customcommands]
impact = "Ogni voce abilitata aggiunge dinamicamente un comando. Il comando target applica ancora le proprie autorizzazioni e gli etichette di comandi esistenti sono protetti se non è abilitato overrideExisting."
summary = "I comandi di scorciatoia personalizzati organizzati con l'etichetta del comando. Aggiungi una tabella [customCommands.day] con enabled = true, command = \"time set day\", permission = \"react.shorthands.custom\" e overrideExisting = false. Gli argomenti digitati dopo il comando di scorciatto sono allegati al comando configurato. Metti la parola args all'interno dei supporti nel comando per inserirli altrove."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.give]
impact = "Mentre è abilitato, la scorciatoia possiede il comando /give non qualificato. Il comando vanilla di dati con spazio nominale rimane disponibile."
summary = "Registra /give <item> <amount> con l'accesso alla scheda di elementi Minecraft."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.gmc]
impact = "Disattivare questa opzione se l'/gmc deve rimanere non registrato mentre la funzione Shorthands è attiva."
summary = "Registra /gmc per passare il player che esegue il comando in modalità Creative."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.gms]
impact = "Disattivare questa opzione se l'/gms deve rimanere non registrato mentre la funzione Shorthands è attiva."
summary = "Registra /gms per passare il player che esegue il comando in modalità Survival."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.gmsp]
impact = "Disattivare questa opzione se l'/gmsp deve rimanere non registrato mentre la funzione Shorthands è attiva."
summary = "Registra /gmsp per passare il player che esegue il comando in modalità Spectator."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.more]
impact = "Disattivare questa opzione se l'/more deve rimanere non registrato mentre la funzione Shorthands è attiva."
summary = "Registra /more per dare al giocatore un'ampia pila di dimensioni che corrisponde esattamente all'oggetto tenuto."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.rl]
impact = "Disattivare questa opzione se l'/rl deve rimanere non registrato mentre la funzione Shorthands è attiva."
summary = "Registra /rl come alias che invoca il comando /reload non qualificato del server."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands_customshorthand.field.command]
impact = "Il comando di destinazione viene eseguito con le autorizzazioni esistenti del mittente che richiede e non può elevare l'accesso."
summary = "Il comando viene eseguito come l'utente di scorciatoia, senza la taglia principale. Gli argomenti forniti vengono allegati automaticamente a meno che non venga visualizzata la parola args all'interno dei supporti."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands_customshorthand.field.enabled]
impact = "Disattivare la definizione in config senza registrarne il comando."
summary = "Abilita questo comando di scorciatoia personalizzato."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands_customshorthand.field.overrideexisting]
impact = "Tenere false per saltare le etichette in conflitto. React ripristina qualsiasi mappatura sostituita quando l'abbreviazione è disabilitata o ricaricata."
summary = "Consente a questa scorciatoia di sostituire temporaneamente un'etichetta di comando non qualificata esistente mentre è attiva."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands_customshorthand.field.permission]
impact = "Per impostazione predefinita, react.shorthands.custom limita i comandi di scorciatoia personalizzati agli operatori."
summary = "Permetto opzionale richiesto per utilizzare questa scorciatoia oltre all'autorizzazione del comando di destinazione. Lascia in bianco per non richiedere autorizzazioni extra di scorciatoie."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakspawnerplayerradius]
description = "Configurazione per il gioco di spawner Radius tweak. Blocchi deposto e pedine di prova quando i giocatori sono al di fuori della distanza di attivazione richiesta."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakspawnerplayerradius.field.enforcespawnerspawns]
