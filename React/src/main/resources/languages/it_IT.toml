summary = "Periodo di raffreddamento dopo le decisioni di limitazione in redstone clock governor, in millisecondi."

[config.documentation.annotation.art.arcane.react.content.feature.featureredstoneclockgovernor.field.maxtransitionsperwindow]
impact = "Valori più alti consentono picchi più ampi prima che il controllo intervenga; valori più bassi limitano i picchi prima."
