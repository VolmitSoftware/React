summary = "Distanza massima in blocchi in «minecart tether»."

[config.documentation.annotation.art.arcane.react.content.feature.featuremobstacking]
description = "Configurazione della funzione Mob Stacking. Questa funzione monitora continuamente il comportamento del server e applica limiti di sicurezza durante l'esecuzione."

[config.documentation.annotation.art.arcane.react.content.feature.featuremobstacking.field.batchintervalms]
impact = "Valori più bassi impilano prima i mob appena generati con un costo di pianificazione maggiore; valori più alti raggruppano più lavoro di unione per passaggio."
summary = "Frequenza con cui i chunk in coda vengono elaborati per l'impilamento, in millisecondi."

[config.documentation.annotation.art.arcane.react.content.feature.featuremobstacking.field.customnames]
impact = "Gloss riceve il numero di creature nei gruppi indipendentemente da questa impostazione e gestisce la visualizzazione combinata delle entità quando è abilitata."
summary = "Mostra i nomi nativi dei gruppi quando le sovrapposizioni di entità di Gloss non sono disponibili."

[config.documentation.annotation.art.arcane.react.content.feature.featuremobstacking.field.maxhealth]
impact = "I valori più elevati permettono un maggiore throughput prima dell'intervento; i valori inferiori rendono la mitigazione più aggressiva."
summary = "Salute massima in «mob stacking»."

[config.documentation.annotation.art.arcane.react.content.feature.featuremobstacking.field.maxstacksize]
impact = "I valori più elevati permettono un maggiore throughput prima dell'intervento; i valori inferiori rendono la mitigazione più aggressiva."
summary = "Dimensione massima della pila in «mob stacking»."

[config.documentation.annotation.art.arcane.react.content.feature.featuremobstacking.field.onlyspawnermobs]
impact = "Attiva per applicare questo comportamento; disattiva per lasciare inattivo questo percorso."
summary = "Controlla se in «mob stacking» si applica «solo mob da spawner»."

[config.documentation.annotation.art.arcane.react.content.feature.featuremobstacking.field.searchradius]
impact = "Valori più alti ampliano l'area di ricerca e richiedono più lavoro; valori più bassi restringono l'ambito e costano meno."
summary = "Raggio di ricerca usato da «mob stacking» (blocchi)."

[config.documentation.annotation.art.arcane.react.content.feature.featuremobstacking.field.skipcustommobs]
impact = "Abilitare questo per escludere i casi corrispondenti; disabilitarlo per includerli nell'applicazione."
summary = "Salta i mob personalizzati quando «mob stacking» valuta i bersagli."

[config.documentation.annotation.art.arcane.react.content.feature.featuremobstacking.field.stackabletypes]
impact = "Restringi questo elenco per interessare meno casi, oppure ampliarlo per includere più voci corrispondenti."
summary = "Definizione del filtro dei tipi impilabili usato da mob stacking."

[config.documentation.annotation.art.arcane.react.content.feature.featuremobstacking.field.vacuumeffect]
impact = "Attiva per applicare questo comportamento; disattiva per lasciare inattivo questo percorso."
summary = "Controlla se in «mob stacking» si applica «effetto aspirazione»."

[config.documentation.annotation.art.arcane.react.content.feature.featurepathfinderbudget]
description = "Configurazione della funzione Pathfinder Budget. Riduce il budget di nodi A* dei mob lontani dai giocatori mentre il server è sotto carico, rendendo più economica ogni ricerca di percorso senza cambiare dove i mob cercano di andare. I budget vengono ripristinati quando i mob si avvicinano ai giocatori, quando il server si riprende, allo scaricamento dell'entità o alla disattivazione. Se i bridge di navigazione NMS non sono disponibili, ricade sul pathfinding vanilla."

[config.documentation.annotation.art.arcane.react.content.feature.featurepathfinderbudget.field.budgetmultiplier]
impact = "Valori più bassi rendono le ricerche di percorso più economiche ma producono percorsi a lunga distanza peggiori per i mob interessati."
summary = "Moltiplicatore del budget di nodi visitati dall'A* applicato ai mob lontani mentre è attivo (vanilla è 1.0)."

[config.documentation.annotation.art.arcane.react.content.feature.featurepathfinderbudget.field.engageticktimems]
impact = "Valori più bassi riducono prima il costo del pathfinding; valori più alti lo riservano a un carico maggiore."
summary = "Millisecondi medi per tick necessari prima che i budget del pathfinding si riducano."

[config.documentation.annotation.art.arcane.react.content.feature.featurepathfinderbudget.field.fullbudgetwithindistance]
impact = "Valori più alti proteggono più mob dal budgeting; valori più bassi riducono di più il costo del pathfinding vicino ai giocatori."
summary = "I mob entro questa distanza da un giocatore mantengono sempre il budget completo di pathfinding (blocchi)."

[config.documentation.annotation.art.arcane.react.content.feature.featurepathfinderbudget.field.maxentitiessampledpercycle]
impact = "Valori più alti convergono più rapidamente sulla popolazione di mob con un costo maggiore per ciclo."
summary = "Numero massimo di mob campionati per ciclo."

[config.documentation.annotation.art.arcane.react.content.feature.featurepathfinderbudget.field.tickintervalms]
impact = "Valori più bassi reagiscono più velocemente ma consumano più CPU; valori più alti riducono il sovraccarico ma reagiscono più tardi."
summary = "Intervallo di valutazione principale per «pathfinder budget» in millisecondi."

[config.documentation.annotation.art.arcane.react.content.feature.featureperworldtickbudget]
description = "Configurazione della funzione Per-World Tick Budget. Misura la quota mobile del tempo di tick per mondo, applica l'isteresi di attivazione e rilascio e pubblica NORMAL/PRESSURE/PANIC per ogni mondo. Adaptive entity sleep, dynamic activation range, item backpressure e pathfinder budget usano questo stato per applicare il comportamento di pressione per mondo."

[config.documentation.annotation.art.arcane.react.content.feature.featureperworldtickbudget.field.budgetms]
impact = "Valori più bassi segnalano prima i mondi sotto pressione; valori più alti riservano PRESSURE a un carico maggiore per mondo."
summary = "Quota media mobile di tick per mondo oltre la quale un mondo entra in modalità PRESSURE (millisecondi)."

[config.documentation.annotation.art.arcane.react.content.feature.featureperworldtickbudget.field.engagesustainticks]
impact = "Valori più alti assorbono i picchi brevi; valori più bassi intervengono più rapidamente ma possono oscillare con segnali rumorosi."
summary = "Cicli di valutazione prolungati sopra la soglia richiesti prima di intervenire."

[config.documentation.annotation.art.arcane.react.content.feature.featureperworldtickbudget.field.panicms]
impact = "Valori più bassi scalano prima; valori più alti riservano PANIC a un carico grave per mondo."
summary = "Quota media mobile di tick per mondo oltre la quale un mondo entra in modalità PANIC (millisecondi)."

[config.documentation.annotation.art.arcane.react.content.feature.featureperworldtickbudget.field.releasems]
impact = "Valori più bassi mantengono la modalità elevata più a lungo per stabilità; valori più alti ripristinano prima NORMAL."
summary = "Soglia di rilascio (millisecondi) sotto cui la media per mondo deve restare per uscire da PRESSURE/PANIC, impostata sotto budgetMs per evitare oscillazioni continue."

[config.documentation.annotation.art.arcane.react.content.feature.featureperworldtickbudget.field.releasesustainticks]
impact = "Valori più alti mantengono la modalità per stabilità; valori più bassi la rilasciano prima."
summary = "Cicli di valutazione prolungati sotto la soglia di rilascio richiesti prima di tornare verso NORMAL."

[config.documentation.annotation.art.arcane.react.content.feature.featureperworldtickbudget.field.tickintervalms]
impact = "Valori più bassi reagiscono più rapidamente alla pressione per mondo ma consumano più CPU nel tick della funzione; valori più alti smussano il segnale ma aumentano il tempo di intervento."
summary = "Intervallo di valutazione principale per «per-world tick budget» in millisecondi."

[config.documentation.annotation.art.arcane.react.content.feature.featureperworldtickbudget.field.worldoverrides]
summary = "Sostituzioni delle soglie per mondo, indicizzate per chiave completa del mondo. Un mondo presente qui usa i propri valori di budget, panic e release invece di quelli globali."

[config.documentation.annotation.art.arcane.react.content.feature.featureplayerimpactoverlay]
description = "Configurazione della funzione Player Impact Overlay. Questa funzione monitora continuamente il comportamento del server e applica limiti di sicurezza durante l'esecuzione."

[config.documentation.annotation.art.arcane.react.content.feature.featureplayerimpactoverlay.field.maxplayersdrawn]
impact = "I valori più elevati permettono un maggiore throughput prima dell'intervento; i valori inferiori rendono la mitigazione più aggressiva."
summary = "Numero massimo di giocatori disegnati in «player impact overlay»."

[config.documentation.annotation.art.arcane.react.content.feature.featureplayerimpactoverlay.field.showplayerinitials]
impact = "Attiva per mostrare questo livello visivo; disattiva per una mappa più pulita e un costo di rendering leggermente inferiore."
summary = "Controlla se player impact overlay mostra le iniziali dei giocatori nell'output della mappa."

[config.documentation.annotation.art.arcane.react.content.feature.featureplugineventimpactlistmap]
description = "Configurazione della funzione Plugin Event Impact List Map. Questa funzione monitora continuamente il comportamento del server e applica limiti di sicurezza durante l'esecuzione."

[config.documentation.annotation.art.arcane.react.content.feature.featureplugineventimpactlistmap.field.maxrowspertile]
impact = "Zero permette a una parete di mappe più alta di elencare ogni plugin; un valore fisso si moltiplica per il numero di riquadri verticali, quindi una parete più alta elenca comunque più plugin."
summary = "Numero massimo di righe disegnate per riquadro della mappa, oppure 0 per riempire l'altezza disponibile."

[config.documentation.annotation.art.arcane.react.content.feature.featureplugineventimpactpiemap]
description = "Configurazione della funzione Plugin Event Impact Pie Map. Questa funzione monitora continuamente il comportamento del server e applica limiti di sicurezza durante l'esecuzione."

[config.documentation.annotation.art.arcane.react.content.feature.featureportaltrafficsmoother]
description = "Configurazione della funzione Portal Traffic Smoother. Questa funzione monitora continuamente il comportamento del server e applica limiti di sicurezza durante l'esecuzione."

[config.documentation.annotation.art.arcane.react.content.feature.featureportaltrafficsmoother.field.bypassnearplayers]
impact = "Attiva per saltare l'applicazione nelle situazioni corrispondenti; disattiva per una gestione rigorosa."
summary = "Salta la gestione di «portal traffic smoother» per i giocatori vicini."

[config.documentation.annotation.art.arcane.react.content.feature.featureportaltrafficsmoother.field.bypassplayerradius]
impact = "Valori più alti ampliano l'area di ricerca e richiedono più lavoro; valori più bassi restringono l'ambito e costano meno."
summary = "Raggio di esclusione attorno ai giocatori usato da «portal traffic smoother» (blocchi)."

[config.documentation.annotation.art.arcane.react.content.feature.featureportaltrafficsmoother.field.cooloffms]
impact = "Valori più alti mantengono attivi più a lungo i throttle; valori più bassi lasciano recuperare prima l'attività."
summary = "Periodo di raffreddamento dopo le decisioni di limitazione in portal traffic smoother (millisecondi)."

[config.documentation.annotation.art.arcane.react.content.feature.featureportaltrafficsmoother.field.entitydelayticks]
impact = "I valori più elevati mantengono più attivo lo stato; i valori inferiori scadono o applicano le modifiche prima."
summary = "Durata del ritardo delle entità usato da «portal traffic smoother» (tick)."

[config.documentation.annotation.art.arcane.react.content.feature.featureportaltrafficsmoother.field.maxentityportalsperchunkwindow]
impact = "Valori più alti consentono picchi più ampi prima che il controllo intervenga; valori più bassi limitano i picchi prima."
summary = "Numero massimo di portali delle entità per finestra di chunk in «portal traffic smoother»."

[config.documentation.annotation.art.arcane.react.content.feature.featureportaltrafficsmoother.field.maxplayerportalsperchunkwindow]
impact = "Valori più alti consentono picchi più ampi prima che il controllo intervenga; valori più bassi limitano i picchi prima."
summary = "Numero massimo di portali dei giocatori per finestra di chunk in «portal traffic smoother»."

[config.documentation.annotation.art.arcane.react.content.feature.featureportaltrafficsmoother.field.maxqueueddelays]
impact = "Valori più alti consentono più throughput ritardato dei portali; valori più bassi limitano in modo più aggressivo il lavoro in coda sulle entità."
summary = "Numero massimo globale di ritardi in coda consentito da portal traffic smoother in tutte le regioni."

[config.documentation.annotation.art.arcane.react.content.feature.featureportaltrafficsmoother.field.onlyduringpressure]
impact = "Attiva per applicare questo comportamento; disattiva per lasciare inattivo questo percorso."
summary = "Controlla se in «portal traffic smoother» si applica «solo sotto pressione»."

[config.documentation.annotation.art.arcane.react.content.feature.featureportaltrafficsmoother.field.playerdelayticks]
impact = "I valori più elevati mantengono più attivo lo stato; i valori inferiori scadono o applicano le modifiche prima."
summary = "Durata del ritardo dei giocatori usato da «portal traffic smoother» (tick)."

[config.documentation.annotation.art.arcane.react.content.feature.featureportaltrafficsmoother.field.pressureincidentscore]
impact = "Valori più alti attivano la mitigazione più tardi; valori più bassi la attivano prima e in modo più aggressivo."
summary = "Soglia di attivazione per il punteggio di incidente da pressione in «portal traffic smoother»."

[config.documentation.annotation.art.arcane.react.content.feature.featureportaltrafficsmoother.field.pressuretickms]
impact = "Valori più elevati ritardano l'attivazione o l'uscita; valori inferiori rendono questa soglia più facile da attraversare."
summary = "Soglia del tempo di tick per la pressione in «portal traffic smoother» (millisecondi)."

[config.documentation.annotation.art.arcane.react.content.feature.featureportaltrafficsmoother.field.tickintervalms]
impact = "Valori più bassi reagiscono più velocemente ma consumano più CPU; valori più alti riducono il sovraccarico ma reagiscono più tardi."
summary = "Intervallo di valutazione principale per «portal traffic smoother» in millisecondi."

[config.documentation.annotation.art.arcane.react.content.feature.featureportaltrafficsmoother.field.windowms]
impact = "Finestre più lunghe smussano i picchi ma reagiscono più lentamente; finestre più brevi reagiscono più velocemente ma sono più sensibili."
summary = "Lunghezza della finestra mobile di applicazione usato da «portal traffic smoother» (millisecondi)."

[config.documentation.annotation.art.arcane.react.content.feature.featureportaltrafficsmoother_chunkkey.field.world]
impact = "Si tratta di dati di identità di runtime, che di norma vanno lasciati agli aggiornamenti automatici."
