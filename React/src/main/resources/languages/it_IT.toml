[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.updatenotifications]
summary = "Controlla le release su GitHub per gli aggiornamenti di React."
impact = "Attivo per impostazione predefinita. VolmLib riunisce gli aggiornamenti in un avviso di accesso e in /volmit plugins updates. Disattiva per interrompere i controlli di React."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.minimumincidentscore]
summary = "Punteggio di incidente necessario perché la procedura continui la mitigazione."
impact = "La procedura continua se viene raggiunto questo punteggio o minimumTickMS."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.minimumtickms]
summary = "Millisecondi medi per tick necessari perché la procedura continui la mitigazione."
impact = "La procedura si arresta quando entrambi gli indicatori di carico scendono sotto le rispettive soglie."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.minimumentitiesperchunk]
summary = "Numero di entità osservate in un chunk richiesto prima della fase di riduzione delle entità."
impact = "Valori più alti limitano la riduzione agli hotspot di entità più densi."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.recheckdelayms]
summary = "Intervallo di osservazione dopo il completamento di un'azione secondaria, in millisecondi; minimo 1000."
impact = "Consente di aggiornare le metriche prima di scegliere un’altra mitigazione."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.childtimeoutms]
summary = "Durata massima di una fase di mitigazione, in millisecondi; minimo 1000."
impact = "Il timeout di un’azione secondaria fa fallire la procedura e interrompe l’escalation."

[config.documentation.annotation.art.arcane.react.content.action.actiontrimentitiesbyagepriority_params.field.minimumentitiesperchunk]
summary = "Numero minimo di entità osservate in un chunk prima della riduzione; zero include tutti i chunk osservati."
impact = "Un valore positivo limita la riduzione ai chunk più densi."

[action.capture_profile]
completed = "Salvati {count} profili locali in {path}"

[config.documentation.annotation.art.arcane.react.content.action.actioncaptureprofile]
description = "Registra su richiesta un profilo JDK Flight Recorder locale con eventi di esecuzione, allocazione e GC. Conserva tre registrazioni; nessun caricamento online."

[config.documentation.annotation.art.arcane.react.content.action.actioncaptureprofile_params.field.seconds]
summary = "Durata del profilo in secondi, limitata da 1 a 300."
impact = "Registrazioni più lunghe coprono più attività; JFR conserva al massimo 64 MiB di dati recenti."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.playerchunkbudgetenabled]
summary = "Abilita i budget di chunk dei giocatori per mondo; le sovrapposizioni contano una volta."
impact = "Disabilitato per impostazione predefinita. I budget possono ridurre le distanze obiettivo esistenti e il ripristino è graduale."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.playertickingchunkbudget]
summary = "Numero massimo stimato di chunk simulati per i giocatori per mondo; minimo 1."
impact = "Le aree di simulazione sovrapposte contano una volta. Le distanze minime configurate hanno priorità se il budget non è raggiungibile."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.playerviewonlychunkbudget]
summary = "Numero massimo stimato di chunk solo visibili per mondo; minimo 1."
impact = "Conta l’area visibile esterna a quella simulata. Stima la domanda dei giocatori, non i chunk caricati o i ticket dei plugin."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.budgetrecoverychecks]
summary = "Valutazioni consecutive sane del budget richieste prima di aumentare una distanza; minimo 1."
impact = "Le valutazioni seguono updateCooldownSeconds. Telemetria dei tick sconosciuta o indice dei giocatori non pronto azzerano il ripristino."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.budgetrecoverystep]
summary = "Aumento massimo della distanza dopo il recupero del budget, in chunk; limitato da 1 a 32."
impact = "Passi piccoli limitano i picchi di caricamento durante il ripristino. Vale solo con i budget di chunk dei giocatori abilitati."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller]
description = "Campiona le posizioni dei giocatori Folia e, facoltativamente, un insieme limitato di eventi JDK Flight Recorder. JFR rileva i totali del traffico di protocollo, le fasi di generazione dei chunk, le attività di archiviazione e le attese oltre la soglia configurata."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller.field.regionalenabled]
summary = "Abilita il campionamento dei TPS delle regioni Folia nelle posizioni dei giocatori."
impact = "Interroga ogni secondo una selezione limitata e a rotazione di posizioni dei giocatori nella cache, senza caricare chunk."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller.field.playeranchorsperrefresh]
summary = "Numero massimo di posizioni dei giocatori campionate ogni secondo, limitato da 1 a 512. Le osservazioni scadono dopo cinque secondi."
impact = "Valori più alti coprono più giocatori, ma richiedono più interrogazioni dei TPS delle regioni."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller.field.jfrenabled]
summary = "Abilita la telemetria JFR selettiva. Disabilitata per impostazione predefinita. I riepiloghi pubblicati omettono indirizzi, percorsi dei file e stack trace."
impact = "Aggiunge lavoro di registrazione JFR con limiti di conservazione di 30 secondi e 64 MiB. Le serie aggregate vengono azzerate ogni secondo."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller.field.jfrslowthresholdms]
summary = "Durata minima in millisecondi per gli eventi JVM di I/O dei file, ingresso nei monitor, attesa sui monitor e parcheggio dei thread, limitata da 1 a 1000. Le fasi di generazione dei chunk non hanno soglie di durata."
impact = "Soglie più basse producono più eventi JVM. Queste metriche descrivono solo gli eventi che raggiungono la soglia."
