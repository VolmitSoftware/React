[config.documentation.annotation.art.arcane.react.content.feature.featureportaltrafficsmoother_chunkkey.field.x]
impact = "Questi dati sono interni e non devono essere modificati manualmente."
summary = "Coordinata dell'asse X usata dal tracciamento interno di «portal traffic smoother»."

[config.documentation.annotation.art.arcane.react.content.feature.featureportaltrafficsmoother_chunkkey.field.z]
impact = "Questi dati sono interni e non devono essere modificati manualmente."
summary = "Coordinata dell'asse Z usata dal tracciamento interno di «portal traffic smoother»."

[config.documentation.annotation.art.arcane.react.content.feature.featureportaltrafficsmoother_portalwindow.field.entities]
impact = "Principalmente stato di runtime; React lo aggiorna automaticamente durante la valutazione in tempo reale."
summary = "Contatore interno usato da «portal traffic smoother» per tracciare l'attività a raffica."

[config.documentation.annotation.art.arcane.react.content.feature.featureportaltrafficsmoother_portalwindow.field.lasthit]
impact = "Principalmente stato di runtime; modificarlo manualmente può alterare il comportamento di cooldown o di throttling."
summary = "Timestamp interno usato da «portal traffic smoother» per tracciare le finestre temporali e il decadimento."

[config.documentation.annotation.art.arcane.react.content.feature.featureportaltrafficsmoother_portalwindow.field.players]
impact = "Principalmente stato di runtime; React lo aggiorna automaticamente durante la valutazione in tempo reale."
summary = "Contatore interno usato da «portal traffic smoother» per tracciare l'attività a raffica."

[config.documentation.annotation.art.arcane.react.content.feature.featureportaltrafficsmoother_portalwindow.field.start]
impact = "Principalmente stato di runtime; modificarlo manualmente può alterare il comportamento di cooldown o di throttling."
summary = "Timestamp interno usato da «portal traffic smoother» per tracciare le finestre temporali e il decadimento."

[config.documentation.annotation.art.arcane.react.content.feature.featureportaltrafficsmoother_portalwindow.field.throttleuntil]
impact = "Principalmente stato di runtime; modificarlo manualmente può alterare il comportamento di cooldown o di throttling."
summary = "Timestamp interno usato da «portal traffic smoother» per tracciare le finestre temporali e il decadimento."

[config.documentation.annotation.art.arcane.react.content.feature.featurerandomtickgovernor]
description = "Configurazione della funzione Random Tick Governor. Abbassa temporaneamente la gamerule della velocità dei tick casuali mentre il server è sotto pressione prolungata, ripristinandola quando il server si riprende. La crescita di colture, foglie e simili basata sui tick casuali rallenta solo durante la finestra regolata."

[config.documentation.annotation.art.arcane.react.content.feature.featurerandomtickgovernor.field.engageincidentscore]
impact = "Valori più bassi intervengono anche in incidenti più lievi; valori più alti attendono incidenti gravi."
summary = "Punteggio di incidente (0-100) che attiva anch'esso il governor."

[config.documentation.annotation.art.arcane.react.content.feature.featurerandomtickgovernor.field.engageticktimems]
impact = "Valori più bassi riducono prima i tick casuali; valori più alti lo riservano a un carico maggiore."
summary = "Millisecondi medi per tick necessari prima che il governor intervenga."

[config.documentation.annotation.art.arcane.react.content.feature.featurerandomtickgovernor.field.reducedrandomtickspeed]
impact = "Valori più bassi riducono più lavoro di tick casuali ma rallentano di più la crescita durante le finestre regolate."
summary = "Velocità dei tick casuali applicata mentre il governor è attivo."

[config.documentation.annotation.art.arcane.react.content.feature.featurerandomtickgovernor.field.releaseticktimems]
impact = "Valori più bassi mantengono la riduzione più a lungo per stabilità; valori più alti ripristinano prima la crescita."
summary = "Millisecondi medi per tick sotto cui il server deve restare prima che il governor rilasci."

[config.documentation.annotation.art.arcane.react.content.feature.featurerandomtickgovernor.field.sustainengagems]
impact = "Valori più alti ignorano i picchi brevi; valori più bassi intervengono più rapidamente."
summary = "Durata della pressione sostenuta richiesta prima di intervenire (millisecondi)."

[config.documentation.annotation.art.arcane.react.content.feature.featurerandomtickgovernor.field.sustainreleasems]
impact = "Valori più alti evitano oscillazioni continue tra gli stati; valori più bassi ripristinano prima la crescita."
summary = "Durata del recupero sostenuto richiesta prima del rilascio (millisecondi)."

[config.documentation.annotation.art.arcane.react.content.feature.featurerandomtickgovernor.field.tickintervalms]
impact = "Valori più bassi reagiscono più velocemente ma consumano più CPU; valori più alti riducono il sovraccarico ma reagiscono più tardi."
summary = "Intervallo di valutazione principale per «random tick governor» in millisecondi."

[config.documentation.annotation.art.arcane.react.content.feature.featureredstoneactivityheatmap]
description = "Configurazione della funzione Redstone Activity Heatmap. Questa funzione monitora continuamente il comportamento del server e applica limiti di sicurezza durante l'esecuzione."

[config.documentation.annotation.art.arcane.react.content.feature.featureredstoneclockgovernor]
