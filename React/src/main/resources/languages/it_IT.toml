impact = "Attiva per accelerare il ritiro e lo svuotamento dei fluidi vicino agli aggiornamenti di flusso; disattiva per accelerare solo i tick di flusso diretti."
summary = "Controlla se in «fast fluids» si applica «accelerazione dello svuotamento attorno agli eventi di flusso attivi»."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids.field.acceleratelava]
