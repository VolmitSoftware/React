[config.documentation.annotation.art.arcane.react.core.controller.configinputcontroller.field.sessiontimeoutseconds]
impact = "I valori più elevati continuano a modificare i prompt prima di essere cancellati."
summary = "Timeout per le sessioni di configurazione basate su chat in pochi secondi."

[config.documentation.annotation.art.arcane.react.core.controller.hotloadcontroller]
description = "Controlla i file di configurazione e di lingua di React e applica automaticamente le modifiche."

[config.documentation.annotation.art.arcane.react.core.controller.hotloadcontroller.field.maxdiffmessagesperfile]
impact = "I valori più bassi riducono il rumore della chat dell'operatore su modifiche di configurazione grandi."
summary = "Numero massimo di messaggi diff a livello chiave inviati per file modificato."

[config.documentation.annotation.art.arcane.react.core.controller.hotloadcontroller.field.notifyoperators]
impact = "Disattivare se si desidera solo log di console e nessuna notifica in-game."
summary = "Invia a operatori online i riassunti di cambiamento di carico caldo."

[config.documentation.annotation.art.arcane.react.core.controller.hotloadcontroller.field.pollintervalms]
impact = "Valori più bassi rilevano prima gli eventi ricevuti; le modifiche automatiche vengono comunque applicate in gruppi al massimo una volta ogni tre secondi."
summary = "Intervallo di interrogazione degli eventi del file system in millisecondi."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller]
description = "Acquisisce una volta i campionatori di React, memorizza telemetria storica compressa e gestisce query limitate a un intervallo temporale."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.compressionlevel]
impact = "Valori più alti possono ridurre l'uso del disco al costo di un maggiore carico CPU in scrittura."
summary = "Livello DEFLATE usato solo quando riduce una colonna di metriche codificata."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.enabled]
impact = "Disabilitare l'archiviazione mantiene le istantanee web in tempo reale, ma non registra nuovi campioni storici. La cronologia esistente resta leggibile."
summary = "Archivia la cronologia dei campionatori in plugins/React/history."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.fifteenminuteretentiondays]
impact = "Le aggregazioni di un'ora conservano la copertura storica dopo la scadenza di questo livello."
summary = "Conservazione delle aggregazioni di quindici minuti in giorni. Zero conserva questo livello indefinitamente."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.livecaptureintervalms]
impact = "Valori più bassi migliorano la fedeltà dei grafici in tempo reale, ma interrogano più spesso tutti i campionatori registrati."
summary = "Frequenza dell'istantanea autorevole dei campionatori in tempo reale, in millisecondi."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.maxquerypoints]
impact = "Valori più alti migliorano la risoluzione del grafico al costo della dimensione della risposta e del lavoro di query."
summary = "Numero massimo di intervalli accettati per ogni serie in una query storica."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.maxqueryseries]
impact = "Valori più alti possono creare frame di inoltro più grandi e più letture simultanee dal disco."
summary = "Numero massimo di serie accettate da una query storica."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.minuteretentiondays]
impact = "La copertura meno recente resta disponibile tramite aggregazioni a risoluzione inferiore."
summary = "Conservazione delle aggregazioni di un minuto in giorni. Zero conserva questo livello indefinitamente."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.querypagepoints]
impact = "Le pagine restano limitate per i timeout dell'inoltro e delle richieste del browser."
summary = "Numero massimo di intervalli restituiti per serie in una pagina di risposta storica."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.rawretentionhours]
impact = "La copertura meno recente resta disponibile tramite aggregazioni a risoluzione inferiore."
summary = "Conservazione dei campioni esatti di un secondo in ore. Zero conserva questo livello indefinitamente."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.tensecondretentiondays]
impact = "La copertura meno recente resta disponibile tramite aggregazioni a risoluzione inferiore."
summary = "Conservazione delle aggregazioni di dieci secondi in giorni. Zero conserva questo livello indefinitamente."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.walforceintervalms]
impact = "Un arresto anomalo del processo o dell'host può perdere al massimo questa finestra recente; valori più bassi aumentano le scritture forzate su disco."
summary = "Tempo massimo tra le scritture forzate del registro storico, in millisecondi."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller]
description = "Gestione React mappa metadati, riparazione del renderer e consegna dei pacchetti di mappe in diretta per gli inventori e i frame degli articoli."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemapidlepushintervalms]
impact = "I valori più elevati riducono il volume dei pacchetti inattivo quando i giocatori sono vicini ma non guardano la mappa."
summary = "Intervallo di spinta del pacchetto per gli spettatori vicini che non stanno attivamente guardando la mappa della cornice (millisecondi)."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemaplookdotthreshold]
impact = "I valori più elevati richiedono un obiettivo più stretto sulla mappa prima che vengano inviati aggiornamenti ad alta frequenza."
summary = "Prodotto minimo di vista-direzione dot necessario per trattare un giocatore come attivamente guardando una mappa della cornice."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemappushintervalms]
impact = "I valori più bassi aggiornano la mappa visualizza velocemente ma aumentano il pacchetto e rendono la pressione."
summary = "Intervallo di spinta del pacchetto per le mappe dei quadri attivi in millisecondi."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemappushoutsiderangewhenholding]
impact = "Disattivare i pacchetti di mappe in modo da interrompere il raggio esterno; abilitare se tenere premuto dovrebbe bypassare i controlli della distanza."
summary = "Consente aggiornamenti di mappa trattenuta al di fuori frameMapPushRadiusBlocks."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemappushradiusblocks]
impact = "I valori più elevati coprono più spettatori, ma aumentano il fanout dei pacchetti."
summary = "raggio massimo di blocco da una mappa del frame degli elementi in cui i giocatori ricevono aggiornamenti push."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemappushstateretentionms]
impact = "I valori più elevati mantengono lo stato più lungo con meno scarto; i valori inferiori prune bookkeeping più aggressivo."
summary = "Durata di conservazione per la manutenzione della mappa del telaio in millisecondi."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemapredrawintervalms]
impact = "I valori inferiori aggiornano i cruscotti della cornice più velocemente; i valori superiori crollano ridondanti per-viewer ridisegnano sulle pareti di mappe trafficate."
summary = "Intervallo minimo tra le raddrizzatrici di tela per l'elemento-frame React mappe in millisecondi."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemaprequirelineofsight]
impact = "Consente di eliminare i pacchetti agli spettatori inclusi, ma aggiunge controlli di visibilità leggeri."
summary = "Se abilitata, le spinte della mappa del telaio richiedono la linea di vista per gli spettatori vicini (i titolari bypassano questo)."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemapvalidateintervalms]
impact = "I valori inferiori rilevano prima gli elementi del quadro scambiato; i valori superiori evitano metadati di oggetto ripetuti che leggono ogni tick di manutenzione."
summary = "Intervallo tra le rivalidazioni complete di cartine tracciate in millisecondi."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.heldmapredrawintervalms]
impact = "I valori più bassi ruotano e rinfrescano le mappe tenute in modo più regolare; i valori superiori tagliano il lavoro quando molti giocatori visualizzano la stessa mappa."
summary = "Intervallo minimo tra le ritorsioni di tela per tenuta React mappe in millisecondi."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.inventoryrepairbatchsize]
impact = "I valori più elevati riducono il tempo di recupero dopo il reload; i valori inferiori riducono ogni passaggio."
summary = "Numero di inventori del giocatore online riparati per il pass di manutenzione."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.inventoryrepaircadencems]
impact = "I valori inferiori riparano i metadati e i renderer della mappa più velocemente; i valori superiori riducono il lavoro per tick."
summary = "Cadence per gli inventori del giocatore di scansione React riparazione mappa in millisecondi."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.itemframechunkbatchsize]
impact = "I valori più elevati velocizzano il recupero della frame-map dopo il ricaricamento; i valori inferiori riducono il costo del per-pass."
summary = "Numero di chunk caricati scansionati per mappe del quadro degli elementi per passaggio di manutenzione."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.itemframerepaircadencems]
impact = "I valori più bassi fissano le mappe degli elementi-frame più velocemente dopo il ricaricamento; i valori più elevati riducono la manutenzione in testa."
summary = "Cadenza per la scansione di chunk caricato per la riparazione della mappa del quadro degli elementi in millisecondi."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.maintenancetickintervalms]
impact = "Riparare i valori più bassi inventari e gli oggetti-frame prima dopo il ricarica; valori superiori ridurre la manutenzione in testa."
summary = "Cadutance principale di manutenzione per la logica di riparazione della mappa in millisecondi."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.megamapenabled]
impact = "Disattivare la visualizzazione di ogni mappa come dashboard indipendente 128x128."
summary = "Combina l'oggetto-frame adiacente React mappe con lo stesso rendering in un grande display megamap piastrellato."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.megamapmaxtiles]
impact = "I muri oltre il budget tornano al rendering ingrandito di una singola dashboard."
summary = "Budget totale di piastrelle per un muro megamap combinato."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.megamapsplitduplicates]
impact = "Disattivare per far condividere alle mappe clonate una sola immagine senza mai unirle."
summary = "Le mappe React clonate poste nelle cornici per oggetti ricevono automaticamente nuovi identificativi di mappa affinché le copie adiacenti si uniscano in un muro megamap."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.startupboostdurationms]
impact = "Valori più elevati priorità veloce recupero post-ricarica più a lungo; valori inferiori tornare alla cadenza normale prima."
summary = "Durata di riscaldamento dopo l'avvio/reload where map recovery uses aggressive repair batching (milliseconds)."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.startupboostinventorybatchsize]
impact = "I valori più elevati rendono gli inventari di mappe recuperare più velocemente dopo il ricarica al costo del lavoro extra temporaneo."
summary = "Inventory riparazione lotto dimensioni mentre il riscaldamento di avvio è attivo."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.startupboostitemframechunkbatchsize]
impact = "I valori più elevati rendono le mappe fotogrammi recuperano velocemente dopo il ricaricamento al costo del lavoro temporaneo."
summary = "Rimanamento chunk di dimensioni del lotto mentre il calore iniziale è attivo."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.startupframemappushintervalms]
impact = "I valori più bassi fanno apparire le mappe dei frame più velocemente dopo il caricamento; i valori più elevati riducono gli scoppi temporanei del pacchetto durante il riscaldamento."
summary = "Intervallo di spinta del pacchetto usato durante il riscaldamento dell'avvio in millisecondi."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemappushbatchsize]
summary = "Numero massimo di mappe monitorate nelle cornici considerate per l'invio di pacchetti a ogni passaggio di manutenzione."
impact = "Valori più alti aggiornano prima le pareti di mappe molto grandi; valori più bassi limitano il carico dello scheduler e della ricerca di entità."

[config.documentation.annotation.art.arcane.react.core.controller.incidentcontroller]
description = "Conserva prove strutturate degli incidenti per il plugin e il visualizzatore web."

[config.documentation.annotation.art.arcane.react.core.controller.incidentcontroller.field.persistenceenabled]
impact = "Disabilitando la persistenza rimane solo la cronologia dell’esecuzione corrente."
summary = "Conserva la cronologia strutturata degli incidenti in plugins/React/incidents.json."

[config.documentation.annotation.art.arcane.react.core.controller.incidentcontroller.field.retention]
impact = "Valori maggiori conservano più cronologia e usano più memoria e spazio su disco."
summary = "Numero massimo di eventi di incidente strutturati conservati."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration]
description = "Globale React configurazione. Controlla il layout di monitoraggio predefinito, la regolazione del modello di valore e il comportamento diagnostico."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.adaptabilityopsmetricmode]
impact = "Non controlla le soglie di pressione sulle prestazioni. ALL_CHECKS viene normalizzato a SUCCESSFUL_CHECKS durante l'esecuzione."
summary = "Seleziona il tasso di operazioni delle abilità Adapt che React mostra e include come contesto degli avvisi. Opzioni: SUCCESSFUL_CHECKS, ALL_CHECKS."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.customcolors]
impact = "Impostare su falso per mantenere l'output più vicino al comportamento di colore vaniglia / default."
summary = "Consente lo styling personalizzato di colore nelle viste del monitor."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.debug]
impact = "Utilizzare durante le sessioni di debug; disabilitare per il normale tempo di produzione."
summary = "Consente di eseguire il debug e la diagnostica aggiuntiva."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.integrationsecretsenabled]
impact = "Disabilitato per impostazione predefinita. Attivare per consentire Iris/Adapt pacchetti segreti quando le dipendenze sono presenti."
summary = "Consente di integrare le funzioni segrete con plugin-gated."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.language]
impact = "L'inglese incluso nel codice rimane la lingua di riserva; i cataloghi TOML modificabili vengono caricati da languages."
summary = "Locale utilizzato per React Interfacce di giocatore e operatore."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.metrics]
impact = "Imposta false per interrompere gli invii di React a bStats. Le modifiche vengono applicate automaticamente."
summary = "Abilita la segnalazione anonima di utilizzo bStats per React."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.monitoring]
impact = "Le modifiche influenzano la composizione della dashboard di monitoraggio baseline e il raggruppamento lettore di metriche."
summary = "Il layout del monitor predefinito mostrato ai giocatori."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.priority]
impact = "Cambiare questi pesi può alterare il comportamento di culling, coda e visibilità."
summary = "Modello di priorità d'ingresso utilizzato da più React sottosistemi."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.slowticklogmode]
impact = "OFF sopprime gli avvertimenti tick lenti. BLAME mette in evidenza la probabile responsabilità del plugin/carico di lavoro. SHORT registra solo il minimo tempo. DETAILED registra il payload dati diagnostico completo."
summary = "Controlla la registrazione delle avvertenze tick lente. Opzioni: OFF, BLAAME, SHORT, DETAILED."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.unsafebytecode]
impact = "Disabilitato per impostazione predefinita. Le funzionalità NMS specifiche della versione possono comunque collegare la propria strumentazione quando vengono attivate. La strumentazione collegata rimane fino al riavvio della JVM."
summary = "Collega l’agente ByteBuddy generale di React all’avvio o quando viene abilitato durante l’esecuzione."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.value]
impact = "I valori più elevati possono aumentare l'influenza di elementi costosi nei calcoli."
summary = "Valore materiale di tuning utilizzato per l'analisi della ricetta/valore."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.verbose]
impact = "Utile per la risoluzione dei problemi, ma può creare un sacco di rumore del registro."
summary = "Consente l'output di console verbose per React interni."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration_monitoring]
description = "Configurazione del cruscotto di monitoraggio predefinito del giocatore."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration_monitoring.field.actionbarheaderslots]
impact = "I valori più elevati riducono la paging orizzontale, ma possono rendere le voci più difficili da leggere se le etichette sono lunghe."
summary = "Numero massimo di gruppi monitori mostrati nella barra d'azione in una sola volta."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration_monitoring.field.actionbarsamplerslots]
impact = "I valori più elevati riducono la paging all'interno di un gruppo, ma possono comprimere la leggibilità su piccoli display."
summary = "Numero massimo di lettori di metriche mostrato nella riga della barra d'azione focalizzata contemporaneamente."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration_monitoring.field.monitorconfiguration]
impact = "Modificando questo modifica la struttura del pannello di monitoraggio della linea base per nuove impostazioni."
summary = "Gruppi di monitoraggio predefiniti e lettori di metriche mostrati ai giocatori."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration_valueconfig]
description = "Configurazione del valore dei materiali React's calcoli di valore e ponderazione."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration_valueconfig.field.basevalue]
impact = "Valori più elevati aumentano la valutazione della linea di base a livello globale."
summary = "Valore base per materiali prima di ricetta e regolazioni override."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration_valueconfig.field.maxrecipelistprecaution]
impact = "I valori più elevati permettono un'esplorazione delle ricette più profonda, ma possono aumentare i costi di lavorazione."
summary = "Tappo di sicurezza per evitare traversali della ricetta profonda o ciclica da spirale."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration_valueconfig.field.valuemutlipliers]
impact = "I moltiplicatori più elevati rendono materiali specifici più influenti nei calcoli di valore."
summary = "Moltiplicatori per-materiali che sovrascrive il comportamento di valutazione predefinito."

