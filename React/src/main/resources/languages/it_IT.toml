[config.documentation.annotation.art.arcane.react.content.feature.featurecropfastforward]
description = "Configurazione della funzione Crop Fast Forward. Il server fa crescere le colture solo nei chunk entro la distanza di simulazione di un giocatore, quindi questa funzione registra quanto tempo ogni chunk caricato trascorre fuori da quella distanza. Quando un giocatore torna nel raggio attivo, percorre una volta i blocchi di colture e arboscelli del chunk e ne fa avanzare la crescita di quel tempo, così i giocatori non trovano fattorie congelate al ritorno. La crescita in sospeso viene scartata quando un chunk viene scaricato. Resta inattiva durante gli incidenti di carico elevato."

[config.documentation.annotation.art.arcane.react.content.feature.featurecropfastforward.field.activerange]
impact = "Valori più grandi applicano prima la crescita in sospeso ai chunk più lontani; valori più piccoli attendono che i giocatori si avvicinino."
summary = "Distanza del giocatore (in blocchi) dalla colonna centrale di un chunk entro cui viene applicato il suo avanzamento in sospeso. L'attività di un chunk segue invece la distanza di simulazione del mondo."

[config.documentation.annotation.art.arcane.react.content.feature.featurecropfastforward.field.engageonincident]
impact = "Valori più alti mantengono attivo l'avanzamento rapido durante incidenti lievi; valori più bassi lo sospendono prima."
summary = "Punteggio di incidente oltre il quale l'avanzamento rapido smette di intervenire. Questa funzione resta inattiva durante gli incidenti ad alto carico (polarità opposta alla maggior parte delle funzioni di React)."

[config.documentation.annotation.art.arcane.react.content.feature.featurecropfastforward.field.engageontickms]
impact = "Valori più alti mantengono attivo l'avanzamento rapido con un carico maggiore; valori più bassi lo sospendono prima."
summary = "Tempo di tick oltre il quale l'avanzamento rapido smette di intervenire (millisecondi). Resta inattiva sotto carico."

[config.documentation.annotation.art.arcane.react.content.feature.featurecropfastforward.field.maxadvancesperpass]
impact = "Valori più alti fanno avanzare più rapidamente farm più grandi in un solo passaggio; valori più bassi limitano il costo di risveglio nel caso peggiore."
summary = "Numero massimo di aggiornamenti di stato dei blocchi applicati per passaggio di avanzamento rapido, per limitare il costo di un singolo risveglio."

[config.documentation.annotation.art.arcane.react.content.feature.featurecropfastforward.field.maxfastforwardticks]
impact = "Valori più alti consentono più recupero ma comprimono più crescita vanilla in un solo passaggio; valori più bassi limitano la correzione al risveglio."
summary = "Numero massimo di tick dormienti usati nel calcolo della crescita. Limita gli avanzamenti rapidi eccessivi dopo una lunga assenza."

[config.documentation.annotation.art.arcane.react.content.feature.featurecropfastforward.field.maxtrackedchunks]
