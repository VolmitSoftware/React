[config.documentation.annotation.art.arcane.react.content.action.actionpurgeentities_params.field.area]
impact = "Scegli un'area più ristretta per azioni locali più sicure o un'area più ampia per un intervento più esteso."
summary = "Selezione dell'area usata da purge entities per scegliere i chunk o le entità da colpire."

[config.documentation.annotation.art.arcane.react.content.action.actionpurgeentities_params.field.entityfilter]
