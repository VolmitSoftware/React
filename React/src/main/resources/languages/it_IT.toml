summary = "Millisecondi tra gli inizi delle finestre di misurazione periodiche nella modalità duty-cycle."

[config.documentation.annotation.art.arcane.react.core.controller.eventcontroller.field.instrumentation]
impact = "ALWAYS impone un sovraccarico di misurazione a ogni gestore di eventi; ON_DEMAND elimina quel costo a riposo ma lascia lacune nella cronologia; DUTY_CYCLE scambia lacune periodiche con un piccolo costo ricorrente."
summary = "Stabilisce quando vengono installati i wrapper di misurazione dei plugin e degli eventi: ON_DEMAND (predefinito) li installa solo mentre un monitor, una mappa, un segnaposto o un visualizzatore web legge i dati degli eventi, ALWAYS li mantiene installati per una cronologia continua dei costi dei plugin e DUTY_CYCLE apre inoltre una finestra di misurazione periodica."

[config.documentation.annotation.art.arcane.react.core.controller.eventcontroller.field.sampleractivitywindowms]
impact = "Valori più alti mantengono installata più a lungo la strumentazione dopo che uno spettatore se ne va; valori più bassi la rimuovono prima."
summary = "Millisecondi dopo l'ultima lettura dei dati degli eventi prima che i wrapper vengano rimossi nelle modalità on-demand e duty-cycle."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller]
description = "Acquisisce una volta i campionatori di React, memorizza telemetria storica compressa e gestisce query limitate a un intervallo temporale."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.compressionlevel]
impact = "Valori più alti possono ridurre l'uso del disco al costo di un maggiore carico CPU in scrittura."
summary = "Livello DEFLATE usato solo quando riduce la dimensione di una colonna di metriche codificata."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.enabled]
impact = "Disabilitare l'archiviazione mantiene le istantanee web in tempo reale, ma non registra nuovi campioni storici. La cronologia esistente resta leggibile."
summary = "Salva la cronologia dei campionatori in plugins/React/history."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.fifteenminuteretentiondays]
impact = "Le aggregazioni di un'ora conservano la copertura storica dopo la scadenza di questo livello."
summary = "Conservazione in giorni delle aggregazioni di quindici minuti. Zero conserva questo livello indefinitamente."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.livecaptureintervalms]
impact = "Valori più bassi migliorano la fedeltà dei grafici in tempo reale, ma interrogano più spesso tutti i campionatori registrati."
summary = "Cadenza dell'istantanea autorevole dei campionatori in tempo reale, in millisecondi."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.maxquerypoints]
impact = "Valori più alti migliorano la risoluzione del grafico al costo della dimensione della risposta e del lavoro di query."
summary = "Numero massimo di intervalli accettati per ogni serie in una query storica."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.maxqueryseries]
impact = "Valori più alti possono creare frame di inoltro più grandi e più letture simultanee dal disco."
summary = "Numero massimo di serie accettate da una query storica."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.minuteretentiondays]
impact = "La copertura meno recente resta disponibile tramite aggregazioni a risoluzione inferiore."
summary = "Conservazione in giorni delle aggregazioni di un minuto. Zero conserva questo livello indefinitamente."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.querypagepoints]
impact = "Le pagine restano limitate per i timeout dell'inoltro e delle richieste del browser."
summary = "Numero massimo di intervalli restituiti per serie in una pagina di risposta storica."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.rawretentionhours]
impact = "La copertura meno recente resta disponibile tramite aggregazioni a risoluzione inferiore."
summary = "Conservazione in ore dei campioni esatti di un secondo. Zero conserva questo livello indefinitamente."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.tensecondretentiondays]
impact = "La copertura meno recente resta disponibile tramite aggregazioni a risoluzione inferiore."
summary = "Conservazione in giorni delle aggregazioni di dieci secondi. Zero conserva questo livello indefinitamente."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.walforceintervalms]
impact = "Un arresto anomalo del processo o dell'host può perdere al massimo questa finestra recente; valori più bassi aumentano le scritture forzate su disco."
summary = "Tempo massimo tra le scritture forzate del giornale della cronologia, in millisecondi."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller]
description = "Gestisce i metadati degli oggetti mappa di React, la riparazione dei renderer e l'invio in tempo reale dei pacchetti mappa per inventari e cornici."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemapidlepushintervalms]
impact = "Valori più alti riducono il volume di pacchetti a riposo quando i giocatori sono vicini ma non guardano la mappa."
summary = "Intervallo di invio dei pacchetti per gli spettatori vicini che non stanno guardando attivamente la mappa nella cornice (millisecondi)."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemaplookdotthreshold]
impact = "I valori più elevati richiedono un obiettivo più stretto sulla mappa prima che vengano inviati aggiornamenti ad alta frequenza."
summary = "Prodotto scalare minimo della direzione dello sguardo necessario per considerare un giocatore intento a guardare una mappa nella cornice."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemappushintervalms]
impact = "Valori più bassi aggiornano più rapidamente la grafica della mappa ma aumentano il carico di pacchetti e rendering."
summary = "Intervallo di invio dei pacchetti per le mappe attive nelle cornici, in millisecondi."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemappushoutsiderangewhenholding]
impact = "Disattiva per interrompere del tutto i pacchetti di mappa fuori dal raggio; attiva se tenere la mappa in mano deve ignorare i controlli di distanza."
summary = "Consente gli aggiornamenti della mappa tenuta in mano al di fuori di frameMapPushRadiusBlocks."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemappushradiusblocks]
impact = "I valori più elevati coprono più spettatori, ma aumentano il fanout dei pacchetti."
summary = "Raggio massimo in blocchi da una mappa nella cornice entro cui i giocatori ricevono aggiornamenti push."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemappushstateretentionms]
impact = "Valori più alti mantengono lo stato più a lungo con meno ricambio; valori più bassi eliminano in modo più aggressivo i dati di gestione."
summary = "Durata di conservazione dei dati di gestione degli invii delle mappe nelle cornici, in millisecondi."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemapredrawintervalms]
impact = "Valori più bassi aggiornano più rapidamente i pannelli nelle cornici; valori più alti riducono i ridisegni ridondanti per spettatore sulle pareti di mappe affollate."
summary = "Intervallo minimo tra i ridisegni del canvas per le mappe React nelle cornici, in millisecondi."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemaprequirelineofsight]
impact = "Attivandolo si eliminano i pacchetti verso gli spettatori che non vedono la mappa, ma si aggiungono leggeri controlli di visibilità."
summary = "Se abilitato, gli invii delle mappe nelle cornici richiedono la linea di vista per gli spettatori vicini (chi tiene la mappa in mano è escluso)."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemapvalidateintervalms]
impact = "Valori più bassi rilevano prima gli oggetti sostituiti nelle cornici; valori più alti evitano letture ripetute dei metadati degli oggetti a ogni tick di manutenzione."
summary = "Intervallo tra le riconvalide complete delle pile di oggetti delle mappe nelle cornici tracciate, in millisecondi."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.heldmapredrawintervalms]
impact = "Valori più bassi ruotano e aggiornano le mappe in mano in modo più fluido; valori più alti riducono il lavoro di rendering quando molti giocatori guardano la stessa mappa."
summary = "Intervallo minimo tra i ridisegni del canvas per le mappe React tenute in mano, in millisecondi."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.inventoryrepairbatchsize]
impact = "Valori più alti riducono il tempo di ripristino dopo il ricaricamento; valori più bassi riducono il lavoro di ogni passaggio."
summary = "Numero di inventari di giocatori online riparati per passaggio di manutenzione."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.inventoryrepaircadencems]
impact = "I valori inferiori riparano i metadati e i renderer della mappa più velocemente; i valori superiori riducono il lavoro per tick."
summary = "Cadenza di scansione degli inventari dei giocatori per la riparazione delle mappe React, in millisecondi."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.itemframechunkbatchsize]
impact = "Valori più alti accelerano il ripristino delle mappe nelle cornici dopo il ricaricamento; valori più bassi riducono il costo per passaggio."
summary = "Numero di chunk caricati analizzati per le mappe nelle cornici per passaggio di manutenzione."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.itemframerepaircadencems]
impact = "Valori più bassi sistemano più rapidamente le mappe nelle cornici dopo il ricaricamento; valori più alti riducono il sovraccarico di manutenzione."
summary = "Cadenza di scansione dei chunk caricati per la riparazione delle mappe nelle cornici, in millisecondi."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.maintenancetickintervalms]
impact = "Valori più bassi riparano prima inventari e cornici dopo il ricaricamento; valori più alti riducono il sovraccarico di manutenzione."
summary = "Cadenza principale di manutenzione per la logica di riparazione delle mappe, in millisecondi."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.megamapenabled]
impact = "Disattiva per mostrare ogni mappa in cornice come pannello indipendente 128x128."
summary = "Combina le mappe React adiacenti nelle cornici con lo stesso renderer in un'unica megamappa a riquadri."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.megamapmaxtiles]
impact = "Le pareti più grandi del budget ricadono sul rendering ingrandito a pannello singolo."
summary = "Budget totale di riquadri per una parete megamappa combinata."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.megamapsplitduplicates]
impact = "Disattivare per far condividere alle mappe clonate una sola immagine senza mai unirle."
summary = "Le mappe React clonate poste nelle cornici ricevono automaticamente nuovi ID di mappa, così le copie adiacenti possono unirsi in una parete megamappa."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.startupboostdurationms]
impact = "Valori più alti danno priorità più a lungo al ripristino rapido dopo il ricaricamento; valori più bassi tornano prima alla cadenza normale."
summary = "Durata del riscaldamento dopo l'avvio o un /reload, in cui il ripristino delle mappe usa un batching di riparazione aggressivo (millisecondi)."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.startupboostinventorybatchsize]
impact = "Valori più alti fanno recuperare più rapidamente gli inventari di mappe subito dopo il ricaricamento, a costo di lavoro temporaneo aggiuntivo."
summary = "Dimensione del batch di riparazione degli inventari mentre il riscaldamento di avvio è attivo."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.startupboostitemframechunkbatchsize]
impact = "Valori più alti fanno recuperare più rapidamente le mappe nelle cornici subito dopo il ricaricamento, a costo di lavoro temporaneo aggiuntivo."
summary = "Dimensione del batch di riparazione dei chunk con cornici mentre il riscaldamento di avvio è attivo."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.startupframemappushintervalms]
impact = "Valori più bassi fanno comparire più rapidamente le mappe nelle cornici dopo il ricaricamento; valori più alti riducono le raffiche temporanee di pacchetti durante il riscaldamento."
summary = "Intervallo di invio dei pacchetti usato durante il riscaldamento di avvio, in millisecondi."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemappushbatchsize]
summary = "Numero massimo di mappe tracciate nelle cornici considerate per l'invio di pacchetti a ogni passaggio di manutenzione."
impact = "Valori più alti aggiornano prima le pareti di mappe molto grandi; valori più bassi limitano il carico dello scheduler e della ricerca di entità."

[config.documentation.annotation.art.arcane.react.core.controller.incidentcontroller]
description = "Conserva prove strutturate degli incidenti per il plugin e il visualizzatore web."

[config.documentation.annotation.art.arcane.react.core.controller.incidentcontroller.field.persistenceenabled]
impact = "Disabilitando la persistenza si conserva solo la cronologia dell'esecuzione corrente."
summary = "Salva la cronologia strutturata degli incidenti in plugins/React/incidents.json."

[config.documentation.annotation.art.arcane.react.core.controller.incidentcontroller.field.retention]
impact = "Valori più alti conservano più cronologia e usano più memoria e spazio su disco."
summary = "Numero massimo di eventi di incidente strutturati conservati."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration]
description = "Configurazione globale di React. Controlla il layout di monitoraggio predefinito, la regolazione del modello di valore e il comportamento della diagnostica."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.adaptabilityopsmetricmode]
impact = "Non controlla le soglie di pressione sulle prestazioni. ALL_CHECKS viene normalizzato a SUCCESSFUL_CHECKS durante l'esecuzione."
summary = "Seleziona quale frequenza di operazioni delle abilità di Adapt React mostra e include come contesto degli avvisi. Opzioni: SUCCESSFUL_CHECKS, ALL_CHECKS."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.customcolors]
impact = "Imposta false per mantenere l'output più vicino al comportamento dei colori vanilla o predefinito."
summary = "Abilita la colorazione personalizzata nelle viste del monitor."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.debug]
impact = "Usa durante le sessioni di debug; disattiva per il normale funzionamento in produzione."
summary = "Abilita il log di debug e diagnostica aggiuntiva."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.integrationsecretsenabled]
impact = "Disattivato per impostazione predefinita. Attiva per consentire i pacchetti segreti di Iris e Adapt quando le dipendenze sono presenti."
summary = "Abilita le funzioni di integrazione segrete vincolate ai plugin."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.integrationsnapshotmaxmetrics]
impact = "Limitato a un valore da 1 a 65536. Le modifiche cancellano le pubblicazioni in cache nel successivo ciclo di raccolta di un secondo."
summary = "Numero massimo di metriche distinte conservate per le richieste di istantanee delle integrazioni."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.language]
impact = "L'inglese incluso nel codice rimane la lingua di riserva; i cataloghi TOML modificabili vengono caricati da languages."
summary = "Lingua usata per le interfacce di React per giocatori e operatori."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.metrics]
impact = "Imposta false per interrompere gli invii di React a bStats. Le modifiche vengono applicate automaticamente."
summary = "Abilita la segnalazione anonima di utilizzo bStats per React."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.monitoring]
impact = "Le modifiche influenzano la composizione della dashboard di monitoraggio di base e il raggruppamento dei campionatori."
summary = "Layout del monitor predefinito mostrato ai giocatori."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.priority]
impact = "Cambiare questi pesi può alterare il comportamento di culling, coda e visibilità."
summary = "Modello di priorità delle entità usato da più sottosistemi di React."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.slowticklogmode]
impact = "OFF sopprime gli avvisi di tick lenti. BLAME evidenzia la probabile responsabilità di plugin o carico di lavoro. SHORT registra solo i tempi minimi. DETAILED registra l'intero payload diagnostico."
summary = "Controlla come vengono registrati gli avvisi di tick lenti. Opzioni: OFF, BLAME, SHORT, DETAILED."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.unsafebytecode]
impact = "Disabilitato per impostazione predefinita. Le funzionalità NMS specifiche della versione possono comunque collegare la propria strumentazione quando vengono attivate. La strumentazione collegata rimane fino al riavvio della JVM."
summary = "Collega l'agente ByteBuddy generale di React all'avvio o quando viene abilitato durante l'esecuzione."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.value]
impact = "Valori più alti possono aumentare l'influenza degli oggetti costosi nei calcoli."
summary = "Regolazione del valore dei materiali usata per l'analisi di ricette e valori."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.verbose]
impact = "Utile per la risoluzione dei problemi, ma può generare molto rumore nel registro."
summary = "Abilita l'output dettagliato della console per le parti interne di React."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration_monitoring]
description = "Configurazione predefinita della dashboard del monitor dei giocatori."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration_monitoring.field.actionbarheaderslots]
impact = "Valori più alti riducono la paginazione orizzontale, ma possono rendere le voci più difficili da leggere se le etichette sono lunghe."
summary = "Numero massimo di gruppi del monitor mostrati contemporaneamente nella barra delle azioni."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration_monitoring.field.actionbarsamplerslots]
impact = "Valori più alti riducono la paginazione all'interno di un gruppo, ma possono compromettere la leggibilità sui display piccoli."
summary = "Numero massimo di campionatori mostrati contemporaneamente nella riga evidenziata della barra delle azioni."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration_monitoring.field.monitorconfiguration]
impact = "Modificarlo cambia la struttura di base del pannello di monitoraggio per le nuove impostazioni."
summary = "Gruppi del monitor e campionatori predefiniti mostrati ai giocatori."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration_valueconfig]
description = "Configurazione del valore dei materiali per i calcoli di valore e ponderazione di React."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration_valueconfig.field.basevalue]
impact = "Valori più alti aumentano globalmente la valutazione di base."
summary = "Valore di base dei materiali prima delle regolazioni di ricette e sostituzioni."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration_valueconfig.field.maxrecipelistprecaution]
impact = "Valori più alti consentono un'esplorazione più profonda delle ricette ma possono aumentare il costo di elaborazione."
summary = "Limite di sicurezza per evitare che l'attraversamento di ricette profonde o cicliche vada fuori controllo."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration_valueconfig.field.valuemutlipliers]
impact = "Moltiplicatori più alti rendono specifici materiali più influenti nei calcoli del valore."
summary = "Moltiplicatori per materiale che sostituiscono la valutazione predefinita."

