summary = "Raggio del gruppo in blocchi; le esplosioni nello stesso mondo così vicine tra loro vengono unite in un unico pacchetto."

[config.documentation.annotation.art.arcane.react.content.feature.featureexplosionpacketbatching.field.releaseticktimems]
