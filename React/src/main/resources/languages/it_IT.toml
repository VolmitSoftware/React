[config.documentation.annotation.art.arcane.react.content.feature.featurehopperchaincoalescing]
description = "Configurazione della funzione Hopper Chain Coalescing. Rileva le catene lineari di tramogge e riporta il risparmio di tick previsto. Per impostazione predefinita resta in sola misurazione; in modalità act, con l'hook delle tramogge specifico della versione, i tick intermedi idonei vengono saltati e viene sintetizzato un unico trasferimento dalla testa alla coda. I trasferimenti sintetizzati si coordinano con il controllo di FeatureHopperTokenBucket invece di annullare direttamente InventoryMoveItemEvent."

[config.documentation.annotation.art.arcane.react.content.feature.featurehopperchaincoalescing.field.bypassradius]
impact = "Valori più alti proteggono una zona più ampia attorno ai giocatori; valori più bassi contano le catene più vicine ai giocatori."
summary = "Raggio di esclusione attorno ai giocatori in blocchi; le catene che toccano questo raggio saltano il conteggio dell'accorpamento."

[config.documentation.annotation.art.arcane.react.content.feature.featurehopperchaincoalescing.field.engageonincident]
impact = "Valori più alti riservano l'accorpamento agli incidenti gravi; valori più bassi intervengono prima."
summary = "Soglia di attivazione per usare il conteggio dell'accorpamento invece del rilevamento passivo (punteggio di incidente)."

[config.documentation.annotation.art.arcane.react.content.feature.featurehopperchaincoalescing.field.engageontickms]
impact = "Valori più alti ritardano l'attivazione; valori più bassi rendono la soglia più facile da superare."
summary = "Soglia del tempo di tick per attivare il conteggio dell'accorpamento (millisecondi)."

[config.documentation.annotation.art.arcane.react.content.feature.featurehopperchaincoalescing.field.featureactmode]
impact = "Attivandolo si accorpano davvero i trasferimenti dalla testa alla coda; disattivandolo si resta in modalità di sola misurazione."
summary = "Salta l'elaborazione dei tick intermedi delle tramogge quando le catene sono idonee al percorso rapido (modalità act)."

[config.documentation.annotation.art.arcane.react.content.feature.featurehopperchaincoalescing.field.featurebucketbypass]
impact = "Attivandolo i trasferimenti accorpati funzionano indipendentemente dal budget del bucket; disattivandolo la catena torna ai tick vanilla quando il bucket rifiuterebbe lo spostamento."
summary = "Esclude il controllo di FeatureHopperTokenBucket quando si sintetizzano i trasferimenti dalla testa alla coda (solo modalità act)."

[config.documentation.annotation.art.arcane.react.content.feature.featurehopperchaincoalescing.field.minchainlength]
