[config.documentation.annotation.art.arcane.react.content.action.actionunknown]
description = "Configurazione dell'azione Unknown. Segnaposto disabilitato usato come protezione quando la risoluzione dell'azione fallisce."

[config.documentation.annotation.art.arcane.react.content.feature.featureactivationrangegovernor]
description = "Configurazione della funzione Activation Range Governor. Riduce temporaneamente gli intervalli di attivazione delle entità per mondo mentre il server è sotto pressione prolungata, così il server stesso disattiva le entità lontane invece di eseguirne i tick. A differenza di dynamic-activation-range (che campiona e mette in pausa le entità una per una), questi intervalli vengono letti dal server a ogni tick e si applicano subito a tutte le entità. Gli intervalli e i tick degli abitanti vengono ripristinati quando il server si riprende."

[config.documentation.annotation.art.arcane.react.content.feature.featureactivationrangegovernor.field.animalrangefactor]
impact = "Valori più bassi disattivano prima gli animali lontani durante le finestre di pressione."
