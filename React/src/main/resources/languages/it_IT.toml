summary = "Controlla se in «fast fluids» si applica «accelerazione della lava»."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids.field.acceleratewater]
impact = "Attiva per accelerare le catene di flusso dell'acqua; disattiva per lasciare l'acqua ai tempi vanilla."
summary = "Controlla se in «fast fluids» si applica «accelerazione dell'acqua»."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids.field.extravanillaticksperevent]
impact = "Valori più alti comprimono più aggiornamenti dei fluidi in meno tick del server ma possono aumentare il lavoro dei fluidi per tick."
summary = "Tick vanilla aggiuntivi dei fluidi messi in coda per ogni evento di flusso dei fluidi in fast fluids."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids.field.maxburstticksperlocationperservertick]
