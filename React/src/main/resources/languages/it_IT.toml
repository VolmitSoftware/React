[config.documentation.annotation.art.arcane.react.content.feature.featureredstoneclockgovernor.field.onlythrottlewithoutnearbyplayers]
impact = "Attiva per proteggere i meccanismi vicini ai giocatori; disattiva per applicare la regola in modo rigoroso."
summary = "Se true, redstone clock governor limita solo gli orologi senza giocatori vicini."

[config.documentation.annotation.art.arcane.react.content.feature.featureredstoneclockgovernor.field.tickintervalms]
impact = "Valori più bassi reagiscono più velocemente ma consumano più CPU; valori più alti riducono il sovraccarico ma reagiscono più tardi."
summary = "Intervallo di valutazione principale per «redstone clock governor» in millisecondi."

[config.documentation.annotation.art.arcane.react.content.feature.featureredstoneclockgovernor.field.windowms]
impact = "Finestre più lunghe smussano i picchi ma reagiscono più lentamente; finestre più brevi reagiscono più velocemente ma sono più sensibili."
summary = "Lunghezza della finestra mobile di applicazione usata da redstone clock governor, in millisecondi."

[config.documentation.annotation.art.arcane.react.content.feature.featurespawnburstlimiter]
