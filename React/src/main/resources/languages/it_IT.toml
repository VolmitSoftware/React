[config.documentation.annotation.art.arcane.react.content.tweak.tweakspawnerplayerradius.field.enforcetrialspawnerspawns]
impact = "Attivare questo comportamento; disabilitare il mantenimento di tale percorso inattivo."
summary = "Controlla se il raggio del giocatore di spawner applica le uova di prova."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakspawnerplayerradius.field.onlymonsters]
