[config.documentation.annotation.art.arcane.react.content.feature.featurespawnburstlimiter.field.maxspawnsperchunkwindow]
impact = "Valori più alti consentono picchi più ampi prima che il controllo intervenga; valori più bassi limitano i picchi prima."
