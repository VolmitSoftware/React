summary = "Controlla se il raggio del giocatore di spawner applica solo i mostri."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakspawnerplayerradius.field.requiredplayerdistance]
impact = "Valori più elevati ampliano l'area di ricerca e costano più lavoro; valori inferiori portata stretta ed eseguire meno costosi."
