summary = "Tempo minimo (in tick) che un chunk deve trascorrere fuori dalla distanza di simulazione prima di essere fatto avanzare. Le assenze più brevi vengono ignorate."

[config.documentation.annotation.art.arcane.react.content.feature.featurecropfastforward.field.releaseonincident]
impact = "Valori più alti riprendono prima dopo una fase di quiete; valori più bassi mantengono l'avanzamento rapido disattivato più a lungo per stabilità."
summary = "Punteggio di incidente sotto il quale l'avanzamento rapido può riprendere dopo una precedente sospensione."

