[config.documentation.annotation.art.arcane.react.content.tweak.tweakvehicleidlebrake.field.minvelocitysquared]
impact = "I valori più elevati richiedono segnali più forti prima dell'azione; i valori inferiori rendono questa condizione più facile da soddisfare."
summary = "Velocità minima quadrata richiesta dal freno di scarico del veicolo."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakvehicleidlebrake.field.onlyemptyvehicles]
impact = "Attivare questo comportamento; disabilitare il mantenimento di tale percorso inattivo."
summary = "Controlla se il freno di scarico del veicolo applica solo veicoli vuoti."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakvehicleidlebrake.field.tickintervalms]
impact = "I valori più bassi reagiscono più velocemente ma consumano di più CPU; valori più elevati riducono la testa sopraelevata ma reagiscono in seguito."
