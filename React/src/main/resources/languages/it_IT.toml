summary = "Il raggio di lettore non sicuro utilizzato dalla rete tramoggia normalizza (blocks)."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.world]
impact = "Impostare un nome del mondo per le azioni di portata lì, o lasciare vuoto per includere tutti i mondi."
summary = "Il filtro di nome mondiale per la rete tramoggia normalizza le operazioni."

