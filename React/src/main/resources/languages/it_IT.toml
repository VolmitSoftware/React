[config.documentation.annotation.art.arcane.react.api.web.webconfiguration]
description = "Configurazione dell’API di gestione HTTP/WebSocket integrata in React. Le modifiche vengono applicate automaticamente al salvataggio di web.toml."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.advertisedurl]
impact = "Imposta l’URL HTTPS di un proxy inverso se il listener è accessibile dall’esterno di localhost. Il listener integrato di React continua a supportare solo HTTP. Le modifiche vengono applicate automaticamente al salvataggio di web.toml."
summary = "URL pubblico di base comunicato ai client API diretti."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.listenaddress]
impact = "L'indirizzo predefinito :: accetta traffico IPv6 e IPv4 mappato per accessi da LAN, container e inoltro delle porte. Usa un indirizzo di loopback solo dietro un proxy inverso o relay sullo stesso host."
summary = "Indirizzo IP a cui si associa il listener web."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.corsorigins]
impact = "Una lista vuota permette tutte le origini. Aggiungi origini specifiche per limitare l'accesso all'origine incrociata."
summary = "Elenco delle origini CORS consentite per l'API HTTP."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.listenerenabled]
impact = "React apre l'API autenticata per impostazione predefinita. Imposta false per non aprire alcun listener HTTP o WebSocket."
summary = "Abilita il listener web integrato."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.port]
impact = "Se questa porta è occupata, React prova le 99 porte successive in ordine e usa la porta effettivamente associata per la connessione locale del relay e gli URL diretti generati quando advertisedUrl è vuoto. Il salvataggio di web.toml riavvia automaticamente il listener."
summary = "Porta TCP preferita per il server web."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.relayenabled]
impact = "Se true, React si collega al broker relay all'indirizzo relayUrl, così l'app companion può raggiungere i server dietro NAT senza inoltro delle porte."
summary = "Abilita il client relay cloud in uscita per l'attraversamento NAT."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.relayurl]
impact = "Viene letto solo quando relayEnabled è true. Lascia vuoto quando il relay è disabilitato."
summary = "URL WSS di base del broker relay, ad esempio wss://relay.arcane.art; il percorso /agent viene aggiunto automaticamente."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.requiretokenforreads]
impact = "Se true, le richieste GET non autenticate vengono rifiutate con 401. Imposta false solo in ambienti di rete completamente attendibili."
summary = "Richiede un token di autenticazione valido per gli endpoint HTTP di sola lettura."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.wspushhz]
impact = "Valori più alti aumentano la fedeltà degli aggiornamenti push, ma anche il carico di rete e CPU."
summary = "Frequenza obiettivo (Hz) con cui gli aggiornamenti dei campionatori vengono inviati sulle connessioni WebSocket."

[config.documentation.annotation.art.arcane.react.content.action.actioncollectgarbage]
description = "Configurazione dell'azione Collect Garbage. Richiede la raccolta dei rifiuti della JVM e riporta subito l'heap recuperato."

[config.documentation.annotation.art.arcane.react.content.action.actioncollectgarbage_params.field.postgcwaitticks]
impact = "Valori più alti concedono ai garbage collector della JVM più tempo per stabilizzarsi; valori più bassi riportano più rapidamente ma possono sottostimare la memoria recuperata."
summary = "Tick da attendere dopo la richiesta di GC prima di campionare la memoria."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize]
description = "Configurazione dell'azione Hopper Network Normalize. Interviene sugli hotspot delle tramogge, unisce le entità oggetto e può scaricare i chunk carichi inattivi."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.itemmergeradius]
impact = "Valori più alti ampliano l'area di ricerca e richiedono più lavoro; valori più bassi restringono l'ambito e costano meno."
summary = "Raggio di unione degli oggetti usato da «hopper network normalize» (blocchi)."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.maxchunks]
impact = "I valori più elevati permettono un maggiore throughput prima dell'intervento; i valori inferiori rendono la mitigazione più aggressiva."
summary = "Numero massimo di chunk in «hopper network normalize»."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.maxmergeditementitiesperchunk]
impact = "Valori più alti consentono picchi più ampi prima che il controllo intervenga; valori più bassi limitano i picchi prima."
summary = "Numero massimo di entità oggetto unite per chunk in «hopper network normalize»."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.minimumhopperupdatesperchunk]
impact = "I valori più elevati richiedono segnali più forti prima dell'azione; i valori inferiori rendono questa condizione più facile da soddisfare."
summary = "Numero minimo di aggiornamenti delle tramogge per chunk in «hopper network normalize»."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.unloadidlehotchunks]
impact = "Attiva per applicare questo comportamento; disattiva per lasciare inattivo questo percorso."
summary = "Controlla se in «hopper network normalize» si applica «scaricare i chunk carichi inattivi»."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.unsafeplayerradius]
impact = "Valori più alti ampliano l'area di ricerca e richiedono più lavoro; valori più bassi restringono l'ambito e costano meno."
summary = "Raggio dei giocatori non sicuro usato da «hopper network normalize» (blocchi)."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.world]
impact = "Imposta il nome di un mondo per limitare le azioni a quel mondo, oppure lascia vuoto per includere tutti i mondi."
summary = "Filtro per nome del mondo per le operazioni di «hopper network normalize»."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook]
description = "Esegue le mitigazioni pertinenti agli incidenti una alla volta, osserva la pressione tra un'azione e l'altra e termina dopo i loro esiti finali."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.includegarbagecollection]
impact = "Disattivato per impostazione predefinita perché una raccolta esplicita può mettere in pausa il server."
summary = "Consente una fase di garbage collection quando l'uso dell'heap supera il 90%, l'heap recuperabile stimato supera il 10% e il tempo di GC resta sotto il 2%."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.tieroverride]
impact = "Sostituisce solo l'intensità; restano necessari evidenze pertinenti e una pressione sostenuta."
summary = "Forza l'intensità della mitigazione da 0 a 2; -1 sceglie in base alla pressione osservata."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.world]
impact = "Lascia vuoto per selezionare, per ogni mitigazione, il mondo con le evidenze più forti."
summary = "Filtro per chiave del mondo per le operazioni della procedura per incidenti."

[config.documentation.annotation.art.arcane.react.content.action.actionprewarmcriticalchunks]
description = "Configurazione dell'azione Prewarm Critical Chunks. Precarica i chunk ad alto rischio e quelli adiacenti per ridurre i picchi di scatti."

[config.documentation.annotation.art.arcane.react.content.action.actionprewarmcriticalchunks_params.field.generatemissingchunks]
impact = "Attiva per applicare questo comportamento; disattiva per lasciare inattivo questo percorso."
summary = "Controlla se in «prewarm critical chunks» si applica «generare i chunk mancanti»."

[config.documentation.annotation.art.arcane.react.content.action.actionprewarmcriticalchunks_params.field.includeplayerchunks]
impact = "Attiva per includere quei bersagli nell'elaborazione; disattiva per escluderli."
