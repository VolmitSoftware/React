[config.documentation.annotation.art.arcane.react.content.feature.featurehopperchaincoalescing]
description = "Configurazione per la funzione tramoggia Chain Coalescing. Rileva catene lineari di N tramogge alimentando nella stessa direzione e proietta quanti tick per trasferimento tramoggia collasserebbero in un unico tiraggio battuta testa-da-cola per catena per tick. Opera in modalità solo misura: rilevamento della catena più tick risparmiato a livello di progetto esposto tramite lettore di metriche di raccolta di catena. Cancellare le spedizioni intermedi InventoryMoveItemEvent si schiantano con l'ordine del consumo di secche di FeatureHopperTokenBucket, quindi il movimento battuta effettivo viene differito da un ponte NMS dedicato."

[config.documentation.annotation.art.arcane.react.content.feature.featurehopperchaincoalescing.field.bypassradius]
impact = "I valori più elevati proteggono una zona più ampia intorno ai giocatori; i valori inferiori contano catene più vicine ai giocatori."
summary = "Bypass raggio intorno ai giocatori in blocchi; catene toccando questo raggio saltare la contabilità di carbonizzazione."

[config.documentation.annotation.art.arcane.react.content.feature.featurehopperchaincoalescing.field.engageonincident]
impact = "I valori più elevati si riservano di carbonizzare per gravi incidenti; i valori inferiori sono in grado di coinvolgere prima."
summary = "Soglia di trigger per l'impegnazione della contabilità di carbonizzazione piuttosto che il rilevamento passivo (partitura dei conti)."

[config.documentation.annotation.art.arcane.react.content.feature.featurehopperchaincoalescing.field.engageontickms]
impact = "Attivazione di ritardo dei valori più elevati; i valori inferiori rendono questa soglia più facile da attraversare."
summary = "TEMPO di tick per l'impegno della contabilità connessiva (millisecondi)."

[config.documentation.annotation.art.arcane.react.content.feature.featurehopperchaincoalescing.field.featureactmode]
