[config.documentation.annotation.art.arcane.react.content.feature.featureactivationrangegovernor]
description = "Configurazione per la funzione di Governatore della gamma di attivazione. Scalera temporaneamente le fasce di attivazione delle entità a livello mondiale mentre il server è sotto pressione sostenuta, quindi il server stesso disattiva le entità distanti invece di eseguire un ciclo di elaborazione del server per loro. A differenza dell'( di gamma di attivazioni dinamiche che campiona e sospende le entità una dopo l'altra in ), questi intervalli vengono letti dal server ogni tick e applicati immediatamente a tutte le entità. Le fasce e i villaggi che eseguono un ciclo di trattamento del server sono ripristinati una volta che il server si recupera."

[config.documentation.annotation.art.arcane.react.content.feature.featureactivationrangegovernor.field.animalrangefactor]
impact = "I valori inferiori disattivano gli animali lontani prima durante le finestre di pressione."
summary = "Fattore di scala applicato alla gamma di attivazione animale durante il fidanzamento."

[config.documentation.annotation.art.arcane.react.content.feature.featureactivationrangegovernor.field.engageticktimems]
