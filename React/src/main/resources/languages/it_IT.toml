summary = "Salta la lavorazione tick tramoggia intermedio quando le catene sono idonee a percorso rapido (act mode)."

[config.documentation.annotation.art.arcane.react.content.feature.featurehopperchaincoalescing.field.featurebucketbypass]
impact = "L'attivazione consente i trasferimenti fusi a funzionare indipendentemente dal budget del secchio; l'attivazione riduce la catena alla vaniglia eseguendo un ciclo di elaborazione server per quando il secchio rifiuterà la mossa."
