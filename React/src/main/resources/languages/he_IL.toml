"config.documentation.annotation.art.arcane.react.content.feature.featurehopperchaincoalescing.description" = "הגדרות לתכונה של משפך Chain Coalescing. מגלה שרשראות לינאריות של N משפכים המזינים באותו כיוון ומנחש כמה טיקים יעברו על פי משפך ותחליף ימוטטו לתוך משיכה אחת ראש-ל-צוואר בשורה כל טיק. פועל במצב מדידה בלבד: זיהוי שרשרת ועוד טיקים מוגנת מופגנת באמצעות דוגם מדדים הקואלס. ביטול רשימות ביניים InventoryMoveItemEvent מתנגשות עם סדר צריכת דלי FeatureHopperTokenBucket, כך שהניעה המובילה בפועל נדחה לגשר NMS מיוחד."
