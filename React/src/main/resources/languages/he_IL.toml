# React — he_IL
#
# === עריכת הקובץ ===
# plugins/React/languages/he_IL.toml
# אפשר לערוך קובץ זה ישירות. שינויים מקומיים נשמרים; ערכים חסרים או לא תקינים משתמשים באנגלית המובנית.
# /react language server edit he_IL
#
# === קידומת ===
# runtime.prefix: הקידומת ש-React מוסיף לפני הודעות צ'אט עם קידומת.
#
# === עיצוב ===
# הודעות צ'אט תומכות בקודי צבע עם &: &cטקסט&r, &lטקסט&r.
# צבעים: &0-&9 ו-&a-&f.
# סגנונות: &l מודגש, &o נטוי, &n קו תחתון, &m קו חוצה, &k תווים משובשים, &r איפוס.
# קודי צבע מבטלים סגנונות פעילים; מקם את הצבע לפני הסגנונות, כמו ב-&3&lטקסט&r. הקוד &r מאפס את כל העיצוב.
# צבעי RGB משתמשים ב-&#RRGGBBטקסט&r, למשל &#55AAFFטקסט&r.
# השתמש ב-MiniMessage לאפקטים מתקדמים ולאינטראקציות; אל תשלב תגיות MiniMessage וקודי & באותה הודעה. סגור תגיות בסדר הפוך לפתיחתן.
# הקפד על מירכאות ורצפי מילוט תקינים ב-TOML.
# השתמש ברצף \n בתוך מחרוזות TOML במירכאות למעבר שורה; {{ ו-}} מציגים סוגריים מסולסלים מילוליים.
# הערכים של renderer.* ושל config.documentation.annotation.* הם טקסט פשוט.
# הערכים של test.* הם טקסט פשוט, פרט להודעות test.result.* התומכות בעיצוב.
# שמור את מצייני המיקום בטקסט ההודעה, מחוץ לתגיות MiniMessage.
#
# === משתנים ===
# יש לשמור על שמות המשתנים ולהשתמש רק במשתנים הקיימים בכל הודעה.
#   {action}  שם הפעולה או כיוון התאמת הצבע
#   {actions}  מספר הפעולות בתור או רשימת שמות הפעולות שהוחרגו
#   {active}  מספר התכונות או הכוונונים הפעילים
#   {actor}  משתמש האינטרנט שביצע שינוי
#   {added}  האם תכונה הצטרפה מחדש למרשם הפעיל לאחר הפעלתה; הודעות שנוספו בעדכון שפה
#   {after}  ערך תצורה, הודעת שפה או שימוש בערימה לאחר שינוי
#   {age}  גיל נתוני האינטגרציה בשניות
#   {amount}  מספר הפריטים להענקה
#   {architecture}  ארכיטקטורת CPU
#   {argument}  ארגומנט פקודה לא צפוי
#   {available}  מספר ידיות גשר NMS הזמינות
#   {average}  ממוצע TPS או אלפיות שנייה לטיק
#   {avg_mspt}  ממוצע אלפיות שנייה לטיק במהלך סבב בדיקת עומס
#   {avg_tps}  ממוצע טיקים לשנייה במהלך סבב בדיקת עומס
#   {bar}  סרגל ציון ביצועים מעוצב
#   {before}  ערך תצורה, הודעת שפה או שימוש בערימה לפני שינוי
#   {checked}  מספר הדוגמים שנבדקו
#   {chunks}  מספר הצ'אנקים שהושפעו מפעולה
#   {code}  קוד צימוד לממשק האינטרנט
#   {command}  נתיב הפקודה
#   {count}  מספר הרשומות, המודולים, השינויים או ממצאי הבדיקה
#   {current}  מספר העמוד הנוכחי
#   {delta_heap}  הפרש השימוש בערימה בסיום בין React לקו הבסיס, ב-MB
#   {delta_mspt}  הפרש זמן הטיק הממוצע בין React לקו הבסיס, ב-ms
#   {delta_tps}  הפרש ה-TPS הממוצע בין React לקו הבסיס
#   {detail}  פרטי אבחון של גשר, אינטגרציה, פעולה או בדיקה
#   {dimensions}  מידות רשת קיר המפות שזוהו
#   {direction}  כיוון סיבוב הגוון של הצבע שנבחר
#   {distance}  מרחק הצפייה, הסימולציה או השליחה המבוקש, בצ'אנקים
#   {duration}  זמן שחלף; הודעות תחילת בדיקת עומס משתמשות בשניות
#   {enabled}  מצב ההפעלה או מספר המודולים המופעלים
#   {entities}  מספר הישויות שהושפעו מפעולה
#   {entry}  רשומה בציר הזמן של האינטגרציה
#   {exceptions}  חריגות React שתועדו במהלך סבב בדיקת עומס
#   {fail}  מספר הבדיקות שנכשלו
#   {file}  שם קובץ תצורה, שפה או API של תוסף
#   {fingerprint}  טביעת אצבע של השרת או של אסימון אינטרנט
#   {finite}  מספר הדוגמים שמחזירים ערכים סופיים
#   {frames}  מספר מסגרות הפריטים בקיר המפות הפעיל
#   {free}  זיכרון פיזי או וירטואלי פנוי
#   {freed}  זיכרון ערימה שפונה באיסוף אשפה
#   {from}  מספר הרשומה הראשונה בעמוד הנוכחי
#   {grid}  מידות רשת קיר המפות
#   {ground_y}  גובה הקרקע לבדיקת הכבידה
#   {group}  קבוצת ניטור, דוגמים, מפות, תצורה או הודעות שפה
#   {growth}  גידול הערימה במהלך בדיקת עומס, ב-MB
#   {health}  מצב תקינות האינטגרציה
#   {heap_end}  שימוש בערימה בסיום סבב בדיקת עומס, ב-MB
#   {heap_start}  שימוש בערימה בתחילת סבב בדיקת עומס, ב-MB
#   {heartbeat}  הזמן מאז אות החיים האחרון של האינטגרציה
#   {height}  גובה משטח הבדיקה בפיקסלים
#   {hoppers}  מספר המשפכים שנורמלו
#   {id}  מזהה של ידית גשר, דוגם, מפה, פעולה, חבילה או אסימון
#   {impact}  תיאור השפעת התצורה
#   {incident}  מזהה פעולת האירוע הרקורסיבית שהוחרגה מחבילת בדיקות הפיתוח
#   {index}  מספר השלב הנוכחי בחבילת בדיקות הפיתוח
#   {invalid}  מספר הדוגמים עם קריאות לא תקינות
#   {issued_at}  זמן יצירת אסימון האינטרנט
#   {item}  שם או מזהה הפריט
#   {items}  מספר ישויות הפריטים שמוזגו
#   {kept}  עריכות מקומיות שנשמרו בעדכון שפה
#   {key}  מפתח פרמטר פקודה, מפתח תצורה או מזהה הודעת שפה
#   {label}  תווית של בדיקת ביצועים, מדד, הגדרה, פקודה או אסימון אינטרנט
#   {line}  מספר השורה הנערכת בהודעה מרובת שורות
#   {lines}  מספר שורות יומן השרת שנסרקו
#   {loaded}  מספר הצ'אנקים שנטענו לראשונה במהלך טעינה מקדימה
#   {locale}  קוד השפה המוצגת, הנבחרת או הנערכת
#   {matched}  עולמות שמצב השמירה האוטומטית שלהם תואם לקו הבסיס של הבדיקה
#   {max_tick}  הפער הארוך ביותר שנמדד בין טיקים בבדיקת עומס, ב-ms
#   {maximum}  מספר פריטים מרבי, סף זמן טיק או אורך קלט העורך
#   {message}  סיכום פעולה שהושלמה או הודעת מצב אינטגרציה
#   {metrics}  מספר המדדים שסופקו על ידי חבילת API של תוסף
#   {minecraft}  גרסת Minecraft
#   {minimum}  ערך TPS מזערי קביל
#   {missing}  מספר הדוגמים הנדרשים שחסרים במרשם
#   {mode}  מצב המשחק או מצב היכולת שנבחר
#   {model}  דגם CPU
#   {name}  שם בדיקת הביצועים, המודול, המרנדר או בדיקת האימות
#   {note}  הסיבה שיומן השרת לא נסרק
#   {offenders}  מספר הדוגמים שמחזירים ערכים לא סופיים
#   {options}  ערכי התצורה המותרים
#   {p95}  האחוזון ה-95 של זמן הטיק בבדיקת עומס, ב-ms
#   {parameter}  שם פרמטר הפקודה
#   {parameters}  פרמטרי פקודה שלא נעשה בהם שימוש
#   {pass}  מספר הבדיקות שעברו
#   {path}  נתיב מפתח תצורה או נתיב קובץ דוח
#   {percent}  אחוז התאמת צבע
#   {permission}  צומת ההרשאה הנדרש
#   {personal}  קוד השפה שבחר השחקן
#   {phase}  שלב מחזור החיים של התכונה הנבדקת
#   {pixels}  מספר הפיקסלים שאינם ריקים שצוירו בבדיקת מפה
#   {platform}  מערכת ההפעלה או פלטפורמת שרת Minecraft
#   {players}  מספר השחקנים המדומים בבדיקת עומס
#   {plugin}  שם התוסף
#   {process_load}  עומס CPU של תהליך השרת
#   {processors}  מספר מעבדי CPU הזמינים
#   {profile}  שם פרופיל התצורה של React
#   {protocol}  גרסת פרוטוקול האינטגרציה
#   {radius}  רדיוס בצ'אנקים לפעולה בחבילת בדיקות הפיתוח
#   {range}  הטווח המותר למרחק צפייה, סימולציה או שליחה, בצ'אנקים
#   {rate}  קצב האצת גידול היבולים שהוגדר
#   {rating}  דירוג ביצועים מעוצב
#   {react_errors}  מספר שורות השגיאה של React שנמצאו ביומן השרת
#   {reason}  הסבר לכשל, לדחייה או למצב לא זמין
#   {registered}  מספר המודולים הרשומים
#   {remaining}  הזמן שנותר עד בדיקת השפות הבאה
#   {removed_first}  האם הכיבוי הראשון הסיר תכונה מהמרשם הפעיל
#   {removed_second}  האם כיבוי חוזר הסיר תכונה מהמרשם הפעיל
#   {renderer}  שם או מזהה מרנדר המפה
#   {renderers}  רשימת מרנדרי מפות עם מזהים ריקים
#   {role}  תפקיד גישה לאינטרנט: viewer, operator או admin
#   {sampler}  שם או מזהה הדוגם
#   {samplers}  רשימת דוגמי האינטגרציה או הדוגמים שנכשלו
#   {scope}  תחום המפה או תחום הגדרת המרחק
#   {score}  ציון בדיקת הביצועים
#   {seconds}  ספירה לאחור או משך בדיקת עומס בשניות
#   {section}  מקטע בהגדרות או בעורך השפות
#   {server}  מימוש שרת Minecraft וגרסתו
#   {shown}  מספר השורות המוצגות כעת
#   {since_run}  שגיאות שדווחו מאז תחילת הבדיקה הנוכחית
#   {size}  מידות מרביות או פעילות של קיר המפות
#   {skip}  מספר הבדיקות שדולגו
#   {spawn_y}  הגובה שבו נוצר בלוק בדיקת הכבידה
#   {state}  מצב פעולה או חבילת API של תוסף
#   {status}  מצב האינטגרציה או תווית מצב התצורה
#   {subject}  המודול או ההגדרה המתוארים בעזרת התצורה
#   {subsystem}  שם תת-המערכת הנבדקת
#   {summary}  סיכום ביקורת פעולה
#   {system_load}  עומס CPU של המערכת כולה
#   {target}  עולם, שחקן, תוסף, הגדרה או קבוצת תוספים שאליהם מכוונת הפעולה
#   {threading}  מצב התהליכונים של השרת
#   {tick}  משך הטיק שחרג מסף הקפיאה, ב-ms
#   {tick_crashes}  מספר שורות קריסת טיק שנמצאו ביומן השרת
#   {tier}  דרגת החומרה בנוהל תגובה לאירוע
#   {timing}  זמן קריאות חוזרות של יכולת, באלפיות שנייה לדקה
#   {to}  מספר הרשומה האחרונה בעמוד הנוכחי
#   {total}  סך הרשומות, המודולים, העולמות, הבדיקות או הזיכרון בהודעה
#   {type}  סוג פרמטר פקודה, ערך תצורה, מפה או מרחק
#   {unavailable}  מספר ידיות גשר NMS שאינן זמינות
#   {unit}  תווית יחידה לסך הכול בתרשים עוגה
#   {unknown}  מזהה הפעולה הלא מוכרת שהוחרגה מחבילת בדיקות הפיתוח
#   {unreadable}  מספר הדוגמים שלא ניתן היה לקרוא
#   {updated}  הודעות ששונו בעדכון שפה
#   {uptime}  משך הפעולה הרציפה של מערכת ההפעלה המארחת
#   {url}  כתובת URL של דוח האבחון שהועלה
#   {usage}  תחביר השימוש בפקודה
#   {used}  זיכרון פיזי, זיכרון וירטואלי או ערימה שנמצאים בשימוש
#   {value}  הגדרה, מדידה או פרט חומרה מעוצבים
#   {values}  ערכים שנדגמו ומופיעים בדוח חבילת בדיקות הפיתוח
#   {variables}  שמות מצייני המיקום שההודעה הנערכת מקבלת
#   {vendor}  ספק Java
#   {version}  גרסת React, Java או הפלטפורמה
#   {warmed}  מספר הצ'אנקים שנטענו מראש
#   {warn}  מספר הבדיקות עם אזהרות
#   {width}  רוחב משטח הבדיקה בפיקסלים
#   {world}  שם עולם Minecraft

