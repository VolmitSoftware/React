"config.documentation.annotation.art.arcane.react.content.feature.featurehopperchaincoalescing.description" = "Konfiguracija piltuvas grandinės suderinimo funkcijai. Atpažįsta N piltuvai linijinius grandines, maitinančias tą pačią kryptį ir prognozuoja, kiek per piltuvas perdavimą žaidimo taktai padėtų į vieną iš galvų iki rytų serija per grandinę per žaidimo taktas. Veikia tik matuojant režime: grandinės atpažinimas plus projektuotas žaidimo taktai-spaustas atskleidžiamas per grandinę suderinimą metrikų skaitytuvas. Atšaukiant tarpinę InventoryMoveItemEvent išsiuntimus susiduria su FeatureHopperTokenBucket vario vartojimo tvarka, todėl faktinis serijas judėjimas nukreiptas į specialią NMS tiltą."
