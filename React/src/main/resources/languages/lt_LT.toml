"config.documentation.annotation.art.arcane.react.content.feature.featureexplosionpacketbatching.description" = "Sprogmenų paketų konfigūracija. Rinkti tą patį-žaidimo taktas sprogimai per pasaulį, klasterių juos mergeRadius, ir priemonės, kiek atskirų ClientboundExplodePackets būtų žlugti į vieną sulietą paketą per klasterio. Pranešimuose projektuojamas sprogimo iki paketo sumažinimas kaip kilimo laiko metrinė išraiška; apeina grupes, kurių bet koks sprogimas yra per bypassRadius grotuvo, kuris yra šalia stebėtojų žiūrėti vanilės animacija / garso ištikimybė. Pritaikytas kaip priemonė - tik kol Folia-saugus sintezuotas -explode- paketas NMS tiltas."
