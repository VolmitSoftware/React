#   {loaded}  Išankstinio paruošimo metu naujai įkeltų pasaulio segmentų skaičius
#   {locale}  Rodomas, pasirenkamas arba redaguojamas kalbos kodas
#   {matched}  Pasauliai, kurių automatinis išsaugojimas atitinka bazinę testo būseną
#   {max_tick}  Ilgiausias stebėtas tarpas tarp žaidimo ciklų apkrovos teste, ms
