"config.documentation.annotation.art.arcane.react.content.feature.featureexplosionpacketbatching.field.bypassradius.summary" = "Blokų spindulys aplink bet kokį klasterizuotą sprogimą; jei kuris nors žaidėjas yra šiame atstumu, klasteris išlaiko vanilės persprogimo paketo fanatai."
