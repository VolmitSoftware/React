"config.documentation.annotation.art.arcane.react.content.feature.featurelazygravity.description" = "„Lazy Gravity“ funkcijos konfigūracija. Stebi vanilla FallingBlock esybes laisvuose vertikaliuose keliuose ir apskaičiuoja, kiek judėjimo taktų būtų galima praleisti, jei nusileidimo taktas būtų deterministiškai nustatomas pagal atsiradimo vietą ir gravitacijos skaičiavimus, o ne kiekvieną taktą vykdant AI ir judėjimo apdorojimą. Numatytą praleidžiamų taktų skaičių pateikia kaip vykdymo metriką, kad operatoriai galėtų įvertinti poveikį prieš įdiegiant visą taktų praleidimo funkciją. Nepaiso krintančių blokų žaidėjo bypassRadius zonoje. Aktyvaus kelio pertrūkiai (bloko padėjimas, sulaužymas ar fizikos pokytis stulpelyje) grąžina stebimą esybę į vanilla fiziką."
