"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.description" = "Konfiguracija Shorthands funkcijai. Įdeda operatorių skersti kelio įsakymus, kuriuos galima konfigūruoti atskirai be /reload pakeitimų."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.customcommands.impact" = "Kiekvienas įjungtas įrašas dinamiškai prideda vieną komandą. Taikomais komandais vis dar vykdomi savo leidimai, o esantys komando ženklai yra apsaugoti, nebent overrideExisting yra įjungti."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.customcommands.summary" = "Įrašykite [customCommands.day] lentelę su enabled = true, command = \"time set day\", permission = \"react.shorthands.custom\" ir overrideExisting = false. Argumentus, užrašytus po šablono komandos, pridedami prie konfigūruoto įsakymo. Įstatyti žodį args į rankines įsakyme, kad juos įdėtų kažkur kitur."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.give.impact" = "Jei įjungtas, skerstis turi nekvalifikuotą /give komandą."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.give.summary" = "Registruoja /give <item> <amount> su Minecraft elementų lentelės užbaigimas."
