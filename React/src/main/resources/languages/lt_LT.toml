"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.gmc.summary" = "Registruoja /gmc, kad žaidėjas, kuris veikia komandą, persikeistų į kūrybinį režimą."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.gms.impact" = "Išjungti šią galimybę, jei /gms turėtų likti neregistruotas, kai yra aktyvi Shorthands funkcija."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.gms.summary" = "Registruoja /gms, kad žaidėjas, kuris veikia komandą, persikeistų į išgyvenimo režimą."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.gmsp.impact" = "Išjungti šią galimybę, jei /gmsp turėtų likti neregistruotas, kai yra aktyvi Shorthands funkcija."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.gmsp.summary" = "Registruoja /gmsp, kad žaidėjas, kuris veikia komandą, persikeistų į spektaklio režimą."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.more.impact" = "Išjungti šią galimybę, jei /more turėtų likti neregistruotas, kai yra aktyvi Shorthands funkcija."
