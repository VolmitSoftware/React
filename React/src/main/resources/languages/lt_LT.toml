# React — lt_LT
#
# === Failo redagavimas ===
# plugins/React/languages/lt_LT.toml
# Šį failą galima redaguoti tiesiogiai. Vietiniai pakeitimai išsaugomi; trūkstamiems ar netinkamiems įrašams naudojama integruota anglų kalba.
# /react language server edit lt_LT
#
# === Priešdėlis ===
# runtime.prefix: Priešdėlis, kurį React prideda prieš pokalbio pranešimus.
#
# === Formatavimas ===
# Pokalbio pranešimai palaiko spalvų kodus su &: &cTekstas&r, &lTekstas&r.
# Spalvos: &0-&9 ir &a-&f.
# Stiliai: &l paryškintas, &o kursyvas, &n pabrauktas, &m perbrauktas, &k sumaišyti simboliai, &r atstatymas.
# Spalvų kodai pašalina aktyvius stilius; spalvą rašykite prieš stilių, pvz., &3&lTekstas&r. &r atstato visą formatavimą.
# RGB spalvos rašomos taip: &#RRGGBBTekstas&r, pavyzdžiui, &#55AAFFTekstas&r.
# Naudokite MiniMessage spalvų perėjimams ir sąveikoms; nemaišykite MiniMessage žymų ir & kodų viename pranešime. Žymas uždarykite atvirkštine atidarymo tvarka.
# Išlaikykite taisyklingas TOML kabutes ir ekranavimo sekas.
# TOML eilutėse su kabutėmis naujai eilutei naudokite \n; {{ ir }} išveda pačius riestinius skliaustus.
# renderer.* ir config.documentation.annotation.* reikšmės yra paprastas tekstas.
# test.* reikšmės yra paprastas tekstas, išskyrus test.result.* pranešimus, kurie palaiko formatavimą.
# Kintamuosius naudokite pranešimo tekste, ne MiniMessage žymose.
#
# === Kintamieji ===
# Nekeiskite kintamųjų pavadinimų ir naudokite tik konkrečiame pranešime esančius kintamuosius.
#   {action}  Veiksmo pavadinimas arba spalvos keitimo kryptis
#   {actions}  Eilėje esančių veiksmų skaičius arba praleistų veiksmų pavadinimai
#   {active}  Aktyvių funkcijų arba patobulinimų skaičius
#   {actor}  Pakeitimą atlikęs žiniatinklio naudotojas
#   {added}  Ar po aktyvinimo funkcija grįžo į aktyvų registrą; kalbos atnaujinimo pridėtų pranešimų skaičius
#   {after}  Nustatymo reikšmė, kalbos pranešimas arba kaupo atmintis po pakeitimo
#   {age}  Integracijos duomenų amžius sekundėmis
#   {amount}  Duodamų daiktų skaičius
#   {architecture}  CPU architektūra
#   {argument}  Netikėtas komandos argumentas
#   {available}  Pasiekiamų NMS jungties nuorodų skaičius
#   {average}  Vidutinis TPS arba milisekundės vienam žaidimo ciklui
#   {avg_mspt}  Vidutinė žaidimo ciklo trukmė milisekundėmis apkrovos testo etape
#   {avg_tps}  Vidutinis žaidimo ciklų skaičius per sekundę apkrovos testo etape
#   {bar}  Suformatuota našumo testo balų juosta
#   {before}  Nustatymo reikšmė, kalbos pranešimas arba kaupo atmintis prieš pakeitimą
#   {checked}  Patikrintų matuoklių skaičius
#   {chunks}  Veiksmo paveiktų pasaulio segmentų skaičius
#   {code}  Žiniatinklio susiejimo kodas
#   {command}  Komandos kelias
#   {count}  Įrašų, modulių, pakeitimų arba testo rezultatų skaičius
#   {current}  Dabartinio puslapio numeris
#   {delta_heap}  React ir bazinio matavimo kaupo atminties skirtumas testo pabaigoje, MB
#   {delta_mspt}  React ir bazinio matavimo vidutinės ciklo trukmės skirtumas, ms
#   {delta_tps}  React ir bazinio matavimo vidutinio TPS skirtumas
#   {detail}  Jungties, integracijos, veiksmo arba testo diagnostikos detalės
#   {dimensions}  Aptiktos žemėlapių sienos tinklelio matmenys
#   {direction}  Pasirinktos spalvos atspalvio sukimo kryptis
#   {distance}  Prašomas matymo, simuliavimo arba siuntimo atstumas pasaulio segmentais
#   {duration}  Praėjęs laikas; apkrovos testo pradžios pranešime sekundėmis
#   {enabled}  Įjungimo būsena arba įjungtų modulių skaičius
#   {entities}  Veiksmo paveiktų objektų skaičius
#   {entry}  Integracijos laiko juostos įrašas
#   {exceptions}  Apkrovos testo etape užregistruotos React išimtys
#   {fail}  Nepavykusių patikrų skaičius
#   {file}  Nustatymų, kalbos arba įskiepio API failo pavadinimas
#   {fingerprint}  Serverio arba žiniatinklio žetono kontrolinis atspaudas
#   {finite}  Baigtines reikšmes grąžinančių matuoklių skaičius
#   {frames}  Daiktų rėmelių skaičius aktyvioje žemėlapių sienoje
#   {free}  Laisva fizinė arba virtualioji atmintis
#   {freed}  Šiukšlių surinkimo atlaisvinta kaupo atmintis
#   {from}  Pirmojo dabartinio puslapio įrašo numeris
#   {grid}  Žemėlapių sienos tinklelio matmenys
#   {ground_y}  Žemės aukštis gravitacijos teste
#   {group}  Stebėjimo, matuoklių, žemėlapių, nustatymų arba kalbos pranešimų grupė
#   {growth}  Kaupo atminties augimas apkrovos teste, MB
#   {health}  Integracijos veikimo būklė
#   {heap_end}  Kaupo atminties naudojimas apkrovos testo etapo pabaigoje, MB
#   {heap_start}  Kaupo atminties naudojimas apkrovos testo etapo pradžioje, MB
#   {heartbeat}  Laikas nuo paskutinio integracijos gyvybingumo signalo
#   {height}  Testo piešimo srities aukštis pikseliais
#   {hoppers}  Normalizuotų piltuvų skaičius
#   {id}  Jungties nuorodos, matuoklio, žemėlapio, veiksmo, paketo arba žetono ID
#   {impact}  Nustatymo poveikio aprašymas
