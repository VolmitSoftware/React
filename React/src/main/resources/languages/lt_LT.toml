"config.documentation.annotation.art.arcane.react.content.tweak.tweakserverhibernator.description" = "Konfiguracija serverio hibernatoriui. Eksperimentinis tuščias serverių hibernacijos režimas, kuris miega tarp žaidimo taktai kai nėra žaidėjų internete."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakserverhibernator.field.imacloudserverenableme.impact" = "Laikykit šį klaidą, nebent aiškiai norite, kad React užsūstų žaidimo taktai serverį tuščias."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakserverhibernator.field.imacloudserverenableme.summary" = "Eksperimentinio serverio nakvynės tako saugos vartai."
