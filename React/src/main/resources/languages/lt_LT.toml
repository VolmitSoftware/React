"config.documentation.annotation.art.arcane.react.content.tweak.tweakfastentityincineration.description" = "Konfiguracija \"Fast Entity Incineration\" pritaikymas. Ištrina degantys monstrus pagal konfigūruotus artimumo taisykles, kad sumažintų trukdantį žaidimo taktas ugnies kainą."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakfastentityincineration.field.incinerationbeyondnearestplayer.impact" = "Aukštesnės vertės leidžia toliau nuo žaidėjų valyti; mažesnės vertės išlaiko švarą arčiau aktyvių žaidėjų."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakfastentityincineration.field.incinerationbeyondnearestplayer.summary" = "Atstumas nuo žaidėjų prieš greitą įmonės deginimą taikomas deginimo elgesį (blokai)."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfallingblocks.description" = "Konfiguracija greitai nukrito blokų pritaikymas. Padidina ilgalaikius nukrito blokas entitetus, kai pradeda nukrito apdorojimas sukelia matuojamą žaidimo taktas kainą."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfallingblocks.field.maxfallms.impact" = "Didesnės vertės leidžia pasiekti didesnį našumą prieš intervenciją, mažesnės vertės daro klimato kaitos švelninimą agresyvesnį."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfallingblocks.field.maxfallms.summary" = "Didžiausias kritimas ms leidžiamas greitai krintantys blokai."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfire.description" = "Konfigūracija greitai ugnis tblis. Trumpojo jungimo grandinės ugnies plitimo ir burnout atnaujinimus į greitai pasaulyje operacijų sumažinti gaisrininkų fizikos viršus."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids.description" = "Konfigūracija greitiems skysčiams. Į priekį vandens ir lava skleisti grandines į apribotus pliūpsnio atnaujinimus, siekiant sumažinti pasikartojančių peržingsninis skysčio šventė."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids.field.acceleratedrain.impact" = "Galima pagreitinti skysčių atšaukimą ir tuščią elgesį netoli srauto atnaujinimų; gali būti neįgalima, kad būtų pagreitintas tik tiesioginis srautas žaidimo taktai."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids.field.acceleratedrain.summary" = "Valdo, ar greitieji skysčiai taiko drenuojantį pagreitį aplink aktyviuosius srauto procesus."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids.field.acceleratelava.impact" = "Įjungti pagreitinti lavos srauto grandines; išjungti palikti lavą vanilės laiku."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids.field.acceleratelava.summary" = "Valdo, ar greitieji skysčiai taiko lava pagreitį."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids.field.acceleratewater.impact" = "Įjungti pagreitinti vandens srauto grandines; išjungti palikti vandenį vanilės laiko."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids.field.acceleratewater.summary" = "Valdo, ar greitieji skysčiai taiko vandens pagreitį."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids.field.extravanillaticksperevent.impact" = "Aukštesnės vertės supjausti daugiau skysčių atnaujinimus į mažiau serverio žaidimo taktai, tačiau gali padidinti per žaidimo taktas skysčio darbą."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids.field.extravanillaticksperevent.summary" = "Papildomas vanilės skysčio žaidimo taktai eilutė per skysčio srauto įvykio greito skysčių."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids.field.maxburstticksperlocationperservertick.impact" = "Aukštesnės vertės greičiau sutriuškina skysčių grandines į vieną žaidimo taktas kiekvienos vietos; mažesnės reikšmės platinimas veikia lygiaverčiau žaidimo taktai."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids.field.maxburstticksperlocationperservertick.summary" = "Maksimalus eilės papildomas skysčio žaidimo taktai vartojimas vienam bloko vietoje per vieną serverio žaidimo taktas plūdis."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids.field.maxextravanillaticksperservertick.impact" = "Didesnės vertės leidžia stipresnis pagreitis pliūpsniai; mažesnės vertės cokolis skysčio trūkimo kaina agresyviau."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids.field.maxextravanillaticksperservertick.summary" = "Maksimalus papildomas vanilės skysčio žaidimo taktai, leidžiamas per serverį žaidimo taktas greitoje skysčiuose."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakfastsnow.description" = "Konfigūracija sparčiam sniego tblui. Trumpojo jungimo sniego forma ir lydalo atnaujinimai į greitai pasaulyje operacijų sumažinti oro blokada šventė."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.description" = "Pre-žaidimo taktai piltuvai naudojant erdvinį elementų indeksą, kad trumposios grandinės vanilės per žaidimo taktas AABB entitetos skaityti. Nesugebėjo uždaryti vanilė jei nėra reikalingas NMS tiltas."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.idlestretch.impact" = "Galima panaikinti nevaldomus piltuvas žaidimo taktas sąnaudas piltuvas-svarūs serverių; daiktų atėmimas per indeksą greitas kelias lieka tuoj."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.idlestretch.summary" = "Išplėsta pakartotinio naudojimo delsa perdavimo tuščias, neveiktas piltuvai, kol serveris yra užkrovtas todėl vanilė praleido juos iš naujo apklausyti."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.idlestretchmintickms.impact" = "Mažesnės vertės anksčiau ištraukia neveiktą piltuvai; aukštesnės vertybės jį rezervuoja didesniam apkrovimui."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.idlestretchmintickms.summary" = "Vidutiniškai žaidimo taktas milisekundų, reikalingos prieš pradėdami naudoti beveiką piltuvas plėtrą."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.idlestretchspreadpasses.impact" = "Aukštesnės vertės kiekvienai piltuvas žvalgybos mažiau dažnai ( pigiau, lėtesnis išplėsti ); mažesnės vertybės plėsto neveikliame piltuvai greičiau."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.idlestretchspreadpasses.summary" = "žaidimo taktas paskutinio skaičiaus, kai per kiekvieną tuštą piltuvas bandymą yra išplaukiama."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.idlestretchticks.impact" = "Aukštesnės vertės neleidžia atlikti daugiau laikinų piltuvas darbų, tačiau atidėja perdavimo atnaujinimą ilgiau."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.idlestretchticks.summary" = "pakartotinio naudojimo delsa žaidimo taktai, taikytas tuštam be darbo piltuvai; riboja blogiausią vėlavimą prieš atkurstant uždarytą piltuvas iš konteinerio."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperlimit.description" = "Konfiguracija piltuvas Limit tweak. Atšaukia piltuvas perdavimo, kai piltuvas žaidimo taktas laiko slėgis viršija konfigūruotą ribą."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperlimit.field.maxhopperticktime.impact" = "Didesnės vertės leidžia pasiekti didesnį našumą prieš intervenciją, mažesnės vertės daro klimato kaitos švelninimą agresyvesnį."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperlimit.field.maxhopperticktime.summary" = "Maksimalus piltuvas žaidimo taktas laikas, leidžiamas piltuvas apribojimui."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.description" = "Konfigūracija Despawn Accelerator tless elementui. Nustumia tinkamus numestus daiktus į niekinimą, kai šalia nėra žaidėjų."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.field.ignorenameditems.impact" = "Įjunkite tai, kad būtų pašalinti tinkami atvejai; negalėsite jų įtraukti į vykdymo užtikrinimą."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.field.ignorenameditems.summary" = "Praleidžia pavadintus elementus, kai elementas nutrūksta akceleratorius įvertina tikslus."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.field.ignorevaluables.impact" = "Įjunkite tai, kad būtų pašalinti tinkami atvejai; negalėsite jų įtraukti į vykdymo užtikrinimą."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.field.ignorevaluables.summary" = "Praleidžia vertybes, kai elementas nusmukdo akceleratorius įvertina tikslus."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.field.noplayerradius.impact" = "Didesnės vertybės praplečia paieškos sritį ir kainuoja daugiau darbo, mažesnės vertės siauras apimtis ir paleisti pigiau."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.field.noplayerradius.summary" = "Nėra elemento nusėdimo akceleratoriaus (blokų) naudojamas grotuvo spindulys."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.field.targettickslived.impact" = "Didesnės vertės stumia elementus arčiau nusėdimo nedelsiant; mažesnės vertės išlaikyti daugiau gamtos gyvenimą."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.field.targettickslived.summary" = "žaidimo taktai-skelbtas vertė, įvertinta reikalavimus atitinkantiems straipsniams, siekiant paspartinti vanilės išleidimo laiką."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.field.valuableitems.impact" = "Pridėti medžiagų, siekiant apsaugoti daugiau objektų nuo pagreitinto nusėdimo, arba pašalinti medžiagas, kad greičiau išvalyti."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.field.valuableitems.summary" = "Medžiagų sąrašas, laikomas vertybėmis ir neįtraukiamas, kai `ignoreValuables` įjungta."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakprojectilelimiter.description" = "Konfiguracija sviedinys Limiter. Įdiegia per žaidėją ir per pasaulio segmentas sviedinys sprogimo viršūnės, kad užkirstų kelią sviedinys spam spikes."
