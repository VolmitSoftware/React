# React — zh_TW
#
# === 編輯檔案 ===
# plugins/React/languages/zh_TW.toml
# 可直接編輯此檔案。本機修改會保留；缺少或無效的項目使用內建英文文字。
# /react language server edit zh_TW
#
# === 前綴 ===
# runtime.prefix: React 在聊天訊息前加入的前綴.
#
# === 格式 ===
# 聊天訊息支援 & 色彩代碼：&c文字&r, &l文字&r。
# 色彩：&0-&9 和 &a-&f。
# 樣式：&l 粗體、&o 斜體、&n 底線、&m 刪除線、&k 隨機字元、&r 重設。
# 色彩代碼會清除目前的樣式；請將色彩放在樣式之前，例如 &3&l文字&r。&r 會重設所有格式。
# RGB 色彩使用 &#RRGGBB文字&r，例如 &#55AAFF文字&r。
# 進階效果與互動請使用 MiniMessage；不要在同一則訊息中混用 MiniMessage 標籤和 & 代碼。請依開啟順序的反向順序關閉標籤。
# 請確保 TOML 的引號與跳脫寫法有效。
# 在加上引號的 TOML 字串中使用 \n 換行；{{ 和 }} 會顯示大括號本身。
# renderer.* 和 config.documentation.annotation.* 的值為純文字。
# test.* 的值為純文字，但 test.result.* 訊息支援格式設定。
# 請將佔位符放在訊息文字中，並置於 MiniMessage 標籤之外。
#
# === 變數 ===
# 請勿變更變數名稱，僅使用各訊息中原有的變數。
#   {action}  操作名稱或色彩調整方向
#   {actions}  佇列中的操作數或已排除的操作名稱清單
#   {active}  啟用中的功能或調校項目數量
#   {actor}  執行修改的網頁使用者
#   {added}  功能啟用後是否重新加入作用中登錄表
#   {after}  變更後的設定值、語言訊息或堆積使用量
#   {age}  整合資料的存在時間，單位為秒
#   {amount}  要給予的物品數量
#   {architecture}  CPU 架構
#   {argument}  非預期的指令引數
#   {available}  可用的 NMS 橋接控制代碼數量
#   {average}  平均 TPS 或每刻毫秒數
#   {avg_mspt}  一輪負載測試中的平均每刻毫秒數
#   {avg_tps}  一輪負載測試中的平均每秒刻數
#   {bar}  已格式化的基準測試分數條
#   {before}  變更前的設定值、語言訊息或堆積使用量
#   {checked}  已檢查的取樣器數量
#   {chunks}  受操作影響的區塊數量
#   {code}  網頁配對碼
#   {command}  指令路徑
#   {count}  項目、模組、變更或測試發現的數量
#   {current}  目前頁碼
#   {delta_heap}  React 與基準在結束時的堆積使用量差值，單位為 MB
#   {delta_mspt}  React 與基準的平均刻耗時差值，單位為 ms
#   {delta_tps}  React 與基準的平均 TPS 差值
#   {detail}  橋接、整合、操作或測試的診斷詳細資訊
#   {dimensions}  偵測到的地圖牆網格尺寸
#   {direction}  旋轉所選色彩色相的方向
#   {distance}  要求的視野、模擬或傳送距離（區塊）
#   {duration}  經過時間；負載測試開始訊息使用秒
#   {enabled}  啟用狀態或已啟用的模組數量
#   {entities}  受操作影響的實體數量
#   {entry}  整合時間軸項目
#   {exceptions}  一輪負載測試中記錄的 React 例外
#   {fail}  未通過的檢查數量
#   {file}  設定、語言或外掛程式 API 檔案名稱
#   {fingerprint}  伺服器或網頁權杖指紋
#   {finite}  傳回有限值的取樣器數量
#   {frames}  作用中地圖牆的物品展示框數量
#   {free}  可用的實體或虛擬記憶體
#   {freed}  垃圾回收釋放的堆積記憶體
#   {from}  目前頁面的第一個項目編號
#   {grid}  地圖牆網格尺寸
#   {ground_y}  重力測試的地面高度
#   {group}  監控、取樣器、地圖、設定或語言訊息群組
#   {growth}  負載測試期間的堆積增長量，單位為 MB
#   {health}  整合的健康狀態
#   {heap_end}  一輪負載測試結束時的堆積使用量，單位為 MB
#   {heap_start}  一輪負載測試開始時的堆積使用量，單位為 MB
#   {heartbeat}  自整合最近一次心跳以來的時間
#   {height}  測試畫布高度，單位為像素
#   {hoppers}  已正規化的漏斗數量
#   {id}  橋接控制代碼、取樣器、地圖、操作、套件或權杖識別碼
#   {impact}  設定效果說明或外掛程式成本，單位為 ms/s
#   {incident}  從開發測試套件排除的遞迴事件操作識別碼
#   {index}  開發測試套件的目前步驟編號
#   {invalid}  讀值無效的取樣器數量
#   {issued_at}  網頁權杖建立時間
#   {item}  物品名稱或識別碼
#   {items}  已合併的物品實體數量
#   {key}  指令參數鍵、設定鍵或語言訊息 ID
#   {label}  基準測試、指標、設定、指令或網頁權杖標籤
#   {line}  正在編輯的多行訊息中的行號
#   {lines}  已掃描的伺服器日誌行數
#   {loaded}  預熱期間新載入的區塊數量
#   {locale}  正在顯示、選擇或編輯的語言代碼
#   {matched}  自動儲存狀態與測試基準一致的世界
#   {max_tick}  負載測試中觀察到的最長刻間隔，單位為 ms
#   {maximum}  最大物品數量、刻耗時門檻或編輯器輸入長度
#   {message}  已完成操作的摘要或整合狀態訊息
#   {metrics}  外掛程式 API 套件提供的指標數量
#   {minecraft}  Minecraft 版本
#   {minimum}  可接受的最低 TPS
#   {missing}  登錄表中缺少的必要取樣器數量
#   {mode}  所選遊戲模式或能力模式
#   {model}  CPU 型號
#   {name}  基準測試、模組、繪製器或測試檢查名稱
#   {note}  未掃描伺服器日誌的原因
#   {offenders}  傳回非有限值的取樣器數量
#   {operations}  每分鐘能力回呼操作數
#   {options}  允許的設定值
#   {p95}  負載測試中刻耗時的第 95 百分位數，單位為 ms
#   {parameter}  指令參數名稱
#   {parameters}  已忽略的指令參數
#   {pass}  通過的檢查數量
#   {path}  設定鍵路徑或報告檔案路徑
#   {percent}  色彩調整百分比或外掛程式影響占比
#   {permission}  所需權限節點
#   {personal}  玩家選擇的語言代碼
#   {phase}  正在測試的功能生命週期階段
#   {pixels}  地圖測試繪製的非空白像素數量
#   {platform}  作業系統或 Minecraft 伺服器平台
#   {players}  負載測試中的模擬玩家數量
#   {plugin}  外掛程式名稱
#   {process_load}  伺服器處理程序的 CPU 負載
#   {processors}  可用的 CPU 處理器數量
#   {profile}  React 設定檔名稱
#   {protocol}  整合通訊協定版本
#   {radius}  地圖或開發測試套件操作的區塊半徑
#   {range}  允許的視野、模擬或傳送距離範圍（區塊）
#   {rate}  設定的作物生長加速倍率
#   {rating}  已格式化的基準測試評等
#   {react_errors}  伺服器日誌中找到的 React 錯誤行數
#   {reason}  失敗、拒絕或無法使用狀態的原因
#   {registered}  已登錄的模組數量
#   {removed_first}  首次停用是否將功能從作用中登錄表移除
#   {removed_second}  再次停用是否將功能從作用中登錄表移除
#   {renderer}  地圖繪製器名稱或識別碼
#   {renderers}  識別碼空白的地圖繪製器清單
#   {role}  網頁存取角色：viewer、operator 或 admin
#   {sampler}  取樣器名稱或識別碼
#   {samplers}  整合取樣器或發生故障的取樣器清單
#   {scope}  地圖範圍或距離設定的套用範圍
#   {score}  基準測試分數
#   {seconds}  倒數計時或負載測試時間，單位為秒
#   {section}  設定區段名稱
#   {server}  Minecraft 伺服器實作及版本
#   {shown}  目前顯示的列數
#   {since_run}  本次測試開始以來回報的錯誤
#   {size}  地圖牆的最大或目前使用尺寸
#   {skip}  已略過的檢查數量
#   {spawn_y}  重力測試方塊的生成高度
#   {state}  操作或外掛程式 API 套件的狀態
#   {status}  整合狀態或設定狀態標籤
#   {subject}  設定說明中描述的模組或設定
#   {subsystem}  測試子系統名稱
#   {summary}  操作稽核摘要
#   {system_load}  整個系統的 CPU 負載
#   {target}  操作針對的世界、玩家、外掛程式、設定或外掛程式群組
#   {threading}  伺服器執行緒模式
#   {tick}  超過凍結門檻的刻耗時，單位為 ms
#   {tick_crashes}  伺服器日誌中找到的遊戲刻崩潰行數
#   {tier}  事件應變手冊的嚴重性等級
#   {timing}  每分鐘能力回呼耗時，單位為毫秒
#   {to}  目前頁面的最後一個項目編號
#   {total}  訊息中的項目、模組、世界、檢查或記憶體總量
#   {type}  指令參數、設定值、地圖或距離類型
#   {unavailable}  無法使用的 NMS 橋接控制代碼數量
#   {unit}  圓餅圖總量的單位標籤
#   {unknown}  從開發測試套件排除的未知操作識別碼
#   {unreadable}  無法讀取的取樣器數量
#   {uptime}  主機作業系統運作時間
#   {url}  已上傳診斷報告的 URL
#   {usage}  指令用法語法
#   {used}  已使用的實體記憶體、虛擬記憶體或堆積
#   {value}  已格式化的設定、測量值或硬體詳細資訊
#   {values}  開發測試套件報告中列出的取樣值
#   {variables}  正在編輯的訊息接受的佔位符名稱
#   {vendor}  Java 供應商
#   {verdict}  整體測試結論
#   {version}  React、Java 或平台版本
#   {warmed}  已預熱的區塊數量
#   {warn}  有警告的檢查數量
#   {width}  測試畫布寬度，單位為像素
#   {world}  Minecraft 世界名稱

