[config.documentation.annotation.art.arcane.react.content.tweak.tweakentitycrowdprevention.field.maxentitiesperclustercrowd]
impact = "Wyższe wartości dopuszczają większe skoki, zanim zadziała kontrola; niższe wartości ograniczają skoki wcześniej."
summary = "Maksymalna liczba bytów dozwolona na tłum w grupie w entity crowd prevention."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakentitycrowdprevention.field.mobstopreventfromcrowding]
