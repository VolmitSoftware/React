[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller.field.jfrslowthresholdms]
summary = "Minimalny czas w milisekundach dla zdarzeń JVM dotyczących wejścia i wyjścia plików, wejścia do monitora, oczekiwania na monitorze i parkowania wątków, ograniczony do zakresu od 1 do 1000. Etapy generowania chunków nie mają progu czasu trwania."
impact = "Niższe progi generują więcej zdarzeń JVM. Te metryki opisują wyłącznie zdarzenia osiągające ten próg."
