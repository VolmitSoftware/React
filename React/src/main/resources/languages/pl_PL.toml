# React — pl_PL
#
# === Edycja pliku ===
# plugins/React/languages/pl_PL.toml
# Ten plik można edytować bezpośrednio. Lokalne zmiany są zachowywane; brakujące lub nieprawidłowe wpisy korzystają z wbudowanego angielskiego tekstu.
# /react language server edit pl_PL
#
# === Prefiks ===
# runtime.prefix: Prefiks dodawany przez React przed wiadomościami czatu.
#
# === Formatowanie ===
# Wiadomości czatu obsługują kody kolorów z &: &cTekst&r, &lTekst&r.
# Kolory: &0-&9 i &a-&f.
# Style: &l pogrubienie, &o kursywa, &n podkreślenie, &m przekreślenie, &k losowe znaki, &r reset.
# Kody kolorów usuwają aktywne style; podaj kolor przed stylem, np. &3&lTekst&r. &r resetuje całe formatowanie.
# Kolory RGB mają postać &#RRGGBBTekst&r, na przykład &#55AAFFTekst&r.
# Używaj MiniMessage do gradientów i interakcji; nie łącz znaczników MiniMessage i kodów & w jednej wiadomości. Zamykaj znaczniki w kolejności odwrotnej do otwierania.
# Zachowaj poprawne cudzysłowy i sekwencje specjalne TOML.
# W tekstach TOML ujętych w cudzysłowy użyj \n, aby rozpocząć nowy wiersz; {{ i }} wyświetlają dosłowne klamry.
# Wartości renderer.* i config.documentation.annotation.* są zwykłym tekstem.
# Wartości test.* są zwykłym tekstem, z wyjątkiem wiadomości test.result.*, które obsługują formatowanie.
# Używaj zmiennych w tekście wiadomości, poza znacznikami MiniMessage.
#
# === Zmienne ===
# Zachowaj nazwy zmiennych i używaj tylko tych, które występują w danej wiadomości.
#   {action}  Nazwa działania lub kierunek zmiany koloru
#   {actions}  Liczba działań w kolejce lub lista nazw pominiętych działań
#   {active}  Liczba aktywnych funkcji lub usprawnień
#   {actor}  Użytkownik panelu WWW, który wprowadził zmianę
#   {added}  Czy funkcja wróciła do rejestru aktywnych funkcji po włączeniu; liczba komunikatów dodanych przez aktualizację języka
#   {after}  Wartość ustawienia, wiadomość językowa lub użycie sterty po zmianie
#   {age}  Wiek danych integracji w sekundach
#   {amount}  Liczba przedmiotów do przekazania
#   {architecture}  Architektura CPU
#   {argument}  Nieoczekiwany argument polecenia
#   {available}  Liczba dostępnych uchwytów mostka NMS
#   {average}  Średnie TPS lub milisekundy na takt
#   {avg_mspt}  Średnia liczba milisekund na takt w przebiegu testu obciążenia
#   {avg_tps}  Średnia liczba taktów na sekundę w przebiegu testu obciążenia
#   {bar}  Sformatowany pasek wyniku testu wydajności
#   {before}  Wartość ustawienia, wiadomość językowa lub użycie sterty przed zmianą
#   {checked}  Liczba sprawdzonych próbników
#   {chunks}  Liczba chunków objętych działaniem
#   {code}  Kod parowania panelu WWW
#   {command}  Ścieżka polecenia
#   {count}  Liczba wpisów, modułów, zmian lub ustaleń testu
#   {current}  Numer bieżącej strony
#   {delta_heap}  Różnica końcowego użycia sterty między React a pomiarem bazowym, w MB
#   {delta_mspt}  Różnica średniego czasu taktu między React a pomiarem bazowym, w ms
#   {delta_tps}  Różnica średniego TPS między React a pomiarem bazowym
#   {detail}  Szczegóły diagnostyczne mostka, integracji, działania lub testu
#   {dimensions}  Wykryte wymiary siatki ściany map
#   {direction}  Kierunek obrotu odcienia wybranego koloru
#   {distance}  Żądana odległość widzenia, symulacji lub wysyłania w chunkach
#   {duration}  Czas, który upłynął; w wiadomościach startowych testu obciążenia w sekundach
#   {enabled}  Stan włączenia lub liczba włączonych modułów
#   {entities}  Liczba bytów objętych działaniem
#   {entry}  Wpis na osi czasu integracji
#   {exceptions}  Wyjątki React zarejestrowane w przebiegu testu obciążenia
#   {fail}  Liczba nieudanych kontroli
#   {file}  Nazwa pliku konfiguracji, języka lub API wtyczki
#   {fingerprint}  Odcisk serwera lub tokenu panelu WWW
#   {finite}  Liczba próbników zwracających wartości skończone
#   {frames}  Liczba ramek na przedmioty w aktywnej ścianie map
#   {free}  Wolna pamięć fizyczna lub wirtualna
#   {freed}  Pamięć sterty odzyskana przez odśmiecanie
#   {from}  Numer pierwszego wpisu na bieżącej stronie
#   {grid}  Wymiary siatki ściany map
#   {ground_y}  Wysokość podłoża w teście grawitacji
#   {group}  Grupa monitorów, próbników, map, ustawień lub wiadomości językowych
#   {growth}  Wzrost użycia sterty w teście obciążenia, w MB
#   {health}  Stan sprawności integracji
#   {heap_end}  Użycie sterty na końcu przebiegu testu obciążenia, w MB
#   {heap_start}  Użycie sterty na początku przebiegu testu obciążenia, w MB
#   {heartbeat}  Czas od ostatniego sygnału aktywności integracji
#   {height}  Wysokość obszaru rysowania testu w pikselach
#   {hoppers}  Liczba znormalizowanych lejów
#   {id}  Identyfikator uchwytu mostka, próbnika, mapy, działania, pakietu lub tokenu
#   {impact}  Opis wpływu ustawienia
#   {incident}  Identyfikator rekurencyjnego działania incydentu pominiętego w zestawie testów deweloperskich
#   {index}  Numer bieżącego kroku zestawu testów deweloperskich
#   {invalid}  Liczba próbników z nieprawidłowymi odczytami
#   {issued_at}  Czas utworzenia tokenu panelu WWW
#   {item}  Nazwa lub identyfikator przedmiotu
#   {items}  Liczba połączonych bytów przedmiotów
#   {kept}  Lokalne edycje zachowane przez aktualizację języka
#   {key}  Klucz parametru polecenia, klucz ustawienia lub ID wiadomości językowej
#   {label}  Etykieta testu wydajności, metryki, ustawienia, polecenia lub tokenu panelu WWW
#   {line}  Numer edytowanego wiersza w wiadomości wielowierszowej
#   {lines}  Liczba sprawdzonych wierszy dziennika serwera
#   {loaded}  Liczba chunków nowo wczytanych podczas przygotowania
#   {locale}  Kod języka wyświetlanego, wybieranego lub edytowanego
#   {matched}  Światy, których stan automatycznego zapisu odpowiada stanowi bazowemu testu
#   {max_tick}  Najdłuższa zaobserwowana przerwa między taktami w teście obciążenia, w ms
#   {maximum}  Maksymalna liczba przedmiotów, próg czasu taktu lub długość tekstu w edytorze
#   {message}  Podsumowanie ukończonego działania lub wiadomość o stanie integracji
#   {metrics}  Liczba metryk dostarczanych przez pakiet API wtyczki
#   {minecraft}  Wersja Minecraft
#   {minimum}  Minimalne akceptowalne TPS
#   {missing}  Liczba wymaganych próbników brakujących w rejestrze
#   {mode}  Wybrany tryb gry lub zdolności
#   {model}  Model CPU
#   {name}  Nazwa testu wydajności, modułu, modułu renderowania lub kontroli testowej
#   {note}  Powód pominięcia sprawdzania dziennika serwera
#   {offenders}  Liczba próbników zwracających wartości nieskończone lub NaN
#   {options}  Dozwolone wartości ustawienia
#   {p95}  95. percentyl czasu taktu w teście obciążenia, w ms
#   {parameter}  Nazwa parametru polecenia
#   {parameters}  Pominięte parametry polecenia
#   {pass}  Liczba udanych kontroli
#   {path}  Ścieżka klucza ustawienia lub pliku raportu
#   {percent}  Procent zmiany koloru
#   {permission}  Wymagany węzeł uprawnienia
#   {personal}  Kod języka wybranego przez gracza
#   {phase}  Testowana faza cyklu życia funkcji
#   {pixels}  Liczba niepustych pikseli narysowanych w teście mapy
#   {platform}  System operacyjny lub platforma serwera Minecraft
#   {players}  Liczba sztucznych graczy w teście obciążenia
#   {plugin}  Nazwa wtyczki
#   {process_load}  Obciążenie CPU przez proces serwera
#   {processors}  Liczba dostępnych procesorów CPU
#   {profile}  Nazwa profilu konfiguracji React
#   {protocol}  Wersja protokołu integracji
#   {radius}  Promień działania testu deweloperskiego w chunkach
#   {range}  Dozwolony zakres odległości widzenia, symulacji lub wysyłania w chunkach
#   {rate}  Skonfigurowane tempo przyspieszania wzrostu upraw
#   {rating}  Sformatowana ocena testu wydajności
#   {react_errors}  Liczba wierszy błędów React znalezionych w dzienniku serwera
#   {reason}  Wyjaśnienie błędu, odrzucenia lub niedostępności
#   {registered}  Liczba zarejestrowanych modułów
#   {remaining}  Czas pozostały do kolejnego dozwolonego sprawdzenia języków
#   {removed_first}  Czy pierwsze wyłączenie usunęło funkcję z rejestru aktywnych funkcji
#   {removed_second}  Czy ponowne wyłączenie usunęło funkcję z rejestru aktywnych funkcji
#   {renderer}  Nazwa lub identyfikator modułu renderowania mapy
#   {renderers}  Lista modułów renderowania map z pustymi identyfikatorami
#   {role}  Rola dostępu do panelu WWW: viewer, operator lub admin
#   {sampler}  Nazwa lub identyfikator próbnika
#   {samplers}  Lista próbników integracji lub próbników z błędami
#   {scope}  Zakres mapy lub ustawienia odległości
#   {score}  Wynik punktowy testu wydajności
#   {seconds}  Odliczanie lub czas trwania testu obciążenia w sekundach
#   {section}  Sekcja konfiguracji lub edytora języków
#   {server}  Implementacja i wersja serwera Minecraft
#   {shown}  Liczba obecnie wyświetlanych wierszy
#   {since_run}  Błędy zgłoszone od rozpoczęcia bieżącego testu
#   {size}  Maksymalne lub aktywne wymiary ściany map
#   {skip}  Liczba pominiętych kontroli
#   {spawn_y}  Wysokość, na której utworzono blok testu grawitacji
#   {state}  Stan działania lub pakietu API wtyczki
#   {status}  Stan integracji lub etykieta stanu ustawienia
#   {subject}  Moduł lub ustawienie opisane w pomocy konfiguracji
#   {subsystem}  Nazwa testowanego podsystemu
#   {summary}  Podsumowanie audytu działania
#   {system_load}  Obciążenie CPU całego systemu
#   {target}  Świat, gracz, wtyczka, ustawienie lub grupa wtyczek objęta operacją
#   {threading}  Tryb obsługi wątków serwera
#   {tick}  Czas trwania taktu, który przekroczył próg zawieszenia, w ms
#   {tick_crashes}  Liczba wierszy awarii taktu znalezionych w dzienniku serwera
#   {tier}  Poziom ważności planu reakcji na incydent
#   {timing}  Czas wywołań zwrotnych zdolności w milisekundach na minutę
#   {to}  Numer ostatniego wpisu na bieżącej stronie
#   {total}  Łączna liczba wpisów, modułów, światów, kontroli lub ilość pamięci w wiadomości
#   {type}  Typ parametru polecenia, wartości ustawienia, mapy lub odległości
#   {unavailable}  Liczba niedostępnych uchwytów mostka NMS
#   {unit}  Jednostka sumy na wykresie kołowym
#   {unknown}  Identyfikator nieznanego działania pominiętego w zestawie testów deweloperskich
#   {unreadable}  Liczba próbników, których nie udało się odczytać
#   {updated}  Liczba komunikatów zmienionych przez aktualizację języka
#   {uptime}  Czas działania systemu operacyjnego hosta
#   {url}  URL przesłanego raportu diagnostycznego
#   {usage}  Składnia użycia polecenia
#   {used}  Używana pamięć fizyczna, wirtualna lub sterta
#   {value}  Sformatowane ustawienie, pomiar lub dane sprzętu
#   {values}  Odczytane wartości wymienione w raporcie testów deweloperskich
#   {variables}  Nazwy zmiennych akceptowanych przez edytowaną wiadomość
#   {vendor}  Dostawca Java
