"config.documentation.annotation.art.arcane.react.content.tweak.tweakserverhibernator.description" = "Konfiguracja serwera Hibernator. Eksperymentalny tryb hibernacji z pustym serwerem, który śpi między ticki, gdy gracze nie są online."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakserverhibernator.field.imacloudserverenableme.impact" = "Trzymaj to fałszywe, chyba że wyraźnie chcesz React śpiący ticki podczas gdy serwer jest pusty."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakserverhibernator.field.imacloudserverenableme.summary" = "Brama bezpieczeństwa dla eksperymentalnej ścieżki hibernacji serwera."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakserverhibernator.field.secondspertick.impact" = "Wyższe wartości spowolniają pętlę bardziej agresywnie; niższe wartości sprawiają, że serwer jest bardziej wrażliwy."
