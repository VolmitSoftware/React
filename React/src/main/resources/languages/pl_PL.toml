[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller.field.regionalenabled]
summary = "Włącza próbkowanie TPS regionów Folia w pozycjach graczy."
impact = "Raz na sekundę odpytuje ograniczony, rotacyjny zestaw pozycji graczy z pamięci podręcznej bez wczytywania chunków."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller.field.playeranchorsperrefresh]
summary = "Maksymalna liczba pozycji graczy próbkowanych na sekundę, ograniczona do zakresu od 1 do 512. Obserwacje wygasają po pięciu sekundach."
impact = "Wyższe wartości obejmują więcej graczy, ale wymagają większej liczby zapytań o TPS regionów."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller.field.jfrenabled]
summary = "Włącza selektywną telemetrię JFR. Domyślnie wyłączona. Publikowane podsumowania pomijają adresy, ścieżki plików i ślady stosu."
