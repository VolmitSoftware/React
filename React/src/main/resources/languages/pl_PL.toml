summary = "Czas przechowywania w pamięci podręcznej dla chunków niedawno odrzuconych przez hardstop przed ponownym sprawdzeniem liczby bytów (takty)."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakentityhardstop.field.maxentitiesperchunk]
