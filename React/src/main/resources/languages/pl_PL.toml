[config.documentation.annotation.art.arcane.react.content.tweak.tweakexperienceorbmerge.field.maxnearbyorbspermerge]
impact = "Wyższe wartości dopuszczają większe skoki, zanim zadziała kontrola; niższe wartości ograniczają skoki wcześniej."
summary = "Maksymalna liczba pobliskich kul dozwolona na jedno połączenie w experience orb merge."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakexperienceorbmerge.field.mergeradius]
