"config.documentation.annotation.art.arcane.react.content.tweak.tweakfastsnow.description" = "Konfiguracja szybkiego zawrotu śniegu. Krótkie obwody śniegowe i topnieć aktualizacje w szybkich operacji świata, aby zmniejszyć zachmurzenie bloku atmosferycznego."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.description" = "Pre-ticki lejki używa indeksu elementów przestrzennych do skanowania jednostki AABB na tick. Nie uszło w przypadku zamknięcia dla vanilli, jeśli wymagany most NMS nie jest dostępny."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.idlestretch.impact" = "Umożliwia zrzucenie bezczynnych kosztów lejek tick na serwerach ciężkich lejek; odbiór przedmiotów przez indeks szybkiego ścieżki pozostaje natychmiastowy."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.idlestretch.summary" = "Rozciąga transfer czas odnowienia pustych, bezczynnych lejki podczas gdy serwer jest pod obciążeniem więc vanilla przepływa ponowne ich ankietowanie."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.idlestretchmintickms.impact" = "Niższe wartości rozciągają martwy lejki wcześniej; wyższe wartości rezerwują go na cięższy obciążenie."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.idlestretchmintickms.summary" = "Średnie milisekundy tick wymagane przed uruchomieniem nieprawidłowego rozciągania lejek."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.idlestretchspreadpasses.impact" = "Wyższe wartości badają każdy lejek mniej często ( tańszy, wolniej rozciąga się ); niższe wartości szybciej rozciągają nieprawidłowe lejki."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.idlestretchspreadpasses.summary" = "Liczba przechodów tick w każdej próżni lejek jest rozproszona."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.idlestretchticks.impact" = "Wyższe wartości przepuszczają więcej pracy lejek, ale opóźniają ponowne rozpoczęcie transferu."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.idlestretchticks.summary" = "czas odnowienia w ticki stosowany do pustych bezczynnych lejki; ogranicza najgorsze opóźnienia przed bezczynnym lejek ponownie ciągnąć z kontenera."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperlimit.description" = "Konfiguracja dla lejek Limit tweak. Zrezygnuje z przesyłania lejek, gdy ciśnienie czasu lejek tick przekracza ustawiony próg."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperlimit.field.maxhopperticktime.impact" = "Wyższe wartości umożliwiają większą przepustowość przed interwencją; niższe wartości sprawiają, że łagodzenie skutków jest bardziej agresywne."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperlimit.field.maxhopperticktime.summary" = "Maksymalny czas lejek tick dopuszczony przez limit lejek."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.description" = "Konfiguracja elementu Despote Accelerator treak. Wciska kwalifikujące się przedmioty upuszczone w kierunku despot, gdy nie ma graczy w pobliżu."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.field.ignorenameditems.impact" = "Włącz to, aby wykluczyć dopasowanie spraw; wyłączyć je do ich egzekwowania."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.field.ignorenameditems.summary" = "Pomija nazwy pozycji, gdy element despot akcelerator ocenia cele."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.field.ignorevaluables.impact" = "Włącz to, aby wykluczyć dopasowanie spraw; wyłączyć je do ich egzekwowania."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.field.ignorevaluables.summary" = "Pomija kosztowności, gdy akcelerator pozycji despot ocenia cele."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.field.noplayerradius.impact" = "Wyższe wartości poszerzają obszar wyszukiwania i kosztują więcej pracy; niższe wartości wąski zakres i biegać taniej."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.field.noplayerradius.summary" = "Nie ma promienia gracza używanego przez akcelerator pozycji despot (bloki)."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.field.targettickslived.impact" = "Wyższe wartości pchają elementy bliżej despot natychmiast; niższe wartości zachować bardziej naturalny okres życia."
