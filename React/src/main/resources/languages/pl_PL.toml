summary = "Chroni byty nazwane przez graczy przed zapobieganiem tłokowi bytów."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakentityhardstop]
description = "Konfiguracja usprawnienia Entity Hardstop. Twardo ogranicza populację bytów na chunk, anulując nowe dodania po przekroczeniu limitów."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakentityhardstop.field.allowitemdrops]
impact = "Włącz, aby upuszczone przedmioty nadal się pojawiały nawet w zatłoczonych chunkach; wyłącz dla ściślejszego twardego limitu."
