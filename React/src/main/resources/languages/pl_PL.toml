summary = "Długość kroczącego okna sprawdzania chunków (milisekundy)."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakprojectilelimiter.field.cleanupintervalms]
impact = "Niższe wartości reagują szybciej, ale zużywają więcej CPU; wyższe wartości redukują koszty ogólne, ale reagują później."
summary = "Główny odstęp oceny projectile limiter w milisekundach."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakprojectilelimiter.field.limitchunkprojectiles]
impact = "Włącz, aby stosować to zachowanie; wyłącz, aby ta ścieżka pozostała nieaktywna."
summary = "Określa, czy projectile limiter stosuje opcję „limit pocisków na chunk”."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakprojectilelimiter.field.limitplayerprojectiles]
impact = "Włącz, aby stosować to zachowanie; wyłącz, aby ta ścieżka pozostała nieaktywna."
summary = "Określa, czy projectile limiter stosuje opcję „limit pocisków na gracza”."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakprojectilelimiter.field.maxprojectilesperchunkwindow]
impact = "Wyższe wartości dopuszczają większe skoki, zanim zadziała kontrola; niższe wartości ograniczają skoki wcześniej."
summary = "Maksymalna liczba pocisków dozwolona na okno chunków w projectile limiter."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakprojectilelimiter.field.maxprojectilesperplayerwindow]
impact = "Wyższe wartości dopuszczają większe skoki, zanim zadziała kontrola; niższe wartości ograniczają skoki wcześniej."
summary = "Maksymalna liczba pocisków dozwolona na okno gracza w projectile limiter."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakprojectilelimiter.field.playerwindowms]
impact = "Dłuższe okna wygładzają skoki, ale reagują wolniej; krótsze okna reagują szybciej, ale są bardziej czułe."
summary = "Długość okna toczenia dla kontroli gracza (milisekundy)."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakprojectilelimiter_burstwindow.field.count]
impact = "Głównie stan czasu działania; React aktualizuje go automatycznie podczas oceny na żywo."
summary = "Wewnętrzny licznik używany przez projectile limiter do śledzenia aktywności serii."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakprojectilelimiter_burstwindow.field.lasthit]
impact = "Głównie stan czasu działania; ręczna zmiana może zakłócić czas odnowienia lub dławienie."
summary = "Wewnętrzny znacznik czasu używany przez projectile limiter do śledzenia okien czasowych i zaniku."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakprojectilelimiter_burstwindow.field.start]
impact = "Głównie stan czasu działania; ręczna zmiana może zakłócić czas odnowienia lub dławienie."
summary = "Wewnętrzny znacznik czasu używany przez projectile limiter do śledzenia okien czasowych i zaniku."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakprojectilelimiter_chunkkey.field.world]
impact = "To dane tożsamości czasu działania; zwykle należy pozostawić je automatycznym aktualizacjom."
summary = "Identyfikator świata używany przez wewnętrzne śledzenie projectile limiter."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakprojectilelimiter_chunkkey.field.x]
impact = "To wewnętrzne dane stanu i zwykle nie należy ich zmieniać ręcznie."
summary = "Współrzędna osi X używana przez wewnętrzne śledzenie projectile limiter."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakprojectilelimiter_chunkkey.field.z]
impact = "To wewnętrzne dane stanu i zwykle nie należy ich zmieniać ręcznie."
summary = "Współrzędna osi Z używana przez wewnętrzne śledzenie projectile limiter."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakserverhibernator]
description = "Konfiguracja usprawnienia Server Hibernator. Eksperymentalny tryb hibernacji pustego serwera, który śpi między taktami, gdy nie ma graczy online."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakserverhibernator.field.imacloudserverenableme]
impact = "Pozostaw false, chyba że wyraźnie chcesz, aby React usypiał takty, gdy serwer jest pusty."
summary = "Bezpiecznik dla eksperymentalnej ścieżki hibernacji serwera."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakserverhibernator.field.secondspertick]
impact = "Wyższe wartości agresywniej spowalniają pętlę; niższe utrzymują większą responsywność serwera."
summary = "Sekundy opóźnienia stosowane na takt przez server hibernator."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands]
description = "Konfiguracja Shorthands. Dodaje osobno konfigurowalne skróty poleceń operatora bez zmiany /reload."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.customcommands]
impact = "Każdy włączony wpis dynamicznie dodaje jedno polecenie. Polecenie docelowe nadal egzekwuje własne uprawnienie, a istniejące etykiety poleceń są chronione, chyba że włączono overrideExisting."
summary = "Własne skróty poleceń indeksowane etykietą polecenia. Dodaj tabelę [customCommands.day] z enabled = true, command = \"time set day\", permission = \"react.shorthands.custom\" i overrideExisting = false. Argumenty wpisane po skrócie są dołączane do skonfigurowanego polecenia; wpisz słowo args w nawiasach klamrowych w poleceniu, aby umieścić je w innym miejscu."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.give]
impact = "Gdy włączone, skrót przejmuje samo /give; waniliowe give z przestrzenią nazw pozostaje dostępne."
summary = "Rejestruje /give <item> <amount> z uzupełnianiem nazw przedmiotów Minecraft."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.gmc]
impact = "Wyłącz, aby /gmc pozostało niezarejestrowane, gdy aktywne jest usprawnienie Shorthands."
summary = "Rejestruje /gmc do przełączania wywołującego w tryb kreatywny."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.gms]
impact = "Wyłącz, aby /gms pozostało niezarejestrowane, gdy aktywne jest usprawnienie Shorthands."
summary = "Rejestruje /gms do przełączania wywołującego w tryb przetrwania."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.gmsp]
impact = "Wyłącz, aby /gmsp pozostało niezarejestrowane, gdy aktywne jest usprawnienie Shorthands."
summary = "Rejestruje /gmsp do przełączania wywołującego w tryb obserwatora."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.more]
impact = "Wyłącz, aby /more pozostało niezarejestrowane, gdy aktywne jest usprawnienie Shorthands."
summary = "Rejestruje /more, aby dać jedną kopię trzymanego przedmiotu o maksymalnym rozmiarze stosu."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.rl]
impact = "Wyłącz, aby /rl pozostało niezarejestrowane, gdy aktywne jest usprawnienie Shorthands."
summary = "Rejestruje /rl jako alias wywołujący samo polecenie /reload serwera."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands_customshorthand.field.command]
impact = "Polecenie docelowe działa z istniejącymi uprawnieniami wywołującego nadawcy i nie może podnieść poziomu dostępu."
summary = "Polecenie wywoływane jako użytkownik skrótu, bez początkowego ukośnika. Podane argumenty są dołączane automatycznie, chyba że słowo args występuje w nawiasach klamrowych."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands_customshorthand.field.enabled]
impact = "Wyłącz, aby zachować definicję w konfiguracji bez rejestrowania jej polecenia."
summary = "Włącza ten własny wpis skrótu."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands_customshorthand.field.overrideexisting]
impact = "Pozostaw false, aby bezpiecznie pomijać konfliktowe etykiety. React przywraca każde zastąpione mapowanie, gdy skrót jest wyłączony lub przeładowany."
summary = "Pozwala temu skrótowi tymczasowo zastąpić istniejącą samą etykietę polecenia, gdy jest aktywny."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands_customshorthand.field.permission]
impact = "Domyślnie własne skróty są dostępne tylko dla operatorów przez react.shorthands.custom."
summary = "Opcjonalne uprawnienie wymagane do użycia tego skrótu, oprócz uprawnienia polecenia docelowego. Zostaw puste, aby nie wymagać dodatkowego uprawnienia do skrótu."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakspawnerplayerradius]
description = "Konfiguracja usprawnienia Spawner Player Radius. Blokuje spawny ze spawnerów i trial spawnerów, gdy gracze są poza wymaganą odległością aktywacji."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakspawnerplayerradius.field.enforcespawnerspawns]
impact = "Włącz, aby stosować to zachowanie; wyłącz, aby ta ścieżka pozostała nieaktywna."
summary = "Określa, czy spawner player radius stosuje opcję „egzekwowanie spawnów ze spawnerów”."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakspawnerplayerradius.field.enforcetrialspawnerspawns]
impact = "Włącz, aby stosować to zachowanie; wyłącz, aby ta ścieżka pozostała nieaktywna."
summary = "Określa, czy spawner player radius stosuje opcję „egzekwowanie spawnów z trial spawnerów”."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakspawnerplayerradius.field.onlymonsters]
impact = "Włącz, aby stosować to zachowanie; wyłącz, aby ta ścieżka pozostała nieaktywna."
summary = "Określa, czy spawner player radius stosuje opcję „tylko potwory”."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakspawnerplayerradius.field.requiredplayerdistance]
impact = "Wyższe wartości poszerzają obszar wyszukiwania i zwiększają koszt; niższe wartości zawężają zakres i są tańsze."
summary = "„wymagany promień gracza” używane przez spawner player radius (bloki)."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakunknown]
description = "Konfiguracja nieznanego usprawnienia. Element zastępczy używany, gdy żądany identyfikator usprawnienia jest nieobecny lub niedostępny."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakvehicleidlebrake]
description = "Konfiguracja usprawnienia Vehicle Idle Brake. Hamuje odległe bezczynne pojazdy, aby ograniczyć niekontrolowany ruch i narzut fizyki."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakvehicleidlebrake.field.brakeboats]
impact = "Włącz, aby stosować to zachowanie; wyłącz, aby ta ścieżka pozostała nieaktywna."
summary = "Określa, czy vehicle idle brake stosuje opcję „hamowanie łodzi”."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakvehicleidlebrake.field.brakeminecarts]
impact = "Włącz, aby stosować to zachowanie; wyłącz, aby ta ścieżka pozostała nieaktywna."
summary = "Określa, czy vehicle idle brake stosuje opcję „hamowanie wagoników”."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakvehicleidlebrake.field.maxdistancewithoutplayer]
impact = "Wyższe wartości umożliwiają większą przepustowość przed interwencją; niższe wartości sprawiają, że łagodzenie skutków jest bardziej agresywne."
summary = "Maksymalna wartość „odległość bez gracza” dozwolona przez vehicle idle brake."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakvehicleidlebrake.field.maxvehiclessampledperworld]
impact = "Wyższe wartości sprawdzają więcej pojazdów na cykl; niższe nakładają ciaśniejszy limit na pracę oceny."
summary = "Maksymalna liczba pojazdów próbkowanych na ocenę we wszystkich światach w vehicle idle brake, ograniczona do zakresu 1–4096."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakvehicleidlebrake.field.minvelocitysquared]
impact = "Wyższe wartości wymagają silniejszych sygnałów przed działaniem; niższe wartości ułatwiają spełnienie tego warunku."
summary = "Minimalna wartość „kwadrat prędkości” wymagana przez vehicle idle brake."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakvehicleidlebrake.field.onlyemptyvehicles]
impact = "Włącz, aby stosować to zachowanie; wyłącz, aby ta ścieżka pozostała nieaktywna."
summary = "Określa, czy vehicle idle brake stosuje opcję „tylko puste pojazdy”."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakvehicleidlebrake.field.tickintervalms]
impact = "Niższe wartości reagują szybciej, ale zużywają więcej CPU; wyższe wartości redukują koszty ogólne, ale reagują później."
summary = "Główny odstęp oceny vehicle idle brake w milisekundach."

[config.documentation.annotation.art.arcane.react.core.controller.configinputcontroller.field.sessiontimeoutseconds]
impact = "Wyższe wartości utrzymują, że edycja promptów jest otwarta dłużej przed ich anulowaniem."
summary = "Limit czasu sesji edycji konfiguracji przez czat w sekundach."

[config.documentation.annotation.art.arcane.react.core.controller.hotloadcontroller]
description = "Monitoruje pliki konfiguracji i języka React oraz automatycznie stosuje zmiany."

[config.documentation.annotation.art.arcane.react.core.controller.hotloadcontroller.field.maxdiffmessagesperfile]
impact = "Niższe wartości zmniejszają szum na czacie operatorów przy dużych edycjach konfiguracji."
summary = "Maksymalna liczba komunikatów różnic na poziomie kluczy wysyłanych dla każdego zmienionego pliku."

[config.documentation.annotation.art.arcane.react.core.controller.hotloadcontroller.field.notifyoperators]
impact = "Wyłącz, jeśli chcesz tylko dzienniki konsoli i żadnych powiadomień w grze."
summary = "Wysyła podsumowania zmian hotload do operatorów online."

[config.documentation.annotation.art.arcane.react.core.controller.hotloadcontroller.field.pollintervalms]
impact = "Niższe wartości pozwalają szybciej wykryć odebrane zdarzenia; automatyczne zmiany są nadal stosowane partiami najwyżej raz na trzy sekundy."
summary = "Odstęp między sprawdzaniem zdarzeń systemu plików, w milisekundach."

[config.documentation.annotation.art.arcane.react.core.controller.eventcontroller]
description = "Mierzy czas procedur obsługi zdarzeń dla każdej wtyczki, opakowując zarejestrowane nasłuchiwacze, gdy instrumentacja jest aktywna."

[config.documentation.annotation.art.arcane.react.core.controller.eventcontroller.field.dutycycleonms]
impact = "Dłuższe okna dają więcej zapisanych próbek na okres przy wyższym powtarzającym się koszcie."
summary = "Długość każdego okresowego okna pomiarowego w milisekundach w trybie cyklicznym."

[config.documentation.annotation.art.arcane.react.core.controller.eventcontroller.field.dutycycleperiodms]
impact = "Krótsze okresy zapisują dane zdarzeń częściej i kosztują więcej; dłuższe okresy zostawiają szersze luki w historii."
summary = "Milisekundy między początkami okresowych okien pomiarowych w trybie cyklicznym."

[config.documentation.annotation.art.arcane.react.core.controller.eventcontroller.field.instrumentation]
impact = "ALWAYS obciąża każdą procedurę obsługi zdarzeń kosztem pomiaru; ON_DEMAND usuwa ten koszt w bezczynności, ale zostawia luki w historii; DUTY_CYCLE zamienia okresowe luki na niewielki powtarzający się koszt."
summary = "Określa, kiedy instalowane są opakowania mierzące czas nasłuchiwaczy: ALWAYS utrzymuje je zainstalowane, ON_DEMAND instaluje je tylko wtedy, gdy monitor, mapa, symbol zastępczy lub przeglądający w sieci odczytuje dane zdarzeń, a DUTY_CYCLE dodatkowo otwiera okresowe okno pomiarowe."

[config.documentation.annotation.art.arcane.react.core.controller.eventcontroller.field.sampleractivitywindowms]
impact = "Wyższe wartości utrzymują instrumentację dłużej po odejściu przeglądającego; niższe wartości usuwają ją wcześniej."
summary = "Milisekundy od ostatniego odczytu danych zdarzeń, po których opakowania są usuwane w trybie na żądanie i w trybie cyklicznym."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller]
description = "Jednorazowo przechwytuje próbniki React, zapisuje skompresowaną telemetrię historyczną i obsługuje ograniczone zapytania o zakres czasu."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.compressionlevel]
impact = "Wyższe wartości mogą zmniejszyć użycie dysku kosztem większego obciążenia procesora podczas zapisu."
summary = "Poziom DEFLATE używany tylko wtedy, gdy zmniejsza zakodowaną kolumnę metryk."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.enabled]
impact = "Wyłączenie zapisu zachowuje bieżące migawki internetowe, ale nie rejestruje nowych próbek historycznych. Istniejąca historia pozostaje czytelna."
summary = "Zapisuje historię próbników w plugins/React/history."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.fifteenminuteretentiondays]
impact = "Agregaty jednogodzinne zachowują pokrycie historyczne po wygaśnięciu tej warstwy."
summary = "Przechowywanie agregatów piętnastominutowych w dniach. Zero zachowuje tę warstwę bezterminowo."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.livecaptureintervalms]
impact = "Niższe wartości poprawiają dokładność wykresów na żywo, ale częściej odpytują wszystkie zarejestrowane próbniki."
summary = "Częstotliwość miarodajnej migawki próbników na żywo w milisekundach."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.maxquerypoints]
impact = "Wyższe wartości poprawiają rozdzielczość wykresu kosztem rozmiaru odpowiedzi i pracy zapytania."
summary = "Maksymalna liczba przedziałów przyjmowanych dla każdej serii w zapytaniu historycznym."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.maxqueryseries]
impact = "Wyższe wartości mogą tworzyć większe ramki przekazywania i więcej równoczesnych odczytów z dysku."
summary = "Maksymalna liczba serii przyjmowanych przez jedno zapytanie historyczne."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.minuteretentiondays]
impact = "Starszy zakres pozostaje dostępny przez agregaty o niższej rozdzielczości."
summary = "Przechowywanie agregatów jednominutowych w dniach. Zero zachowuje tę warstwę bezterminowo."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.querypagepoints]
impact = "Strony pozostają ograniczone ze względu na limity czasu przekazywania i żądań przeglądarki."
summary = "Maksymalna liczba przedziałów zwracanych dla każdej serii na jednej stronie odpowiedzi historycznej."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.rawretentionhours]
impact = "Starszy zakres pozostaje dostępny przez agregaty o niższej rozdzielczości."
summary = "Przechowywanie dokładnych próbek jednosekundowych w godzinach. Zero zachowuje tę warstwę bezterminowo."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.tensecondretentiondays]
impact = "Starszy zakres pozostaje dostępny przez agregaty o niższej rozdzielczości."
summary = "Przechowywanie agregatów dziesięciosekundowych w dniach. Zero zachowuje tę warstwę bezterminowo."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.walforceintervalms]
impact = "Awaria procesu lub hosta może utracić najwyżej ten ostatni przedział czasu; niższe wartości zwiększają liczbę wymuszonych zapisów na dysku."
summary = "Maksymalny czas między wymuszonymi zapisami dziennika historii w milisekundach."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller]
description = "Zarządza metadanymi przedmiotów-map React, naprawą modułów renderowania i dostarczaniem pakietów map na żywo dla ekwipunków i ramek na przedmioty."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemapidlepushintervalms]
impact = "Wyższe wartości zmniejszają ruch pakietów w bezczynności, gdy gracze są w pobliżu, ale nie patrzą na mapę."
summary = "Odstęp między podawaniem pakietów dla pobliskich widzów, którzy nie patrzą aktywnie na mapę ramki (milisekundy)."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemaplookdotthreshold]
impact = "Wyższe wartości wymagają dokładniejszego wycelowania w mapę, zanim zostaną wysłane aktualizacje o wysokiej częstotliwości."
summary = "Minimalny iloczyn skalarny kierunku patrzenia wymagany, aby uznać gracza za aktywnie patrzącego na mapę w ramce."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemappushintervalms]
impact = "Niższe wartości odświeżają obraz mapy szybciej, ale zwiększają obciążenie pakietami i renderowaniem."
summary = "Odstęp wysyłania pakietów dla aktywnych map w ramkach na przedmioty w milisekundach."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemappushoutsiderangewhenholding]
impact = "Wyłącz, aby całkowicie zatrzymać pakiety map poza promieniem; włącz, jeśli trzymanie mapy ma omijać kontrole odległości."
summary = "Zezwala na aktualizacje trzymanej mapy poza frameMapPushRadiusBlocks."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemappushradiusblocks]
