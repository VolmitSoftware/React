[config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperlimit]
description = "Konfiguracja ograniczenia lejów. Anuluje transfery, gdy obciążenie wynikające z rozpiętości czasowej zdarzeń lejów przekracza ustawiony próg."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperlimit.field.maxhoppereventspan]
