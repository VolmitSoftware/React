"config.documentation.annotation.art.arcane.react.content.feature.featurehopperchaincoalescing.description" = "Konfiguracja funkcji lejek Chain Coalescing. Detektuje liniowe łańcuchy N lejki karmiące w tym samym kierunku i projektuje, ile na transfer lejek ticki załamałoby się do jednego przeciągania z wiązki do ręki na łańcuch tick. Działa w trybie wyłącznie pomiarowym: wykrywanie łańcucha plus zaprojektowane ticki-zawieranie ekspozycje poprzez czytnik metryk łączące łańcuchowe. Odwołanie pośrednich przesyłek InventoryMoveItemEvent koliduje z zamówieniem zużycia bucket FeatureHopperTokenBucket's, więc rzeczywisty ruch lotów jest odroczony do dedykowanego mostu NMS."
