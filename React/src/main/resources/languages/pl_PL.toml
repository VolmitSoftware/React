summary = "Sklonowane mapy React umieszczone w ramkach na przedmioty automatycznie otrzymują nowe identyfikatory map, aby sąsiednie kopie łączyły się w ścianę megamap."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.startupboostdurationms]
impact = "Wyższe wartości dłużej dają priorytet szybkiemu odzyskiwaniu po przeładowaniu; niższe szybciej wracają do normalnej częstotliwości."
