"config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.field.valuableitems.impact" = "Dodaj materiały, aby chronić więcej elementów przed przyspieszonym despotrem lub usunąć materiały, aby umożliwić szybsze czyszczenie."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.field.valuableitems.summary" = "Wykaz materiałów traktowanych jako wartościowe i wyłączonych, gdy `ignoreValuables` jest włączona."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakprojectilelimiter.description" = "Konfiguracja dla pocisk Limiter tweak. Wykorzystuje okapu rozbłysków pocisk na gracza i chunk, aby zapobiec spakowaniu spamów pocisk."
