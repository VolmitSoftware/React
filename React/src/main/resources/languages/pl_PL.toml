"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands_customshorthand.field.command.impact" = "Komanda docelowa działa z istniejącymi uprawnieniami wzywającego nadawcę i nie może podnieść dostępu."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands_customshorthand.field.command.summary" = "Komanda uruchomiona jako użytkownik skrót, bez głównej strzały. Dostarczone argumenty są dołączone automatycznie, chyba że słowo args pojawia się w przyczepach."
