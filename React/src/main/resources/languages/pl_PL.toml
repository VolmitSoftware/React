summary = "Liczba ekwipunków graczy online naprawianych w jednym przebiegu konserwacji."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.inventoryrepaircadencems]
impact = "Niższe wartości szybciej naprawiają metadane map i moduły renderowania; wyższe zmniejszają pracę na takt."
summary = "Częstotliwość skanowania ekwipunków graczy pod kątem naprawy map React w milisekundach."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.itemframechunkbatchsize]
