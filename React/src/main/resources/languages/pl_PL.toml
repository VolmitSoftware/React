"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.description" = "Konfiguracja funkcji Shorthands. Dodaje polecenia przejścia krótkiego operatora, które można skonfigurować oddzielnie bez zmiany /reload."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.customcommands.impact" = "Każdy uruchomiony wpis dynamicznie dodaje jeden polecenie. Polecenie docelowe nadal egzekwuje własne zezwolenie, a istniejące etykiety poleceń są chronione, chyba że overrideExisting jest włączony."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.customcommands.summary" = "Własne komendy skrótów organizowane przez tablicę poleceń. Dodaj [customCommands.day] tabela enabled = true, command = \"time set day\", permission = \"react.shorthands.custom\", oraz overrideExisting = false. Argumenty wpisane po dodaniu komendy skrótu do skonfigurowanego polecenia. Powiedz to. args wewnątrz aparatów w komendzie, aby umieścić je gdzie indziej."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.give.impact" = "Podczas uruchomienia skrót posiada nieokwalifikowaną komendę /give. Komenda z przestrzeniami nazwisk pozostaje dostępna."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.give.summary" = "Rejestruje /give <item> <amount> z zakończeniem karty elementów Minecraft."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.gmc.impact" = "Wyłącz tę opcję, jeśli /gmc nie jest zarejestrowany podczas aktywności funkcji Shorthands."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.gmc.summary" = "Rejestruje /gmc, aby przełączyć gracz uruchamiający polecenie do trybu Creative."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.gms.impact" = "Wyłącz tę opcję, jeśli /gms nie jest zarejestrowany podczas aktywności funkcji Shorthands."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.gms.summary" = "Rejestruje /gms, aby przełączyć gracza uruchamiającego polecenie do trybu przetrwania."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.gmsp.impact" = "Wyłącz tę opcję, jeśli /gmsp nie jest zarejestrowany podczas aktywności funkcji Shorthands."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.gmsp.summary" = "Rejestruje /gmsp, aby przełączyć gracza uruchamiającego polecenie do trybu Spectator."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.more.impact" = "Wyłącz tę opcję, jeśli /more nie jest zarejestrowany podczas aktywności funkcji Shorthands."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.more.summary" = "Rejestruje /more, aby dać graczowi jeden największy rozmiar stack dokładnie pasuje do posiadanej przedmiotu."
