[config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.field.ignorevaluables]
impact = "Włącz, aby wykluczyć pasujące przypadki; wyłącz, aby objąć je egzekwowaniem."
summary = "Pomija „przedmioty wartościowe”, gdy item despawn accelerator ocenia cele."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.field.noplayerradius]
impact = "Wyższe wartości poszerzają obszar wyszukiwania i zwiększają koszt; niższe wartości zawężają zakres i są tańsze."
summary = "„promień braku graczy” używane przez item despawn accelerator (bloki)."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.field.targettickslived]
impact = "Wyższe wartości natychmiast przybliżają przedmioty do zniknięcia; niższe zachowują bardziej naturalny czas życia."
summary = "Wartość czasu życia w taktach narzucana kwalifikującym się przedmiotom, aby przyspieszyć waniliowy czas zniknięcia."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.field.valuableitems]
