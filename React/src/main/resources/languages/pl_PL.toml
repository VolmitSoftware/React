[config.documentation.annotation.art.arcane.react.api.web.webconfiguration]
description = "Konfiguracja wbudowanego interfejsu zarządzania HTTP/WebSocket React. Zmiany są stosowane automatycznie po zapisaniu web.toml."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.advertisedurl]
impact = "Ustaw adres HTTPS odwrotnego serwera proxy, jeśli nasłuch jest dostępny spoza localhost. Wbudowany nasłuch React nadal obsługuje wyłącznie HTTP. Zmiany są stosowane automatycznie po zapisaniu web.toml."
summary = "Publiczny bazowy adres URL przekazywany bezpośrednim klientom API."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.listenaddress]
impact = "Domyślny adres :: przyjmuje ruch IPv6 i mapowany IPv4 z sieci LAN, kontenerów i przekierowanych portów. Adresu pętli zwrotnej używaj tylko za odwrotnym proxy lub przekaźnikiem na tym samym hoście."
summary = "Adres IP, z którym wiązany jest nasłuch internetowy."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.corsorigins]
impact = "Pusta lista zezwala na wszystkie źródła (origin). Dodaj konkretne źródła, aby ograniczyć dostęp między domenami."
summary = "Lista dozwolonych źródeł CORS dla API HTTP."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.listenerenabled]
impact = "React domyślnie otwiera API z uwierzytelnianiem. Ustaw false, aby nie otwierać nasłuchu HTTP ani WebSocket."
summary = "Włącza wbudowany nasłuch internetowy."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.port]
impact = "Jeśli ten port jest zajęty, React sprawdza kolejno następne 99 portów i używa faktycznie powiązanego portu dla lokalnego połączenia przekaźnika oraz generowanych bezpośrednich adresów URL, gdy advertisedUrl jest puste. Zapisanie web.toml automatycznie uruchamia ponownie nasłuch."
summary = "Preferowany port TCP serwera WWW."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.relayenabled]
impact = "Gdy true, React łączy się z brokerem przekaźnika pod adresem relayUrl, aby aplikacja towarzysząca mogła połączyć się z serwerami za NAT bez przekierowania portów."
summary = "Włącza wychodzącego klienta przekaźnika chmurowego do omijania NAT."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.relayurl]
impact = "Odczytywane tylko wtedy, gdy relayEnabled ma wartość true. Pozostaw puste, gdy przekaźnik jest wyłączony."
summary = "Bazowy adres WSS brokera przekaźnika, np. wss://relay.arcane.art; ścieżka /agent jest dodawana automatycznie."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.requiretokenforreads]
impact = "Gdy true, nieuwierzytelnione żądania GET są odrzucane z kodem 401. Ustaw false tylko w całkowicie zaufanych środowiskach sieciowych."
summary = "Wymaga prawidłowego tokenu uwierzytelniającego dla punktów końcowych HTTP tylko do odczytu."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.wspushhz]
impact = "Wyższe wartości zwiększają wierność odświeżania, ale także narzut sieci i CPU."
summary = "Docelowa częstotliwość (Hz), z jaką aktualizacje próbników są wysyłane przez połączenia WebSocket."

[config.documentation.annotation.art.arcane.react.content.action.actioncollectgarbage]
description = "Konfiguracja działania Collect Garbage. Żąda odśmiecania pamięci JVM i zgłasza natychmiast odzyskaną ilość sterty."

[config.documentation.annotation.art.arcane.react.content.action.actioncollectgarbage_params.field.postgcwaitticks]
impact = "Wyższe wartości dają kolektorom JVM więcej czasu na ustabilizowanie się; niższe zgłaszają szybciej, ale mogą zaniżyć ilość odzyskanej pamięci."
summary = "Takty oczekiwania po zażądaniu GC przed próbkowaniem pamięci."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize]
description = "Konfiguracja działania Hopper Network Normalize. Celuje w punkty zapalne lejów, łączy byty przedmiotów i może wyładowywać bezczynne gorące chunki."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.itemmergeradius]
impact = "Wyższe wartości poszerzają obszar wyszukiwania i zwiększają koszt; niższe wartości zawężają zakres i są tańsze."
summary = "Promień łączenia przedmiotów używany przez hopper network normalize (bloki)."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.maxchunks]
impact = "Wyższe wartości umożliwiają większą przepustowość przed interwencją; niższe wartości sprawiają, że łagodzenie skutków jest bardziej agresywne."
summary = "Maksymalna liczba chunków dozwolona dla hopper network normalize."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.maxmergeditementitiesperchunk]
impact = "Wyższe wartości dopuszczają większe skoki, zanim zadziała kontrola; niższe wartości ograniczają skoki wcześniej."
summary = "Maksymalna liczba połączonych bytów przedmiotów na chunk w hopper network normalize."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.minimumhopperupdatesperchunk]
impact = "Wyższe wartości wymagają silniejszych sygnałów przed działaniem; niższe wartości ułatwiają spełnienie tego warunku."
summary = "Minimalna liczba aktualizacji lejów na chunk wymagana przez hopper network normalize."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.unloadidlehotchunks]
impact = "Włącz, aby stosować to zachowanie; wyłącz, aby ta ścieżka pozostała nieaktywna."
summary = "Określa, czy hopper network normalize wyładowuje bezczynne gorące chunki."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.unsafeplayerradius]
impact = "Wyższe wartości poszerzają obszar wyszukiwania i zwiększają koszt; niższe wartości zawężają zakres i są tańsze."
summary = "Promień niebezpiecznej bliskości gracza używany przez hopper network normalize (bloki)."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.world]
impact = "Ustaw nazwę świata, aby ograniczyć działania do niego, lub zostaw puste, aby objąć wszystkie światy."
summary = "Filtr nazwy świata dla operacji hopper network normalize."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook]
description = "Wykonuje odpowiednie działania łagodzące incydent pojedynczo, obserwuje obciążenie między działaniami i kończy po ich końcowych wynikach."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.includegarbagecollection]
impact = "Domyślnie wyłączone, ponieważ jawne odśmiecanie może wstrzymać serwer."
summary = "Zezwala na etap odśmiecania pamięci, gdy użycie sterty przekracza 90%, szacowana odzyskiwalna sterta przekracza 10%, a czas GC pozostaje poniżej 2%."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.tieroverride]
impact = "Zastępuje tylko intensywność; nadal wymagane są odpowiednie dowody i utrzymujące się obciążenie."
summary = "Nadpisanie intensywności łagodzenia od 0 do 2; -1 wybiera na podstawie zaobserwowanego obciążenia."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.world]
