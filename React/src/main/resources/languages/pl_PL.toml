[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.budgetrecoverystep]
summary = "Maksymalny wzrost odległości po odzyskaniu budżetu, w chunkach; ograniczony do 1–32."
impact = "Mniejsze kroki ograniczają skoki ładowania podczas przywracania. Dotyczy tylko włączonych budżetów chunków graczy."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller]
