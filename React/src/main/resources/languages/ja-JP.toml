# React — ja-JP
#
# === ファイルの編集 ===
# plugins/React/languages/ja-JP.toml
# このファイルを直接編集できます。ローカルの変更は保持され、不足または無効な項目には内蔵の英語を使用します。
# /react language server edit ja-JP
#
# === 接頭辞 ===
# runtime.prefix: Reactがチャットメッセージの先頭に付ける接頭辞。
#
# === 書式 ===
# チャットメッセージでは & 色コードを使えます: &cテキスト&r, &lテキスト&r。
# 色: &0-&9 と &a-&f。
# スタイル: &l 太字、&o 斜体、&n 下線、&m 取り消し線、&k ランダム文字、&r リセット。
# 色コードは適用中のスタイルを解除します。&3&lテキスト&r のように、色をスタイルの前に指定してください。&r はすべての書式をリセットします。
# RGB 色には &#RRGGBBテキスト&r を使います。例: &#55AAFFテキスト&r。
# 高度な効果やインタラクションには MiniMessage を使ってください。同じメッセージ内で MiniMessage タグと & コードを混在させないでください。タグは開いた順と逆の順に閉じてください。
# TOML の引用符とエスケープを正しく記述してください。
# 引用符で囲んだ TOML 文字列内では \n で改行します。{{ と }} は波括弧そのものを表示します。
# renderer.* と config.documentation.annotation.* の値はプレーンテキストです。
# test.* の値はプレーンテキストですが、test.result.* メッセージでは書式設定を使えます。
# プレースホルダーは MiniMessage タグの外側のメッセージ本文に記述してください。
#
# === 変数 ===
# 変数名を変更せず、各メッセージに元からある変数だけを使用してください。
#   {action}  アクション名または色調整の方向
#   {actions}  待機中のアクション数または除外されたアクション名の一覧
#   {active}  有効な機能または調整項目の数
#   {actor}  変更を行った Web ユーザー
#   {added}  有効化後に機能がアクティブレジストリへ再登録されたか; 言語更新で追加されたメッセージ
#   {after}  変更後の設定値、言語メッセージ、またはヒープ使用量
#   {age}  連携データの経過時間（秒）
#   {amount}  付与するアイテム数
#   {architecture}  CPU アーキテクチャ
#   {argument}  想定外のコマンド引数
#   {available}  利用可能な NMS ブリッジハンドル数
#   {average}  平均 TPS または 1 ティックあたりのミリ秒数
#   {avg_mspt}  負荷テストの各試行における平均ティック処理時間（ミリ秒）
#   {avg_tps}  負荷テストの各試行における 1 秒あたりの平均ティック数
#   {bar}  書式設定済みのベンチマークスコアバー
#   {before}  変更前の設定値、言語メッセージ、またはヒープ使用量
#   {checked}  確認したサンプラー数
#   {chunks}  アクションの影響を受けたチャンク数
#   {code}  Web ペアリングコード
#   {command}  コマンドパス
#   {count}  項目、モジュール、変更、またはテスト結果の数
#   {current}  現在のページ番号
#   {delta_heap}  終了時のヒープ使用量の React とベースラインとの差（MB）
#   {delta_mspt}  平均ティック時間の React とベースラインとの差（ms）
#   {delta_tps}  平均 TPS の React とベースラインとの差
#   {detail}  ブリッジ、連携、アクション、またはテストの診断詳細
#   {dimensions}  検出されたマップウォールのグリッド寸法
#   {direction}  選択した色の色相を回転させる方向
#   {distance}  要求された描画・シミュレーション・送信距離（チャンク単位）
#   {duration}  経過時間。負荷テスト開始メッセージでは秒単位
#   {enabled}  有効状態または有効なモジュール数
#   {entities}  アクションの影響を受けたエンティティ数
#   {entry}  連携タイムラインの項目
#   {exceptions}  負荷テストの各試行中に記録された React の例外
#   {fail}  失敗したチェック数
#   {file}  設定、言語、またはプラグイン API のファイル名
#   {fingerprint}  サーバーまたは Web トークンのフィンガープリント
#   {finite}  有限値を返すサンプラー数
#   {frames}  使用中のマップウォールにある額縁数
#   {free}  空き物理メモリまたは空き仮想メモリ
#   {freed}  ガベージコレクションで回収されたヒープメモリ
#   {from}  現在のページの最初の項目番号
#   {grid}  マップウォールのグリッド寸法
#   {ground_y}  重力テストの地面の高さ
#   {group}  モニター、サンプラー、マップ、設定、または言語メッセージのグループ
#   {growth}  負荷テスト中のヒープ増加量（MB）
#   {health}  連携の健全性状態
#   {heap_end}  負荷テストの各試行終了時のヒープ使用量（MB）
#   {heap_start}  負荷テストの各試行開始時のヒープ使用量（MB）
#   {heartbeat}  連携の最新ハートビートからの経過時間
#   {height}  テストキャンバスの高さ（ピクセル）
#   {hoppers}  正規化したホッパー数
#   {id}  ブリッジハンドル、サンプラー、マップ、アクション、パック、またはトークンの識別子
#   {impact}  設定の影響の説明
#   {incident}  開発テスト一式から除外された再帰的インシデントアクションの識別子
#   {index}  開発テスト一式の現在のステップ番号
#   {invalid}  無効な測定値を返すサンプラー数
#   {issued_at}  Web トークンの作成時刻
#   {item}  アイテム名または識別子
#   {items}  統合したアイテムエンティティ数
#   {kept}  言語更新で保持されたローカル編集
#   {key}  コマンドパラメーターキー、設定キー、または言語メッセージ ID
#   {label}  ベンチマーク、指標、設定、コマンド、または Web トークンのラベル
#   {line}  複数行メッセージで編集中の行番号
#   {lines}  走査したサーバーログの行数
#   {loaded}  事前読み込み中に新たに読み込んだチャンク数
#   {locale}  表示、選択、または編集中の言語コード
#   {matched}  自動保存状態がテストのベースラインと一致するワールド
#   {max_tick}  負荷テストで観測した最長のティック間隔（ms）
#   {maximum}  最大アイテム数、ティック時間のしきい値、またはエディターの入力長
#   {message}  完了したアクションの概要または連携の状態メッセージ
#   {metrics}  プラグイン API パックが提供する指標数
#   {minecraft}  Minecraft のバージョン
#   {minimum}  許容される最低 TPS
#   {missing}  レジストリにない必須サンプラー数
#   {mode}  選択したゲームモードまたはアビリティモード
#   {model}  CPU モデル
#   {name}  ベンチマーク、モジュール、レンダラー、またはテストチェック名
#   {note}  サーバーログを走査しなかった理由
#   {offenders}  非有限値を返すサンプラー数
#   {options}  受け付ける設定値
#   {p95}  負荷テスト中のティック時間の 95 パーセンタイル（ms）
#   {parameter}  コマンドパラメーター名
#   {parameters}  無視されたコマンドパラメーター
#   {pass}  合格したチェック数
#   {path}  設定キーのパスまたはレポートファイルのパス
#   {percent}  色調整の割合
#   {permission}  必要な権限ノード
#   {personal}  プレイヤーが選択した言語コード
#   {phase}  テスト中の機能ライフサイクル段階
#   {pixels}  マップテストで描画した空白でないピクセル数
#   {platform}  OS または Minecraft サーバープラットフォーム
#   {players}  負荷テストの模擬プレイヤー数
#   {plugin}  プラグイン名
#   {process_load}  サーバープロセスの CPU 負荷
#   {processors}  利用可能な CPU プロセッサー数
#   {profile}  React 設定プロファイル名
#   {protocol}  連携プロトコルのバージョン
#   {radius}  開発テストのアクションのチャンク半径
#   {range}  描画・シミュレーション・送信距離の許容範囲（チャンク単位）
#   {rate}  設定された作物の成長早送り速度
#   {rating}  書式設定済みのベンチマーク評価
#   {react_errors}  サーバーログで見つかった React エラーの行数
#   {reason}  失敗、拒否、または利用不可状態の理由
#   {registered}  登録済みモジュール数
#   {remaining}  次回の言語確認が可能になるまでの時間
#   {removed_first}  最初の無効化で機能がアクティブレジストリから削除されたか
#   {removed_second}  繰り返しの無効化で機能がアクティブレジストリから削除されたか
#   {renderer}  マップレンダラー名または識別子
#   {renderers}  識別子が空のマップレンダラー一覧
#   {role}  Web アクセスロール: viewer、operator、または admin
#   {sampler}  サンプラー名または識別子
#   {samplers}  連携サンプラーまたは失敗したサンプラーの一覧
#   {scope}  マップの適用範囲または距離設定の適用範囲
#   {score}  ベンチマークスコア
#   {seconds}  カウントダウンまたは負荷テストの時間（秒）
#   {section}  設定または言語エディターのセクション
#   {server}  Minecraft サーバーの実装とバージョン
#   {shown}  現在表示中の行数
#   {since_run}  現在のテスト開始以降に報告されたエラー
#   {size}  マップウォールの最大寸法または使用中の寸法
#   {skip}  スキップしたチェック数
#   {spawn_y}  重力テストのブロックを生成した高さ
#   {state}  アクションまたはプラグイン API パックの状態
#   {status}  連携の状態または設定状態のラベル
#   {subject}  設定ヘルプで説明されるモジュールまたは設定
#   {subsystem}  テストサブシステム名
#   {summary}  アクション監査の概要
#   {system_load}  システム全体の CPU 負荷
#   {target}  操作対象のワールド、プレイヤー、プラグイン、設定、またはプラグイングループ
#   {threading}  サーバーのスレッド動作モード
#   {tick}  フリーズしきい値を超えたティック時間（ms）
#   {tick_crashes}  サーバーログで見つかったティッククラッシュの行数
#   {tier}  インシデント対応手順の重大度レベル
#   {timing}  1 分あたりのアビリティのコールバック時間（ミリ秒）
#   {to}  現在のページの最後の項目番号
#   {total}  メッセージ内の項目、モジュール、ワールド、チェック、またはメモリの合計
#   {type}  コマンドパラメーター、設定値、マップ、または距離の種類
#   {unavailable}  利用不可の NMS ブリッジハンドル数
#   {unit}  円グラフの合計値の単位ラベル
#   {unknown}  開発テスト一式から除外された不明なアクションの識別子
#   {unreadable}  読み取れなかったサンプラー数
#   {updated}  言語更新で変更されたメッセージ
#   {uptime}  ホスト OS の稼働時間
#   {url}  アップロードした診断レポートの URL
#   {usage}  コマンドの使用構文
#   {used}  使用中の物理メモリ、仮想メモリ、またはヒープ
#   {value}  書式設定済みの設定、測定値、またはハードウェア詳細
#   {values}  開発テスト一式のレポートに記載されたサンプル値
#   {variables}  編集中のメッセージで使えるプレースホルダー名
#   {vendor}  Java ベンダー
#   {version}  React、Java、またはプラットフォームのバージョン
#   {warmed}  事前読み込み済みのチャンク数
#   {warn}  警告のあるチェック数
#   {width}  テストキャンバスの幅（ピクセル）
#   {world}  Minecraft ワールド名

