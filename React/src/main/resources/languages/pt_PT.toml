[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.updatenotifications]
summary = "Procura atualizações do React nas versões do GitHub."
impact = "Ativado por predefinição. O VolmLib reúne as atualizações num aviso ao entrar e em /volmit plugins updates. Desative para parar as verificações do React."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.minimumincidentscore]
summary = "Pontuação de incidente necessária para continuar a mitigação."
impact = "O procedimento continua quando esta pontuação ou minimumTickMS é atingido."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.minimumtickms]
summary = "Duração média do tick, em milissegundos, necessária para continuar a mitigação."
impact = "O procedimento para quando ambos os indicadores de pressão ficam abaixo dos respetivos limiares."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.minimumentitiesperchunk]
summary = "Número de entidades observadas num chunk necessário antes da sua redução."
impact = "Valores mais altos limitam a redução às concentrações de entidades mais densas."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.recheckdelayms]
summary = "Intervalo de observação após concluir uma ação secundária, em milissegundos; mínimo 1000."
impact = "Permite atualizar as métricas antes de escolher outra medida."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.childtimeoutms]
summary = "Duração máxima de uma etapa de mitigação, em milissegundos; mínimo 1000."
impact = "Se uma ação secundária exceder o tempo limite, o procedimento falha e não avança para outras medidas."

[config.documentation.annotation.art.arcane.react.content.action.actiontrimentitiesbyagepriority_params.field.minimumentitiesperchunk]
summary = "Mínimo de entidades observadas num chunk antes da redução; zero inclui todos os chunks observados."
impact = "Um valor positivo limita a redução aos chunks mais densos."

[action.capture_profile]
completed = "Guardado {count} perfil local em {path}"

[config.documentation.annotation.art.arcane.react.content.action.actioncaptureprofile]
description = "Captura a pedido um perfil local do JDK Flight Recorder com eventos de execução, alocação e GC. Conserva três capturas; nunca as envia."

[config.documentation.annotation.art.arcane.react.content.action.actioncaptureprofile_params.field.seconds]
summary = "Duração do perfil em segundos, limitada entre 1 e 300."
impact = "Capturas mais longas abrangem mais atividade; a gravação JFR conserva até 64 MiB de dados recentes."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.playerchunkbudgetenabled]
summary = "Ativa orçamentos de chunks dos jogadores por mundo; as sobreposições contam uma vez."
impact = "Desativado por predefinição. Os orçamentos podem reduzir as distâncias pretendidas existentes e a recuperação é gradual."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.playertickingchunkbudget]
summary = "Máximo estimado de chunks simulados para os jogadores por mundo; mínimo 1."
impact = "As áreas de simulação sobrepostas contam uma vez. As distâncias mínimas configuradas têm prioridade se o orçamento não puder ser cumprido."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.playerviewonlychunkbudget]
summary = "Máximo estimado de chunks apenas visíveis por mundo; mínimo 1."
impact = "Conta a área visível fora da área simulada. Estima a procura dos jogadores, não os chunks carregados nem os tickets dos plugins."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.budgetrecoverychecks]
summary = "Avaliações saudáveis consecutivas do orçamento necessárias antes de aumentar uma distância; mínimo 1."
impact = "As avaliações seguem updateCooldownSeconds. Telemetria de ticks desconhecida ou um índice de jogadores indisponível reiniciam a recuperação."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.budgetrecoverystep]
summary = "Aumento máximo da distância após a recuperação do orçamento, em chunks; limitado entre 1 e 32."
impact = "Passos pequenos limitam picos de carregamento durante a recuperação. Aplica-se apenas com os orçamentos de chunks dos jogadores ativos."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller]
description = "Amostra posições de jogadores Folia e, opcionalmente, um conjunto limitado de eventos JDK Flight Recorder. O JFR regista totais de tráfego do protocolo, fases de geração de chunks, atividade de armazenamento e esperas acima do limiar configurado."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller.field.regionalenabled]
summary = "Ativa a amostragem de TPS das regiões Folia nas posições dos jogadores."
impact = "Consulta uma seleção limitada e rotativa de posições de jogadores em cache uma vez por segundo, sem carregar chunks."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller.field.playeranchorsperrefresh]
summary = "Número máximo de posições de jogadores amostradas por segundo, limitado de 1 a 512. As observações expiram após cinco segundos."
impact = "Valores mais altos abrangem mais jogadores, mas exigem mais consultas de TPS das regiões."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller.field.jfrenabled]
summary = "Ativa a telemetria JFR seletiva. Desativada por predefinição. Os resumos publicados omitem endereços, caminhos de ficheiros e rastreios da pilha."
impact = "Adiciona trabalho de gravação JFR com limites de retenção de 30 segundos e 64 MiB. As séries agregadas são repostas a zero a cada segundo."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller.field.jfrslowthresholdms]
summary = "Duração mínima em milissegundos para eventos JVM de E/S de ficheiros, entrada em monitores, espera em monitores e estacionamento de threads, limitada de 1 a 1000. As fases de geração de chunks não têm limiar de duração."
impact = "Limiares mais baixos produzem mais eventos JVM. Estas métricas descrevem apenas os eventos que atingem este limiar."
