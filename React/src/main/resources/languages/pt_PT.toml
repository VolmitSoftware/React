[config.documentation.annotation.art.arcane.react.model.reactconfiguration_valueconfig.field.basevalue]
impact = "Valores mais elevados aumentam a avaliação de base globalmente."
summary = "Valor base dos materiais antes dos ajustes de receita e de substituição."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration_valueconfig.field.maxrecipelistprecaution]
impact = "Valores mais elevados permitem uma exploração mais profunda das receitas, mas podem aumentar o custo de processamento."
