summary = "Cadência para a digitalização de chunks carregado para reparação do mapa de quadro item em milissegundos."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.maintenancetickintervalms]
impact = "Valores mais baixos reparam inventários e quadros de itens mais cedo após a recarga; valores mais elevados reduzem a sobrecarga de manutenção."
summary = "Cadência de manutenção principal para a lógica de reparo do mapa em milissegundos."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.megamapenabled]
