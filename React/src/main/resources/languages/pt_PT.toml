impact = "Valores mais elevados requerem sinais mais fortes antes da ação; valores mais baixos facilitam a satisfação dessa condição."
summary = "Velocidade mínima ao quadrado exigida pelo travão de veículos inativos."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakvehicleidlebrake.field.onlyemptyvehicles]
impact = "Ative para aplicar este comportamento; desative para manter este caminho inativo."
summary = "Controla se o travão de veículos inativos se aplica apenas a veículos vazios."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakvehicleidlebrake.field.tickintervalms]
impact = "Valores mais baixos reagem mais depressa, mas consomem mais CPU; valores mais elevados reduzem a sobrecarga, mas reagem mais tarde."
summary = "Intervalo principal de avaliação do travão de veículos inativos, em milissegundos."

[config.documentation.annotation.art.arcane.react.core.controller.configinputcontroller.field.sessiontimeoutseconds]
impact = "Valores mais elevados mantêm as instruções de edição abertas durante mais tempo antes de serem canceladas."
summary = "Tempo limite para as sessões de edição de configuração baseadas em chat em segundos."

[config.documentation.annotation.art.arcane.react.core.controller.hotloadcontroller]
description = "Monitoriza os ficheiros de configuração e de idioma do React e aplica as alterações automaticamente."

[config.documentation.annotation.art.arcane.react.core.controller.hotloadcontroller.field.maxdiffmessagesperfile]
impact = "Valores mais baixos reduzem o ruído de chat do operador em edições de configuração grandes."
summary = "Número máximo de mensagens diff no nível da chave enviadas por ficheiro alterado."

[config.documentation.annotation.art.arcane.react.core.controller.hotloadcontroller.field.notifyoperators]
impact = "Desative se quiser apenas registos na consola e nenhuma notificação no jogo."
summary = "Envia resumos de alterações de carga a quente para os operadores online."

[config.documentation.annotation.art.arcane.react.core.controller.hotloadcontroller.field.pollintervalms]
impact = "Valores mais baixos detetam mais cedo os eventos recebidos; as alterações automáticas continuam a ser aplicadas em lotes, no máximo uma vez a cada três segundos."
summary = "Intervalo de consulta de eventos do sistema de ficheiros, em milissegundos."

[config.documentation.annotation.art.arcane.react.core.controller.eventcontroller]
description = "Mede o tempo dos manipuladores de eventos por plugin envolvendo os ouvintes registados enquanto a instrumentação está ativa."

[config.documentation.annotation.art.arcane.react.core.controller.eventcontroller.field.dutycycleonms]
impact = "Janelas mais longas produzem mais amostras registadas por período com um custo recorrente maior."
summary = "Duração em milissegundos de cada janela de medição periódica no modo de ciclo."

[config.documentation.annotation.art.arcane.react.core.controller.eventcontroller.field.dutycycleperiodms]
impact = "Períodos mais curtos registam dados de eventos com mais frequência e custam mais; períodos mais longos deixam lacunas mais amplas no histórico."
summary = "Milissegundos entre os inícios das janelas de medição periódicas no modo de ciclo."

[config.documentation.annotation.art.arcane.react.core.controller.eventcontroller.field.instrumentation]
impact = "ALWAYS impõe uma sobrecarga de medição a cada manipulador de eventos; ON_DEMAND remove esse custo em repouso mas deixa lacunas no histórico; DUTY_CYCLE troca lacunas periódicas por um pequeno custo recorrente."
summary = "Controla quando os invólucros de medição dos ouvintes são instalados: ALWAYS mantém-nos instalados, ON_DEMAND instala-os apenas enquanto um monitor, um mapa, um marcador ou um visitante web lê dados de eventos, e DUTY_CYCLE abre ainda uma janela de medição periódica."

[config.documentation.annotation.art.arcane.react.core.controller.eventcontroller.field.sampleractivitywindowms]
impact = "Valores mais altos mantêm a instrumentação instalada mais tempo depois de um visitante sair; valores mais baixos removem-na mais cedo."
summary = "Milissegundos após a última leitura de dados de eventos antes de os invólucros serem removidos nos modos a pedido e de ciclo."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller]
