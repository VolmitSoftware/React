[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemappushradiusblocks]
impact = "Valores mais elevados cobrem mais espectadores, mas aumentam o leque de pacotes."
summary = "Raio máximo, em blocos, a partir de um mapa de moldura de item dentro do qual os jogadores recebem atualizações push."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemappushstateretentionms]
impact = "Valores mais elevados mantêm o estado durante mais tempo com menos rotatividade; valores mais baixos eliminam o registo auxiliar com mais agressividade."
summary = "Duração da retenção do registo auxiliar de envio do mapa de moldura, em milissegundos."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemapredrawintervalms]
