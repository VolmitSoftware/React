summary = "Produto escalar mínimo da direção de visão exigido para tratar um jogador como estando a olhar ativamente para um mapa de moldura."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemappushintervalms]
impact = "Valores mais baixos atualizam o visual do mapa mais depressa, mas aumentam a pressão de pacotes e de renderização."
summary = "Intervalo de envio de pacotes para mapas ativos de molduras de itens, em milissegundos."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemappushoutsiderangewhenholding]
impact = "Desative para interromper por completo os pacotes de mapa fora do raio; ative se segurar o mapa deve ignorar as verificações de distância."
