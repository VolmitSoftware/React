[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.value]
impact = "Valores mais elevados podem aumentar a influência de itens caros nos cálculos."
summary = "Ajuste do valor do material usado para a análise de receitas/valor."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.verbose]
impact = "Útil para resolver problemas, mas pode criar muito ruído nos registos."
summary = "Ativa saída detalhada na consola para os componentes internos do React."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration_monitoring]
description = "Configuração predefinida do painel de monitor do jogador."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration_monitoring.field.actionbarheaderslots]
impact = "Valores mais elevados reduzem a paginação horizontal, mas podem dificultar a leitura das entradas se os rótulos forem longos."
