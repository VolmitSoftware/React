[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.inventoryrepaircadencems]
impact = "Valores inferiores reparam metadados de mapas e renderizadores mais rapidamente; valores superiores reduzem o trabalho por tick."
summary = "Cadência de análise dos inventários dos jogadores para reparação de mapas React, em milissegundos."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.itemframechunkbatchsize]
impact = "Valores mais elevados aceleram a recuperação do mapa de molduras após o recarregamento; valores mais baixos reduzem o custo por passagem."
summary = "Número de chunks carregados analisados por passagem de manutenção em busca de mapas em molduras de itens."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.itemframerepaircadencems]
impact = "Valores mais baixos corrigem mais depressa os mapas em molduras de itens após o recarregamento; valores mais altos reduzem a sobrecarga de manutenção."
summary = "Cadência de análise dos chunks carregados para reparação de mapas em molduras de itens, em milissegundos."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.maintenancetickintervalms]
impact = "Valores mais baixos reparam inventários e quadros de itens mais cedo após a recarga; valores mais elevados reduzem a sobrecarga de manutenção."
summary = "Cadência de manutenção principal da lógica de reparação de mapas, em milissegundos."

