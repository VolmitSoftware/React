summary = "Armazena o histórico dos amostradores em plugins/React/history."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.fifteenminuteretentiondays]
impact = "Os agregados de uma hora preservam a cobertura histórica após este nível expirar."
summary = "Retenção dos agregados de quinze minutos em dias. Zero mantém este nível indefinidamente."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.livecaptureintervalms]
impact = "Valores mais baixos melhoram a fidelidade dos gráficos em direto, mas consultam com maior frequência todos os amostradores registados."
summary = "Cadência do instantâneo de referência dos amostradores em direto, em milissegundos."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.maxquerypoints]
impact = "Valores mais altos melhoram a resolução do gráfico à custa do tamanho da resposta e do trabalho da consulta."
summary = "Número máximo de intervalos aceites por cada série numa consulta histórica."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.maxqueryseries]
impact = "Valores mais altos podem criar tramas de retransmissão maiores e mais leituras simultâneas do disco."
summary = "Número máximo de séries aceites por uma consulta histórica."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.minuteretentiondays]
impact = "A cobertura mais antiga permanece disponível através de agregados de menor resolução."
summary = "Retenção dos agregados de um minuto em dias. Zero mantém este nível indefinidamente."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.querypagepoints]
impact = "As páginas permanecem limitadas para os tempos limite da retransmissão e dos pedidos do navegador."
summary = "Número máximo de intervalos devolvidos por série numa página de resposta histórica."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.rawretentionhours]
impact = "A cobertura mais antiga permanece disponível através de agregados de menor resolução."
summary = "Retenção das amostras exatas de um segundo em horas. Zero mantém este nível indefinidamente."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.tensecondretentiondays]
impact = "A cobertura mais antiga permanece disponível através de agregados de menor resolução."
summary = "Retenção dos agregados de dez segundos em dias. Zero mantém este nível indefinidamente."

[config.documentation.annotation.art.arcane.react.core.controller.historycontroller.field.walforceintervalms]
impact = "Uma falha do processo ou do anfitrião pode perder, no máximo, esta janela recente; valores mais baixos aumentam as escritas forçadas no disco."
summary = "Tempo máximo entre escritas forçadas do diário histórico, em milissegundos."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller]
description = "Gere os metadados dos itens de mapa do React, a reparação de renderizadores e a entrega de pacotes de mapa em direto para inventários e molduras."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemapidlepushintervalms]
