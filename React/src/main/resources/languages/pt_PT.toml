"config.documentation.annotation.art.arcane.react.content.feature.featurehopperchaincoalescing.field.engageonincident.impact" = "Valores mais elevados reservam coalescimento para incidentes graves; valores mais baixos se envolvem mais cedo."
"config.documentation.annotation.art.arcane.react.content.feature.featurehopperchaincoalescing.field.engageonincident.summary" = "limiar de desencadeamento para envolver a contabilidade coalescente em vez de detecção passiva (pontuação incidente)."
