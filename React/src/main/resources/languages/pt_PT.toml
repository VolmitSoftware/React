[config.documentation.annotation.art.arcane.react.model.reactconfiguration_valueconfig.field.valuemutlipliers]
impact = "Multiplicadores mais elevados tornam os materiais específicos mais influentes nos cálculos de valor."
summary = "Multiplicadores por material que substituem o comportamento de avaliação predefinido."

