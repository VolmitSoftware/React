[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.debug]
impact = "Use durante sessões de depuração; desative para o funcionamento normal em produção."
summary = "Ativa o registo de depuração e diagnósticos adicionais."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.integrationsecretsenabled]
impact = "Desativado por predefinição. Ative para permitir pacotes secretos do Iris/Adapt quando as dependências estão presentes."
summary = "Ativa as funcionalidades de integração secreta condicionadas por plugin."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.integrationsnapshotmaxmetrics]
impact = "Limitado a um valor entre 1 e 65536. As alterações limpam as publicações em cache no próximo ciclo de recolha de um segundo."
summary = "Número máximo de métricas distintas mantidas para os pedidos de instantâneos das integrações."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.language]
