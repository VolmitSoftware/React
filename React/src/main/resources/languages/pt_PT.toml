[config.documentation.annotation.art.arcane.react.api.web.webconfiguration]
description = "Configuração da API de gestão HTTP/WebSocket integrada no React. As alterações são aplicadas automaticamente ao guardar web.toml."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.advertisedurl]
impact = "Defina o URL HTTPS de um proxy inverso se o serviço de escuta estiver acessível fora de localhost. O serviço integrado do React continua a suportar apenas HTTP. As alterações são aplicadas automaticamente ao guardar web.toml."
summary = "URL de base público anunciado aos clientes diretos da API."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.listenaddress]
impact = "O endereço predefinido :: aceita tráfego IPv6 e IPv4 mapeado para acesso por LAN, contentores e reencaminhamento de portas. Use um endereço de loopback apenas atrás de um proxy inverso ou retransmissor na mesma máquina."
summary = "Endereço IP ao qual o serviço de escuta web se associa."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.corsorigins]
impact = "Uma lista vazia permite todas as origens. Adicione origens específicas para restringir o acesso entre origens."
summary = "Lista de origens CORS permitidas para a API HTTP."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.listenerenabled]
impact = "O React abre a API autenticada por predefinição. Defina false para não abrir qualquer serviço de escuta HTTP ou WebSocket."
summary = "Ativa o serviço de escuta web integrado."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.port]
impact = "Se esta porta estiver ocupada, o React tenta as 99 portas seguintes por ordem e usa a porta efetivamente associada para a ligação local do relay e os URL diretos gerados quando advertisedUrl está vazio. Guardar web.toml reinicia automaticamente o serviço de escuta."
summary = "Porta TCP preferida para o servidor web."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.relayenabled]
impact = "Quando true, o React liga-se ao broker de relay em relayUrl para que a aplicação companheira consiga chegar a servidores atrás de NAT sem reencaminhamento de portas."
summary = "Ativa o cliente de relay na nuvem, de saída, para atravessar NAT."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.relayurl]
impact = "Só é lido quando relayEnabled é true. Deixe vazio quando o relay estiver desativado."
summary = "URL WSS base do broker de relay, p. ex. wss://relay.arcane.art; o caminho /agent é acrescentado automaticamente."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.requiretokenforreads]
impact = "Quando true, os pedidos GET não autenticados são rejeitados com 401. Defina como false apenas em ambientes de rede totalmente fiáveis."
summary = "Exige um token de autenticação válido para os endpoints HTTP só de leitura."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.wspushhz]
impact = "Valores mais elevados aumentam a fidelidade das atualizações enviadas, mas também a carga de rede e de CPU."
summary = "Frequência alvo (Hz) com que as atualizações dos amostradores são enviadas pelas ligações WebSocket."

[config.documentation.annotation.art.arcane.react.content.action.actioncollectgarbage]
description = "Configuração da ação Recolher lixo. Pede a recolha de lixo da JVM e indica o heap recuperado de imediato."

[config.documentation.annotation.art.arcane.react.content.action.actioncollectgarbage_params.field.postgcwaitticks]
impact = "Valores mais elevados dão mais tempo aos coletores da JVM para estabilizarem; valores mais baixos comunicam mais depressa, mas podem subestimar a memória recuperada."
summary = "Ticks a aguardar depois de pedir a GC e antes de amostrar a memória."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize]
description = "Configuração da ação Normalizar rede de funis. Visa pontos críticos de funis, funde entidades de itens e pode descarregar chunks quentes inativos."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.itemmergeradius]
impact = "Valores mais elevados alargam a área de pesquisa e custam mais trabalho; valores mais baixos reduzem o âmbito e saem mais baratos."
summary = "Raio de fusão de itens usado pela normalização da rede de funis (blocos)."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.maxchunks]
impact = "Valores mais elevados permitem maior débito antes da intervenção; valores mais baixos tornam a mitigação mais agressiva."
summary = "Máximo de chunks permitido pela normalização da rede de funis."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.maxmergeditementitiesperchunk]
impact = "Valores mais elevados permitem rajadas maiores antes de o controlo atuar; valores mais baixos limitam os picos mais cedo."
summary = "Máximo de entidades de itens fundidas permitido por chunk na normalização da rede de funis."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.minimumhopperupdatesperchunk]
