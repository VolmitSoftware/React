summary = "Intervalo de envio de pacotes para observadores próximos que não estão a olhar ativamente para o mapa de moldura (milissegundos)."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemaplookdotthreshold]
