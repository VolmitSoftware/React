summary = "Orçamento total de mosaicos para uma parede de megamapa combinada."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.megamapsplitduplicates]
impact = "Desative para que os mapas clonados partilhem uma imagem e nunca se combinem."
summary = "Os mapas React clonados colocados em molduras de itens recebem automaticamente novos identificadores de mapa para que as cópias adjacentes se juntem numa parede de megamapa."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.startupboostdurationms]
impact = "Valores mais elevados priorizam recuperação rápida pós-recarga mais tempo; valores mais baixos retornam à cadência normal mais cedo."
summary = "Duração do aquecimento após o arranque ou /reload em que a recuperação de mapas usa um agrupamento de reparação agressivo (milissegundos)."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.startupboostinventorybatchsize]
impact = "Valores mais elevados fazem com que os inventários de mapas recuperem mais rapidamente logo após a recarga ao custo de trabalho extra temporário."
summary = "Tamanho do lote de reparação de inventário enquanto o aquecimento inicial está ativo."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.startupboostitemframechunkbatchsize]
impact = "Valores mais elevados fazem com que os mapas de quadros recuperem mais rápido logo após a recarga ao custo de trabalho temporário extra."
summary = "Tamanho do lote de reparação de chunks de molduras de itens enquanto o aquecimento inicial está ativo."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.startupframemappushintervalms]
impact = "Valores mais baixos fazem os mapas de molduras aparecer mais depressa após o recarregamento; valores mais altos reduzem as rajadas temporárias de pacotes durante o aquecimento."
summary = "Intervalo de envio de pacotes usado durante o aquecimento inicial, em milissegundos."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemappushbatchsize]
summary = "Número máximo de mapas monitorizados em molduras considerados para envio de pacotes por passagem de manutenção."
impact = "Valores mais altos atualizam mais depressa paredes de mapas muito grandes; valores mais baixos limitam a pressão sobre o agendador e a pesquisa de entidades."

[config.documentation.annotation.art.arcane.react.core.controller.incidentcontroller]
description = "Guarda provas estruturadas de incidentes para o plugin e o visualizador web."

[config.documentation.annotation.art.arcane.react.core.controller.incidentcontroller.field.persistenceenabled]
impact = "Desativar a persistência mantém apenas o histórico da execução atual."
summary = "Guarda o histórico estruturado de incidentes em plugins/React/incidents.json."

[config.documentation.annotation.art.arcane.react.core.controller.incidentcontroller.field.retention]
impact = "Valores maiores preservam mais histórico e usam mais memória e espaço em disco."
summary = "Número máximo de eventos de incidente estruturados mantidos."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration]
description = "Configuração global do React. Controla a disposição predefinida de monitorização, o ajuste do modelo de valor e o comportamento de diagnóstico."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.adaptabilityopsmetricmode]
