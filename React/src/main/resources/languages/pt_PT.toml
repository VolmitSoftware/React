"config.documentation.annotation.art.arcane.react.content.feature.featurefurnacebrewbatching.description" = "Configuração para Forno / Função de Batchamento de Bruto. Segue fornos ativos e postos de cerveja por chunk e mede o número de ticks intermediários que poderiam ser saltados entre eventos de combustível-out / cozinha-completo. Relatórios projetado skip volume como uma métrica de tempo de execução; contorna qualquer bloco dentro bypassRadius de um jogador, assim que chama cosmética/ fumaça permanece animada perto dos jogadores."
