summary = "Número de inventários de jogadores online reparados por passe de manutenção."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.inventoryrepaircadencems]
impact = "Valores inferiores reparam metadados de mapas e renderizadores mais rapidamente; valores superiores reduzem o trabalho por tick."
summary = "Cadence para digitalizar inventários de jogadores React reparação do mapa em milissegundos."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.itemframechunkbatchsize]
