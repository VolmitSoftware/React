[config.documentation.annotation.art.arcane.react.model.reactconfiguration_monitoring.field.actionbarsamplerslots]
impact = "Valores mais elevados reduzem a paginação dentro de um grupo, mas podem comprometer a legibilidade em ecrãs pequenos."
summary = "Número máximo de amostradores mostrados de uma vez na linha em foco da barra de ação."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration_monitoring.field.monitorconfiguration]
impact = "Alterar isto muda a estrutura de base do painel do monitor para as novas definições."
summary = "Grupos de monitor e amostradores predefinidos mostrados aos jogadores."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration_valueconfig]
