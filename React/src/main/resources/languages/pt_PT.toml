"config.documentation.annotation.art.arcane.react.content.feature.featurehopperchaincoalescing.description" = "Configuração para funil Chain Coalescing. Detecta cadeias lineares de N funis alimentando a mesma direção e projeta quantas por transferência funil ticks colapsaria em um único tirão batchado cabeça-para-cauda por cadeia por tick. Opera em modo apenas de medição: detecção de cadeia mais ticks projetada salvada exposta através do leitor de métricas coalheating cadeia. Cancelamento intermediário InventoryMoveItemEvent dispatches colisões com FeatureHopperTokenBucket's bucket consumo ordenamento, então o movimento batchado real é adiado para uma ponte NMS dedicada."
