summary = "Intervalo mínimo entre redesenhos de tela dos mapas React em molduras de itens, em milissegundos."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemaprequirelineofsight]
impact = "Ativar elimina pacotes para visualizadores ocluídos, mas adiciona verificações de visibilidade leves."
summary = "Se ativado, os envios do mapa de moldura exigem linha de visão para os observadores próximos (quem o segura ignora isto)."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemapvalidateintervalms]
impact = "Valores mais baixos detetam mais cedo os itens de moldura trocados; valores mais altos evitam leituras repetidas de metadados dos itens a cada tick de manutenção."
summary = "Intervalo entre revalidações completas das pilhas de itens dos mapas de moldura acompanhados, em milissegundos."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.heldmapredrawintervalms]
impact = "Valores mais baixos rodam e atualizam os mapas segurados de forma mais fluida; valores mais altos reduzem o trabalho de renderização quando muitos jogadores veem o mesmo mapa."
summary = "Intervalo mínimo entre redesenhos de tela dos mapas React segurados, em milissegundos."

[config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.inventoryrepairbatchsize]
