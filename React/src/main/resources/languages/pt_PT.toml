"config.documentation.annotation.art.arcane.react.content.feature.featureexplosionpacketbatching.description" = "Configuração para Explosion Packet Batching. Coleta explosões tick semelhantes por mundo, agrupá-las através de mergeRadius e mede quantas pacotes separadas ClientboundExplodePackets colapsariam em um pacote combinado por cluster. Relatórios projetaram redução exploração a pacotes como uma métrica de tempo de execução; contorna os clusters cuja qualquer explosão está dentro do bypassRadius de um jogador. Observadores próximos vêem animação / fidelidade de som vanilla. Enviado apenas como medida pendente de uma ponte NMS com segurança Folia sintetizada - explodir pacotes."
