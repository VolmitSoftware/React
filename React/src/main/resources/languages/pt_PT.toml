[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.unsafebytecode]
impact = "Desativado por predefinição. As funcionalidades NMS específicas de cada versão podem continuar a ligar a sua própria instrumentação quando são ativadas. A instrumentação ligada permanece até a JVM ser reiniciada."
