# React — pt_PT
#
# === Editar o ficheiro ===
# plugins/React/languages/pt_PT.toml
# Pode editar este ficheiro diretamente. As alterações locais são preservadas; as entradas em falta ou inválidas usam o inglês incorporado.
# /react language server edit pt_PT
#
# === Prefixo ===
# runtime.prefix: Prefixo que o React adiciona antes das mensagens de chat.
#
# === Formatação ===
# As mensagens de conversa suportam códigos de cor com &: &cTexto&r, &lTexto&r.
# Cores: &0-&9 e &a-&f.
# Estilos: &l negrito, &o itálico, &n sublinhado, &m rasurado, &k caracteres ofuscados, &r reposição.
# Os códigos de cor removem os estilos ativos; coloque a cor antes do estilo, como em &3&lTexto&r. &r repõe toda a formatação.
# As cores RGB usam &#RRGGBBTexto&r, por exemplo &#55AAFFTexto&r.
# Use MiniMessage para gradientes e interações; não misture etiquetas MiniMessage e códigos & na mesma mensagem. Feche as etiquetas pela ordem inversa à de abertura.
# Mantenha válidas as aspas e as sequências de escape TOML.
# Use \n em cadeias TOML entre aspas para uma nova linha; {{ e }} apresentam chavetas literais.
# Os valores de renderer.* e config.documentation.annotation.* são texto simples.
# Os valores de test.* são texto simples, exceto as mensagens de test.result.*, que suportam formatação.
# Use as variáveis no texto da mensagem, fora das etiquetas MiniMessage.
#
# === Variáveis ===
# Mantenha os nomes das variáveis e use apenas as que pertencem a cada mensagem.
#   {action}  Nome da ação ou sentido do ajuste de cor
#   {actions}  Número de ações em fila ou lista dos nomes de ações excluídas
#   {active}  Número de funcionalidades ou ajustes ativos
#   {actor}  Utilizador web que efetuou uma alteração
#   {added}  Indica se uma funcionalidade regressou ao registo ativo após a ativação
#   {after}  Valor de configuração, mensagem de idioma ou utilização da memória heap após uma alteração
#   {age}  Idade dos dados de integração em segundos
#   {amount}  Número de objetos a dar
#   {architecture}  Arquitetura da CPU
#   {argument}  Argumento de comando inesperado
#   {available}  Número de referências disponíveis da ponte NMS
#   {average}  TPS médios ou milissegundos médios por tick
#   {avg_mspt}  Milissegundos médios por tick durante uma passagem do teste de carga
#   {avg_tps}  Ticks médios por segundo durante uma passagem do teste de carga
#   {bar}  Barra formatada da pontuação do teste de desempenho
#   {before}  Valor de configuração, mensagem de idioma ou utilização da memória heap antes de uma alteração
#   {checked}  Número de amostradores verificados
#   {chunks}  Número de chunks afetados por uma ação
#   {code}  Código de emparelhamento web
#   {command}  Caminho do comando
#   {count}  Número de entradas, módulos, alterações ou resultados de testes
#   {current}  Número da página atual
#   {delta_heap}  Diferença na utilização final do heap entre o React e a referência, em MB
#   {delta_mspt}  Diferença no tempo médio dos ticks entre o React e a referência, em ms
#   {delta_tps}  Diferença nos TPS médios entre o React e a referência
#   {detail}  Detalhes de diagnóstico da ponte, integração, ação ou teste
#   {dimensions}  Dimensões detetadas da grelha da parede de mapas
#   {direction}  Sentido de rotação da tonalidade da cor selecionada
#   {distance}  Distância de visão, simulação ou envio pedida, em chunks
#   {duration}  Tempo decorrido; as mensagens de início dos testes de carga usam segundos
#   {enabled}  Estado de ativação ou número de módulos ativados
#   {entities}  Número de entidades afetadas por uma ação
#   {entry}  Entrada da cronologia da integração
#   {exceptions}  Exceções do React registadas durante uma passagem do teste de carga
#   {fail}  Número de verificações falhadas
#   {file}  Nome do ficheiro de configuração, idioma ou API de plugins
#   {fingerprint}  Impressão digital do servidor ou do token web
#   {finite}  Número de amostradores que devolvem valores finitos
#   {frames}  Número de molduras na parede de mapas ativa
#   {free}  Memória física ou virtual livre
#   {freed}  Memória heap libertada pela recolha de lixo
#   {from}  Número da primeira entrada na página atual
#   {grid}  Dimensões da grelha da parede de mapas
#   {ground_y}  Altura do solo para o teste de gravidade
#   {group}  Grupo de monitores, amostradores, mapas, configuração ou mensagens de idioma
#   {growth}  Crescimento do heap durante um teste de carga, em MB
#   {health}  Estado de funcionamento da integração
#   {heap_end}  Utilização do heap no fim de uma passagem do teste de carga, em MB
#   {heap_start}  Utilização do heap no início de uma passagem do teste de carga, em MB
#   {heartbeat}  Tempo desde o último sinal de atividade da integração
#   {height}  Altura da área de desenho do teste em píxeis
#   {hoppers}  Número de funis normalizados
#   {id}  Identificador da referência da ponte, amostrador, mapa, ação, pacote ou token
#   {impact}  Descrição do efeito da configuração ou custo do plugin em ms/s
#   {incident}  Identificador da ação recursiva de incidentes excluída dos testes de desenvolvimento
#   {index}  Número do passo atual dos testes de desenvolvimento
#   {invalid}  Número de amostradores com leituras inválidas
#   {issued_at}  Data e hora de criação do token web
#   {item}  Nome ou identificador do objeto
#   {items}  Número de entidades de objetos fundidas
#   {key}  Chave do parâmetro de comando, chave de configuração ou ID da mensagem de idioma
#   {label}  Rótulo do teste de desempenho, métrica, definição, comando ou token web
#   {line}  Número da linha em edição numa mensagem com várias linhas
#   {lines}  Número de linhas do registo do servidor examinadas
#   {loaded}  Número de chunks carregados pela primeira vez durante o pré-carregamento
#   {locale}  Código de idioma apresentado, selecionado ou editado
#   {matched}  Mundos cujo estado de gravação automática corresponde à referência do teste
#   {max_tick}  Maior intervalo observado entre ticks durante um teste de carga, em ms
#   {maximum}  Número máximo de objetos, limiar de tempo dos ticks ou comprimento da entrada no editor
#   {message}  Resumo da ação concluída ou mensagem de estado da integração
#   {metrics}  Número de métricas fornecidas por um pacote de API de plugins
#   {minecraft}  Versão do Minecraft
#   {minimum}  TPS mínimos aceitáveis
#   {missing}  Número de amostradores necessários em falta no registo
#   {mode}  Modo de jogo ou de habilidade selecionado
#   {model}  Modelo da CPU
#   {name}  Nome do teste de desempenho, módulo, renderizador ou verificação
#   {note}  Motivo pelo qual o registo do servidor não foi examinado
#   {offenders}  Número de amostradores que devolvem valores não finitos
#   {operations}  Operações de callbacks de habilidades por minuto
#   {options}  Valores de configuração aceites
#   {p95}  Percentil 95 do tempo dos ticks durante um teste de carga, em ms
#   {parameter}  Nome do parâmetro de comando
#   {parameters}  Parâmetros de comando ignorados
#   {pass}  Número de verificações aprovadas
#   {path}  Caminho da chave de configuração ou do ficheiro de relatório
#   {percent}  Percentagem de ajuste de cor ou proporção do impacto do plugin
#   {permission}  Nó de permissão necessário
#   {personal}  Código de idioma selecionado pelo jogador
#   {phase}  Fase do ciclo de vida da funcionalidade em teste
#   {pixels}  Número de píxeis não vazios desenhados por um teste de mapas
#   {platform}  Sistema operativo ou plataforma do servidor Minecraft
#   {players}  Número de jogadores sintéticos num teste de carga
#   {plugin}  Nome do plugin
#   {process_load}  Carga de CPU do processo do servidor
#   {processors}  Número de processadores de CPU disponíveis
#   {profile}  Nome do perfil de configuração do React
#   {protocol}  Versão do protocolo de integração
#   {radius}  Raio em chunks para uma ação de mapas ou dos testes de desenvolvimento
#   {range}  Intervalo permitido da distância de visão, simulação ou envio, em chunks
#   {rate}  Velocidade configurada de avanço rápido das culturas
#   {rating}  Avaliação formatada do teste de desempenho
#   {react_errors}  Número de linhas de erro do React encontradas no registo do servidor
#   {reason}  Explicação da falha, rejeição ou estado indisponível
#   {registered}  Número de módulos registados
#   {removed_first}  Indica se a primeira desativação removeu uma funcionalidade do registo ativo
#   {removed_second}  Indica se uma desativação repetida removeu uma funcionalidade do registo ativo
#   {renderer}  Nome ou identificador do renderizador de mapas
#   {renderers}  Lista de renderizadores de mapas com identificadores vazios
#   {role}  Papel de acesso web: viewer, operator ou admin
#   {sampler}  Nome ou identificador do amostrador
#   {samplers}  Lista de amostradores de integração ou com falhas
#   {scope}  Âmbito do mapa ou da definição de distância
#   {score}  Pontuação do teste de desempenho
#   {seconds}  Contagem decrescente ou duração do teste de carga em segundos
#   {section}  Nome da secção de configuração
#   {server}  Implementação e versão do servidor Minecraft
#   {shown}  Número de linhas atualmente apresentadas
#   {since_run}  Erros comunicados desde o início do teste atual
#   {size}  Dimensões máximas ou ativas da parede de mapas
#   {skip}  Número de verificações ignoradas
#   {spawn_y}  Altura a que o bloco do teste de gravidade foi gerado
#   {state}  Estado da ação ou do pacote de API de plugins
#   {status}  Rótulo do estado da integração ou da configuração
#   {subject}  Módulo ou definição descritos pela ajuda de configuração
#   {subsystem}  Nome do subsistema de testes
#   {summary}  Resumo da auditoria de ações
#   {system_load}  Carga de CPU de todo o sistema
#   {target}  Mundo, jogador, plugin, definição ou grupo de plugins visado por uma operação
#   {threading}  Modo de gestão de threads do servidor
#   {tick}  Duração do tick que ultrapassou o limiar de bloqueio, em ms
#   {tick_crashes}  Número de linhas de falhas de ticks encontradas no registo do servidor
#   {tier}  Nível de gravidade do procedimento de incidentes
#   {timing}  Tempo de callbacks de habilidades em milissegundos por minuto
#   {to}  Número da última entrada na página atual
#   {total}  Total de entradas, módulos, mundos, verificações ou memória da mensagem
#   {type}  Tipo do parâmetro de comando, valor de configuração, mapa ou distância
#   {unavailable}  Número de referências indisponíveis da ponte NMS
#   {unit}  Rótulo da unidade para o total de um gráfico circular
#   {unknown}  Identificador da ação desconhecida excluída dos testes de desenvolvimento
#   {unreadable}  Número de amostradores que não foi possível ler
#   {uptime}  Tempo de atividade do sistema operativo anfitrião
#   {url}  URL do relatório de diagnóstico carregado
#   {usage}  Sintaxe de utilização do comando
#   {used}  Memória física, memória virtual ou heap utilizados
#   {value}  Definição, medição ou detalhe de hardware formatados
#   {values}  Valores amostrados listados num relatório dos testes de desenvolvimento
#   {variables}  Nomes de variáveis aceites pela mensagem em edição
#   {vendor}  Fornecedor de Java
#   {verdict}  Resultado global do teste
#   {version}  Versão do React, Java ou da plataforma
#   {warmed}  Número de chunks pré-carregados
#   {warn}  Número de verificações com avisos
#   {width}  Largura da área de desenho do teste em píxeis
#   {world}  Nome do mundo Minecraft

