"config.documentation.annotation.art.arcane.react.content.feature.featuretrinityincidentmode.description" = "Konfiguration für die Funktion Trinity Incident Mode. Diese Funktion überwacht kontinuierlich das Verhalten des Servers und wendet während der Laufzeit Leitplanken an."
