"config.documentation.annotation.art.arcane.react.content.feature.featureexplosionpacketbatching.field.maxmergedbroadcastspertick.summary" = "Maximum merged explosion clusters broadcast across all worlds per server tick."
"config.documentation.annotation.art.arcane.react.content.feature.featureexplosionpacketbatching.field.maxmergedbroadcastspertick.impact" = "Higher values flush bursts sooner but multiply recipient fanout; values clamp to 1..1024."
"config.documentation.annotation.art.arcane.react.content.feature.featureexplosionpacketbatching.field.maxsuppressedexplosiondebt.summary" = "Global maximum suppressed explosions awaiting a merged broadcast."
"config.documentation.annotation.art.arcane.react.content.feature.featureexplosionpacketbatching.field.maxsuppressedexplosiondebt.impact" = "Once full, additional explosion packets stay vanilla; values clamp to 0..65536."
"config.documentation.annotation.art.arcane.react.content.feature.featureexplosionpacketbatching.field.shutdowndraintimeoutms.summary" = "Maximum time to drain suppressed explosion broadcasts during deactivation (milliseconds)."
"config.documentation.annotation.art.arcane.react.content.feature.featureexplosionpacketbatching.field.shutdowndraintimeoutms.impact" = "A timeout fails deactivation and retains unsent broadcasts instead of silently losing their sound and particles."
"config.documentation.annotation.art.arcane.react.content.feature.featurefarmburstsmoother.field.shutdowndraintimeoutms.summary" = "Maximum time spent waiting for owner-thread growth application during deactivation (milliseconds)."
"config.documentation.annotation.art.arcane.react.content.feature.featurefarmburstsmoother.field.shutdowndraintimeoutms.impact" = "Higher values give busy regions longer to preserve cancelled growth; a nonempty remainder fails deactivation instead of being discarded."
"config.documentation.annotation.art.arcane.react.content.feature.featurefastexplosions.field.maxblocksperownerexecution.summary" = "Maximum explosion blocks processed by one chunk-owner callback."
"config.documentation.annotation.art.arcane.react.content.feature.featurefastexplosions.field.maxblocksperownerexecution.impact" = "Lower values tighten region-tick work at the cost of more continuation ticks."
"config.documentation.annotation.art.arcane.react.content.feature.featurefastexplosions.field.maxpendingblocksglobal.summary" = "Maximum accepted explosion blocks retained across all worlds."
"config.documentation.annotation.art.arcane.react.content.feature.featurefastexplosions.field.maxpendingblocksglobal.impact" = "Lower values bound shutdown memory more tightly; overflow remains in vanilla explosion handling."
"config.documentation.annotation.art.arcane.react.content.feature.featurefastexplosions.field.maxpendingblocksperworld.summary" = "Maximum accepted explosion blocks retained for one world."
"config.documentation.annotation.art.arcane.react.content.feature.featurefastexplosions.field.maxpendingblocksperworld.impact" = "Lower values prevent one world from consuming the whole global pending-block allowance."
"config.documentation.annotation.art.arcane.react.content.feature.featurefastexplosions.field.shutdowndraintimeoutms.summary" = "Maximum time to drain accepted fast-explosion block work during deactivation (milliseconds)."
"config.documentation.annotation.art.arcane.react.content.feature.featurefastexplosions.field.shutdowndraintimeoutms.impact" = "A timeout fails deactivation instead of silently losing blocks already removed from vanilla explosion handling."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.itemchunkbudgetpertick.summary" = "Maximum item-bearing chunks inspected across all worlds per tick."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.itemchunkbudgetpertick.impact" = "Higher values revisit indexed chunks faster but can schedule more region work; values clamp to 1..4096."
"config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemappushbatchsize.summary" = "Maximum tracked item-frame maps considered for packet pushes per maintenance pass."
"config.documentation.annotation.art.arcane.react.core.controller.mapcontroller.field.framemappushbatchsize.impact" = "Higher values refresh very large map walls sooner; lower values cap scheduler and entity-lookup pressure."
