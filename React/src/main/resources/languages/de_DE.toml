"config.documentation.annotation.art.arcane.react.content.tweak.tweakentitybubbler.description" = "Konfiguration für Entity Bubbler-Twick. Verhindert, dass ausgewählte Projektil- oder Utility-Eintheiten in Blasenkolonnen auf unbestimmte Zeit ausgesetzt werden."
