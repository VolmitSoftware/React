summary = "Auslöseschwelle für die Iris-Generierungszeit im Iris Terrain Surge Guard."

[config.documentation.annotation.art.arcane.react.content.feature.featureiristerrainsurgeguard.field.triggeririspregeninflight]
impact = "Höhere Werte lösen erst aus, wenn die Vorgenerierung der Welt nahe an ihrer vollen Parallelität läuft; niedrigere Werte lösen auch bei leichterer Vorgenerierungslast aus."
summary = "Laufende Chunk-Anfragen des Iris-Pregenerators für diese Welt, ab denen der Iris-Geländespitzenschutz auslöst, sobald die Tick-Zeit auch triggerIrisPregenTickMS erreicht; Werte werden auf 1..256 begrenzt."

[config.documentation.annotation.art.arcane.react.content.feature.featureiristerrainsurgeguard.field.triggeririspregentickms]
impact = "Höhere Werte lassen die Vorgenerierung ohne Spielerbegrenzung laufen, bis der Server weiter zurückfällt; niedrigere Werte begrenzen die Chunk-Generierung durch Spieler früher, während eine Vorgenerierung läuft."
summary = "Tick-Zeitschwelle, die zusätzlich erreicht sein muss, bevor laufende Anfragen des Iris-Pregenerators den Iris-Geländespitzenschutz auslösen (Millisekunden); Werte werden auf 1..1000 begrenzt."

[config.documentation.annotation.art.arcane.react.content.feature.featureiristerrainsurgeguard.field.triggertickms]
impact = "Höhere Werte verzögern die Aktivierung oder den Ausstieg; niedrigere Werte erleichtern das Überschreiten dieses Schwellenwerts."
summary = "Tick-Zeit-Schwelle für den Auslöser im Iris Terrain Surge Guard (Millisekunden)."

[config.documentation.annotation.art.arcane.react.content.feature.featureiristerrainsurgeguard.field.windowms]
impact = "Längere Fenster glätten Bursts, reagieren aber langsamer; kürzere Fenster reagieren schneller, sind jedoch empfindlicher."
summary = "Länge des gleitenden Durchsetzungsfensters, das der Iris Terrain Surge Guard verwendet (Millisekunden)."

[config.documentation.annotation.art.arcane.react.content.feature.featureirisworldchunksharepiemap]
description = "Konfiguration der Funktion Iris World Chunk Share Pie Map. Diese Funktion überwacht kontinuierlich das Verhalten des Servers und wendet während der Laufzeit Leitplanken an."

[config.documentation.annotation.art.arcane.react.content.feature.featureitembackpressure]
description = "Konfiguration für Item Backpressure Feature. Diese Funktion überwacht kontinuierlich das Verhalten des Servers und wendet während der Laufzeit Leitplanken an."

[config.documentation.annotation.art.arcane.react.content.feature.featureitembackpressure.field.maxitemsremovedpercycle]
impact = "Höhere Werte erlauben größere Bursts, bevor die Steuerung eingreift; niedrigere Werte klemmen Spikes früher."
summary = "Maximal erlaubte Anzahl entfernter Gegenstände pro Zyklus bei Item Backpressure."

[config.documentation.annotation.art.arcane.react.content.feature.featureitembackpressure.field.maxitemsscannedperworld]
impact = "Höhere Werte prüfen Drops schneller bei höheren Kosten pro Zyklus; niedrigere Werte setzen eine engere feste Arbeitsgrenze."
summary = "Maximale Anzahl an Entitätskandidaten, die Item Backpressure pro Zyklus scannt."

[config.documentation.annotation.art.arcane.react.content.feature.featureitembackpressure.field.minimumitemageticks]
impact = "Höhere Werte erfordern stärkere Signale vor dem Handeln; niedrigere Werte machen diese Bedingung leichter zu erfüllen."
summary = "Mindestalter der Gegenstände in Ticks, das Item Backpressure verlangt."

[config.documentation.annotation.art.arcane.react.content.feature.featureitembackpressure.field.noplayerradius]
impact = "Höhere Werte erweitern den Suchbereich und kosten mehr Arbeit; niedrigere Werte verengen den Umfang und laufen billiger."
summary = "Radius ohne Spieler in der Nähe, den Item Backpressure verwendet (Blöcke)."

[config.documentation.annotation.art.arcane.react.content.feature.featureitembackpressure.field.protectnameditems]
impact = "Aktivieren Sie dies, um übereinstimmende Ziele sicher zu halten; deaktivieren Sie es, damit sie für die Handhabung in Frage kommen."
summary = "Schützt benannte Gegenstände vor der Durchsetzung von Item Backpressure."

[config.documentation.annotation.art.arcane.react.content.feature.featureitembackpressure.field.protectvaluables]
impact = "Aktivieren Sie dies, um übereinstimmende Ziele sicher zu halten; deaktivieren Sie es, damit sie für die Handhabung in Frage kommen."
summary = "Schützt Wertsachen vor der Durchsetzung von Item Backpressure."

[config.documentation.annotation.art.arcane.react.content.feature.featureitembackpressure.field.tickintervalms]
impact = "Niedrigere Werte reagieren schneller, verbrauchen aber mehr CPU; höhere Werte reduzieren den Overhead, reagieren aber später."
summary = "Hauptauswertungsintervall für Item Backpressure in Millisekunden."

[config.documentation.annotation.art.arcane.react.content.feature.featureitembackpressure.field.triggerentitycount]
impact = "Höhere Werte lösen später eine Minderung aus, niedrigere Werte früher und aggressiver."
summary = "Auslöseschwelle für die Entitätenanzahl bei Item Backpressure."

[config.documentation.annotation.art.arcane.react.content.feature.featureitembackpressure.field.triggerticktimems]
impact = "Höhere Werte verzögern die Aktivierung oder den Ausstieg; niedrigere Werte erleichtern das Überschreiten dieses Schwellenwerts."
summary = "Tick-Zeit-Schwelle für die Auslösezeit bei Item Backpressure (Millisekunden)."

[config.documentation.annotation.art.arcane.react.content.feature.featureitemsuperstacker]
description = "Konfiguration für die Item Super Stacker-Funktion. Diese Funktion überwacht kontinuierlich das Verhalten des Servers und wendet während der Laufzeit Leitplanken an."

[config.documentation.annotation.art.arcane.react.content.feature.featureitemsuperstacker.field.glossbundleheaderformat]
summary = "Kopfzeile des vertikalen Gloss-Labels für React-Bündel."
impact = "Gloss ersetzt den Gesamtzahl-Platzhalter und stellt Farbcodes mit kaufmännischem Und dar."

[config.documentation.annotation.art.arcane.react.content.feature.featureitemsuperstacker.field.glossbundleentryformat]
summary = "Zeile des vertikalen Gloss-Labels für jedes Material in React-Bündeln."
impact = "Gloss ersetzt die Platzhalter für Anzahl und Typ und stellt Farbcodes mit kaufmännischem Und dar."

[config.documentation.annotation.art.arcane.react.content.feature.featureitemsuperstacker.field.glossbundlemoreformat]
summary = "Zusatz des vertikalen Gloss-Labels für ausgeblendete Materialien in React-Bündeln."
impact = "Gloss ersetzt den Platzhalter für verbleibende Materialien und stellt Farbcodes mit kaufmännischem Und dar."

[config.documentation.annotation.art.arcane.react.content.feature.featureitemsuperstacker.field.glossbundleentrylimit]
summary = "Maximale Anzahl angezeigter Materialeinträge im Gloss-Label eines React-Bündels."
impact = "Weitere Materialtypen werden in der konfigurierten Restzeile zusammengefasst. Werte werden auf 1 bis 10 begrenzt."

[config.documentation.annotation.art.arcane.react.content.feature.featureitemsuperstacker.field.maxitemsperbundle]
impact = "Höhere Werte erlauben größere Bursts, bevor die Steuerung eingreift; niedrigere Werte klemmen Spikes früher."
summary = "Maximal erlaubte Anzahl Gegenstände pro Bündel im Item Super Stacker."

[config.documentation.annotation.art.arcane.react.content.feature.featureitemsuperstacker.field.searchradius]
impact = "Höhere Werte erweitern den Suchbereich und kosten mehr Arbeit; niedrigere Werte verengen den Umfang und laufen billiger."
summary = "Vom Item Super Stacker verwendeter Suchradius (Blöcke)."

[config.documentation.annotation.art.arcane.react.content.feature.featureitemsuperstacker.field.mergematchingstacks]
impact = "Besonders wirksam bei dichten Ansammlungen abgebauter Gegenstände wie Bruchstein; die normale maximale Stapelgröße bleibt erhalten."
summary = "Führt gewöhnliche passende Gegenstandsstapel sofort zusammen, ohne auf Minecrafts Zusammenführungstimer zu warten."

[config.documentation.annotation.art.arcane.react.content.feature.featureitemsuperstacker.field.maxmergesperpass]
impact = "Höhere Werte fassen dichte Gegenstandsgruppen schneller zusammen; zur Begrenzung der Arbeit pro Durchlauf wird der Wert auf 1 bis 64 begrenzt."
summary = "Maximale Anzahl naher Gegenstandsentitäten, die ein Durchlauf des Super-Staplers zusammenfasst."

[config.documentation.annotation.art.arcane.react.content.feature.featureitemsuperstacker.field.spawnmergedelayticks]
impact = "Ein Tick lässt Bukkit das Hinzufügen der Gegenstandsentität abschließen; der verwendete Wert wird auf 1 bis 20 Ticks begrenzt."
summary = "Ticks nach dem Erscheinen eines Gegenstands bis zur ersten Gruppenzusammenführung durch React."

[config.documentation.annotation.art.arcane.react.content.feature.featurelazygravity]
description = "Konfiguration der Funktion Lazy Gravity. Verfolgt FallingBlock-Entitäten auf freien vertikalen Bahnen und meldet überspringbare Ticks. Unter der konfigurierten Belastung überspringt der versionierte Hook zulässige Ticks außerhalb von bypassRadius; ohne den Hook bleibt die Funktion reine Messung. Spaltenänderungen geben betroffene Blöcke an die Vanilla-Physik zurück."

[config.documentation.annotation.art.arcane.react.content.feature.featurelazygravity.field.bypassradius]
impact = "Höhere Werte lassen mehr fallende Blöcke in Spielernähe nach Vanilla-Animation laufen; niedrigere Werte lassen Lazy Gravity näher heranreichen."
summary = "Umgehungsradius um Spieler in Blöcken; fallende Blöcke innerhalb überspringen Lazy Gravity vollständig."

[config.documentation.annotation.art.arcane.react.content.feature.featurelazygravity.field.engageincidentscore]
impact = "Niedrigere Werte greifen bei milderen Vorfällen ein; höhere Werte reservieren sie für schwere Vorfälle."
summary = "Vorfallscore (0-100), der erforderlich ist, bevor Lazy Gravity eingreift."

[config.documentation.annotation.art.arcane.react.content.feature.featurelazygravity.field.engageticktimems]
impact = "Niedrigere Werte greifen früher ein; höhere Werte reservieren sie für schwerere Last."
summary = "Erforderliche durchschnittliche Tick-Millisekunden, bevor Lazy Gravity eingreift."

[config.documentation.annotation.art.arcane.react.content.feature.featurelazygravity.field.maxtrackedtasks]
impact = "Höhere Werte decken größere Sandspender-Farmen bei höheren Speicherkosten ab; niedrigere Werte begrenzen den Speicher."
summary = "Maximale Anzahl gleichzeitig verfolgter Fallblock-Aufgaben."

[config.documentation.annotation.art.arcane.react.content.feature.featurelazygravity.field.reappertick]
impact = "Höhere Werte halten die Aufgabenübersicht sauberer; niedrigere Werte glätten die CPU-Last auf Kosten langsamerer Bereinigung."
summary = "Maximale Anzahl bereinigter Einträge pro Wartungstick beim Scannen abgelaufener Aufgaben."

[config.documentation.annotation.art.arcane.react.content.feature.featurelazygravity.field.releaseticktimems]
impact = "Niedrigere Werte halten das Tracking aus Stabilitätsgründen länger; höhere Werte werden früher freigegeben."
summary = "Durchschnittliche Tick-Millisekunden, unter denen der Server bleiben muss, bevor Lazy Gravity freigegeben wird."

[config.documentation.annotation.art.arcane.react.content.feature.featurelazygravity.field.sustainengagems]
impact = "Höhere Werte ignorieren kurze Spikes; niedrigere Werte greifen schneller."
summary = "Erforderliche Dauer anhaltender Belastung vor dem Eingreifen (Millisekunden)."

[config.documentation.annotation.art.arcane.react.content.feature.featurelazygravity.field.sustainreleasems]
impact = "Höhere Werte vermeiden das Flattern zwischen Zuständen; niedrigere Werte werden früher freigegeben."
summary = "Erforderliche Dauer anhaltender Erholung vor der Freigabe (Millisekunden)."

[config.documentation.annotation.art.arcane.react.content.feature.featurelazygravity.field.tickintervalms]
impact = "Niedrigere Werte bereinigen abgeschlossene Fallblöcke schneller, verbrauchen aber mehr CPU; höhere Werte verringern den Overhead."
summary = "Hauptauswertungsintervall für Lazy Gravity in Millisekunden."

[config.documentation.annotation.art.arcane.react.content.feature.featureminecarttether]
description = "Konfiguration für Minecart Tether Feature. Diese Funktion überwacht kontinuierlich das Verhalten des Servers und wendet während der Laufzeit Leitplanken an."

[config.documentation.annotation.art.arcane.react.content.feature.featureminecarttether.field.maxblockdistance]
impact = "Höhere Werte ermöglichen mehr Durchsatz vor dem Eingriff; niedrigere Werte machen die Minderung aggressiver."
summary = "Maximale Blockdistanz, die der Minecart Tether erlaubt."

[config.documentation.annotation.art.arcane.react.content.feature.featuremobstacking]
description = "Konfiguration für Mob Stacking-Funktion. Diese Funktion überwacht kontinuierlich das Verhalten des Servers und wendet während der Laufzeit Leitplanken an."

[config.documentation.annotation.art.arcane.react.content.feature.featuremobstacking.field.batchintervalms]
impact = "Niedrigere Werte stapeln frisch gespawnte Mobs früher bei höheren Planungskosten; höhere Werte bündeln mehr Zusammenführungsarbeit pro Durchlauf."
summary = "Wie oft Chunks in der Warteschlange zum Stapeln verarbeitet werden, in Millisekunden."

[config.documentation.annotation.art.arcane.react.content.feature.featuremobstacking.field.customnames]
impact = "Gloss erhält die Stapelgrößen unabhängig von dieser Einstellung und übernimmt die kombinierte Entitätsanzeige, wenn diese aktiviert ist."
summary = "Zeigt die nativen Namen von Mob-Stapeln an, wenn die Entitätsanzeigen von Gloss nicht verfügbar sind."

[config.documentation.annotation.art.arcane.react.content.feature.featuremobstacking.field.maxhealth]
impact = "Höhere Werte ermöglichen mehr Durchsatz vor dem Eingriff; niedrigere Werte machen die Minderung aggressiver."
summary = "Maximale Gesundheit, die das Mob-Stacking erlaubt."

[config.documentation.annotation.art.arcane.react.content.feature.featuremobstacking.field.maxstacksize]
impact = "Höhere Werte ermöglichen mehr Durchsatz vor dem Eingriff; niedrigere Werte machen die Minderung aggressiver."
summary = "Maximale Stapelgröße, die durch Mob-Stacking erlaubt ist."

[config.documentation.annotation.art.arcane.react.content.feature.featuremobstacking.field.onlyspawnermobs]
impact = "Aktivieren Sie dies, um dieses Verhalten anzuwenden; deaktivieren Sie es, um diesen Pfad inaktiv zu halten."
summary = "Legt fest, ob das Mob-Stacking nur auf Spawner-Mobs wirkt."

[config.documentation.annotation.art.arcane.react.content.feature.featuremobstacking.field.searchradius]
impact = "Höhere Werte erweitern den Suchbereich und kosten mehr Arbeit; niedrigere Werte verengen den Umfang und laufen billiger."
summary = "Suchradius, der durch Mob-Stacking verwendet wird (Blöcke)."

[config.documentation.annotation.art.arcane.react.content.feature.featuremobstacking.field.skipcustommobs]
impact = "Aktivieren Sie dies, um passende Fälle auszuschließen; deaktivieren Sie es, um sie in die Durchsetzung einzubeziehen."
summary = "Überspringt benutzerdefinierte Mobs, wenn das Mob-Stacking Ziele bewertet."

[config.documentation.annotation.art.arcane.react.content.feature.featuremobstacking.field.stackabletypes]
impact = "Engen Sie diese Liste ein, um weniger Fälle zu erfassen, oder erweitern Sie sie, um mehr übereinstimmende Einträge aufzunehmen."
summary = "Filterdefinition für stapelbare Typen, die vom Mob-Stacking verwendet werden."

[config.documentation.annotation.art.arcane.react.content.feature.featuremobstacking.field.vacuumeffect]
impact = "Aktivieren Sie dies, um dieses Verhalten anzuwenden; deaktivieren Sie es, um diesen Pfad inaktiv zu halten."
summary = "Legt fest, ob das Mob-Stacking den Vakuumeffekt anwendet."

[config.documentation.annotation.art.arcane.react.content.feature.featurepathfinderbudget]
description = "Konfiguration der Funktion Pathfinder Budget. Verkleinert das A*-Knotenbudget von Mobs abseits von Spielern, solange der Server unter Last steht, und macht so jede Pfadsuche günstiger, ohne zu ändern, wohin die Mobs wollen. Budgets werden wiederhergestellt, wenn Mobs in die Nähe von Spielern kommen, der Server sich erholt, die Entität entladen oder die Funktion deaktiviert wird. Fällt auf das Vanilla-Pathfinding zurück, wenn die NMS-Navigations-Bridges nicht verfügbar sind."

[config.documentation.annotation.art.arcane.react.content.feature.featurepathfinderbudget.field.budgetmultiplier]
impact = "Niedrigere Werte machen die Pfadsuche billiger, aber sie erzeugen schlechtere Fernstreckenwege für betroffene Mobs."
summary = "Multiplikator für das Budget besuchter A*-Knoten, der auf entfernte Mobs angewendet wird, solange er aktiv ist (Vanilla ist 1.0)."

[config.documentation.annotation.art.arcane.react.content.feature.featurepathfinderbudget.field.engageticktimems]
impact = "Niedrigere Werte werfen die Pathfinding-Kosten früher ab; höhere Werte reservieren sie für schwerere Last."
summary = "Durchschnittliche Tick-Millisekunden, die erforderlich sind, bevor das Pathfinding-Budget schrumpft."

[config.documentation.annotation.art.arcane.react.content.feature.featurepathfinderbudget.field.fullbudgetwithindistance]
impact = "Höhere Werte schützen mehr Mobs vor der Budgetierung; niedrigere Werte senken die Pathfinding-Kosten in Spielernähe stärker."
summary = "Mobs innerhalb dieser Distanz eines Spielers behalten immer ihr volles Pfadfindungsbudget (Blöcke)."

[config.documentation.annotation.art.arcane.react.content.feature.featurepathfinderbudget.field.maxentitiessampledpercycle]
impact = "Höhere Werte erfassen die Mob-Population schneller, bei höheren Kosten pro Zyklus."
summary = "Maximale Anzahl pro Zyklus gemessener Mobs."

[config.documentation.annotation.art.arcane.react.content.feature.featurepathfinderbudget.field.tickintervalms]
impact = "Niedrigere Werte reagieren schneller, verbrauchen aber mehr CPU; höhere Werte reduzieren den Overhead, reagieren aber später."
summary = "Hauptauswertungsintervall für das Pathfinder-Budget in Millisekunden."

[config.documentation.annotation.art.arcane.react.content.feature.featureperworldtickbudget]
description = "Konfiguration der Funktion Per-World Tick Budget. Misst den gleitenden Tick-Zeitanteil pro Welt, wendet Hysterese für Eingreifen und Freigabe an und veröffentlicht NORMAL/PRESSURE/PANIC für jede Welt. Adaptive Entity Sleep, Dynamic Activation Range, Item Backpressure und Pathfinder Budget nutzen diesen Zustand, wenn sie weltbezogenes Belastungsverhalten anwenden."

[config.documentation.annotation.art.arcane.react.content.feature.featureperworldtickbudget.field.budgetms]
impact = "Niedrigere Werte stufen Welten früher als belastet ein; höhere Werte behalten PRESSURE schwererer Last pro Welt vor."
summary = "Gleitender mittlerer Tick-Anteil pro Welt, ab dem eine Welt in den Modus PRESSURE wechselt (Millisekunden)."

[config.documentation.annotation.art.arcane.react.content.feature.featureperworldtickbudget.field.engagesustainticks]
impact = "Höhere Werte fangen kurze Spitzen ab; niedrigere Werte greifen schneller ein, können bei verrauschten Signalen aber hin- und herspringen."
summary = "Anhaltende Auswertungszyklen über dem Schwellenwert, die vor dem Eingreifen erforderlich sind."

[config.documentation.annotation.art.arcane.react.content.feature.featureperworldtickbudget.field.panicms]
impact = "Niedrigere Werte eskalieren früher; höhere Werte behalten PANIC schwerer Last pro Welt vor."
summary = "Gleitender mittlerer Tick-Anteil pro Welt, ab dem eine Welt in den Modus PANIC wechselt (Millisekunden)."

[config.documentation.annotation.art.arcane.react.content.feature.featureperworldtickbudget.field.releasems]
impact = "Niedrigere Werte halten den erhöhten Modus für mehr Stabilität länger; höhere Werte stellen NORMAL früher wieder her."
summary = "Freigabeschwelle (Millisekunden), unter der der Mittelwert pro Welt bleiben muss, um PRESSURE/PANIC zu verlassen; liegt unter budgetMs, um Flattern zu vermeiden."

[config.documentation.annotation.art.arcane.react.content.feature.featureperworldtickbudget.field.releasesustainticks]
impact = "Höhere Werte halten den Modus für Stabilität; niedrigere Werte werden früher freigegeben."
summary = "Anhaltende Auswertungszyklen unter der Freigabeschwelle, die erforderlich sind, bevor wieder zu NORMAL zurückgekehrt wird."

[config.documentation.annotation.art.arcane.react.content.feature.featureperworldtickbudget.field.tickintervalms]
impact = "Niedrigere Werte reagieren schneller auf die Belastung pro Welt, verbrauchen aber mehr CPU im Feature-Tick; höhere Werte glätten das Signal, verlängern aber die Zeit bis zum Eingreifen."
summary = "Hauptbewertungsintervall für Tick-Budget pro Welt in Millisekunden."

[config.documentation.annotation.art.arcane.react.content.feature.featureperworldtickbudget.field.worldoverrides]
summary = "Schwellenwert-Überschreibungen pro Welt, nach vollqualifiziertem Weltschlüssel. Eine hier vorhandene Welt verwendet ihre eigenen Werte für Budget/Panik/Freigabe statt der globalen Werte."

[config.documentation.annotation.art.arcane.react.content.feature.featureplayerimpactoverlay]
description = "Konfiguration für die Player Impact Overlay-Funktion. Diese Funktion überwacht kontinuierlich das Verhalten des Servers und wendet während der Laufzeit Leitplanken an."

[config.documentation.annotation.art.arcane.react.content.feature.featureplayerimpactoverlay.field.maxplayersdrawn]
impact = "Höhere Werte ermöglichen mehr Durchsatz vor dem Eingriff; niedrigere Werte machen die Minderung aggressiver."
summary = "Maximale Anzahl Spieler, die das Player Impact Overlay zeichnen darf."

[config.documentation.annotation.art.arcane.react.content.feature.featureplayerimpactoverlay.field.showplayerinitials]
impact = "Aktivieren Sie dies, um diese visuelle Ebene anzuzeigen; deaktivieren Sie es für eine übersichtlichere Karte und etwas geringere Renderkosten."
summary = "Legt fest, ob das Player Impact Overlay Spielerinitialen in der Kartenausgabe anzeigt."

[config.documentation.annotation.art.arcane.react.content.feature.featureplugineventimpactlistmap]
description = "Konfiguration für die Plugin Event Impact List Map-Funktion. Diese Funktion überwacht kontinuierlich das Verhalten des Servers und wendet während der Laufzeit Leitplanken an."

[config.documentation.annotation.art.arcane.react.content.feature.featureplugineventimpactlistmap.field.maxrowspertile]
impact = "Null lässt eine höhere Kartenwand jedes Plugin auflisten; ein fester Wert wird mit der Anzahl vertikaler Kacheln multipliziert, sodass eine höhere Wand weiterhin mehr Plugins auflistet."
summary = "Maximale Zeilen pro Kartenkachel oder 0, um die verfügbare Höhe auszufüllen."

[config.documentation.annotation.art.arcane.react.content.feature.featureplugineventimpactpiemap]
description = "Konfiguration für die Plugin Event Impact Pie Map Funktion. Diese Funktion überwacht kontinuierlich das Verhalten des Servers und wendet während der Laufzeit Leitplanken an."

[config.documentation.annotation.art.arcane.react.content.feature.featureportaltrafficsmoother]
description = "Konfiguration für Portal Traffic Smoother Funktion. Diese Funktion überwacht kontinuierlich das Verhalten des Servers und wendet während der Laufzeit Leitplanken an."

[config.documentation.annotation.art.arcane.react.content.feature.featureportaltrafficsmoother.field.bypassnearplayers]
impact = "Aktivieren Sie dies, um die Durchsetzung in passenden Situationen zu überspringen; deaktivieren Sie es für strikte Behandlung."
summary = "Umgeht die Behandlung durch den Portal Traffic Smoother für Bereiche in der Nähe von Spielern."

[config.documentation.annotation.art.arcane.react.content.feature.featureportaltrafficsmoother.field.bypassplayerradius]
impact = "Höhere Werte erweitern den Suchbereich und kosten mehr Arbeit; niedrigere Werte verengen den Umfang und laufen billiger."
summary = "Vom Portal Traffic Smoother verwendeter Umgehungsradius um Spieler (Blöcke)."

[config.documentation.annotation.art.arcane.react.content.feature.featureportaltrafficsmoother.field.cooloffms]
impact = "Höhere Werte halten Drosselungen länger aktiv; niedrigere Werte lassen die Aktivität früher wieder anlaufen."
summary = "Abkühlzeit nach Drosselungsentscheidungen im Portal Traffic Smoother (Millisekunden)."

[config.documentation.annotation.art.arcane.react.content.feature.featureportaltrafficsmoother.field.entitydelayticks]
impact = "Höhere Werte halten den Zustand länger aktiv; niedrigere Werte verfallen oder wenden Änderungen früher an."
summary = "Vom Portal Traffic Smoother verwendete Verzögerungsdauer für Entitäten (Ticks)."

[config.documentation.annotation.art.arcane.react.content.feature.featureportaltrafficsmoother.field.maxentityportalsperchunkwindow]
