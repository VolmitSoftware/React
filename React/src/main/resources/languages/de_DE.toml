"config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.field.ignorevaluables.impact" = "Dies kann dazu führen, dass Matching-Fälle ausgeschlossen werden; es kann deaktiviert werden, um sie in die Durchsetzung einzubeziehen."
