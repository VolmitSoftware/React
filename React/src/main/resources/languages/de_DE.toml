[config.documentation.annotation.art.arcane.react.content.action.actionquarantinehotchunks_params.field.protectnamed]
impact = "Aktivieren Sie dies, um übereinstimmende Ziele sicher zu halten; deaktivieren Sie es, damit sie für die Handhabung in Frage kommen."
summary = "Schützt benannte Entitäten vor der Durchsetzung von Quarantine Hot Chunks."

[config.documentation.annotation.art.arcane.react.content.action.actionquarantinehotchunks_params.field.protecttamed]
impact = "Aktivieren Sie dies, um übereinstimmende Ziele sicher zu halten; deaktivieren Sie es, damit sie für die Handhabung in Frage kommen."
summary = "Schützt gezähmte Entitäten vor der Durchsetzung von Quarantine Hot Chunks."

[config.documentation.annotation.art.arcane.react.content.action.actionquarantinehotchunks_params.field.unloadchunk]
