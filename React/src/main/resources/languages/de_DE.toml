"config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.description" = "Konfiguration für die Funktion Tracker Range Governor. Skaliert vorübergehend die Tracking-Bereiche von Entitäten pro Welt (Items, Misc, Displays, Tiere, Monster), während der Server unter anhaltendem Druck steht und schrumpft sowohl den Entity-Tracker als auch den Paketfanout. Änderungen gelten für Entitäten, wenn sie verfolgt werden, so dass schnell wachsende Entitäten wie Items innerhalb von Sekunden reagieren; Bereiche werden wiederhergestellt, sobald der Server sich erholt hat."
"config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.field.animalrangefactor.impact" = "Niedrigere Werte schneiden Tier-Tracker Fanout; entfernte Tiere erscheinen später, während sie sich engagieren."
"config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.field.animalrangefactor.summary" = "Skalierungsfaktor angewendet auf Tierverfolgungsbereich während des Eingriffs."
"config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.field.displayrangefactor.impact" = "Niedrigere Werte schneiden Display-Entity Fanout; Hologramme rendern von näher nur während sie aktiviert sind."
"config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.field.displayrangefactor.summary" = "Skalierungsfaktor, der angewendet wird, um den Tracking-Bereich von Entitäten während des Eingriffs anzuzeigen."
"config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.field.engageticktimems.impact" = "Niedrigere Werte schrumpfen früher, höhere Werte reservieren sie für schwerere Last."
"config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.field.engageticktimems.summary" = "Durchschnittliche Tick-Millisekunden, die erforderlich sind, bevor der Gouverneur sich engagiert."
"config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.field.itemrangefactor.impact" = "Niedrigere Werte schneiden mehr Item-Tracker / Paket Fanout; Spieler sehen fallen gelassene Gegenstände nur von näher."
"config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.field.itemrangefactor.summary" = "Skalierungsfaktor, der auf den Item-Tracking-Bereich angewendet wird, während er aktiviert ist."
"config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.field.minimumrangeblocks.impact" = "Höhere Werte kappt, wie aggressiv Bereiche schrumpfen; niedrigere Werte erlauben tiefere Schnitte."
"config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.field.minimumrangeblocks.summary" = "Mindest-Tracking-Bereich in Blöcken nach Skalierung."
"config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.field.miscrangefactor.impact" = "Niedrigere Werte schneiden mehr Tracker / Paket Fanout für dekorative und Ambient-Entitäten."
