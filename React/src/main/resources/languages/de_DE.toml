"config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids.field.maxburstticksperlocationperservertick.summary" = "Maximal für einen Blockort während eines einzelnen Tick-Flashs des Servers verbrauchte zusätzliche Flüssigkeit Ticks in der Warteschlange."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids.field.maxextravanillaticksperservertick.impact" = "Höhere Werte ermöglichen stärkere Beschleunigungsstöße; niedrigere Werte kappen Fluidstoß Kosten aggressiver."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids.field.maxextravanillaticksperservertick.summary" = "Maximale maximale zusätzliche Vanilleflüssigkeits-Ticks pro Server Tick in schnellen Flüssigkeiten."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakfastsnow.description" = "Konfiguration für Fast Snow Tweak. Kurzschlüsse Schnee bilden und Schmelze Updates in schnelle Welt Operationen Wetterblock Abwanderung zu reduzieren."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.description" = "Pre-Ticks Trichter mit einem räumlichen Elementindex zum Short-Circuit Vanilla's per Tick AABB Entity Scan. Versagt, wenn eine erforderliche NMS-Brücke nicht verfügbar ist, zu verriegeln."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.idlestretch.impact" = "Ermöglicht, leere Trichter-Tick-Kosten auf Trichter-schweren Servern zu verringern; Elemente durch den Index schnellste Weg bleibt sofort abgeholt."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.idlestretch.summary" = "Erstreckt die Übertragung Abklingzeit von leeren, leeren Trichter während der Server unter Last ist so dass Vanilla überspringt sie wieder zu befragen."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.idlestretchmintickms.impact" = "Niedrigere Werte dehnen früher leeres Trichter aus; höhere Werte reservieren es für eine schwerere Belastung."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.idlestretchmintickms.summary" = "Durchschnittliche Tick-Millisekunden, die erforderlich sind, bevor ein leeres Trichter-Strachen eingesetzt wird."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.idlestretchspreadpasses.impact" = "Höhere Werte untersuchen jedes Trichter seltener ( günstiger, langsamer zum Strecken); niedrigere Werte strecken leeres Trichter früher."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.idlestretchspreadpasses.summary" = "Anzahl der Tick-Passungen, die jede leere Trichter-Sonde überspannt."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.idlestretchticks.impact" = "Höhere Werte überspringen mehr leere Trichter-Arbeit, verzögern aber die Wiederaufnahme der Übertragung länger."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.idlestretchticks.summary" = "Abklingzeit in Ticks wird auf leere Leer Trichter angewendet; begrenzt die schlimmste Verzögerung, bevor ein Leer Trichter wieder aus einem Container zieht."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperlimit.description" = "Configuration for Hopper Limit tweak. Cancels hopper transfers when hopper event-span pressure exceeds the configured threshold."
