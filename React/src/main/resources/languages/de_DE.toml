"config.documentation.annotation.art.arcane.react.content.feature.featurefurnacebrewbatching.field.engageincidentscore.summary" = "Incident-Score (Inzidenz0-100) vor dem Einsetzen der Ofen-/Brauereicharge erforderlich."
