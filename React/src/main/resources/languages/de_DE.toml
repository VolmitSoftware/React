# React — de_DE
#
# === Datei bearbeiten ===
# plugins/React/languages/de_DE.toml
# Diese Datei kann direkt bearbeitet werden. Lokale Änderungen bleiben erhalten; fehlende oder ungültige Einträge verwenden das eingebaute Englisch.
# /react language server edit de_DE
#
# === Präfix ===
# runtime.prefix: Nachrichtenpräfix, das React vor Chatnachrichten setzt.
#
# === Formatierung ===
# Chatnachrichten unterstützen &-Farbcodes: &cText&r, &lText&r.
# Farben: &0-&9 und &a-&f.
# Stile: &l fett, &o kursiv, &n unterstrichen, &m durchgestrichen, &k verschleiert, &r zurücksetzen.
# Farbcodes löschen aktive Stile; setzen Sie die Farbe vor den Stil, etwa &3&lText&r. &r setzt die gesamte Formatierung zurück.
# RGB-Farben verwenden &#RRGGBBText&r, zum Beispiel &#55AAFFText&r.
# Nutzen Sie MiniMessage für Farbverläufe und Interaktionen; mischen Sie MiniMessage-Tags und &-Codes nicht in einer Nachricht. Schließen Sie Tags in umgekehrter Öffnungsreihenfolge.
# Achten Sie auf gültige TOML-Anführungszeichen und Escape-Sequenzen.
# Verwenden Sie \n in TOML-Zeichenketten in Anführungszeichen für einen Zeilenumbruch; {{ und }} geben wörtliche geschweifte Klammern aus.
# Werte unter renderer.* und config.documentation.annotation.* sind reiner Text.
# Werte unter test.* sind reiner Text; Nachrichten unter test.result.* unterstützen Formatierung.
# Verwenden Sie Variablen im Nachrichtentext außerhalb von MiniMessage-Tags.
#
# === Variablen ===
# Variablennamen unverändert lassen und nur die Variablen der jeweiligen Nachricht verwenden.
#   {access}  Rolle oder Berechtigungen einer React-Web-Kopplung
#   {action}  Aktionsname oder Richtung der Farbanpassung
#   {actions}  Anzahl eingereihter Aktionen oder Liste ausgeschlossener Aktionsnamen
#   {active}  Anzahl aktiver Funktionen oder Tweaks
#   {actor}  Webbenutzer, der eine Änderung vorgenommen hat
#   {added}  Ob eine Funktion nach der Aktivierung wieder in der aktiven Registrierung steht; Durch eine Sprachaktualisierung hinzugefügte Nachrichten
#   {after}  Konfigurationswert, Sprachnachricht oder Heap-Belegung nach einer Änderung
#   {age}  Alter der Integrationsdaten in Sekunden
#   {amount}  Anzahl zu vergebender Gegenstände
#   {architecture}  CPU-Architektur
#   {argument}  Unerwartetes Befehlsargument
#   {available}  Anzahl verfügbarer NMS-Bridge-Handles
#   {average}  Durchschnittliche TPS oder Millisekunden pro Tick
#   {avg_mspt}  Durchschnittliche Millisekunden pro Tick während eines Lasttestdurchlaufs
#   {avg_tps}  Durchschnittliche Ticks pro Sekunde während eines Lasttestdurchlaufs
#   {bar}  Formatierter Balken der Benchmark-Punktzahl
#   {before}  Konfigurationswert, Sprachnachricht oder Heap-Belegung vor einer Änderung
#   {checked}  Anzahl geprüfter Sampler
#   {chunks}  Anzahl der von einer Aktion betroffenen Chunks
#   {client}  Browsername, von dem eine React-Web-Kopplung stammt
#   {command}  Befehlspfad
#   {count}  Anzahl der Einträge, Module, Änderungen oder Testergebnisse
#   {current}  Aktuelle Seitennummer
#   {delta_heap}  Differenz der abschließenden Heap-Belegung zwischen React und Referenzlauf in MB
#   {delta_mspt}  Differenz der durchschnittlichen Tickdauer zwischen React und Referenzlauf in ms
#   {delta_tps}  Differenz der durchschnittlichen TPS zwischen React und Referenzlauf
#   {detail}  Diagnosedetails zu Bridge, Integration, Aktion oder Test
#   {dimensions}  Erkannte Rastermaße der Kartenwand
#   {direction}  Drehrichtung des Farbtons der ausgewählten Farbe
#   {distance}  Angeforderte Sicht-, Simulations- oder Sendedistanz in Chunks
#   {duration}  Verstrichene Zeit; Startnachrichten für Lasttests verwenden Sekunden
#   {enabled}  Aktivierungszustand oder Anzahl aktivierter Module
#   {entities}  Anzahl der von einer Aktion betroffenen Entitäten
#   {entry}  Eintrag in der Integrationszeitleiste
#   {exceptions}  Während eines Lasttestdurchlaufs aufgezeichnete React-Ausnahmen
#   {expires}  Wann eine React-Web-Kopplung ohne Nutzung endet
#   {fail}  Anzahl fehlgeschlagener Prüfungen
#   {file}  Dateiname einer Konfiguration, Sprache oder Plugin-API
#   {fingerprint}  Fingerabdruck des Servers oder Web-Tokens
#   {finite}  Anzahl der Sampler, die endliche Werte zurückgeben
#   {frames}  Anzahl der Gegenstandsrahmen in der aktiven Kartenwand
#   {free}  Freier physischer oder virtueller Speicher
#   {freed}  Durch Speicherbereinigung freigegebener Heap-Speicher
#   {from}  Nummer des ersten Eintrags auf der aktuellen Seite
#   {grid}  Rastermaße der Kartenwand
#   {ground_y}  Bodenhöhe für den Schwerkrafttest
#   {group}  Monitor-, Sampler-, Karten-, Konfigurations- oder Sprachnachrichtengruppe
#   {growth}  Heap-Zuwachs während eines Lasttests in MB
#   {health}  Funktionszustand der Integration
#   {heap_end}  Heap-Belegung am Ende eines Lasttestdurchlaufs in MB
#   {heap_start}  Heap-Belegung zu Beginn eines Lasttestdurchlaufs in MB
#   {heartbeat}  Zeit seit dem letzten Lebenszeichen der Integration
#   {height}  Höhe der Testzeichenfläche in Pixeln
#   {hoppers}  Anzahl normalisierter Trichter
#   {id}  Kennung eines Bridge-Handles, Samplers, einer Karte, Aktion, eines Pakets oder Tokens
#   {impact}  Beschreibung der Konfigurationsauswirkung
#   {incident}  Kennung der aus dem Entwicklertest ausgeschlossenen rekursiven Vorfallaktion
#   {index}  Nummer des aktuellen Schritts im Entwicklertest
#   {invalid}  Anzahl der Sampler mit ungültigen Messwerten
#   {item}  Name oder Kennung des Gegenstands
#   {items}  Anzahl zusammengeführter Gegenstandsentitäten
#   {kept}  Bei einer Sprachaktualisierung behaltene lokale Änderungen
#   {key}  Befehlsparameterschlüssel, Konfigurationsschlüssel oder Sprachnachrichten-ID
#   {label}  Bezeichnung eines Benchmarks, Messwerts, einer Einstellung, eines Befehls oder Web-Tokens
#   {lifetime}  Wie lange eine React-Web-Kopplung ohne Nutzung besteht
#   {line}  Nummer der bearbeiteten Zeile in einer mehrzeiligen Nachricht
#   {lines}  Anzahl durchsuchter Serverprotokollzeilen
#   {link}  React-Web-Kopplungslink
#   {links}  Anzahl noch nicht geöffneter React-Web-Kopplungslinks
#   {listener}  Adresse, an die der React-Web-Listener gebunden ist
#   {loaded}  Anzahl der beim Vorladen neu geladenen Chunks
#   {locale}  Angezeigter, ausgewählter oder bearbeiteter Sprachcode
#   {matched}  Welten, deren automatischer Speicherzustand dem Referenzzustand des Tests entspricht
#   {max_tick}  Größter beobachteter Tickabstand während eines Lasttests in ms
#   {maximum}  Maximale Gegenstandsanzahl, Tickzeitschwelle oder Eingabelänge im Editor
#   {message}  Zusammenfassung einer abgeschlossenen Aktion oder Integrationsstatusnachricht
#   {metrics}  Anzahl der von einem Plugin-API-Paket bereitgestellten Messwerte
#   {minecraft}  Minecraft-Version
#   {minimum}  Niedrigste akzeptable TPS
#   {missing}  Anzahl erforderlicher Sampler, die in der Registrierung fehlen
#   {mode}  Ausgewählter Spiel- oder Fähigkeitsmodus
#   {model}  CPU-Modell
#   {name}  Name eines Benchmarks, Moduls, Renderers oder Prüfschritts
#   {note}  Grund, warum das Serverprotokoll nicht durchsucht wurde
#   {offenders}  Anzahl der Sampler, die nicht endliche Werte zurückgeben
#   {options}  Zulässige Konfigurationswerte
#   {p95}  95. Perzentil der Tickdauer während eines Lasttests in ms
#   {origin}  Browser-Ursprung einer Anfrage
#   {parameter}  Name des Befehlsparameters
#   {parameters}  Ignorierte Befehlsparameter
#   {pass}  Anzahl bestandener Prüfungen
#   {path}  Pfad des Konfigurationsschlüssels oder der Berichtsdatei
#   {percent}  Prozentsatz der Farbanpassung
#   {permission}  Erforderlicher Berechtigungsknoten
#   {personal}  Vom Spieler ausgewählter Sprachcode
#   {phase}  Geprüfte Lebenszyklusphase einer Funktion
#   {pixels}  Anzahl der von einem Kartentest gezeichneten nicht leeren Pixel
#   {platform}  Betriebssystem oder Minecraft-Serverplattform
#   {players}  Anzahl synthetischer Spieler in einem Lasttest
#   {plugin}  Plugin-Name
#   {process_load}  CPU-Auslastung des Serverprozesses
#   {processors}  Anzahl verfügbarer CPU-Prozessoren
#   {profile}  Name des React-Konfigurationsprofils
#   {protocol}  Version des Integrationsprotokolls
#   {radius}  Chunkradius für eine Entwicklertestaktion
#   {range}  Zulässiger Bereich für Sicht-, Simulations- oder Sendedistanz in Chunks
#   {rate}  Konfigurierte Beschleunigungsrate für Pflanzenwachstum
#   {rating}  Formatierte Benchmark-Bewertung
#   {react_errors}  Anzahl der im Serverprotokoll gefundenen React-Fehlerzeilen
#   {reason}  Erklärung eines Fehlers, einer Ablehnung oder einer Nichtverfügbarkeit
#   {registered}  Anzahl registrierter Module
#   {relay}  Zustand des React-Web-Relays
#   {remaining}  Verbleibende Wartezeit bis zur nächsten Sprachprüfung
#   {removed_first}  Ob die erste Deaktivierung eine Funktion aus der aktiven Registrierung entfernt hat
#   {removed_second}  Ob die wiederholte Deaktivierung eine Funktion aus der aktiven Registrierung entfernt hat
#   {renderer}  Name oder Kennung des Kartenrenderers
#   {renderers}  Liste der Kartenrenderer mit leeren Kennungen
#   {role}  Web-Zugriffsrolle: viewer, operator oder admin
#   {sampler}  Name oder Kennung des Samplers
#   {samplers}  Liste der Integrationssampler oder fehlerhaften Sampler
#   {scope}  Geltungsbereich der Karte oder Distanzeinstellung
#   {scopes}  Berechtigungen einer React-Web-Kopplung
#   {score}  Benchmark-Punktzahl
#   {seconds}  Countdown oder Lasttestdauer in Sekunden
#   {section}  Konfigurationsabschnitt oder Abschnitt des Spracheneditors
#   {server}  Implementierung und Version des Minecraft-Servers
#   {shown}  Anzahl aktuell angezeigter Zeilen
#   {since_run}  Seit Beginn des aktuellen Tests gemeldete Fehler
#   {size}  Maximale oder aktive Abmessungen der Kartenwand
#   {skip}  Anzahl übersprungener Prüfungen
#   {sockets}  Anzahl offener React-Web-Sockets
#   {spawn_y}  Höhe, auf der der Block für den Schwerkrafttest erzeugt wurde
#   {state}  Zustand einer Aktion oder eines Plugin-API-Pakets
#   {status}  Bezeichnung des Integrationsstatus oder Konfigurationszustands
#   {subject}  In der Konfigurationshilfe beschriebenes Modul oder beschriebene Einstellung
#   {subsystem}  Name des getesteten Teilsystems
#   {summary}  Zusammenfassung des Aktionsprotokolls
#   {system_load}  CPU-Auslastung des gesamten Systems
#   {target}  Zielwelt, Zielspieler, Zielplugin, Zieleinstellung oder Ziel-Plugin-Gruppe einer Operation
#   {threading}  Threading-Modus des Servers
#   {tick}  Tickdauer, die die Stillstandsschwelle überschritten hat, in ms
#   {tick_crashes}  Anzahl der im Serverprotokoll gefundenen Tick-Absturzzeilen
#   {tier}  Schweregrad des Vorfallablaufs
#   {timing}  Zeit für Fähigkeits-Callbacks in Millisekunden pro Minute
#   {to}  Nummer des letzten Eintrags auf der aktuellen Seite
#   {tokens}  Anzahl gekoppelter React-Web-Browser
#   {total}  Gesamtzahl der Einträge, Module, Welten, Prüfungen oder Speichermenge in der Nachricht
#   {type}  Typ des Befehlsparameters, Konfigurationswerts, der Karte oder Distanz
#   {unavailable}  Anzahl nicht verfügbarer NMS-Bridge-Handles
#   {unit}  Einheit für die Gesamtsumme eines Kreisdiagramms
#   {unknown}  Kennung der aus dem Entwicklertest ausgeschlossenen unbekannten Aktion
#   {unreadable}  Anzahl der Sampler, die nicht gelesen werden konnten
#   {updated}  Durch eine Sprachaktualisierung geänderte Nachrichten
#   {uptime}  Laufzeit des Host-Betriebssystems
#   {url}  URL des hochgeladenen Diagnoseberichts
#   {usage}  Syntax zur Befehlsverwendung
#   {used}  Belegter physischer Speicher, virtueller Speicher oder Heap
#   {value}  Formatierte Einstellung, Messung oder Hardwareangabe
#   {values}  In einem Entwicklertestbericht aufgeführte Messwerte
#   {variables}  Von der bearbeiteten Nachricht akzeptierte Platzhalternamen
#   {vendor}  Java-Anbieter
#   {version}  React-, Java- oder Plattformversion
#   {warmed}  Anzahl vorgeladener Chunks
#   {warn}  Anzahl der Prüfungen mit Warnungen
#   {width}  Breite der Testzeichenfläche in Pixeln
#   {world}  Name der Minecraft-Welt

