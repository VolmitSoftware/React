"config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.field.noplayerradius.summary" = "Kein Spielerradius, der vom Item Despawn Accelerator (Blöcke) verwendet wird."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.field.targettickslived.impact" = "Höhere Werte schieben Gegenstände unmittelbar näher an den Entlauber; niedrigere Werte halten eine natürlichere Lebensdauer."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.field.targettickslived.summary" = "Ticks-Living-Wert, der auf berechtigte Elemente gezwungen wird, um die Zeit für den Verlust von Vanille zu beschleunigen."
