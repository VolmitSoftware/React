"config.documentation.annotation.art.arcane.react.content.feature.featurelazygravity.description" = "Konfiguration der Funktion Lazy Gravity. Verfolgt Vanilla-FallingBlock-Entitäten auf freien vertikalen Bahnen und schätzt, wie viele Bewegungsticks übersprungen werden könnten, wenn der Landetick aus Spawnposition und Schwerkraftberechnung deterministisch ermittelt würde, statt AI und Bewegung in jedem Tick zu verarbeiten. Meldet die geschätzte Zahl überspringbarer Ticks als Laufzeitmetrik, damit Betreiber die Auswirkung vor einer vollständigen Tick-Überspringimplementierung abschätzen können. Ignoriert fallende Blöcke innerhalb von bypassRadius um einen Spieler. Unterbrechungen der aktiven Bahn (Platzieren, Abbauen oder Physikänderungen in der Spalte) geben die verfolgte Entität an die Vanilla-Physik zurück."
