[config.documentation.annotation.art.arcane.react.content.action.actionquarantinehotchunks_params.field.minentityageticks]
impact = "Höhere Werte erfordern stärkere Signale vor dem Handeln; niedrigere Werte machen diese Bedingung leichter zu erfüllen."
