[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.minimumincidentscore]
summary = "Erforderlicher Vorfallwert, um weitere Gegenmaßnahmen auszuführen."
impact = "Der Ablaufplan wird fortgesetzt, wenn dieser Wert oder minimumTickMS erreicht wird."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.minimumtickms]
summary = "Erforderliche mittlere Tickdauer in Millisekunden, um weitere Gegenmaßnahmen auszuführen."
impact = "Der Ablaufplan endet, wenn beide Belastungswerte unter ihren Schwellen liegen."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.minimumentitiesperchunk]
summary = "Erforderliche Anzahl beobachteter Entitäten in einem Chunk vor deren Reduzierung."
impact = "Höhere Werte beschränken die Reduzierung auf dichtere Entitätsansammlungen."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.recheckdelayms]
summary = "Beobachtungszeit nach Abschluss einer untergeordneten Aktion in Millisekunden; mindestens 1000."
impact = "Ermöglicht die Aktualisierung der Messwerte vor der nächsten Gegenmaßnahme."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.childtimeoutms]
summary = "Maximale Laufzeit einer Gegenmaßnahme in Millisekunden; mindestens 1000."
impact = "Eine Zeitüberschreitung lässt den Ablaufplan scheitern und stoppt weitere Eskalationen."

[config.documentation.annotation.art.arcane.react.content.action.actiontrimentitiesbyagepriority_params.field.minimumentitiesperchunk]
summary = "Mindestanzahl beobachteter Entitäten pro Chunk vor der Reduzierung; null schließt alle beobachteten Chunks ein."
impact = "Ein positiver Wert beschränkt die Reduzierung auf dicht besetzte Chunks."

[action.capture_profile]
completed = "{count} lokales Profil unter {path} gespeichert"

[config.documentation.annotation.art.arcane.react.content.action.actioncaptureprofile]
description = "Erstellt auf Anfrage ein lokales JDK-Flight-Recorder-Profil mit Ausführungs-, Speicherbelegungs- und GC-Ereignissen. Behält drei Aufnahmen; lädt sie nie hoch."

[config.documentation.annotation.art.arcane.react.content.action.actioncaptureprofile_params.field.seconds]
summary = "Profildauer in Sekunden, begrenzt auf 1 bis 300."
impact = "Längere Aufnahmen erfassen mehr Aktivität; die rollende JFR-Aufzeichnung hält höchstens 64 MiB vor."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.playerchunkbudgetenabled]
summary = "Aktiviert Chunk-Budgets pro Welt für Spieler; Überlappungen zählen einmal."
impact = "Standardmäßig deaktiviert. Budgets können bestehende Distanzziele senken; die Wiederherstellung erfolgt schrittweise."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.playertickingchunkbudget]
summary = "Maximale geschätzte Anzahl spielerbedingt tickender Chunks pro Welt; mindestens 1."
impact = "Überlappende Simulationsbereiche zählen einmal. Konfigurierte Mindestdistanzen haben Vorrang, wenn das Budget nicht erreichbar ist."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.playerviewonlychunkbudget]
summary = "Maximale geschätzte Anzahl nur sichtbarer Chunks pro Welt; mindestens 1."
impact = "Zählt den Sichtbereich außerhalb des Simulationsbereichs. Schätzt den Spielerbedarf, nicht tatsächlich geladene Chunks oder Plugin-Tickets."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.budgetrecoverychecks]
summary = "Erforderliche aufeinanderfolgende gesunde Budgetprüfungen vor einer Distanzerhöhung; mindestens 1."
impact = "Prüfungen folgen updateCooldownSeconds. Fehlende Tickdaten oder ein nicht bereiter Spielerindex setzen die Erholung zurück."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.budgetrecoverystep]
summary = "Maximale Distanzerhöhung nach erfolgreicher Budgeterholung in Chunks; begrenzt auf 1 bis 32."
impact = "Kleinere Schritte begrenzen Ladespitzen bei der Wiederherstellung. Gilt nur bei aktivierten Spieler-Chunk-Budgets."

[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.updatenotifications]
summary = "Prüft GitHub-Releases auf React-Updates."
impact = "Standardmäßig aktiviert. VolmLib fasst Updates in einer Beitrittsmeldung und unter /volmit plugins updates zusammen. Deaktivieren stoppt React-Prüfungen."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller]
description = "Erfasst Folia-Spielerpositionen und optional begrenzte JDK-Flight-Recorder-Ereignisse. JFR erfasst Protokollverkehrssummen, Chunk-Generierungsphasen, Speicherzugriffe und Wartezeiten oberhalb des konfigurierten Schwellenwerts."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller.field.regionalenabled]
summary = "Aktiviert die Messung der Folia-Regions-TPS an Spielerpositionen."
impact = "Fragt einmal pro Sekunde eine begrenzte, wechselnde Auswahl zwischengespeicherter Spielerpositionen ab, ohne Chunks zu laden."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller.field.playeranchorsperrefresh]
summary = "Maximale Anzahl pro Sekunde erfasster Spielerpositionen, begrenzt auf 1 bis 512. Beobachtungen verfallen nach fünf Sekunden."
impact = "Höhere Werte erfassen mehr Spieler, erfordern aber mehr Abfragen der Regions-TPS."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller.field.jfrenabled]
summary = "Aktiviert ausgewählte JFR-Messungen. Standardmäßig deaktiviert. Veröffentlichte Zusammenfassungen enthalten keine Adressen, Dateipfade oder Stacktraces."
impact = "Verursacht JFR-Aufzeichnungsarbeit mit Aufbewahrungsgrenzen von 30 Sekunden und 64 MiB. Aggregierte Messreihen werden jede Sekunde zurückgesetzt."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller.field.jfrslowthresholdms]
summary = "Mindestdauer in Millisekunden für JVM-Dateizugriffe, Monitoreintritt, Monitor-Wartezeiten und Thread-Parken, begrenzt auf 1 bis 1000. Für Chunk-Generierungsphasen gilt kein Dauerschwellenwert."
impact = "Niedrigere Schwellenwerte erzeugen mehr JVM-Ereignisse. Diese Metriken erfassen nur Ereignisse, die diesen Schwellenwert erreichen."
