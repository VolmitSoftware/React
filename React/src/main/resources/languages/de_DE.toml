[config.documentation]
effect = "Wirkung: {impact}"
options = "Optionen: {options}"

[config.documentation.annotation.art.arcane.react.api.action.reactaction.field.enabled]
impact = "Setzen Sie auf false, um diese Aktion aus normalen Ausführungswarteschlangen zu verbergen, ohne ihre Konfiguration zu löschen."
summary = "Aktiviert oder deaktiviert diese Aktion."

[config.documentation.annotation.art.arcane.react.api.feature.reactfeature.field.enabled]
impact = "Setzen Sie auf false, um die Aktivierung dieser Funktion zu stoppen, während Sie ihre Konfigurationsdatei beibehalten."
summary = "Aktiviert oder deaktiviert diese Funktion."

[config.documentation.annotation.art.arcane.react.api.tweak.reacttweak.field.enabled]
impact = "Setzen Sie auf false, um zu verhindern, dass dieser Tweak aktiviert wird, während Sie seine Konfigurationsdatei beibehalten."
summary = "Aktiviert oder deaktiviert diesen Tweak."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration]
description = "Konfiguration der eingebetteten HTTP/WebSocket-Verwaltungs-API von React. Änderungen werden beim Speichern von web.toml automatisch übernommen."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.advertisedurl]
impact = "Hier die HTTPS-URL eines Reverse-Proxys eintragen, wenn der Listener außerhalb von localhost erreichbar ist. Der eingebettete Listener von React unterstützt weiterhin nur HTTP. Änderungen werden beim Speichern von web.toml automatisch übernommen."
summary = "Öffentliche Basis-URL, die direkten API-Clients bekannt gegeben wird."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.allowedorigins]
impact = "Jeder Eintrag ist ein Ursprung: Schema, Host und Port ohne Pfad; einfaches http nur auf Loopback. Eine Seite von einem anderen Ursprung wird mit origin_not_allowed abgelehnt. Anfragen ohne Origin, etwa vom Relay, sind nicht betroffen."
summary = "Browser-Ursprünge, die den direkten Listener nutzen dürfen."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.appurl]
impact = "Auf ein selbst gehostetes React Web ändern und dessen Ursprung zu allowedOrigins hinzufügen."
summary = "Adresse von React Web, die Kopplungslinks öffnen."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.listenaddress]
impact = "Die Standard-Wildcard :: akzeptiert IPv6- und IPv4-gemappten Verkehr für LAN-, Container- und Portweiterleitungszugriffe. Eine Loopback-Adresse nur hinter einem Reverse-Proxy oder Relay auf demselben Host verwenden."
summary = "IP-Adresse, an die sich der Web-Listener bindet."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.listenerenabled]
impact = "React öffnet die authentifizierte API standardmäßig. Mit false wird kein HTTP- oder WebSocket-Listener geöffnet."
summary = "Aktiviert den eingebetteten Web-Listener."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.port]
impact = "Ist dieser Port belegt, versucht React der Reihe nach die nächsten 99 Ports und verwendet den tatsächlich gebundenen Port für Relay-Loopback und erzeugte direkte URLs, wenn advertisedUrl leer ist. Das Speichern von web.toml startet den Listener automatisch neu."
summary = "Bevorzugter TCP-Port für den Webserver."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.relayenabled]
impact = "React verbindet sich beim ersten /react web pair mit relayUrl und bei jedem Start, solange eine Kopplung besteht. Kopplungslinks enthalten dann auch die Relay-Adresse."
summary = "Aktiviert den ausgehenden Relay-Client, damit Browser diesen Server ohne offenen Port erreichen."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.relayurl]
impact = "Wird nur gelesen, wenn relayEnabled true ist. Bei deaktiviertem Relay leer lassen."
summary = "Basis-WSS-URL des Relay-Brokers, z. B. wss://relay.arcane.art; der Pfad /agent wird automatisch angehängt."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.requiretokenforreads]
impact = "Bei true werden nicht authentifizierte GET-Anfragen mit 401 abgelehnt. Setzen Sie den Wert nur in vollständig vertrauenswürdigen Netzwerkumgebungen auf false."
summary = "Erfordert ein gültiges Auth-Token für schreibgeschützte HTTP-Endpunkte."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.servername]
impact = "Leer verwendet die erste Zeile der MOTD oder den Namen des Serverordners, wenn die MOTD der Vanilla-Standard ist."
summary = "Name, den React Web für diesen Server anzeigt."

[config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.tokendays]
impact = "Jede Nutzung startet die Zeit neu. /react web pair expires= überschreibt den Wert für einen Link. 1 bis 365."
summary = "Tage, die eine Kopplung ohne Nutzung besteht."

[config.documentation.annotation.art.arcane.react.content.action.actioncollectgarbage]
description = "Konfiguration der Aktion Collect Garbage. Fordert die JVM-Speicherbereinigung an und meldet den sofort freigegebenen Heap."

[config.documentation.annotation.art.arcane.react.content.action.actioncollectgarbage_params.field.postgcwaitticks]
impact = "Höhere Werte geben den JVM-Collectoren mehr Zeit zum Einpendeln; niedrigere Werte melden schneller, können aber den freigegebenen Speicher zu niedrig ausweisen."
summary = "Ticks, die nach der GC-Anforderung gewartet werden, bevor der Speicher gemessen wird."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize]
description = "Konfiguration der Aktion Hopper Network Normalize. Zielt auf Trichter-Hotspots, führt Gegenstandsentitäten zusammen und kann inaktive heiße Chunks entladen."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.itemmergeradius]
impact = "Höhere Werte erweitern den Suchbereich und kosten mehr Arbeit; niedrigere Werte verengen den Umfang und laufen billiger."
summary = "Von Hopper Network Normalize verwendeter Zusammenführungsradius für Gegenstände (Blöcke)."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.maxchunks]
impact = "Höhere Werte ermöglichen mehr Durchsatz vor dem Eingriff; niedrigere Werte machen die Minderung aggressiver."
summary = "Maximale Anzahl Chunks, die Hopper Network Normalize erlaubt sind."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.maxmergeditementitiesperchunk]
impact = "Höhere Werte erlauben größere Bursts, bevor die Steuerung eingreift; niedrigere Werte klemmen Spikes früher."
summary = "Maximale Anzahl zusammengeführter Gegenstandsentitäten pro Chunk bei Hopper Network Normalize."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.minimumhopperupdatesperchunk]
impact = "Höhere Werte erfordern stärkere Signale vor dem Handeln; niedrigere Werte machen diese Bedingung leichter zu erfüllen."
summary = "Mindestanzahl an Trichter-Updates pro Chunk, die Hopper Network Normalize verlangt."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.unloadidlehotchunks]
impact = "Aktivieren Sie dies, um dieses Verhalten anzuwenden; deaktivieren Sie es, um diesen Pfad inaktiv zu halten."
summary = "Legt fest, ob Hopper Network Normalize inaktive heiße Chunks entlädt."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.unsafeplayerradius]
impact = "Höhere Werte erweitern den Suchbereich und kosten mehr Arbeit; niedrigere Werte verengen den Umfang und laufen billiger."
summary = "Von Hopper Network Normalize verwendeter unsicherer Spielerradius (Blöcke)."

[config.documentation.annotation.art.arcane.react.content.action.actionhoppernetworknormalize_params.field.world]
impact = "Geben Sie einen Weltnamen an, um Aktionen auf diese Welt zu beschränken, oder lassen Sie das Feld leer, um alle Welten einzubeziehen."
summary = "Weltnamenfilter für Operationen von Hopper Network Normalize."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook]
description = "Führt relevante Vorfall-Gegenmaßnahmen einzeln aus, beobachtet die Belastung zwischen den Aktionen und endet nach deren Endergebnissen."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.includegarbagecollection]
impact = "Standardmäßig deaktiviert, da eine ausdrückliche Speicherbereinigung den Server anhalten kann."
summary = "Erlaubt eine Speicherbereinigungsstufe, wenn die Heap-Nutzung über 90 % liegt, der geschätzte freigebbare Heap über 10 % liegt und die GC-Zeit unter 2 % bleibt."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.tieroverride]
impact = "Überschreibt nur die Intensität; relevante Hinweise und anhaltende Belastung bleiben erforderlich."
summary = "Überschreibung der Gegenmaßnahmen-Intensität von 0 bis 2; -1 wählt anhand der beobachteten Belastung."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.world]
impact = "Leer lassen, um für jede Gegenmaßnahme die Welt mit den stärksten Hinweisen zu wählen."
summary = "Weltschlüsselfilter für Operationen des Incident Playbook."

[config.documentation.annotation.art.arcane.react.content.action.actionprewarmcriticalchunks]
description = "Konfiguration der Aktion Prewarm Critical Chunks. Lädt riskante Chunks und ihre Nachbarn vor, um Ruckelspitzen zu verringern."

[config.documentation.annotation.art.arcane.react.content.action.actionprewarmcriticalchunks_params.field.generatemissingchunks]
impact = "Aktivieren Sie dies, um dieses Verhalten anzuwenden; deaktivieren Sie es, um diesen Pfad inaktiv zu halten."
summary = "Legt fest, ob Prewarm Critical Chunks fehlende Chunks erzeugt."

[config.documentation.annotation.art.arcane.react.content.action.actionprewarmcriticalchunks_params.field.includeplayerchunks]
impact = "Aktivieren Sie dies, um diese Ziele zur Verarbeitung hinzuzufügen; Deaktivieren Sie es, um sie wegzulassen."
summary = "Bezieht Spieler-Chunks in die Verarbeitung von Prewarm Critical Chunks ein."

[config.documentation.annotation.art.arcane.react.content.action.actionprewarmcriticalchunks_params.field.maxchunks]
impact = "Höhere Werte ermöglichen mehr Durchsatz vor dem Eingriff; niedrigere Werte machen die Minderung aggressiver."
summary = "Maximale Anzahl Chunks, die Prewarm Critical Chunks erlaubt sind."

[config.documentation.annotation.art.arcane.react.content.action.actionprewarmcriticalchunks_params.field.neighborradius]
impact = "Höhere Werte erweitern den Suchbereich und kosten mehr Arbeit; niedrigere Werte verengen den Umfang und laufen billiger."
summary = "Von Prewarm Critical Chunks verwendeter Nachbarradius (Blöcke)."

[config.documentation.annotation.art.arcane.react.content.action.actionprewarmcriticalchunks_params.field.playerchunkradius]
impact = "Höhere Werte erweitern den Suchbereich und kosten mehr Arbeit; niedrigere Werte verengen den Umfang und laufen billiger."
summary = "Von Prewarm Critical Chunks verwendeter Spieler-Chunk-Radius (Chunks)."

[config.documentation.annotation.art.arcane.react.content.action.actionprewarmcriticalchunks_params.field.touchchunksnapshot]
impact = "Aktivieren Sie dies, um dieses Verhalten anzuwenden; deaktivieren Sie es, um diesen Pfad inaktiv zu halten."
summary = "Legt fest, ob Prewarm Critical Chunks den Chunk-Snapshot berührt (Touch)."

[config.documentation.annotation.art.arcane.react.content.action.actionprewarmcriticalchunks_params.field.world]
impact = "Geben Sie einen Weltnamen an, um Aktionen auf diese Welt zu beschränken, oder lassen Sie das Feld leer, um alle Welten einzubeziehen."
summary = "Weltnamenfilter für Operationen von Prewarm Critical Chunks."

[config.documentation.annotation.art.arcane.react.content.action.actionpurgechunks]
description = "Konfiguration der Aktion Purge Chunks. Versucht, ausgewählte Chunks zu entladen, um die Belastung durch aktive Chunks zu verringern."

[config.documentation.annotation.art.arcane.react.content.action.actionpurgechunks_params.field.area]
impact = "Wählen Sie einen engeren Bereich für sicherere, lokale Aktionen oder einen breiteren Bereich für umfassendere Abhilfe."
summary = "Bereichsauswahl, die Purge Chunks beim Wählen von Ziel-Chunks oder -Entitäten verwendet."

[config.documentation.annotation.art.arcane.react.content.action.actionpurgeentities]
description = "Konfiguration der Aktion Purge Entities. Entfernt passende Entitäten aus ausgewählten Chunks oder Welten."

[config.documentation.annotation.art.arcane.react.content.action.actionpurgeentities.field.defaultblacklist]
impact = "Aktivieren Sie dies, um dieses Verhalten anzuwenden; deaktivieren Sie es, um diesen Pfad inaktiv zu halten."
summary = "Legt fest, ob Purge Entities die Standard-Sperrliste anwendet."

[config.documentation.annotation.art.arcane.react.content.action.actionpurgeentities.field.protectnamedentities]
impact = "Aktiviert lassen, um Entitäten mit benutzerdefiniertem Namen auszuschließen; deaktivieren, um auch benannte Entitäten entfernen zu lassen."
summary = "Schützt von Spielern benannte Entitäten vor Purge Entities."

[config.documentation.annotation.art.arcane.react.content.action.actionpurgeentities.field.secondstopurge]
impact = "Höhere Werte geben Spielern mehr Vorwarnzeit; niedrigere Werte bereinigen früher."
summary = "Countdown-Basis in Sekunden, bevor Purge Entities passende Entitäten entfernt."

[config.documentation.annotation.art.arcane.react.content.action.actionpurgeentities_params.field.area]
impact = "Wählen Sie einen engeren Bereich für sicherere, lokale Aktionen oder einen breiteren Bereich für umfassendere Abhilfe."
summary = "Bereichsauswahl, die Purge Entities beim Wählen von Ziel-Chunks oder -Entitäten verwendet."

[config.documentation.annotation.art.arcane.react.content.action.actionpurgeentities_params.field.entityfilter]
impact = "Engen Sie diese Liste ein, um weniger Fälle zu erfassen, oder erweitern Sie sie, um mehr übereinstimmende Einträge aufzunehmen."
summary = "Filterdefinition für den von Purge Entities verwendeten Entitätenfilter."

[config.documentation.annotation.art.arcane.react.content.action.actionpurgeentities_params.field.protectnamedentities]
impact = "Aktiviert lassen, um Entitäten mit benutzerdefiniertem Namen auszuschließen; deaktivieren, um auch benannte Entitäten entfernen zu lassen."
summary = "Schützt von Spielern benannte Entitäten vor Purge Entities."

[config.documentation.annotation.art.arcane.react.content.action.actionquarantinehotchunks]
description = "Konfiguration der Aktion Quarantine Hot Chunks. Isoliert Chunks mit hohem Score und entfernt optional alte Entitäten abseits von Spielern."

[config.documentation.annotation.art.arcane.react.content.action.actionquarantinehotchunks_params.field.cullentities]
