"config.documentation.annotation.art.arcane.react.content.feature.featurehopperchaincoalescing.description" = "Konfiguration für Trichter-Kette Koalitionsfunktion. Erkennt lineare Ketten von N Trichter, die in dieselbe Richtung füttern und prognostiziert, wie viele Ticks pro Trichter-Transfer per Tick in einen einzigen Head-to-Tail batched pull pro Kette zusammenbrechen würden. Betrieb im Messmodus: Kettendetektion plus geprojektierte Ticks-gespeicherte Expositionen über das Kettenkollegierungs Messwertsammler. Das Löschen der Zwischenversandungen InventoryMoveItemEvent kollidiert mit FeatureHopperTokenBucket's Bucket-Verbrauchsordnung, so dass der tatsächliche Batchgeschritt auf eine dedizierte NMS-Brücke verschoben wird."
"config.documentation.annotation.art.arcane.react.content.feature.featurehopperchaincoalescing.field.bypassradius.impact" = "Höhere Werte schützen eine breitere Zone um Spieler herum; niedrigere Werte zählen Ketten, die näher bei Spielern sind."
"config.documentation.annotation.art.arcane.react.content.feature.featurehopperchaincoalescing.field.bypassradius.summary" = "Umgehungsradius um spieler in blöcken; ketten, die diesen radius berühren, überspringen die zusammenführung der buchhaltung."
"config.documentation.annotation.art.arcane.react.content.feature.featurehopperchaincoalescing.field.engageonincident.impact" = "Höhere Werte Reserve verschmelzen für schwere Vorfälle; niedrigere Werte greifen früher."
"config.documentation.annotation.art.arcane.react.content.feature.featurehopperchaincoalescing.field.engageonincident.summary" = "Auslöseschwelle für die Verknüpfung von Buchhaltung anstelle von passiver Erkennung (Incident Score)."
"config.documentation.annotation.art.arcane.react.content.feature.featurehopperchaincoalescing.field.engageontickms.impact" = "Höhere Werte verzögern die Aktivierung; niedrigere Werte erleichtern das Überschreiten dieser Schwelle."
