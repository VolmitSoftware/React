summary = "Tick-Zeit (Millisekunden), ab der der Schnellvorlauf nicht mehr eingreift. Unter Last inaktiv bleiben."

[config.documentation.annotation.art.arcane.react.content.feature.featurecropfastforward.field.maxadvancesperpass]
impact = "Höhere Werte spulen größere Farmen in einem Durchgang vor; niedrigere Werte begrenzen die Kosten im ungünstigsten Fall beim Aufwecken."
summary = "Maximale Anzahl der Blockzustands-Updates pro Schnellvorlauf-Durchgang, um die Kosten eines einzelnen Aufweckens zu begrenzen."

[config.documentation.annotation.art.arcane.react.content.feature.featurecropfastforward.field.maxfastforwardticks]
