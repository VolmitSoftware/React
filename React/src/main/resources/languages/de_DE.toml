"config.documentation.annotation.art.arcane.react.content.tweak.tweakserverhibernator.description" = "Konfiguration für Server Hibernator-Twick. Experimenteller leerer Server-Hibernationsmodus, der zwischen Ticks schläft, wenn keine Spieler online sind."
