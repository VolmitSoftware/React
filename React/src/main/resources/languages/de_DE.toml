"config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.field.monsterrangefactor.impact" = "Niedrigere Werte schneiden Monster Tracker Fanout; entfernte Monster erscheinen später, während sie sich engagieren."
"config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.field.monsterrangefactor.summary" = "Skalierungsfaktor angewendet, um monster tracking-reichweite während engagiert."
"config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.field.otherrangefactor.impact" = "Niedrigere Werte werden für nicht kategorisierte Entitäten wie Projektile und Fahrzeuge ausgeschnitten."
