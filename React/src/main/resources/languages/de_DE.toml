summary = "Legt fest, ob Quarantine Hot Chunks den Chunk entlädt."

[config.documentation.annotation.art.arcane.react.content.action.actionquarantinehotchunks_params.field.unsafeplayerradius]
impact = "Höhere Werte erweitern den Suchbereich und kosten mehr Arbeit; niedrigere Werte verengen den Umfang und laufen billiger."
summary = "Von Quarantine Hot Chunks verwendeter unsicherer Spielerradius (Blöcke)."

[config.documentation.annotation.art.arcane.react.content.action.actionquarantinehotchunks_params.field.world]
impact = "Geben Sie einen Weltnamen an, um Aktionen auf diese Welt zu beschränken, oder lassen Sie das Feld leer, um alle Welten einzubeziehen."
summary = "Weltnamenfilter für Operationen von Quarantine Hot Chunks."

[config.documentation.annotation.art.arcane.react.content.action.actiontrimentitiesbyagepriority]
description = "Konfiguration der Aktion Trim Entities By Age Priority. Bewertet alte Entitäten mit niedriger Priorität und dünnt sie mit Sicherheitsprüfungen aus."

[config.documentation.annotation.art.arcane.react.content.action.actiontrimentitiesbyagepriority_params.field.allowitems]
