"config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids.field.extravanillaticksperevent.summary" = "Zusätzliche Vanilleflüssigkeit Ticks in der Warteschlange pro Flüssigkeitsflussereignis bei schnellen Flüssigkeiten."
