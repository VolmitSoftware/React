"config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.description" = "Konfiguration für Item Despawn Accelerator Tweak. Pushs berechtigte fallen gelassene gegenstände in richtung despawn, wenn keine spieler in der nähe sind."
