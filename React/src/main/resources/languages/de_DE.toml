[config.documentation.annotation.art.arcane.react.content.feature.featurehopperchaincoalescing]
description = "Konfiguration der Funktion Hopper Chain Coalescing. Erkennt lineare Trichterketten und meldet die prognostizierte Tick-Ersparnis. Standardmäßig bleibt sie reine Messung; im Act-Modus mit dem versionierten Trichter-Hook werden zulässige Zwischen-Ticks übersprungen und ein Transfer vom Anfang zum Ende der Kette synthetisiert. Synthetisierte Transfers stimmen sich mit dem Gating von FeatureHopperTokenBucket ab, statt InventoryMoveItemEvent direkt abzubrechen."

