"config.documentation.annotation.art.arcane.react.content.feature.featureactivationrangegovernor.description" = "Konfiguration für die Funktion der Aktivationsbereichs-Region. Es reduziert vorübergehend die Aktivierungsbereiche pro Weltentität, während der Server unter anhaltendem Druck ist, so dass der Server selbst entfernte Entitäten deaktiviert anstatt einen Serververarbeitungszyklus für sie auszuführen. Im Gegensatz zu ( mit dynamischer Aktivierungsergebnis, das Entitäten nach einem ) sampelt und pausioniert, werden diese Bereiche vom Server jedes Tick gelesen und sofort auf alle Entitäten angewendet. Bereiche und Dorfstädte, die einen Serververarbeitungszyklus betreiben, werden wiederhergestellt, sobald sich der Server erholt."
