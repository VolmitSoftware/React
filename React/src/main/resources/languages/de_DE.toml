"config.documentation.annotation.art.arcane.react.content.feature.featuretrinityincidentmode.field.minimumengagems.impact" = "Höhere Werte erfordern stärkere Signale vor dem Handeln; niedrigere Werte machen diese Bedingung leichter zu erfüllen."
