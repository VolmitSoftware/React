"config.documentation.annotation.art.arcane.react.api.web.webconfiguration.description" = "Embedded HTTP/WebSocket management API configuration for React."
"config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.advertisedurl.impact" = "Set this to the HTTPS URL of a reverse proxy when the listener is exposed beyond localhost. React's embedded listener remains HTTP-only."
"config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.advertisedurl.summary" = "Public base URL advertised to direct API clients."
"config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.listenaddress.impact" = "The default :: wildcard accepts IPv6 and IPv4-mapped traffic for LAN, container, and port-forwarded access. Use a loopback address only behind a same-host reverse proxy or relay."
"config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.listenaddress.summary" = "IP address the web listener binds to."
"config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.corsorigins.impact" = "Eine leere Liste erlaubt alle Ursprünge. Fügen Sie spezifische Ursprünge hinzu, um den Zugriff auf Cross-Origin zu beschränken."
"config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.corsorigins.summary" = "Liste der zulässigen CORS Ursprung für die HTTP API."
"config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.listenerenabled.impact" = "React opens the authenticated API by default. Set false to bind no HTTP or WebSocket listener."
"config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.listenerenabled.summary" = "Enables the embedded web listener."
"config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.port.impact" = "Ist dieser Port belegt, versucht React der Reihe nach die nächsten 99 Ports und verwendet den tatsächlich gebundenen Port für direkte und Relay-Verbindungen. Wirksam nach einem React-Neuladen oder Serverneustart. Eine ausdrücklich gesetzte advertisedUrl bleibt unverändert."
"config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.port.summary" = "Bevorzugter TCP-Port für den Webserver."
"config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.relayenabled.impact" = "Wenn wahr, React Verbindet sich mit dem Relais-Broker bei relayUrl So kann die Begleit-App Server hinterher erreichen NAT ohne Port-Weiterleitung."
"config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.relayenabled.summary" = "Ermöglicht den Outbound Cloud-Relay Client für NAT Traversal."
"config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.relayurl.impact" = "Lesen Sie nur, wenn relayEnabled ist wahr. Lassen Sie leer, wenn das Relais deaktiviert ist."
"config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.relayurl.summary" = "Basis WSS URL des Relaisvermittlers, e.g. wss://relay.arcane.art; das /agent Der Pfad wird automatisch angehängt."
"config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.requiretokenforreads.impact" = "Wenn wahr, unauthentifiziert GET Anträge werden abgelehnt mit 401. Setzen Sie auf false nur in vollständig vertrauenswürdigen Netzwerkumgebungen."
"config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.requiretokenforreads.summary" = "Erfordert ein gültiges Auth-Token für Read-only HTTP Endpunkte."
"config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.wspushhz.impact" = "Höhere Werte erhöhen Push-Fidelity aber auch Netzwerk und CPU Gemeinkosten."
"config.documentation.annotation.art.arcane.react.api.web.webconfiguration.field.wspushhz.summary" = "Zielfrequenz (Hz), bei dem Messwertsammler-Updates über WebSocket-Verbindungen gedrückt werden."
