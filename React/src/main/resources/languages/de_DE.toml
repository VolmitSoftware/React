"config.documentation.annotation.art.arcane.react.content.feature.featurecircuitmanager.field.throttledurationms.impact" = "Längere Zeiträume unterdrücken eine problematische Komponente länger; kürzere versuchen sie früher erneut."
"config.documentation.annotation.art.arcane.react.content.feature.featurecircuitmanager.field.throttledurationms.summary" = "Dauer einer Schaltungsdrosselung in Millisekunden."
