"config.documentation.annotation.art.arcane.react.content.feature.featurehopperchaincoalescing.field.featureactmode.summary" = "Überspringt die Zwischenverarbeitung von Trichter Tick, wenn Ketten in einem (act-Modus ) für einen schnellen Weg berechtigt sind."
