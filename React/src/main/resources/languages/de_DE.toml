summary = "Angesammelter Hitze-Score, den die Tick Spike Origin Replay Map für die Hotspot-Wiedergabe verfolgt."

[config.documentation.annotation.art.arcane.react.content.feature.featuretickspikeoriginreplaymap_heatcell.field.lastseenms]
impact = "Hauptsächlich Laufzeitzustand; eine manuelle Änderung kann das Abklingzeit- oder Drosselungsverhalten verfälschen."
summary = "Interner Zeitstempel, den die Tick Spike Origin Replay Map verwendet, um Zeitfenster und Abklingen zu verfolgen."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor]
description = "Konfiguration der Funktion Tracker Range Governor. Verkleinert vorübergehend die Tracking-Reichweiten der Entitäten pro Welt (Gegenstände, Sonstiges, Displays, Tiere, Monster), solange der Server unter anhaltender Belastung steht, und verringert so Entity-Tracker und Paket-Fanout. Änderungen gelten für Entitäten, sobald sie verfolgt werden; daher reagieren sich schnell ändernde Entitäten wie Gegenstände innerhalb von Sekunden. Die Reichweiten werden wiederhergestellt, sobald sich der Server erholt hat."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.field.animalrangefactor]
impact = "Niedrigere Werte verringern das Fanout des Tier-Trackers; entfernte Tiere erscheinen im aktivierten Zustand später."
summary = "Skalierungsfaktor für die Tracking-Reichweite von Tieren im aktivierten Zustand."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.field.displayrangefactor]
impact = "Niedrigere Werte verringern das Fanout von Display-Entitäten; Hologramme werden im aktivierten Zustand nur aus geringerer Entfernung gerendert."
summary = "Skalierungsfaktor für die Tracking-Reichweite von Display-Entitäten im aktivierten Zustand."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.field.engageticktimems]
impact = "Niedrigere Werte verkleinern die Tracking-Reichweiten früher; höhere Werte behalten dies schwererer Last vor."
summary = "Erforderliche durchschnittliche Tick-Millisekunden, bevor der Regler eingreift."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.field.itemrangefactor]
impact = "Niedrigere Werte verringern das Item-Tracker-/Paket-Fanout stärker; Spieler sehen fallen gelassene Gegenstände nur aus geringerer Entfernung."
summary = "Skalierungsfaktor für die Tracking-Reichweite von Gegenständen im aktivierten Zustand."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.field.minimumrangeblocks]
impact = "Höhere Werte begrenzen, wie stark Reichweiten schrumpfen; niedrigere Werte erlauben tiefere Einschnitte."
summary = "Mindest-Tracking-Reichweite in Blöcken nach der Skalierung."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.field.miscrangefactor]
impact = "Niedrigere Werte verringern das Tracker-/Paket-Fanout für dekorative und Ambient-Entitäten stärker."
summary = "Skalierungsfaktor für die sonstige Tracking-Reichweite (Item-Rahmen, Gemälde, XP-Orbs) im aktivierten Zustand."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.field.monsterrangefactor]
impact = "Niedrigere Werte verringern das Fanout des Monster-Trackers; entfernte Monster erscheinen im aktivierten Zustand später."
summary = "Skalierungsfaktor für die Tracking-Reichweite von Monstern im aktivierten Zustand."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.field.otherrangefactor]
impact = "Niedrigere Werte verringern das Fanout für nicht kategorisierte Entitäten wie Projektile und Fahrzeuge."
summary = "Skalierungsfaktor für die Tracking-Reichweite sonstiger Entitäten im aktivierten Zustand."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.field.releaseticktimems]
impact = "Niedrigere Werte halten die Reduktion länger für Stabilität; höhere Werte stellen volle Bereiche früher wieder her."
summary = "Durchschnittliche Tick-Millisekunden, unter denen der Server bleiben muss, bevor der Regler freigibt."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.field.sustainengagems]
impact = "Höhere Werte ignorieren kurze Spikes; niedrigere Werte greifen schneller."
summary = "Erforderliche Dauer anhaltender Belastung vor dem Eingreifen (Millisekunden)."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.field.sustainreleasems]
impact = "Höhere Werte vermeiden das Flattern zwischen Zuständen; niedrigere Werte stellen Bereiche früher wieder her."
summary = "Erforderliche Dauer anhaltender Erholung vor der Freigabe (Millisekunden)."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrackerrangegovernor.field.tickintervalms]
impact = "Niedrigere Werte reagieren schneller, verbrauchen aber mehr CPU; höhere Werte reduzieren den Overhead, reagieren aber später."
summary = "Hauptauswertungsintervall für den Tracker Range Governor in Millisekunden."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrinityincidentmode]
description = "Konfiguration für die Funktion Trinity Incident Mode. Diese Funktion überwacht kontinuierlich das Verhalten des Servers und wendet während der Laufzeit Leitplanken an."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrinityincidentmode.field.enteradaptabilitytimingbudgetpercent]
impact = "Höhere Werte erfordern vor der Vorfallsbehandlung höhere gemessene Kosten für Adapt-Schutzprüfungen; niedrigere Werte lösen früher aus."
summary = "Schwellenwert des Adapt-Fähigkeits-Zeitbudgets (Prozent), der im Trinity Incident Mode die Vorfallsbehandlung auslösen kann."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrinityincidentmode.field.enteradaptsessionload]
impact = "Höhere Werte lösen später bei schwerer Last aus; niedrigere Werte früher."
summary = "Schwellenwert der Adapt-Sitzungslast (Prozent), der im Trinity Incident Mode die Vorfallsbehandlung auslösen kann."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrinityincidentmode.field.enterincidentscore]
impact = "Höhere Werte lösen später eine Minderung aus, niedrigere Werte früher und aggressiver."
summary = "Auslöseschwelle für den Eintritts-Vorfallscore im Trinity Incident Mode."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrinityincidentmode.field.enteririspregeninflight]
impact = "Höhere Werte erkennen Iris-Druck erst, wenn der Pregenerator nahe an seiner vollen Parallelität arbeitet; niedrigere Werte zählen auch leichtere Vorgenerierungslast."
summary = "Laufende Chunk-Anfragen des Iris-Pregenerators, die im Trinity Incident Mode als Iris-Belastung zählen; Werte werden auf 1..256 begrenzt."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrinityincidentmode.field.entertickms]
impact = "Höhere Werte verzögern die Aktivierung oder den Ausstieg; niedrigere Werte erleichtern das Überschreiten dieses Schwellenwerts."
summary = "Tick-Zeit-Schwelle für den Eintritt im Trinity Incident Mode (Millisekunden)."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrinityincidentmode.field.minimumengagems]
impact = "Höhere Werte erfordern stärkere Signale vor dem Handeln; niedrigere Werte machen diese Bedingung leichter zu erfüllen."
summary = "Mindestdauer des Eingreifens in ms, die der Trinity Incident Mode verlangt."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrinityincidentmode.field.playbookcooldownms]
impact = "Höhere Werte reduzieren die Wiederholungshäufigkeit; niedrigere Werte erlauben häufiger Reaktionen."
summary = "Abklingzeit des Playbooks im Trinity Incident Mode (Millisekunden)."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrinityincidentmode.field.tickintervalms]
impact = "Niedrigere Werte reagieren schneller, verbrauchen aber mehr CPU; höhere Werte reduzieren den Overhead, reagieren aber später."
summary = "Hauptauswertungsintervall für den Trinity Incident Mode in Millisekunden."

[config.documentation.annotation.art.arcane.react.content.feature.featuretrinityincidentmode.field.verbosetransitions]
impact = "Für Diagnose aktivieren; deaktivieren, um Chat- oder Protokollrauschen zu verringern."
summary = "Ermöglicht zusätzliches Protokollieren für ausführliche Übergänge im Trinity-Incident-Modus."

[config.documentation.annotation.art.arcane.react.content.feature.featureunknown]
description = "Konfiguration für unbekanntes Feature. Diese Funktion überwacht kontinuierlich das Verhalten des Servers und wendet während der Laufzeit Leitplanken an."

[config.documentation.annotation.art.arcane.react.content.feature.perworld.worldbudgetoverride.field.budgetms]
summary = "Budgetschwelle pro Welt in Millisekunden, die budgetMs global für diese Welt überschreibt."

[config.documentation.annotation.art.arcane.react.content.feature.perworld.worldbudgetoverride.field.panicms]
summary = "Panikschwelle pro Welt in Millisekunden, die panicMs global für diese Welt überschreibt."

[config.documentation.annotation.art.arcane.react.content.feature.perworld.worldbudgetoverride.field.releasems]
summary = "Pro-Welt-Release-Schwelle in Millisekunden überschreibt die globale releaseMs für diese Welt."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakentitybubbler]
description = "Konfiguration des Tweaks Entity Bubbler. Verhindert, dass ausgewählte Projektil- oder Hilfsentitäten dauerhaft in Blasensäulen festhängen."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakentitybubbler.field.entitiedtopreventfrombeingbubbled]
impact = "Fügen Sie weitere Typen hinzu, um Blasenaufzüge aggressiv zu leeren, oder entfernen Sie Typen, damit diese Entitäten durch Wassersäulen reisen können."
summary = "Entitätstypen, die entfernt werden, wenn sie in Blasensäulen oder Seelensand-Blasenaufzugspfaden erkannt werden."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakentitycrowdprevention]
description = "Konfiguration des Tweaks Entity Crowd Prevention. Dünnt überfüllte Entitätengruppen wie bei Nutztieren aus, bevor sie anhaltende Tick-Belastung erzeugen."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakentitycrowdprevention.field.maxentitiesperclustercrowd]
impact = "Höhere Werte erlauben größere Bursts, bevor die Steuerung eingreift; niedrigere Werte klemmen Spikes früher."
summary = "Maximal erlaubte Entitäten pro Gruppe bei Entity Crowd Prevention."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakentitycrowdprevention.field.mobstopreventfromcrowding]
impact = "Beschränken Sie diese Liste, um mehr Mobs zu schützen, oder erweitern Sie sie, um Anti-Crowding auf zusätzliche Entity-Typen durchzusetzen."
summary = "Entitätstypen, die auf lokale Ansammlungsbelastung überwacht werden und zum Ausdünnen infrage kommen."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakentitycrowdprevention.field.prevententitybubbling]
impact = "Aktivieren Sie dies, um dieses Verhalten anzuwenden; deaktivieren Sie es, um diesen Pfad inaktiv zu halten."
summary = "Legt fest, ob Entity Crowd Prevention das Verhindern von Entity Bubbling anwendet."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakentitycrowdprevention.field.protectnamedentities]
impact = "Aktiviert lassen, um Entitäten mit benutzerdefiniertem Namen auszuschließen; deaktivieren, um auch benannte Entitäten entfernen zu lassen."
summary = "Schützt von Spielern benannte Entitäten vor Entity Crowd Prevention."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakentityhardstop]
description = "Konfiguration des Tweaks Entity Hardstop. Begrenzt die Entitätenanzahl pro Chunk hart, indem neue Entitäten abgebrochen werden, sobald die Grenzen überschritten sind."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakentityhardstop.field.allowitemdrops]
impact = "Aktivieren, damit fallen gelassene Gegenstände auch in überfüllten Chunks weiter fließen; deaktivieren für strengere harte Begrenzung."
summary = "Erlaubt natürlichen und von Spielern fallen gelassenen Gegenstandsentitäten, die Hardstop-Grenzprüfungen zu umgehen."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakentityhardstop.field.cacheintervalticks]
impact = "Höhere Werte reduzieren den wiederholten Overhead-Zähler, können aber Spawns länger verweigern; niedrigere Werte werden mit mehr Overhead früher erneut überprüft."
summary = "Cache-Dauer für Chunks, die Hardstop kürzlich abgelehnt hat, bevor die Entitätenzahl erneut geprüft wird (Ticks)."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakentityhardstop.field.maxentitiesperchunk]
impact = "Höhere Werte erlauben größere Bursts, bevor die Steuerung eingreift; niedrigere Werte klemmen Spikes früher."
summary = "Maximal erlaubte Entitäten pro Chunk bei Entity Hardstop."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakexperienceorbmerge]
description = "Konfiguration des Tweaks Experience Orb Merge. Führt nahe XP-Orbs zu größeren Stapeln zusammen, um die Anzahl der Orb-Entitäten und den Aufwand beim Einsammeln zu verringern."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakexperienceorbmerge.field.maxexperienceperorb]
impact = "Höhere Werte erlauben größere Bursts, bevor die Steuerung eingreift; niedrigere Werte klemmen Spikes früher."
summary = "Maximale Erfahrung pro Orb bei Experience Orb Merge."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakexperienceorbmerge.field.maxnearbyorbspermerge]
impact = "Höhere Werte erlauben größere Bursts, bevor die Steuerung eingreift; niedrigere Werte klemmen Spikes früher."
summary = "Maximal erlaubte Anzahl naher Orbs pro Zusammenführung bei Experience Orb Merge."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakexperienceorbmerge.field.mergeradius]
impact = "Höhere Werte erweitern den Suchbereich und kosten mehr Arbeit; niedrigere Werte verengen den Umfang und laufen billiger."
summary = "Von Experience Orb Merge verwendeter Zusammenführungsradius (Blöcke)."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastcolumns]
description = "Konfiguration des Tweaks Fast Columns. Fasst Pflanzensäulen in verketteten Updates zusammen, um wiederholten Physikaufwand pro Block zu verringern."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastdrops]
description = "Konfiguration des Tweaks Fast Drops. Leitet Drops und XP direkt an Spieler, um Bodengegenstand-Ansammlungen und Einsammel-Aufwand zu verringern."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastdrops.field.allowcontainerdrops]
impact = "Aktivieren Sie dies, um das Verhalten zu ermöglichen; deaktivieren Sie es, um diesen Weg zu blockieren oder zu drosseln."
summary = "Erlaubt Container-Drops bei Fast Drops."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastdrops.field.teleportblockdrops]
impact = "Aktivieren Sie dies, um dieses Verhalten anzuwenden; deaktivieren Sie es, um diesen Pfad inaktiv zu halten."
summary = "Legt fest, ob Fast Drops Block-Drops teleportiert."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastdrops.field.teleportblockxp]
impact = "Aktivieren Sie dies, um dieses Verhalten anzuwenden; deaktivieren Sie es, um diesen Pfad inaktiv zu halten."
summary = "Legt fest, ob Fast Drops Block-XP teleportiert."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastdrops.field.teleportentitydrops]
impact = "Aktivieren Sie dies, um dieses Verhalten anzuwenden; deaktivieren Sie es, um diesen Pfad inaktiv zu halten."
summary = "Legt fest, ob Fast Drops Entitäten-Drops teleportiert."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastdrops.field.teleportentityxp]
impact = "Aktivieren Sie dies, um dieses Verhalten anzuwenden; deaktivieren Sie es, um diesen Pfad inaktiv zu halten."
summary = "Legt fest, ob Fast Drops Entitäten-XP teleportiert."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastentityincineration]
description = "Konfiguration des Tweaks Fast Entity Incineration. Entfernt brennende Monster nach konfigurierten Näheregeln, um anhaltende Feuer-Tick-Kosten zu senken."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastentityincineration.field.incinerationbeyondnearestplayer]
impact = "Höhere Werte ermöglichen eine Bereinigung weiter von den Spielern entfernt; niedrigere Werte halten die Bereinigung näher an aktiven Spielern."
summary = "Entfernung von Spielern, ab der Fast Entity Incineration das Verbrennungsverhalten anwendet (Blöcke)."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfallingblocks]
description = "Konfiguration des Tweaks Fast Falling Blocks. Beschleunigt langlebige Fallblock-Entitäten, wenn die Fallverarbeitung messbare Tick-Kosten verursacht."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfallingblocks.field.maxfallms]
impact = "Höhere Werte ermöglichen mehr Durchsatz vor dem Eingriff; niedrigere Werte machen die Minderung aggressiver."
summary = "Maximale Fallzeit in ms, die Fast Falling Blocks erlauben."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfire]
description = "Konfiguration des Tweaks Fast Fire. Leitet Feuerausbreitung und Ausbrenn-Updates in schnelle Weltoperationen um, um den Feuerphysik-Overhead zu senken."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids]
description = "Konfiguration des Tweaks Fast Fluids. Spult Wasser- und Lava-Ausbreitungsketten in begrenzte Burst-Updates vor, um wiederholten Flüssigkeitsaufwand pro Schritt zu verringern."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids.field.acceleratedrain]
impact = "Aktivieren, um das Zurückziehen und Leerlaufen von Flüssigkeiten in der Nähe von Fluss-Updates zu beschleunigen; deaktivieren, um nur direkte Fluss-Ticks zu beschleunigen."
summary = "Steuert, ob schnelle Flüssigkeiten eine Abflussbeschleunigung um aktive Strömungsereignisse herum anwenden."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids.field.acceleratelava]
impact = "Aktivieren, um Lavafluss-Ketten zu beschleunigen; deaktivieren, um Lava mit Vanilla-Timing zu belassen."
summary = "Kontrolliert, ob schnelle Flüssigkeiten Lavabeschleunigung anwenden."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids.field.acceleratewater]
impact = "Aktivieren, um Wasserfluss-Ketten zu beschleunigen; deaktivieren, um Wasser mit Vanilla-Timing zu belassen."
summary = "Kontrolliert, ob schnelle Flüssigkeiten Wasserbeschleunigung anwenden."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids.field.extravanillaticksperevent]
impact = "Höhere Werte komprimieren mehr Flüssigkeitsupdates in weniger Server-Ticks, können jedoch die Fluidarbeit pro Tick erhöhen."
summary = "Zusätzliche Vanilla-Flüssigkeits-Ticks, die bei Fast Fluids pro Flüssigkeitsfluss-Ereignis eingereiht werden."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids.field.maxburstticksperlocationperservertick]
impact = "Höhere Werte fassen Flüssigkeitsketten pro Position schneller in einem Tick zusammen; niedrigere Werte verteilen die Arbeit gleichmäßiger über Ticks."
summary = "Maximale Anzahl eingereihter zusätzlicher Flüssigkeits-Ticks, die für eine Blockposition während eines einzelnen Server-Tick-Flushs verbraucht werden."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastfluids.field.maxextravanillaticksperservertick]
impact = "Höhere Werte erlauben stärkere Beschleunigungs-Bursts; niedrigere Werte begrenzen die Burst-Kosten für Flüssigkeiten strenger."
summary = "Maximal erlaubte zusätzliche Vanilla-Flüssigkeits-Ticks pro Server-Tick bei Fast Fluids."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakfastsnow]
description = "Konfiguration des Tweaks Fast Snow. Leitet Schneebildung und Schmelz-Updates in schnelle Weltoperationen um, um den Aufwand durch Wetterblöcke zu verringern."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex]
description = "Tickt Trichter vorab mithilfe eines räumlichen Gegenstandsindex, um den AABB-Entitätsscan pro Tick in Vanilla zu umgehen. Fällt auf Vanilla zurück, wenn eine erforderliche NMS-Bridge nicht verfügbar ist."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.idlestretch]
impact = "Aktivieren, um die Tick-Kosten inaktiver Trichter auf trichterlastigen Servern zu senken; das Einsammeln von Gegenständen über den Indexschnellpfad bleibt sofort."
summary = "Verlängert die Transfer-Abklingzeit leerer, inaktiver Trichter, solange der Server unter Last steht, sodass Vanilla sie nicht erneut abfragt."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.idlestretchmintickms]
impact = "Niedrigere Werte dehnen inaktive Trichter früher; höhere Werte behalten dies schwererer Last vor."
summary = "Erforderliche durchschnittliche Tick-Millisekunden, bevor das Dehnen inaktiver Trichter einsetzt."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.idlestretchspreadpasses]
impact = "Höhere Werte prüfen jeden Trichter seltener (günstiger, dehnt langsamer); niedrigere Werte dehnen inaktive Trichter früher."
summary = "Anzahl der Tick-Durchläufe, über die jede Prüfung inaktiver Trichter verteilt wird."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.idlestretchticks]
impact = "Höhere Werte überspringen mehr Arbeit inaktiver Trichter, verzögern aber die Wiederaufnahme von Transfers länger."
summary = "Auf leere, inaktive Trichter angewendete Abklingzeit in Ticks; begrenzt die längste Verzögerung, bevor ein inaktiver Trichter wieder aus einem Container zieht."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.itemchunkbudgetpertick]
summary = "Maximale Anzahl Chunks mit Gegenständen, die pro Tick über alle Welten hinweg geprüft werden."
impact = "Höhere Werte prüfen indexierte Chunks schneller erneut, können aber mehr Regionsarbeit einplanen; Werte werden auf 1 bis 4096 begrenzt."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperlimit]
description = "Konfiguration der Trichterbegrenzung. Verhindert Trichtertransfers, wenn die zeitliche Spanne der Trichterereignisse den konfigurierten Schwellenwert überschreitet."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperlimit.field.maxhoppereventspan]
impact = "Höhere Werte ermöglichen mehr Durchsatz vor dem Eingriff; niedrigere Werte machen die Minderung aggressiver."
summary = "Maximale durch die Trichterbegrenzung erlaubte Zeitspanne der Trichterereignisse."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator]
description = "Konfiguration des Tweaks Item Despawn Accelerator. Treibt geeignete fallen gelassene Gegenstände Richtung Despawn, wenn keine Spieler in der Nähe sind."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.field.ignorenameditems]
impact = "Aktivieren Sie dies, um passende Fälle auszuschließen; deaktivieren Sie es, um sie in die Durchsetzung einzubeziehen."
summary = "Überspringt benannte Gegenstände, wenn der Item Despawn Accelerator Ziele bewertet."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.field.ignorevaluables]
impact = "Aktivieren Sie dies, um passende Fälle auszuschließen; deaktivieren Sie es, um sie in die Durchsetzung einzubeziehen."
summary = "Überspringt Wertsachen, wenn der Item Despawn Accelerator Ziele bewertet."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.field.noplayerradius]
impact = "Höhere Werte erweitern den Suchbereich und kosten mehr Arbeit; niedrigere Werte verengen den Umfang und laufen billiger."
summary = "Radius ohne Spieler in der Nähe, den der Item Despawn Accelerator verwendet (Blöcke)."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakitemdespawnaccelerator.field.targettickslived]
