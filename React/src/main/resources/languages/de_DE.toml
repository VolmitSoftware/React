"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.description" = "Konfiguration für die Shorthands-Funktion. Fügt Operator-Schnittstellenbefehle hinzu, die jeweils separat konfiguriert werden können, ohne /reload zu ändern."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.customcommands.impact" = "Jeder aktivierte Eintrag fügt dynamisch einen Befehl hinzu. Der Zielbefehl setzt immer noch seine eigene Berechtigung durch und bestehende Befehlsetiketten sind geschützt, es sei denn overrideExisting ist aktiviert."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.customcommands.summary" = "Custom-Shortcut-Befehle, die nach Kommandoetiketten organisiert werden. Fügen Sie eine [customCommands.day]-Tabelle mit enabled = true, command = \"time set day\", permission = \"react.shorthands.custom\" und overrideExisting = false hinzu. Argumente, die nach dem Shortcut-Bufehl eingegeben werden, werden dem konfigurierten Befehl angeschlossen. Setzen Sie das Wort args in Bänken im Befehl ein, um sie irgendwo anders einzubringen."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.give.impact" = "Während der Abkürzung aktiviert ist, besitzt die unqualifizierte /give-Befehl. Der Namenspazierungsbereich von Vanilla geben Befehl bleibt verfügbar."
"config.documentation.annotation.art.arcane.react.content.tweak.tweakshorthands.field.give.summary" = "Registriert /give <item> <amount> mit Minecraft-Element-Tab-Füllung."
