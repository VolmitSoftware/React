[config.documentation.annotation.art.arcane.react.content.feature.featurecropfastforward]
description = "Konfiguration für die Crop Fast Forward-Funktion. Der Server lässt Pflanzen nur in Chunks innerhalb der Simulationsdistanz eines Spielers wachsen, daher erfasst diese Funktion, wie lange jeder geladene Chunk außerhalb dieser Distanz verbringt. Kommt ein Spieler wieder in den aktiven Bereich, durchläuft sie die Pflanzen- und Setzlingsblöcke des Chunks einmal und lässt sie um diese Zeit weiterwachsen, damit Spieler nach der Rückkehr keine eingefrorenen Farmen sehen. Ausstehendes Wachstum verfällt, wenn ein Chunk entladen wird. Bleibt bei hochbelasteten Vorfällen inaktiv."

[config.documentation.annotation.art.arcane.react.content.feature.featurecropfastforward.field.activerange]
impact = "Größere Werte wenden ausstehendes Wachstum früher auf weiter entfernte Chunks an; kleinere Werte warten, bis Spieler näher kommen."
summary = "Spielerabstand (Blöcke) zur mittleren Spalte eines Chunks, ab dem sein ausstehender Schnellvorlauf angewendet wird. Ob ein Chunk aktiv ist, richtet sich nach der Simulationsdistanz der Welt."

[config.documentation.annotation.art.arcane.react.content.feature.featurecropfastforward.field.engageonincident]
impact = "Höhere Werte lassen den Schnellvorlauf auch bei leichten Vorfällen weiterlaufen; niedrigere Werte stoppen ihn früher."
summary = "Vorfallscore, ab dem der Schnellvorlauf nicht mehr eingreift. Diese Funktion bleibt bei Vorfällen mit hoher Last inaktiv (umgekehrte Polarität zu den meisten React-Funktionen)."

[config.documentation.annotation.art.arcane.react.content.feature.featurecropfastforward.field.engageontickms]
