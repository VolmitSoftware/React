"config.documentation.annotation.art.arcane.react.content.feature.featurefurnacebrewbatching.description" = "Konfiguration für die Ofen-/Brew Batching Funktion. Gleise mit aktiven Öfen und Brauständen je Chunk und misst die Anzahl der Zwischenstufen Ticks die zwischen den Fuel-Out / Cook-Complete Events übersprungen werden könnten. Berichtet projiziertes Überspringen des Volumens als Laufzeitmetrik; umgeht jeden Block innerhalb bypassRadius eines Spielers so kosmetische Flamme / Rauch bleibt lebendig in der Nähe von Spielern."
"config.documentation.annotation.art.arcane.react.content.feature.featurefurnacebrewbatching.field.bypassradius.impact" = "Höhere Werte halten mehr nahegelegene Öfen für einen normalen Serververarbeitungszyklus; niedrigere Werte lassen das Batch-Reich näher an die Spieler gelangen."
