[config.documentation.annotation.art.arcane.react.content.feature.featurecropfastforward]
description = "Cấu hình cho tính năng Crop Fast Forward. Máy chủ chỉ cho cây trồng phát triển trong các chunk nằm trong khoảng cách mô phỏng của người chơi, vì vậy tính năng này ghi lại thời gian mỗi chunk đã tải nằm ngoài khoảng cách đó. Khi người chơi quay lại phạm vi hoạt động, nó duyệt các khối cây trồng và cây non của chunk một lần và cho chúng phát triển thêm tương ứng với thời gian đó, để người chơi không thấy nông trại bị đứng yên khi quay lại. Phần tăng trưởng đang chờ bị hủy khi chunk được dỡ tải. Không hoạt động trong các sự cố tải cao."

[config.documentation.annotation.art.arcane.react.content.feature.featurecropfastforward.field.activerange]
impact = "Giá trị lớn hơn áp dụng tăng trưởng đang chờ cho các chunk xa hơn sớm hơn; giá trị nhỏ hơn chờ tới khi người chơi đến gần hơn."
summary = "Khoảng cách từ người chơi (tính bằng khối) tới cột trung tâm của chunk mà tại đó phần tua nhanh đang chờ được áp dụng. Việc chunk có hoạt động hay không phụ thuộc vào khoảng cách mô phỏng của thế giới."

[config.documentation.annotation.art.arcane.react.content.feature.featurecropfastforward.field.engageonincident]
impact = "Giá trị cao hơn giữ tua nhanh hoạt động trong các sự cố nhẹ; giá trị thấp hơn tắt nó sớm hơn."
summary = "Điểm sự cố mà khi vượt qua, tua nhanh sẽ ngừng hoạt động. Tính năng này im lặng trong các sự cố tải cao (ngược cực so với hầu hết tính năng React)."

[config.documentation.annotation.art.arcane.react.content.feature.featurecropfastforward.field.engageontickms]
impact = "Giá trị cao hơn giữ tua nhanh hoạt động khi tải nặng hơn; giá trị thấp hơn tắt nó sớm hơn."
summary = "Thời gian tick mà khi vượt qua, tua nhanh sẽ ngừng hoạt động (mili giây). Giữ yên lặng khi chịu tải."

[config.documentation.annotation.art.arcane.react.content.feature.featurecropfastforward.field.maxadvancesperpass]
impact = "Giá trị cao hơn tua nhanh các nông trại lớn hơn trong một lượt; giá trị thấp hơn giới hạn chi phí đánh thức trong trường hợp xấu nhất."
summary = "Số lần cập nhật trạng thái khối tối đa áp dụng mỗi lượt tua nhanh để giới hạn chi phí của một lần đánh thức."

[config.documentation.annotation.art.arcane.react.content.feature.featurecropfastforward.field.maxfastforwardticks]
impact = "Giá trị cao hơn cho phép bắt kịp nhiều hơn nhưng nén nhiều tăng trưởng vanilla hơn vào một lượt; giá trị thấp hơn giới hạn mức hiệu chỉnh khi đánh thức."
summary = "Số tick ngủ đông tối đa đưa vào phép tính tăng trưởng. Giới hạn việc tua nhanh quá mức sau thời gian vắng mặt kéo dài."

[config.documentation.annotation.art.arcane.react.content.feature.featurecropfastforward.field.maxtrackedchunks]
impact = "Giá trị cao hơn bao phủ nhiều địa hình hơn nhưng tốn nhiều bộ nhớ hơn; giá trị thấp hơn đánh đổi độ bao phủ để tiết kiệm bộ nhớ."
summary = "Số chunk tối đa được theo dõi trên tất cả thế giới trước khi các chunk được theo dõi lâu nhất bị loại bỏ."

[config.documentation.annotation.art.arcane.react.content.feature.featurecropfastforward.field.minelapsedticks]
impact = "Giá trị cao hơn bỏ qua các lần vắng mặt ngắn; giá trị thấp hơn tua nhanh cả những khoảng ngắn ngoài khoảng cách mô phỏng."
summary = "Thời gian tối thiểu (tính bằng tick) mà chunk phải ở ngoài khoảng cách mô phỏng trước khi được tua nhanh. Các lần vắng mặt ngắn hơn bị bỏ qua."

[config.documentation.annotation.art.arcane.react.content.feature.featurecropfastforward.field.releaseonincident]
impact = "Giá trị cao hơn tiếp tục sớm hơn sau khi yên tĩnh trở lại; giá trị thấp hơn giữ tua nhanh tắt lâu hơn để ổn định."
summary = "Điểm sự cố dưới mức này thì tua nhanh được phép tiếp tục sau khi bị tạm dừng trước đó."

[config.documentation.annotation.art.arcane.react.content.feature.featurecropfastforward.field.releaseontickms]
impact = "Giá trị cao hơn tiếp tục sớm hơn sau khi yên tĩnh trở lại; giá trị thấp hơn giữ tua nhanh tắt lâu hơn."
summary = "Ngưỡng thời gian tick dưới mức này thì tua nhanh được phép tiếp tục (mili giây)."

[config.documentation.annotation.art.arcane.react.content.feature.featurecropfastforward.field.saplinggrowthchance]
