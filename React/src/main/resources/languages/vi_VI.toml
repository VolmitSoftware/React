#   {type}  Loại tham số lệnh, giá trị cấu hình, bản đồ hoặc khoảng cách
#   {unavailable}  Số điểm truy cập cầu nối NMS không khả dụng
#   {unit}  Nhãn đơn vị cho tổng của biểu đồ tròn
#   {unknown}  Định danh hành động không rõ bị loại khỏi bộ kiểm thử dành cho nhà phát triển
#   {unreadable}  Số bộ lấy mẫu không đọc được
#   {uptime}  Thời gian hoạt động của hệ điều hành máy chủ
#   {url}  URL của báo cáo chẩn đoán đã tải lên
#   {usage}  Cú pháp sử dụng lệnh
#   {used}  Bộ nhớ vật lý, bộ nhớ ảo hoặc bộ nhớ heap đã dùng
#   {value}  Thiết lập, số đo hoặc chi tiết phần cứng đã định dạng
#   {values}  Các giá trị lấy mẫu được liệt kê trong báo cáo kiểm thử dành cho nhà phát triển
#   {variables}  Tên các biến thay thế mà thông điệp đang sửa chấp nhận
#   {vendor}  Nhà cung cấp Java
#   {verdict}  Kết luận chung của kiểm thử
#   {version}  Phiên bản React, Java hoặc nền tảng
#   {warmed}  Số vùng khối được tải trước
#   {warn}  Số phép kiểm tra có cảnh báo
#   {width}  Chiều rộng khung vẽ kiểm thử, tính bằng điểm ảnh
#   {world}  Tên thế giới Minecraft

