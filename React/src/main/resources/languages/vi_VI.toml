summary = "Qua bán kính xung quanh người chơi trong khối; giảm khối bên trong bỏ qua trọng lực lười biếng hoàn toàn."

[config.documentation.annotation.art.arcane.react.content.feature.featurelazygravity.field.engageincidentscore]
