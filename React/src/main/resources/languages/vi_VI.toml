description = "Cấu hình cho tính năng Ngân sách tìm đường. Thu nhỏ ngân sách nút A* của sinh vật ở xa người chơi khi máy chủ đang chịu tải, khiến mỗi lần tìm đường rẻ hơn mà không đổi nơi sinh vật muốn đến. Ngân sách được khôi phục khi sinh vật đến gần người chơi, khi máy chủ phục hồi, khi dỡ tải thực thể hoặc khi tắt tính năng. Quay về tìm đường vanilla nếu các cầu điều hướng NMS không khả dụng."

[config.documentation.annotation.art.arcane.react.content.feature.featurepathfinderbudget.field.budgetmultiplier]
