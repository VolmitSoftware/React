[config.documentation.annotation.art.arcane.react.content.feature.featureperworldtickbudget.field.tickintervalms]
impact = "Giá trị thấp hơn phản ứng với áp lực theo từng thế giới nhanh hơn nhưng tốn nhiều CPU hơn cho tick của tính năng; giá trị cao hơn làm mượt tín hiệu nhưng tăng thời gian kích hoạt."
