[config.documentation.annotation.art.arcane.react.content.feature.featurepathfinderbudget.field.tickintervalms]
impact = "Giá trị thấp hơn phản ứng nhanh hơn nhưng tốn nhiều CPU hơn; giá trị cao hơn giảm chi phí nhưng phản ứng chậm hơn."
