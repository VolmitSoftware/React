summary = "Thời gian hồi (tick) áp dụng cho phễu trống, nhàn rỗi; giới hạn độ trễ tệ nhất trước khi một phễu nhàn rỗi tiếp tục kéo vật phẩm từ vật chứa."

[config.documentation.annotation.art.arcane.react.content.tweak.tweakhopperindex.field.itemchunkbudgetpertick]
