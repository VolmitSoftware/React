[config.documentation.annotation.art.arcane.react.model.reactconfiguration.field.updatenotifications]
summary = "Kiểm tra bản cập nhật React trong các bản phát hành GitHub."
impact = "Bật theo mặc định. VolmLib gộp các bản cập nhật vào một thông báo khi vào máy chủ và báo cáo /volmit plugins updates. Tắt để dừng kiểm tra React."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.minimumincidentscore]
summary = "Điểm sự cố cần đạt để kịch bản tiếp tục giảm thiểu."
impact = "Kịch bản tiếp tục khi đạt điểm này hoặc minimumTickMS."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.minimumtickms]
summary = "Thời gian tick trung bình tính bằng mili giây cần đạt để tiếp tục giảm thiểu."
impact = "Kịch bản dừng khi cả hai chỉ số áp lực đều thấp hơn ngưỡng tương ứng."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.minimumentitiesperchunk]
summary = "Số thực thể quan sát được trong một chunk cần có trước bước cắt giảm thực thể."
impact = "Giá trị cao hơn giới hạn việc cắt giảm ở các cụm thực thể dày đặc hơn."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.recheckdelayms]
summary = "Khoảng theo dõi sau khi một hành động con hoàn tất, tính bằng mili giây; tối thiểu 1000."
impact = "Cho phép làm mới số liệu trước khi chọn biện pháp tiếp theo."

[config.documentation.annotation.art.arcane.react.content.action.actionincidentplaybook_params.field.childtimeoutms]
summary = "Thời gian tối đa của một bước giảm thiểu, tính bằng mili giây; tối thiểu 1000."
impact = "Hành động con hết thời gian khiến kịch bản thất bại và dừng tăng cường biện pháp."

[config.documentation.annotation.art.arcane.react.content.action.actiontrimentitiesbyagepriority_params.field.minimumentitiesperchunk]
summary = "Số thực thể tối thiểu quan sát được trong một chunk trước khi cắt giảm; 0 bao gồm mọi chunk đã quan sát được."
impact = "Đặt giá trị dương để giới hạn việc cắt giảm ở các chunk có mật độ cao."

[action.capture_profile]
completed = "Đã lưu {count} hồ sơ cục bộ vào {path}"

[config.documentation.annotation.art.arcane.react.content.action.actioncaptureprofile]
description = "Ghi hồ sơ JDK Flight Recorder cục bộ theo yêu cầu với sự kiện thực thi, cấp phát và GC. Giữ ba bản ghi; không bao giờ tải lên."

[config.documentation.annotation.art.arcane.react.content.action.actioncaptureprofile_params.field.seconds]
summary = "Thời gian hồ sơ tính bằng giây, giới hạn từ 1 đến 300."
impact = "Bản ghi dài hơn bao quát nhiều hoạt động hơn; JFR giữ tối đa 64 MiB dữ liệu gần nhất."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.playerchunkbudgetenabled]
summary = "Bật ngân sách chunk của người chơi theo từng thế giới; vùng chồng lấn chỉ tính một lần."
impact = "Mặc định tắt. Ngân sách có thể giảm khoảng cách mục tiêu hiện có; việc khôi phục diễn ra dần dần."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.playertickingchunkbudget]
summary = "Số chunk mô phỏng cho người chơi tối đa ước tính trong mỗi thế giới; tối thiểu 1."
impact = "Vùng mô phỏng chồng lấn chỉ tính một lần. Khoảng cách tối thiểu đã đặt được ưu tiên nếu không thể đáp ứng ngân sách."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.playerviewonlychunkbudget]
summary = "Số chunk chỉ hiển thị tối đa ước tính trong mỗi thế giới; tối thiểu 1."
impact = "Đếm vùng nhìn ngoài vùng mô phỏng. Dự đoán nhu cầu của người chơi, không phải chunk đã tải hay vé của plugin."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.budgetrecoverychecks]
summary = "Số lần đánh giá ngân sách tốt liên tiếp cần có trước khi tăng khoảng cách; tối thiểu 1."
impact = "Các lần đánh giá theo updateCooldownSeconds. Thiếu dữ liệu tick hoặc chỉ mục người chơi chưa sẵn sàng sẽ đặt lại quá trình khôi phục."

[config.documentation.annotation.art.arcane.react.content.feature.featuredynamicviewdistance.field.budgetrecoverystep]
summary = "Mức tăng khoảng cách tối đa sau khi ngân sách phục hồi, tính bằng chunk; giới hạn từ 1 đến 32."
impact = "Bước nhỏ hạn chế đợt tải chunk lớn khi khôi phục. Chỉ áp dụng khi bật ngân sách chunk của người chơi."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller]
description = "Lấy mẫu vị trí người chơi Folia và tùy chọn một tập sự kiện JDK Flight Recorder có giới hạn. JFR ghi tổng lưu lượng giao thức, các giai đoạn tạo chunk, hoạt động lưu trữ và thời gian chờ vượt ngưỡng đã cấu hình."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller.field.regionalenabled]
summary = "Bật lấy mẫu TPS vùng Folia tại vị trí người chơi."
impact = "Mỗi giây truy vấn một tập vị trí người chơi luân phiên có giới hạn từ bộ nhớ đệm mà không tải chunk."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller.field.playeranchorsperrefresh]
summary = "Số vị trí người chơi tối đa được lấy mẫu mỗi giây, giới hạn từ 1 đến 512. Các quan sát hết hạn sau năm giây."
impact = "Giá trị cao hơn bao phủ nhiều người chơi hơn nhưng cần nhiều truy vấn TPS vùng hơn."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller.field.jfrenabled]
summary = "Bật thu thập dữ liệu JFR có chọn lọc. Mặc định tắt. Các bản tổng hợp được công bố không chứa địa chỉ, đường dẫn tệp hoặc dấu vết ngăn xếp."
impact = "Thêm công việc ghi JFR với giới hạn lưu giữ 30 giây và 64 MiB. Các chuỗi tổng hợp được đặt lại mỗi giây."

[config.documentation.annotation.art.arcane.react.core.controller.runtimetelemetrycontroller.field.jfrslowthresholdms]
summary = "Thời lượng tối thiểu tính bằng mili giây cho các sự kiện vào/ra tệp JVM, vào monitor, chờ monitor và tạm dừng luồng bằng park, giới hạn từ 1 đến 1000. Các giai đoạn tạo chunk không có ngưỡng thời lượng."
impact = "Ngưỡng thấp hơn tạo nhiều sự kiện JVM hơn. Các chỉ số này chỉ mô tả những sự kiện đạt ngưỡng này."
