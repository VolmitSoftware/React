summary = "Xác suất mỗi tick ngẫu nhiên để một cây non mọc thành cây theo quy tắc vanilla; dùng cho phép tính theo tỉ lệ."

[config.documentation.annotation.art.arcane.react.content.feature.featurecropfastforward.field.tickintervalms]
