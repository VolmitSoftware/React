# React — vi_VI
#
# === Chỉnh sửa tệp ===
# plugins/React/languages/vi_VI.toml
# Bạn có thể chỉnh sửa trực tiếp tệp này. Thay đổi cục bộ được giữ lại; mục thiếu hoặc không hợp lệ dùng bản tiếng Anh tích hợp.
# /react language server edit vi_VI
#
# === Tiền tố ===
# runtime.prefix được thêm vào trước các tin nhắn trò chuyện có tiền tố.
#
# === Định dạng ===
# Tin nhắn trò chuyện hỗ trợ mã màu &: &cVăn bản&r, &lVăn bản&r.
# Màu sắc: &0-&9 và &a-&f.
# Kiểu chữ: &l in đậm, &o in nghiêng, &n gạch chân, &m gạch ngang, &k ký tự ngẫu nhiên, &r đặt lại.
# Mã màu xóa các kiểu chữ đang dùng; đặt màu trước kiểu chữ, như &3&lVăn bản&r. &r đặt lại toàn bộ định dạng.
# Màu RGB dùng &#RRGGBBVăn bản&r, ví dụ &#55AAFFVăn bản&r.
# Dùng MiniMessage cho chuyển màu và tương tác; không trộn thẻ MiniMessage với mã & trong cùng một tin nhắn. Đóng thẻ theo thứ tự ngược với khi mở.
# Giữ đúng dấu ngoặc kép và chuỗi thoát TOML.
# Dùng \n trong chuỗi TOML có dấu ngoặc kép để xuống dòng; {{ và }} hiển thị dấu ngoặc nhọn nguyên dạng.
# Giá trị renderer.* và config.documentation.annotation.* là văn bản thuần.
# Giá trị test.* là văn bản thuần, ngoại trừ tin nhắn test.result.* hỗ trợ định dạng.
# Dùng biến trong nội dung tin nhắn, bên ngoài thẻ MiniMessage.
#
# === Biến ===
# Giữ nguyên tên biến và chỉ dùng những biến có sẵn trong từng thông báo.
#   {action}  Tên hành động hoặc hướng điều chỉnh màu
#   {actions}  Số hành động trong hàng đợi hoặc danh sách tên hành động bị loại trừ
#   {active}  Số tính năng hoặc tinh chỉnh đang hoạt động
#   {actor}  Người dùng web thực hiện thay đổi
#   {added}  Tính năng có được đưa lại vào danh sách đăng ký đang hoạt động sau khi kích hoạt hay không; Thông báo được thêm bởi bản cập nhật ngôn ngữ
#   {after}  Giá trị cấu hình, thông điệp ngôn ngữ hoặc mức dùng bộ nhớ heap sau thay đổi
#   {age}  Tuổi của dữ liệu tích hợp, tính bằng giây
#   {amount}  Số vật phẩm cần cấp
#   {architecture}  Kiến trúc CPU
#   {argument}  Đối số lệnh không mong đợi
#   {available}  Số điểm truy cập cầu nối NMS khả dụng
#   {average}  TPS trung bình hoặc số mili giây mỗi nhịp
#   {avg_mspt}  Số mili giây trung bình mỗi nhịp trong một lượt kiểm thử tải
#   {avg_tps}  Số nhịp trung bình mỗi giây trong một lượt kiểm thử tải
#   {bar}  Thanh điểm kiểm thử hiệu năng đã định dạng
#   {before}  Giá trị cấu hình, thông điệp ngôn ngữ hoặc mức dùng bộ nhớ heap trước thay đổi
#   {checked}  Số bộ lấy mẫu đã kiểm tra
#   {chunks}  Số vùng khối chịu tác động của một hành động
#   {code}  Mã ghép nối web
#   {command}  Đường dẫn lệnh
#   {count}  Số mục, mô-đun, thay đổi hoặc phát hiện trong kiểm thử
#   {current}  Số trang hiện tại
#   {delta_heap}  Chênh lệch mức dùng bộ nhớ heap khi kết thúc giữa React và lần đo cơ sở, tính bằng MB
#   {delta_mspt}  Chênh lệch thời gian nhịp trung bình giữa React và lần đo cơ sở, tính bằng ms
#   {delta_tps}  Chênh lệch TPS trung bình giữa React và lần đo cơ sở
#   {detail}  Chi tiết chẩn đoán cầu nối, tích hợp, hành động hoặc kiểm thử
#   {dimensions}  Kích thước lưới tường bản đồ đã phát hiện
#   {direction}  Hướng xoay sắc độ của màu đang chọn
#   {distance}  Khoảng cách nhìn, mô phỏng hoặc gửi được yêu cầu, tính bằng chunk
#   {duration}  Thời gian đã trôi qua; thông điệp bắt đầu kiểm thử tải dùng đơn vị giây
#   {enabled}  Trạng thái bật hoặc số mô-đun đang bật
#   {entities}  Số thực thể chịu tác động của một hành động
#   {entry}  Mục trong dòng thời gian tích hợp
#   {exceptions}  Các ngoại lệ React ghi nhận trong một lượt kiểm thử tải
#   {fail}  Số phép kiểm tra thất bại
#   {file}  Tên tệp cấu hình, ngôn ngữ hoặc API phần bổ trợ
#   {fingerprint}  Dấu vân tay máy chủ hoặc mã truy cập web
#   {finite}  Số bộ lấy mẫu trả về giá trị hữu hạn
#   {frames}  Số khung vật phẩm trong tường bản đồ đang hoạt động
#   {free}  Bộ nhớ vật lý hoặc bộ nhớ ảo còn trống
#   {freed}  Bộ nhớ heap được thu hồi khi dọn rác
#   {from}  Số thứ tự mục đầu tiên trên trang hiện tại
#   {grid}  Kích thước lưới tường bản đồ
#   {ground_y}  Độ cao mặt đất của kiểm thử trọng lực
#   {group}  Nhóm giám sát, bộ lấy mẫu, bản đồ, cấu hình hoặc thông điệp ngôn ngữ
#   {growth}  Mức tăng bộ nhớ heap trong kiểm thử tải, tính bằng MB
#   {health}  Tình trạng hoạt động của tích hợp
#   {heap_end}  Mức dùng bộ nhớ heap khi kết thúc một lượt kiểm thử tải, tính bằng MB
#   {heap_start}  Mức dùng bộ nhớ heap khi bắt đầu một lượt kiểm thử tải, tính bằng MB
#   {heartbeat}  Thời gian từ tín hiệu duy trì kết nối gần nhất của tích hợp
#   {height}  Chiều cao khung vẽ kiểm thử, tính bằng điểm ảnh
#   {hoppers}  Số phễu đã chuẩn hóa
#   {id}  Định danh điểm truy cập cầu nối, bộ lấy mẫu, bản đồ, hành động, gói hoặc mã truy cập
#   {impact}  Mô tả tác động cấu hình
#   {incident}  Định danh hành động sự cố đệ quy bị loại khỏi bộ kiểm thử dành cho nhà phát triển
#   {index}  Số thứ tự bước hiện tại trong bộ kiểm thử dành cho nhà phát triển
#   {invalid}  Số bộ lấy mẫu có kết quả đo không hợp lệ
#   {issued_at}  Thời điểm tạo mã truy cập web
#   {item}  Tên hoặc định danh vật phẩm
#   {items}  Số thực thể vật phẩm đã gộp
#   {kept}  Chỉnh sửa cục bộ được giữ lại sau bản cập nhật ngôn ngữ
#   {key}  Khóa tham số lệnh, khóa cấu hình hoặc định danh thông điệp ngôn ngữ
#   {label}  Nhãn kiểm thử hiệu năng, chỉ số, thiết lập, lệnh hoặc mã truy cập web
#   {line}  Số dòng đang sửa trong thông điệp nhiều dòng
#   {lines}  Số dòng nhật ký máy chủ đã quét
#   {loaded}  Số vùng khối mới được tải trong giai đoạn tải trước
#   {locale}  Mã ngôn ngữ đang hiển thị, chọn hoặc sửa
#   {matched}  Các thế giới có trạng thái tự lưu khớp với trạng thái cơ sở của kiểm thử
#   {max_tick}  Khoảng cách dài nhất giữa các nhịp ghi nhận trong kiểm thử tải, tính bằng ms
#   {maximum}  Số vật phẩm tối đa, ngưỡng thời gian nhịp hoặc độ dài đầu vào của trình sửa
#   {message}  Tóm tắt hành động đã hoàn tất hoặc thông điệp trạng thái tích hợp
#   {metrics}  Số chỉ số do một gói API phần bổ trợ cung cấp
#   {minecraft}  Phiên bản Minecraft
#   {minimum}  TPS tối thiểu có thể chấp nhận
#   {missing}  Số bộ lấy mẫu bắt buộc còn thiếu trong danh sách đăng ký
#   {mode}  Chế độ chơi hoặc chế độ kỹ năng đang chọn
#   {model}  Mẫu CPU
#   {name}  Tên kiểm thử hiệu năng, mô-đun, bộ kết xuất hoặc phép kiểm tra
#   {note}  Lý do không quét nhật ký máy chủ
#   {offenders}  Số bộ lấy mẫu trả về giá trị không hữu hạn
#   {options}  Các giá trị cấu hình được chấp nhận
#   {p95}  Phân vị thứ 95 của thời gian nhịp trong kiểm thử tải, tính bằng ms
#   {parameter}  Tên tham số lệnh
#   {parameters}  Các tham số lệnh bị bỏ qua
#   {pass}  Số phép kiểm tra thành công
#   {path}  Đường dẫn khóa cấu hình hoặc tệp báo cáo
#   {percent}  Phần trăm điều chỉnh màu
#   {permission}  Nút quyền bắt buộc
#   {personal}  Mã ngôn ngữ người chơi đã chọn
#   {phase}  Giai đoạn vòng đời tính năng đang được kiểm thử
#   {pixels}  Số điểm ảnh không trống được vẽ trong kiểm thử bản đồ
#   {platform}  Hệ điều hành hoặc nền tảng máy chủ Minecraft
#   {players}  Số người chơi mô phỏng trong kiểm thử tải
#   {plugin}  Tên phần bổ trợ
#   {process_load}  Tải CPU của tiến trình máy chủ
#   {processors}  Số bộ xử lý CPU khả dụng
#   {profile}  Tên hồ sơ cấu hình React
#   {protocol}  Phiên bản giao thức tích hợp
#   {radius}  Bán kính theo vùng khối của hành động kiểm thử dành cho nhà phát triển
#   {range}  Phạm vi khoảng cách nhìn, mô phỏng hoặc gửi được chấp nhận, tính bằng chunk
#   {rate}  Tốc độ tăng nhanh sinh trưởng cây trồng đã cấu hình
#   {rating}  Mức đánh giá kiểm thử hiệu năng đã định dạng
#   {react_errors}  Số dòng lỗi React tìm thấy trong nhật ký máy chủ
#   {reason}  Giải thích lỗi, việc từ chối hoặc trạng thái không khả dụng
#   {registered}  Số mô-đun đã đăng ký
#   {remaining}  Thời gian còn lại đến lần kiểm tra ngôn ngữ tiếp theo
#   {removed_first}  Lần vô hiệu hóa đầu tiên có xóa tính năng khỏi danh sách đăng ký đang hoạt động hay không
