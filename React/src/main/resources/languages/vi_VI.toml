#   {parameters}  Các tham số lệnh bị bỏ qua
#   {pass}  Số phép kiểm tra thành công
#   {path}  Đường dẫn khóa cấu hình hoặc tệp báo cáo
#   {percent}  Phần trăm điều chỉnh màu hoặc tỉ trọng tác động của phần bổ trợ
#   {permission}  Nút quyền bắt buộc
#   {personal}  Mã ngôn ngữ người chơi đã chọn
#   {phase}  Giai đoạn vòng đời tính năng đang được kiểm thử
#   {pixels}  Số điểm ảnh không trống được vẽ trong kiểm thử bản đồ
#   {platform}  Hệ điều hành hoặc nền tảng máy chủ Minecraft
#   {players}  Số người chơi mô phỏng trong kiểm thử tải
#   {plugin}  Tên phần bổ trợ
#   {process_load}  Tải CPU của tiến trình máy chủ
#   {processors}  Số bộ xử lý CPU khả dụng
#   {profile}  Tên hồ sơ cấu hình React
#   {protocol}  Phiên bản giao thức tích hợp
#   {radius}  Bán kính theo vùng khối của bản đồ hoặc hành động kiểm thử dành cho nhà phát triển
#   {range}  Phạm vi khoảng cách nhìn, mô phỏng hoặc gửi được chấp nhận, tính bằng chunk
#   {rate}  Tốc độ tăng nhanh sinh trưởng cây trồng đã cấu hình
#   {rating}  Mức đánh giá kiểm thử hiệu năng đã định dạng
#   {react_errors}  Số dòng lỗi React tìm thấy trong nhật ký máy chủ
