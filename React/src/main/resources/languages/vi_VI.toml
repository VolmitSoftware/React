#   {renderer}  Tên hoặc định danh bộ kết xuất bản đồ
#   {renderers}  Danh sách bộ kết xuất bản đồ có định danh trống
#   {role}  Vai trò truy cập web: viewer, operator hoặc admin
#   {sampler}  Tên hoặc định danh bộ lấy mẫu
#   {samplers}  Danh sách bộ lấy mẫu tích hợp hoặc bộ lấy mẫu bị lỗi
#   {scope}  Phạm vi bản đồ hoặc phạm vi thiết lập khoảng cách
#   {score}  Điểm kiểm thử hiệu năng
#   {seconds}  Thời lượng đếm ngược hoặc kiểm thử tải, tính bằng giây
#   {section}  Mục cấu hình hoặc mục trong trình chỉnh sửa ngôn ngữ
#   {server}  Bản triển khai máy chủ Minecraft và phiên bản
#   {shown}  Số hàng đang hiển thị
#   {since_run}  Các lỗi được báo từ khi bắt đầu kiểm thử hiện tại
