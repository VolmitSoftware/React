description = "Tính năng định cấu hình cho tính năng Gravity Lười biếng. Theo dõi các thực thể FallingBlock trên đường thẳng đứng rõ ràng và dự đoán bao nhiêu chuyển động các tick sẽ được bỏ nếu xởi tick hạ cánh của họ được giải quyết theo cách xác định từ vị trí sinh sản và toán học trọng lực, thay vì xử lý AI / di chuyển mỗi tick. báo cáo khối lượng skip dự kiến như một métrics thời gian chạy để các nhà điều hành có thể đo tác động trước khi một ứng dụng tick-skip đầy đủ hạ cánh. Vượt qua các khối rơi trong vòng bypassRadius của người chơi. Phong đoạn (/break/physics trong cột ) làm giảm thực thể bị theo dõi trở lại vật lí vanilla."

[config.documentation.annotation.art.arcane.react.content.feature.featurelazygravity.field.bypassradius]
