"config.documentation.annotation.art.arcane.react.content.feature.featurehopperchaincoalescing.description" = "漏斗链合并功能的配置。检测沿同一方向输送的 N 个漏斗组成的直线链，并估算每个漏斗的传输 tick 有多少可合并为每条链每个 tick 一次从链首到链尾的批量拉取。仅以测量模式运行：检测链，并通过链合并采样器公开预计节省的 tick 数。取消中间 InventoryMoveItemEvent 的分发会与 FeatureHopperTokenBucket 的令牌桶消耗顺序冲突，因此实际的批量移动将交由专用 NMS 桥接器处理。"
