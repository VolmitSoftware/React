# React — zh_CN
#
# === 编辑文件 ===
# plugins/React/languages/zh_CN.toml
# 可直接编辑此文件。本地修改会保留；缺失或无效条目使用内置英语文本。
# /react language server edit zh_CN
#
# === 前缀 ===
# runtime.prefix 会添加在带前缀的聊天消息之前。
#
# === 格式 ===
# 聊天消息支持 & 颜色代码：&c文本&r, &l文本&r。
# 颜色：&0-&9 和 &a-&f。
# 样式：&l 粗体、&o 斜体、&n 下划线、&m 删除线、&k 随机字符、&r 重置。
# 颜色代码会清除当前样式；请将颜色放在样式之前，例如 &3&l文本&r。&r 会重置所有格式。
# RGB 颜色使用 &#RRGGBB文本&r，例如 &#55AAFF文本&r。
# 高级效果和交互请使用 MiniMessage；不要在同一条消息中混用 MiniMessage 标签和 & 代码。请按与打开顺序相反的顺序关闭标签。
# 请确保 TOML 的引号和转义写法有效。
# 在带引号的 TOML 字符串中使用 \n 换行；{{ 和 }} 会显示花括号本身。
# renderer.* 和 config.documentation.annotation.* 的值为纯文本。
# test.* 的值为纯文本，但 test.result.* 消息支持格式设置。
# 请将占位符放在消息文本中，并置于 MiniMessage 标签之外。
#
# === 变量 ===
# 请勿更改变量名，仅使用各消息中原有的变量。
#   {action}  操作名称或颜色调整方向
#   {actions}  队列中的操作数或已排除的操作名称列表
#   {active}  活跃的功能或调优项数量
#   {actor}  执行修改的网页用户
#   {added}  功能是否重新加入活跃注册表的状态，或语言更新新增的消息数
#   {after}  更改后的配置值、语言消息或堆使用量
#   {age}  集成数据的存在时间，单位为秒
#   {amount}  要给予的物品数量
#   {architecture}  CPU 架构
#   {argument}  意外的命令参数
#   {available}  可用的 NMS 桥接句柄数量
#   {average}  平均 TPS 或每刻毫秒数
#   {avg_mspt}  一轮负载测试中的平均每刻毫秒数
#   {avg_tps}  一轮负载测试中的平均每秒刻数
#   {bar}  带格式的基准测试得分条
#   {before}  更改前的配置值、语言消息或堆使用量
#   {checked}  已检查的采样器数量
#   {chunks}  受操作影响的区块数量
#   {code}  网页配对码
#   {command}  命令路径
#   {count}  条目、模块、更改或测试发现的数量
#   {current}  当前页码
#   {delta_heap}  React 与基线在结束时的堆使用量差值，单位为 MB
#   {delta_mspt}  React 与基线的平均刻耗时差值，单位为 ms
#   {delta_tps}  React 与基线的平均 TPS 差值
#   {detail}  桥接、集成、操作或测试的诊断详情
#   {dimensions}  检测到的地图墙网格尺寸
#   {direction}  旋转所选颜色色相的方向
#   {distance}  请求的视野、模拟或发送距离（区块）
#   {duration}  已用时间；负载测试开始消息使用秒
#   {enabled}  启用状态或已启用的模块数量
#   {entities}  受操作影响的实体数量
#   {entry}  集成时间线条目
#   {exceptions}  一轮负载测试中记录的 React 异常
#   {fail}  未通过的检查数量
#   {file}  配置、语言或插件 API 文件名
#   {fingerprint}  服务器或网页令牌指纹
#   {finite}  返回有限值的采样器数量
#   {frames}  活跃地图墙中的物品展示框数量
#   {free}  可用的物理或虚拟内存
#   {freed}  垃圾回收释放的堆内存
#   {from}  当前页面的首个条目编号
#   {grid}  地图墙网格尺寸
#   {ground_y}  重力测试的地面高度
#   {group}  监控、采样器、地图、配置或语言消息分组
#   {growth}  负载测试期间的堆增长量，单位为 MB
#   {health}  集成的健康状态
#   {heap_end}  一轮负载测试结束时的堆使用量，单位为 MB
#   {heap_start}  一轮负载测试开始时的堆使用量，单位为 MB
#   {heartbeat}  自集成最近一次心跳以来的时间
#   {height}  测试画布高度，单位为像素
#   {hoppers}  已规范化的漏斗数量
#   {id}  桥接句柄、采样器、地图、操作、包或令牌标识符
#   {impact}  配置效果描述
#   {incident}  从开发测试套件排除的递归事件操作标识符
#   {index}  开发测试套件的当前步骤编号
#   {invalid}  读数无效的采样器数量
#   {issued_at}  网页令牌创建时间
#   {item}  物品名称或标识符
#   {items}  已合并的物品实体数量
#   {kept}  语言更新中保留的本地修改数
#   {key}  命令参数键、配置键或语言消息 ID
#   {label}  基准测试、指标、设置、命令或网页令牌标签
#   {line}  正在编辑的多行消息中的行号
#   {lines}  已扫描的服务器日志行数
#   {loaded}  预热期间新加载的区块数量
#   {locale}  正在显示、选择或编辑的语言代码
#   {matched}  自动保存状态与测试基线一致的世界
#   {max_tick}  负载测试中观察到的最长刻间隔，单位为 ms
#   {maximum}  最大物品数量、刻耗时阈值或编辑器输入长度
#   {message}  已完成操作的摘要或集成状态消息
#   {metrics}  插件 API 包提供的指标数量
#   {minecraft}  Minecraft 版本
#   {minimum}  可接受的最低 TPS
#   {missing}  注册表中缺少的必要采样器数量
#   {mode}  所选游戏模式或能力模式
#   {model}  CPU 型号
#   {name}  基准测试、模块、渲染器或测试检查名称
#   {note}  未扫描服务器日志的原因
#   {offenders}  返回非有限值的采样器数量
#   {options}  允许的配置值
#   {p95}  负载测试中刻耗时的第 95 百分位数，单位为 ms
#   {parameter}  命令参数名称
#   {parameters}  已忽略的命令参数
#   {pass}  通过的检查数量
#   {path}  配置键路径或报告文件路径
#   {percent}  颜色调整百分比
#   {permission}  所需权限节点
#   {personal}  玩家选择的语言代码
#   {phase}  正在测试的功能生命周期阶段
#   {pixels}  地图测试渲染的非空白像素数量
#   {platform}  操作系统或 Minecraft 服务器平台
#   {players}  负载测试中的模拟玩家数量
#   {plugin}  插件名称
#   {process_load}  服务器进程的 CPU 负载
#   {processors}  可用的 CPU 处理器数量
#   {profile}  React 配置方案名称
#   {protocol}  集成协议版本
#   {radius}  开发测试套件操作的区块半径
#   {range}  允许的视野、模拟或发送距离范围（区块）
#   {rate}  配置的作物生长加速倍率
#   {rating}  带格式的基准测试评级
#   {react_errors}  服务器日志中发现的 React 错误行数
#   {reason}  失败、拒绝或不可用状态的原因
#   {registered}  已注册的模块数量
#   {remaining}  距下次语言检查的剩余时间
#   {removed_first}  首次停用是否将功能从活跃注册表移除
#   {removed_second}  再次停用是否将功能从活跃注册表移除
#   {renderer}  地图渲染器名称或标识符
#   {renderers}  标识符为空的地图渲染器列表
#   {role}  网页访问角色：viewer、operator 或 admin
#   {sampler}  采样器名称或标识符
#   {samplers}  集成采样器或发生故障的采样器列表
#   {scope}  地图范围或距离设置的作用范围
#   {score}  基准测试得分
#   {seconds}  倒计时或负载测试时长，单位为秒
#   {section}  配置或语言编辑器分区
#   {server}  Minecraft 服务器实现及版本
#   {shown}  当前显示的行数
#   {since_run}  本次测试开始以来报告的错误
#   {size}  地图墙的最大或当前使用尺寸
#   {skip}  已跳过的检查数量
#   {spawn_y}  重力测试方块的生成高度
#   {state}  操作或插件 API 包的状态
#   {status}  集成状态或配置状态标签
#   {subject}  配置帮助中描述的模块或设置
#   {subsystem}  测试子系统名称
#   {summary}  操作审计摘要
#   {system_load}  整个系统的 CPU 负载
#   {target}  操作针对的世界、玩家、插件、设置或插件组
#   {threading}  服务器线程模式
#   {tick}  超过冻结阈值的刻耗时，单位为 ms
#   {tick_crashes}  服务器日志中发现的游戏刻崩溃行数
#   {tier}  事件响应手册的严重性级别
#   {timing}  每分钟能力回调耗时，单位为毫秒
#   {to}  当前页面的最后一个条目编号
#   {total}  消息中的条目、模块、世界、检查或内存总量
#   {type}  命令参数、配置值、地图或距离类型
#   {unavailable}  不可用的 NMS 桥接句柄数量
#   {unit}  饼图总量的单位标签
#   {unknown}  从开发测试套件排除的未知操作标识符
#   {unreadable}  无法读取的采样器数量
#   {updated}  语言更新中更改的消息数
#   {uptime}  主机操作系统运行时间
#   {url}  已上传诊断报告的 URL
#   {usage}  命令用法语法
#   {used}  已使用的物理内存、虚拟内存或堆
#   {value}  带格式的设置、测量值或硬件详情
#   {values}  开发测试套件报告中列出的采样值
#   {variables}  正在编辑的消息接受的占位符名称
#   {vendor}  Java 供应商
#   {version}  React、Java 或平台版本
#   {warmed}  已预热的区块数量
#   {warn}  带警告的检查数量
#   {width}  测试画布宽度，单位为像素
#   {world}  Minecraft 世界名称

