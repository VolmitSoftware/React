import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
import io.github.slimjar.resolver.data.Mirror

plugins {
    id 'java'
    id 'java-library'
    id 'com.gradleup.shadow' version '9.0.0-rc3'
    id 'de.crazydev22.slimjar' version '2.1.9'
}

apply from: 'nms-jars.gradle'

version = '2.0.0-26.2' // Needs to be version specific
def apiVersion = '26.2'
def pluginName = rootProject.name // Defined in settings.gradle.kts
String mainClass = 'art.arcane.react.React'
String lib = 'art.arcane.react.util.arcane'
String volmLibCoordinate = providers.gradleProperty('volmLibCoordinate')
        .orElse('com.github.VolmitSoftware:VolmLib:master-SNAPSHOT')
        .get()
tasks.named('slimJar').get()

tasks.named('jar', org.gradle.api.tasks.bundling.Jar).configure {
    archiveClassifier.set('thin')
}

void registerCustomOutputTask(String name, String path) {
    if (!System.getProperty('os.name').toLowerCase().contains('windows')) {
        return
    }
    createOutputTask(name, path)
}

void registerCustomOutputTaskUnix(String name, String path) {
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        return
    }
    createOutputTask(name, path)
}

void createOutputTask(String name, String path) {
    tasks.register("build${name}", Copy) {
        group = 'development'
        outputs.upToDateWhen { false }
        TaskProvider<ShadowJar> shadowJarTask = tasks.named('shadowJar', ShadowJar)
        dependsOn(shadowJarTask)
        from(shadowJarTask.flatMap { ShadowJar task -> task.archiveFile })
        into(file(path))
        rename { String fileName ->
            fileName.replace("React-${project.version}.jar", 'React.jar')
        }
    }
}

