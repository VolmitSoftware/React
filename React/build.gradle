    compileOnly('com.google.code.gson:gson:2.10')
    compileOnly('io.netty:netty-transport:4.1.92.Final')

    testImplementation('io.javalin:javalin:6.4.0')
    testImplementation('net.kyori:adventure-text-minimessage:5.1.1')
    testImplementation('net.kyori:adventure-text-serializer-legacy:5.1.1')
    testImplementation('org.junit.jupiter:junit-jupiter:5.11.4')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher:1.11.4')
    testImplementation('org.mockito:mockito-core:5.18.0')
    testImplementation('net.bytebuddy:byte-buddy:1.17.6')
    testImplementation('net.bytebuddy:byte-buddy-agent:1.17.6')
    testImplementation('net.jqwik:jqwik:1.9.1')
