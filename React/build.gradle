tasks.named('test', Test).configure {
    useJUnitPlatform {
        includeEngines('junit-jupiter', 'jqwik')
    }
    systemProperty('net.bytebuddy.experimental', 'true')
    jvmArgs('-XX:+EnableDynamicAgentLoading')
    testLogging {
        events('passed', 'skipped', 'failed')
    }
}

slimJar {
    mirrors = [
            new Mirror(
                    URI.create('https://maven-central.storage-download.googleapis.com/maven2').toURL(),
                    URI.create('https://repo.maven.apache.org/maven2/').toURL()
            )
    ]
    relocate('art.arcane.chrono', "${lib}.chrono")
    relocate('art.arcane.curse', "${lib}.curse")
    relocate('art.arcane.multiburst', "${lib}.multiburst")
    relocate('net.bytebuddy', "${lib}.bytebuddy")
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.named('compileJava', JavaCompile).configure {
    // We need parameter meta for the decree command system
    options.compilerArgs.add('-parameters')
    options.encoding = 'UTF-8'
    options.release.set(25)
}

tasks.named('shadowJar', ShadowJar).configure {
    // Configure React for shading
    // React/Curse rely on reflection/decompiler internals; minimization strips required classes.
    // minimize()
    dependsOn(tasks.named('processResources'))
    from(sourceSets.main.output)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveClassifier.set('')
    relocate('io.github.slimjar', "${lib}.slimjar")
    relocate('art.arcane.chrono', "${lib}.chrono")
    relocate('art.arcane.curse', "${lib}.curse")
    relocate('art.arcane.multiburst', "${lib}.multiburst")
    relocate('art.arcane.volmlib', "${lib}.volmlib")
    relocate('net.bytebuddy', "${lib}.bytebuddy")
}

tasks.named('build').configure {
    dependsOn('shadowJar')
}

if (!JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_25)) {
    System.err.println()
    System.err.println('=========================================================================================================')
    System.err.println("You must run gradle on Java 25 or newer. You are using ${JavaVersion.current()}")
    System.err.println()
    System.err.println('=== For IDEs ===')
    System.err.println('1. Configure the project for Java 25')
    System.err.println('2. Configure the bundled gradle to use Java 25 in settings')
    System.err.println()
    System.err.println('=== For Command Line (gradlew) ===')
    System.err.println('1. Install JDK 25 from https://adoptium.net/temurin/releases/?version=25')
    System.err.println('2. Set JAVA_HOME environment variable to the new jdk installation folder such as C:/Program Files/Java/jdk-25')
    System.err.println('3. Open a new command prompt window to get the new environment variables if need be.')
    System.err.println('=========================================================================================================')
    System.err.println()
    System.exit(69)
}
