    slim('net.bytebuddy:byte-buddy-agent:1.14.19')
    compileOnly('io.javalin:javalin:6.4.0')
    slim('io.javalin:javalin:6.4.0')
    compileOnly('com.fasterxml.jackson.core:jackson-annotations:2.17.2')

