afterEvaluate {
    File packedArchive = tasks.named('packedJar').get().outputJar.get().asFile
    List<Map<String, Object>> targets = [[
        id: 'bukkit',
        tasks: ['build'],
        arguments: [],
        java: 25,
        memoryMiB: 6144,
        workers: 2,
        dependsOn: [],
        artifacts: [[
            path: relativePath(packedArchive),
            role: 'runtime',
            platforms: ['plugin'],
            minecraftVersions: [bukkitMinecraftRange.toString()]
        ]]
    ]]
    for (String loader : ['fabric', 'forge', 'neoforge']) {
        minecraftTargets.each { String minecraft, Map<String, Object> properties ->
            if (loader == 'neoforge' && properties.neoforgeUsesForge) {
                return
            }
            int memory = loader == 'fabric' && properties.obfuscated ? 8192 : 4096
            List<String> arguments = ['-p', "adapters/${loader}".toString(), "-PminecraftVersion=${minecraft}".toString(),
                    "-Dorg.gradle.jvmargs=-Xmx${memory - 1024}m -Dfile.encoding=UTF-8".toString()]
            react.each { String key, String value ->
                if (key != 'minecraftVersion') {
                    arguments.add("-P${key}=${value}".toString())
                }
            }
            targets.add([
                id: "${loader}-${minecraft}".toString(),
                tasks: [':build'],
                arguments: arguments,
                java: (int) properties.javaVersion,
                memoryMiB: memory,
                workers: 2,
                dependsOn: [],
                artifacts: [[
                    path: "adapters/${loader}/build/${minecraft}/libs/${modJarName(loader, minecraft)}".toString(),
                    role: 'runtime',
                    platforms: loader == 'forge' && properties.neoforgeUsesForge ? ['forge', 'neoforge'] : [loader],
                    minecraftVersions: [minecraft]
                ]]
            ])
        }
    }
    rootProject.ext.multiplexor = [
        schema: 1,
        id: 'react',
        name: 'React',
        sandbox: 'per-target',
        parallelTargets: true,
        sourceDependencies: ['volmlib'],
        targets: targets
    ]
}
