afterEvaluate {
    File packedArchive = tasks.named('packedJar').get().outputJar.get().asFile
    rootProject.ext.multiplexor = [
        schema: 1,
        id: 'react',
        name: 'React',
        sandbox: 'per-target',
        parallelTargets: true,
        sourceDependencies: ['volmlib'],
        targets: [[
            id: 'bukkit',
            tasks: ['build'],
            arguments: [],
            java: 25,
            memoryMiB: 6144,
            workers: 2,
            dependsOn: [],
            artifacts: [[
                path: relativePath(packedArchive),
                role: 'runtime',
                platforms: ['plugin'],
                minecraftVersions: [bukkitMinecraftRange.toString()]
            ]]
        ]]
    ]
}
