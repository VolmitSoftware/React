import art.arcane.volmit.packaging.JarCompactor

buildscript {
    repositories {
        mavenCentral()
        maven { url = uri('https://jitpack.io') }
    }
    dependencies {
        classpath('com.github.VolmitSoftware.VolmLib:packaging:master-SNAPSHOT')
    }
}

ext.reactRoot = file('../..')
apply from: '../../gradle/identity.gradle'
group = react.projectGroup
version = react.projectVersion

String target = react.minecraftVersion
String loader = projectDir.name
Map<String, Object> targetProperties = minecraftTargets[target]
ext.targetProperties = targetProperties
ext.hasCore = findProject(':core') != null
layout.buildDirectory.set(layout.projectDirectory.dir("build/${target}"))

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}
// The shipped classes target the server's Java; tests run on the build JDK.
tasks.named('compileJava', JavaCompile).configure {
    options.release.set((int) targetProperties.javaVersion)
}
tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
repositories {
    mavenCentral()
    maven { url = uri('https://jitpack.io') }
}

apply from: '../../gradle/shadow.gradle'
apply from: '../../gradle/verify-artifact.gradle'
apply from: '../../gradle/language-source.gradle'

sourceSets.main.java.srcDir('../mod-common/src/main/java')
sourceSets.main.resources.srcDir('../mod-common/src/main/resources')
sourceSets.test.java.srcDir('../mod-common/src/test/java')
if (hasCore) {
    TaskProvider<Task> classIndex = tasks.register('reactClassIndex') {
        File output = layout.buildDirectory.dir('generated/react-class-index').get().asFile
        dependsOn(':core:classes')
        inputs.files(project.provider { project(':core').sourceSets.main.output.classesDirs })
        outputs.dir(output)
        doLast {
            List<String> names = []
            project(':core').sourceSets.main.output.classesDirs.each { File directory ->
                if (directory.isDirectory()) {
                    project.fileTree(directory).matching { include('**/*.class') }.visit { FileVisitDetails entry ->
                        String path = entry.relativePath.pathString
                        if (!entry.directory && !path.contains('$')) {
                            names.add(path.substring(0, path.length() - '.class'.length()).replace('/', '.'))
                        }
                    }
                }
            }
            names.sort()
            output.mkdirs()
            new File(output, 'react-class-index.txt').text = names.join('\n') + '\n'
        }
    }
    sourceSets.main.resources.srcDir(classIndex)
}
dependencies {
    testImplementation('org.junit.jupiter:junit-jupiter:5.11.4')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher:1.11.4')
}
for (String kind : ['java', 'resources']) {
    org.gradle.api.file.SourceDirectorySet directories = kind == 'java' ? sourceSets.main.java : sourceSets.main.resources
    List<File> overlays = []
    if (targetProperties.sourceFamily != null) {
        overlays.add(file("../mod-common/src/families/${targetProperties.sourceFamily}/${kind}"))
        overlays.add(file("src/families/${targetProperties.sourceFamily}/${kind}"))
    }
    overlays.add(file("../mod-common/src/versions/${target}/${kind}"))
    overlays.add(file("src/versions/${target}/${kind}"))
    for (File overlay : overlays) {
        directories.srcDir(overlay)
    }
    directories.exclude { FileTreeElement entry ->
        for (int index = overlays.size() - 1; index >= 0; index--) {
            File replacement = new File(overlays[index], entry.relativePath.pathString)
            if (replacement.isFile()) {
                return entry.file.canonicalFile != replacement.canonicalFile
            }
        }
        false
    }
}

// Sources a target's Minecraft lacks, such as mixins for blocks added later; their mixins leave the configs too.
List<String> excludedSources = (List<String>) (targetProperties.excludedSources ?: [])
sourceSets.main.java.exclude { FileTreeElement entry -> excludedSources.contains(entry.relativePath.pathString) }
List<String> excludedMixins = excludedSources.findAll { String path -> path.contains('/mixin/') }
    .collect { String path -> path.substring(path.lastIndexOf('/') + 1, path.length() - '.java'.length()) }
// Mixins only a target's Minecraft needs, such as accessors for fields later versions expose.
List<String> addedMixins = (List<String>) (targetProperties.addedMixins ?: [])
String mixinLevel = (int) targetProperties.javaVersion >= 21 ? 'JAVA_21' : 'JAVA_17'
ext.mixinRefmap = null

Map<String, String> metadata = react + [
    fabricLoaderVersion: targetProperties.fabricLoader,
    forgeLoaderRange: targetProperties.forgeLoaderRange,
    neoForgeVersion: targetProperties.neoforge ?: '',
    javaVersion: targetProperties.javaVersion.toString(),
    dataPackFormat: targetProperties.dataPackFormat.toString()
]
tasks.named('processResources').configure {
    inputs.properties(metadata)
    filesMatching(['fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml', 'pack.mcmeta', 'react.mixins.json',
            'art/arcane/react/mod/react-mod.properties']) { expand(metadata) }
    inputs.property('excludedMixins', excludedMixins)
    inputs.property('addedMixins', addedMixins)
    inputs.property('mixinLevel', mixinLevel)
    doLast {
        fileTree(destinationDir) { include('*.mixins.json') }.each { File config ->
            Map<String, Object> mixins = (Map<String, Object>) new groovy.json.JsonSlurper().parse(config)
            mixins.compatibilityLevel = mixinLevel
            for (String side : ['mixins', 'client', 'server']) {
                if (mixins[side] instanceof List) {
                    mixins[side] = ((List<String>) mixins[side]).findAll { String name -> !excludedMixins.contains(name) }
                }
            }
            if (mixins.package == react.projectGroup + '.mod.mixin') {
                mixins.mixins = ((List<String>) mixins.mixins) + addedMixins
                if (project.ext.mixinRefmap != null) {
                    mixins.refmap = project.ext.mixinRefmap
                }
            }
            config.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(mixins)) + '\n'
        }
    }
}
tasks.named('shadowJar').configure {
    String platform = [fabric: 'Fabric', forge: 'Forge', neoforge: 'NeoForge'][loader]
    String loaderVersion = loader == 'fabric' ? targetProperties.fabricLoader : targetProperties[loader]
    String displayVersion = loaderVersion.startsWith(target + '-') ? loaderVersion.substring(target.length() + 1) : loaderVersion
    displayVersion = displayVersion.replaceFirst(/-beta$/, '')
    archiveFileName.set("${react.projectName} v${version} [${platform}] ${target}+${displayVersion}.jar")
    doLast {
        if (compactShadowJar) {
            compactJar(archiveFile.get().asFile)
        }
    }
}
File compressionCache = new File(gradle.gradleUserHomeDir, 'caches/volmit-packaging/compression')
ext.compactShadowJar = true
ext.compactJar = { File archive ->
    long before = archive.length()
    JarCompactor.compact(archive, new JarCompactor.CompactionOptions(Collections.<String>emptySet(), false, true, true, compressionCache.toPath()))
    logger.lifecycle("${archive.name}: ${before} -> ${archive.length()} bytes")
}

// Profiler frames on obfuscated runtimes read through a runtime-to-Mojang name map written from the build's own
// mappings: 'tsrg' is Forge's official-to-SRG file (methods only, classes are Mojang names at runtime), 'tiny' is
// Loom's official/intermediary/named file. ModFrameNames documents the format.
ext.bundleFrameNames = { Object source, String format ->
    File output = layout.buildDirectory.dir('generated/frame-names').get().asFile
    TaskProvider<Task> frameNames = tasks.register('reactFrameNames') {
        inputs.property('format', format)
        inputs.files(source)
        outputs.dir(output)
        doLast {
            File mappings = project.files(source).singleFile
            Map<String, String> classes = new TreeMap<>()
            Map<Integer, String> methods = new TreeMap<>()
            String classPrefix = ''
            String methodPrefix
            String methodSuffix
            if (format == 'tsrg') {
                methodPrefix = 'm_'
                methodSuffix = '_'
                java.util.regex.Pattern srg = ~/^\t(\S+) \(\S*\)\S* m_(\d+)_$/
                mappings.eachLine('UTF-8') { String line ->
                    java.util.regex.Matcher matcher = srg.matcher(line)
                    if (matcher.matches()) {
                        methods.put(Integer.parseInt(matcher.group(2)), matcher.group(1))
                    }
                }
            } else if (format == 'tiny') {
                classPrefix = 'net.minecraft.'
                methodPrefix = 'method_'
                methodSuffix = ''
                int intermediary = -1
                int named = -1
                mappings.eachLine('UTF-8') { String line ->
                    String[] parts = line.split('\t', -1)
                    if (parts[0] == 'tiny') {
                        List<String> namespaces = parts.toList().subList(3, parts.length)
                        intermediary = namespaces.indexOf('intermediary')
                        named = namespaces.indexOf('named')
                    } else if (parts[0] == 'c' && parts.length > named + 1) {
                        String runtime = parts[intermediary + 1].replace('/', '.')
                        String readable = parts[named + 1].replace('/', '.')
                        if (runtime != readable && runtime.startsWith(classPrefix)) {
                            classes.put(runtime.substring(classPrefix.length()), readable)
                        }
                    } else if (parts.length > named + 3 && parts[0] == '' && parts[1] == 'm') {
                        String runtime = parts[intermediary + 3]
                        if (runtime.startsWith(methodPrefix) && runtime.substring(methodPrefix.length()).isInteger()) {
                            // Mojang's mappings leave synthetic lambda bodies unnamed.
                            String readable = parts[named + 3] == runtime ? 'lambda$' + runtime : parts[named + 3]
                            methods.put(Integer.parseInt(runtime.substring(methodPrefix.length())), readable)
                        }
                    }
                }
            } else {
                throw new GradleException("Unknown frame name format ${format}")
            }
            File resource = new File(output, 'art/arcane/react/mod/frame-names.gz')
            resource.parentFile.mkdirs()
            resource.withOutputStream { OutputStream stream ->
                java.util.zip.GZIPOutputStream gzip = new java.util.zip.GZIPOutputStream(stream)
                Writer writer = new OutputStreamWriter(gzip, 'UTF-8')
                writer.write("react-frame-names 1\nclasses ${classPrefix} ${classes.size()}\n")
                classes.each { String key, String value -> writer.write("${key} ${value}\n") }
                writer.write("methods ${methodPrefix} ${methodSuffix} ${methods.size()}\n")
                int previous = 0
                methods.each { Integer id, String name ->
                    writer.write("${id - previous} ${name}\n")
                    previous = id
                }
                writer.close()
            }
            logger.lifecycle("Frame names: ${classes.size()} classes, ${methods.size()} methods, ${resource.length()} bytes")
        }
    }
    sourceSets.main.resources.srcDir(frameNames)
}
