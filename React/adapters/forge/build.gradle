import net.minecraftforge.renamer.gradle.RenameJar

plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '7.0.40'
    id 'net.minecraftforge.renamer' version '1.1.2' apply false
    id 'com.gradleup.shadow' version '9.5.1'
}
apply from: '../../gradle/mod.gradle'

if (targetProperties.obfuscated) {
    minecraft.mappings channel: 'official', version: react.minecraftVersion
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
}
configurations {
    nestedMixinExtras { transitive = false }
    // Unit tests never start a client; the 1.21.1 client natives are Mojang-patched builds missing from Maven Central.
    testRuntimeClasspath { exclude(group: 'org.lwjgl') }
}
dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${targetProperties.forge}")
    // Forge only ships MixinExtras from 64 on; older lines get it nested through Forge's jar-in-jar.
    if (targetProperties.forgeMixinExtras != null) {
        compileOnly("io.github.llamalad7:mixinextras-common:${targetProperties.forgeMixinExtras}")
        nestedMixinExtras("io.github.llamalad7:mixinextras-forge:${targetProperties.forgeMixinExtras}")
    }
}
String eventBusPackage = targetProperties.sourceFamily == 'mapped' ? 'net.minecraftforge.eventbus' : 'net.minecraftforge.eventbus.internal'
tasks.named('shadowJar').configure {
    manifest.attributes('MixinConfigs': 'react.mixins.json', 'Add-Opens': "net.minecraftforge.eventbus/${eventBusPackage}")
}
if (targetProperties.forgeMixinExtras != null) {
    String mixinExtras = targetProperties.forgeMixinExtras
    String nestedName = "mixinextras-forge-${mixinExtras}.jar"
    TaskProvider<Task> jarJarMetadata = tasks.register('jarJarMetadata') {
        File output = layout.buildDirectory.dir('generated/jarjar').get().asFile
        inputs.property('mixinExtras', mixinExtras)
        outputs.dir(output)
        doLast {
            File metadata = new File(output, 'META-INF/jarjar/metadata.json')
            metadata.parentFile.mkdirs()
            metadata.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([jars: [[
                identifier: [group: 'io.github.llamalad7', artifact: 'mixinextras-forge'],
                version: [range: "[${mixinExtras},)".toString(), artifactVersion: mixinExtras],
                path: "META-INF/jarjar/${nestedName}".toString(),
                isObfuscated: false
            ]]]))
        }
    }
    tasks.named('shadowJar').configure {
        from(project.configurations.nestedMixinExtras) {
            into('META-INF/jarjar')
            rename { String filename -> nestedName }
        }
        from(jarJarMetadata)
    }
}

if (targetProperties.forgeRuntimeMappings == 'srg') {
    apply plugin: 'net.minecraftforge.renamer'
    // SRG-named servers resolve mixin targets through a refmap that the Mixin processor writes at compile time.
    project.ext.mixinRefmap = 'react.refmap.json'
    dependencies {
        annotationProcessor('org.spongepowered:mixin:0.8.5:processor')
        // Lets the processor see MixinExtras injectors such as @WrapOperation, so their targets reach the refmap.
        if (targetProperties.forgeMixinExtras != null) {
            annotationProcessor("io.github.llamalad7:mixinextras-common:${targetProperties.forgeMixinExtras}")
        }
    }
    renamer.mappings(minecraft.dependency.toSrgFile)
    renamer.enableMixinRefmaps { mixin ->
        mixin.config('react.mixins.json')
        mixin.source(sourceSets.main) { source -> source.refMap.set(project.ext.mixinRefmap) }
        mixin.jar(tasks.named('shadowJar', Jar))
    }
    TaskProvider<Jar> developmentJar = tasks.named('shadowJar', Jar)
    developmentJar.configure {
        destinationDirectory.set(layout.buildDirectory.dir('devlibs'))
    }
    // The Mixin processor writes @Shadow SRG names as flat "owner member [desc] srg" lines that the
    // merged map drops, so they are appended here as class blocks for the rename pass.
    Provider<RegularFile> shadowSource = layout.buildDirectory.file('tmp/compileJava/compileJava-mappings.tsrg')
    Provider<RegularFile> renameMap = layout.buildDirectory.file('mappings/reobfWithShadows.tsrg')
    bundleFrameNames(renamer.mixin.generatedMappings.flatMap { task -> task.output }, 'tsrg')
    TaskProvider<Task> shadowMappings = tasks.register('shadowMixinMappings') {
        Provider<RegularFile> merged = renamer.mixin.generatedMappings.flatMap { task -> task.output }
        dependsOn(tasks.named('compileJava'))
        inputs.file(merged)
        inputs.file(shadowSource)
        outputs.file(renameMap)
        doLast {
            Map<String, List<String>> members = new LinkedHashMap<>()
            shadowSource.get().asFile.eachLine { String line ->
                String[] parts = line.trim().split(' ')
                if (parts.length < 3) {
                    return
                }
                String member = parts.length == 4 ? "${parts[1]} ${parts[2]} ${parts[3]}" : "${parts[1]} ${parts[2]}"
                members.computeIfAbsent(parts[0]) { String key -> new ArrayList<String>() }.add(member)
            }
            File output = renameMap.get().asFile
            output.parentFile.mkdirs()
            output.text = merged.get().asFile.text
            output.withWriterAppend { Writer writer ->
                members.each { String owner, List<String> entries ->
                    writer.write("\n${owner} ${owner}\n")
                    entries.each { String entry -> writer.write("\t${entry}\n") }
                }
            }
        }
    }
    TaskProvider<RenameJar> productionJar = renamer.classes('reobfShadowJar', developmentJar) {
        dependsOn(shadowMappings)
        map.setFrom(renameMap)
        output.set(layout.buildDirectory.file(developmentJar.flatMap { Jar task -> task.archiveFileName }
            .map { String filename -> "libs/${filename}" }))
    }
    productionJar.configure { doLast { compactJar(output.get().asFile) } }
    ext.compactShadowJar = false
    ext.distributionJar = productionJar.flatMap { RenameJar task -> task.output }
}
