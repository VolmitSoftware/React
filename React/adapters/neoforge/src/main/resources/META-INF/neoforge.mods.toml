ordering = "NONE"
side = "BOTH"

[[dependencies.${projectId}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraftVersion}]"
ordering = "NONE"
side = "BOTH"

[[mixins]]
config = "react.mixins.json"
