modLoader = "javafml"
loaderVersion = "[3,)"
license = "GPL-3.0"

[[mods]]
modId = "${projectId}"
version = "${projectVersion}"
displayName = "${projectName}"
description = "Server performance monitoring and tuning."
authors = "NextdoorPsycho, Cyberpwn"

[features.${projectId}]
javaVersion = "[${javaVersion},)"

[[dependencies.${projectId}]]
