name: reactor_relay
description: "Zero-trust WebSocket relay broker for React plugin: routes frames between /agent (plugin) and /app (dashboard) connections, identified by server-id and verified via Ed25519 pubkey fingerprint."
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  shelf: ^1.4.2
  shelf_web_socket: ^2.0.0
  web_socket_channel: ^3.0.1
  crypto: ^3.0.6
  cryptography: ^2.7.0

dev_dependencies:
  test: ^1.25.0
  lints: ^5.0.0
