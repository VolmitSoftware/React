name: react_web
description: "Local-first React server monitoring and operations console."
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  jaspr: ^0.23.1
  arcane_jaspr:
    path: .deps/arcane_jaspr
  arcane_jaspr_shadcn:
    path: .deps/arcane_jaspr/packages/arcane_jaspr_shadcn
  jaspr_router: ^0.8.0
  http: ^1.6.0
  web: ^1.1.1
  crypto: ^3.0.6

dev_dependencies:
  build_daemon: 4.1.4
  build_runner: 2.15.1
  build_web_compilers: ^4.4.18
  jaspr_builder: ^0.23.1
  jaspr_cli: ^0.23.2
  jaspr_test: ^0.23.0
  lints: ^6.1.0
  test: ^1.25.0

dependency_overrides:
  arcane_jaspr:
    path: .deps/arcane_jaspr

jaspr:
  mode: client
  styles: standalone

scripts:
  serve: jaspr serve
  build: jaspr build
  clean: jaspr clean
